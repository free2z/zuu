[pytest]
DJANGO_SETTINGS_MODULE = pytest_settings
pythonpath = .
testpaths = dj/apps gcp zcashrpc
python_files = test_*.py
addopts = -ra
# `async def` tests (the WebSocket regression tests in dj/apps/events) are
# collected without needing an explicit @pytest.mark.asyncio on each one.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    chaos: kills a real procrastinate worker subprocess mid-job and watches the row heal
    real_deadline: run twitter provider calls through the real threaded deadline
    ledger_drift_expected: the test corrupts the 2Z ledger on purpose (a reconciler test); skip the end-of-test R1/R3 assertion
