<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="robots" content="noindex,nofollow">
    <meta name="referrer" content="no-referrer">
    <title>Sign-in unavailable</title>
  </head>
  <body>
    <main>
      <h1>Sign-in unavailable</h1>
      {% if detail %}<p role="alert">{{ detail }}</p>{% endif %}
      <p><a href="{{ back|default:'/profile' }}">{% if back and back != '/profile' %}Back{% else %}Home{% endif %}</a></p>
    </main>
  </body>
</html>
