<html>

<head>
    <meta charset="utf-8">
    <title>{{ title }}</title>
    <meta name="description" content="{{ description }}" />
    {% if robots %}<meta name="robots" content="{{ robots }}" />{% endif %}
    <link rel="canonical" href="https://{{ request.META.HTTP_HOST }}{{ path }}">

    <meta property="og:title" content="{{ title }}" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://{{ request.META.HTTP_HOST }}{{ image }}" />
    <meta property="og:description" content="{{ description }}" />
    <meta property="og:url" content="https://{{ request.META.HTTP_HOST }}{{ path }}" />
    <meta property="og:site_name" content="Free2Z" />

    <meta name="twitter:title" content="{{ title }}" />
    <meta name="twitter:description" content="{{ description }}" />
    <meta name="twitter:image" content="https://{{ request.META.HTTP_HOST }}{{ image }}" />
    <meta name="twitter:url" content="https://{{ request.META.HTTP_HOST }}{{ path }}" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image:alt" content="{{ title }}" />
    <meta name="twitter:site" content="@free2zcash">
    <meta name="twitter:creator" content="@free2zcash">

    <meta name="fb:app_id" content="278755727751440">

    <meta itemprop="name" content="{{ title }}">
    <meta itemprop="description" content="{{ description }}">
    <meta itemprop="image" content="https://{{ request.META.HTTP_HOST }}{{ image }}">
</head>

<body>
    <h1>{{ title }}</h1>
    <p>{{ description }}</p>
</body>

</html>
