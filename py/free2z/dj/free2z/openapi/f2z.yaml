  /api/tuzis/subscribe/{username}:
    get:
      operationId: tuzis_subscribe_retrieve
      description: |-
        Subscribe the request.user as a fan to the star in the urls.

        Add another 30 days if repeated... hrm...
      parameters:
      - in: path
        name: username
        schema:
          type: string
        required: true
      tags:
      - tuzis
      security:
      - cookieAuth: []
      - knoxApiToken: []
      responses:
        '200':
          description: No response body
    post:
      operationId: tuzis_subscribe_create
      description: |-
        Subscribe the request.user as a fan to the star in the urls.

        Add another 30 days if repeated... hrm...
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
        description: 'Optional client-generated UUIDv4 that makes this charge safe
          to retry. When the header is present it MUST parse as a version-4 UUID:
          anything else, a blank or whitespace-only value included, is answered 400
          with code `invalid_idempotency_key` and nothing is charged. There is no
          truncation and no silent fallback -- the only way to opt out of the protection
          is to omit the header entirely. Send the canonical 36-character 8-4-4-4-12
          form, which is what this schema declares. The server is deliberately no
          stricter than Python''s UUID parser, so surrounding whitespace is stripped
          and the braced (`{...}`), `urn:uuid:` and unhyphenated 32-character spellings
          of one UUID all normalize to that same canonical key -- they are ONE key
          and replay each other, not three independent charges. Case is not significant
          either. The key is scoped to the authenticated fan AND the creator in the
          path, so the same key sent for a different creator is a different request
          -- unless it was already spent on POST /api/tuzis/subscribe-confirmed/{username}/,
          which scopes a key to the fan alone. This route reads that route''s receipts:
          a key that completed there for THIS creator replays here (nothing charged).
          One that completed there for a DIFFERENT creator is not this request at
          all, so it is claimed and charged normally under this route''s own per-creator
          scope. Only a receipt that cannot be attributed to a creator -- still running,
          or recorded without a recipient id -- is answered 409 `idempotency_mismatch`,
          because it might be this creator''s committed purchase; mint a new key.
          That is the price of the two routes being one retry namespace, and it is
          what stops a route switch charging a second month. It is a guarantee about
          COMMITTED receipts: two genuinely concurrent requests under one key are
          not covered, and neither is a retry sent after the path username changed
          owners, because the recipient is identified by id and that is then a different
          creator. Reuse the SAME key for every retry of one purchase and a NEW key
          for a genuinely new purchase: once a request under a key has completed,
          retrying that key replays the recorded status and body verbatim and does
          NOT charge again for 365 days afterwards -- for as long as the membership
          it bought is still running. The receipt outlives the membership by up to
          eleven months, and once the month has ENDED that retry is neither replayed
          (you are not subscribed) nor charged again under the same key: it is 409
          `idempotency_mismatch` with `key_resolved: true`, meaning retire this key
          and buy the new month under a fresh one. Because the replay is verbatim
          it is a record of THAT request, not a live read: `charged` describes the
          original call and `expires` is the membership end date as of the original
          call, which a later renewal may since have pushed out. Re-read GET /api/tuzis/my-subscriptions
          for current state rather than writing a replayed body over it. A retry sent
          while the original is still running either blocks until the original commits
          and then replays it, or is answered 409 Conflict meaning ''undecided, ask
          again shortly'' -- never a second charge. A request that moved no 2Z (for
          example 402 insufficient funds) does not burn the key. For an existing target,
          a completed key is looked up before mutable price, balance, or active-state
          checks, so a retry after a timeout still replays a committed charge even
          if the creator was later deactivated. A genuinely new key must still pass
          those eligibility checks; a failed check releases the key. If the target
          username no longer resolves, the stored request fingerprint is used for
          the same replay-or-conflict decision. Omit the header entirely and every
          POST is an independent request, protected only by a coarse 60-second server-side
          debounce -- a retry after that window charges another month. This endpoint
          also binds no price: it charges the creator''s price as of the request.
          Interactive clients that showed the fan a price should use POST /api/tuzis/subscribe-confirmed/{username}/
          with expected_price instead, which refuses (409 `price_changed`) rather
          than charge an amount the fan never saw.'
      - in: path
        name: username
        schema:
          type: string
        required: true
      tags:
      - tuzis
      security:
      - cookieAuth: []
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - charged
                - expires
                - replayed
                properties:
                  charged:
                    type: boolean
                    description: True if 2Z moved for the request this body describes.
                      False means it was absorbed as a duplicate of a very recent
                      one; the fan is subscribed either way. On an Idempotency-Key
                      replay this still describes the ORIGINAL call, so do not decrement
                      cached 2Z again on seeing it.
                  expires:
                    type: string
                    format: date-time
                    description: Membership end date as of this request. Use it rather
                      than assuming the previous value plus 30 days. On an Idempotency-Key
                      replay it is the value recorded then and a later renewal may
                      have pushed it out since, so refresh from my-subscriptions instead
                      of writing a replayed value over current state.
                  replayed:
                    type: boolean
                    description: True when this is the replay of a completed Idempotency-Key
                      request rather than a new subscription attempt.
          description: Subscribed. A replay of a previously completed Idempotency-Key
            returns the original body here verbatim, so treat it as a record of that
            request rather than as a live read of the membership.
        '400':
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                  code:
                    type: string
                    description: Present as `invalid_idempotency_key` when an Idempotency-Key
                      header was sent but is not a canonical UUIDv4. Nothing was charged;
                      do NOT discard the key and mint another on a retry -- check
                      my-subscriptions first, because the original request under that
                      key may have completed.
          description: 'Not chargeable: subscribing to yourself, the creator set no
            member price, or the Idempotency-Key header is present but is not a UUIDv4
            (`code` says which).'
        '402':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsufficientFundsError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                  code:
                    type: string
                    description: '`idempotency_mismatch` when this key is already
                      spent on a different request for THIS creator -- including one
                      made on POST /api/tuzis/subscribe-confirmed/{username}/, whose
                      keys share this namespace, or one recorded there without a recipient
                      id and so no longer attributable to a creator at all. A confirmed
                      receipt that is positively another creator''s is not this request
                      and is charged normally under this route''s per-creator scope.
                      It also covers a key spent on a membership that has since ENDED,
                      on either route: that receipt is real, but the month it bought
                      is over, so it is neither replayed (you are not subscribed)
                      nor charged again under the same key -- `key_resolved: true`
                      says to retire it and buy under a fresh one. `invalid_idempotency_record`
                      when a receipt exists but cannot be replayed safely -- a stored
                      body this route cannot read, or one with no membership recorded
                      at all. Absent on the in-flight answer. `subscription_retryable`
                      means a lock timeout left the request undecided; reuse the SAME
                      Idempotency-Key. `subscription_intent_abandoned` means authenticated
                      recovery fenced this key; retire it and use a fresh key for
                      a deliberate new purchase.'
                  key_resolved:
                    type: boolean
                    description: 'Only on `idempotency_mismatch`, and only when this
                      endpoint can prove it: true means the request recorded under
                      your Idempotency-Key has FINISHED and cannot be the one you
                      are making now -- another creator''s, or a membership that has
                      since ended -- so retire that key and mint a new one. It is
                      NOT merely "a different request finished": a finished receipt
                      for a membership you are still holding is your own purchase
                      and replays as a 200 instead, because retiring the key there
                      would buy a second month. False means it may still be committing
                      -- reuse the SAME key. Absent means the endpoint could not tell
                      (a receipt it cannot attribute), which is also a reason to reuse
                      the same key. Without this a client that keeps one key per purchase
                      intent can be answered 409 for the receipt''s whole retention
                      horizon with no way to recover.'
          description: Either a request with this Idempotency-Key is still in flight
            — undecided, not failed, so retry the SAME key rather than issuing a new
            one — or the key is already spent on a different request (`code` says
            which). Nothing was charged in either case. On `idempotency_mismatch`,
            `key_resolved` says whether that other request has finished, which is
            what makes minting a fresh key safe rather than a second charge. `subscription_retryable`
            means a lock timeout left the request undecided; retry with the same key.
            `subscription_intent_abandoned` means authenticated recovery fenced this
            key; retire it before a deliberate new purchase.
    patch:
      operationId: tuzis_subscribe_partial_update
      description: Change the authenticated fan's maximum 2Z per renewal and return
