      description: |-
        * `invalid` - invalid
        * `reserved` - reserved
        * `taken` - taken
        * `already_bound` - already_bound
    HandleClaimRequest:
      type: object
      properties:
        handle:
          type: string
          description: The handle to own, exactly ^[a-z0-9_]{1,30}$. Not lowercased
            or trimmed for you. Permanent once bound.
          maxLength: 64
      required:
      - handle
    HandleIneligible:
      type: object
      description: |-
        The 409 body: this account owns no messaging handle to vouch for.

        ``handle_unclaimed`` covers every cause -- an ineligible username
        (``WIRE.md`` §14.3), a reserved word, or a handle an earlier account holds
        -- because the remedy is the same: ``GET /api/e2ee/handle/`` names the
        cause and ``POST /api/e2ee/handle/claim/`` binds one.
      properties:
        detail:
          type: string
        reason:
          $ref: '#/components/schemas/HandleIneligibleReasonEnum'
      required:
      - detail
      - reason
    HandleIneligibleReasonEnum:
      enum:
      - handle_unclaimed
      type: string
      description: '* `handle_unclaimed` - handle_unclaimed'
    HandleStatus:
      type: object
      description: The caller's messaging handle, and what they can do about it.
      properties:
        handle:
          type: string
          nullable: true
          description: The handle this account owns, or null.
        status:
          allOf:
          - $ref: '#/components/schemas/MessagingHandleStatusEnum'
          description: |-
            'bound': the account owns `handle`, permanently. 'unclaimed': it owns none and may claim one.

            * `bound` - bound
            * `unclaimed` - unclaimed
        source:
          nullable: true
          description: |-
            'username': reserved from the account's own username. 'claimed': chosen through the claim flow. Null when unclaimed.

            * `username` - username
            * `claimed` - claimed
          oneOf:
          - $ref: '#/components/schemas/SourceEnum'
          - $ref: '#/components/schemas/NullEnum'
        candidate:
          type: string
          nullable: true
          description: lowercase(username) when that is a well-formed handle, else
            null. Says nothing about who owns it.
        eligible:
          type: boolean
          description: 'Whether `candidate` is this account''s to have: well-formed,
            not reserved, and not held by another account.'
        reason:
          nullable: true
          description: |-
            Why `eligible` is false. 'punctuation', 'non-ascii' and 'too-long' match the ZUULI client's IneligibilityReason; 'reserved' and 'taken' depend on server state.

            * `punctuation` - punctuation
            * `non-ascii` - non-ascii
            * `too-long` - too-long
            * `reserved` - reserved
            * `taken` - taken
          oneOf:
          - $ref: '#/components/schemas/HandleStatusReasonEnum'
          - $ref: '#/components/schemas/NullEnum'
        can_claim:
          type: boolean
          description: Whether POST /api/e2ee/handle/claim/ can succeed for this account.
      required:
      - can_claim
      - candidate
      - eligible
      - handle
      - reason
      - source
      - status
    HandleStatusReasonEnum:
      enum:
      - punctuation
      - non-ascii
      - too-long
      - reserved
      - taken
      type: string
      description: |-
        * `punctuation` - punctuation
        * `non-ascii` - non-ascii
        * `too-long` - too-long
        * `reserved` - reserved
        * `taken` - taken
