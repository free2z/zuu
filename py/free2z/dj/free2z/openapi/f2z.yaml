                $ref: '#/components/schemas/PurchaseIntent'
          description: The intent, `pending`, with `rail_data.checkout_url`.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`rail: zcash` is 400 `rail_unavailable` with `details.billing_url`:
            the Free2Z billing page (`<origin>/buy-2z`, with `?client_id=<app>` for
            an OAuth caller), where the user pays with Zcash.'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
