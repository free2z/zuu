  /api/zpage/{id}/:
    get:
      operationId: zpage_retrieve
      description: One zPage. The response carries a strong `ETag` for the **canonical**
        article — send it back as `If-Match` on a later PUT/PATCH/DELETE to make that
        write conditional. It describes the canonical article even when `?lang=` rendered
        a translation, because the write on this URL always writes the canonical article;
        a translation's own validator comes from `GET /api/zpage/{id}/variants/{language}/`.
      parameters:
      - in: header
        name: Accept-Language
        schema:
          type: string
        description: 'Standard weighted preference list, used when `lang` is absent.
          The full list is honoured in `q` order; an exact tag match beats a primary-subtag
          match (`en-GB` finds the `en` variant), `q=0` refuses a language, and a
          preference for a language this page does not have falls through to the source
          variant rather than failing. Responses carry `Vary: Accept-Language, Cookie`.'
      - in: path
        name: id
        schema:
          type: string
        description: The zPage's `free2zaddr` (a UUID) or its `vanity` slug. Not the
          database primary key -- this route never looks one up.
        required: true
      - in: query
        name: lang
        schema:
          type: string
        description: 'Which language variant to render. Any real BCP-47 language tag
          (`en`, `de`, `ja`, `pt-PT`); bare `pt` is accepted as `pt-BR`. A tag that
          is not a language at all is a 400. Omit to negotiate: the `Accept-Language`
          header is consulted next, and the article''s source variant last.'
      - in: query
        name: mine
        schema:
          type: boolean
        description: Owner-only draft access. Set this explicitly from the dashboard
          or editor; ordinary public profile and article reads are published-only
          and use the public paywall representation even for the owner. An anonymous
          request with `mine=true` is rejected with 403.
      tags:
      - zpage
      security:
      - cookieAuth: []
      - knoxApiToken: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/zPageDetail'
          description: ''
    put:
      operationId: zpage_update
      description: |-
        Update a zPage. `source_language` is the article's language *label* and is mutable: changing it renames the source variant and the denormalized column in one transaction. If another variant already holds the target language the change is refused with **409** and an actionable message — never a silent overwrite of the creator's translation.

        Send `If-Match` with the `ETag` from the article read to make this write conditional: a second tab that saved in the meantime turns this into a **412** instead of silently discarding their edit. Without the header the write is last-write-wins, as it has always been.
      parameters:
      - in: header
        name: If-Match
        schema:
          type: string
        description: 'Optimistic-concurrency precondition. Send the strong `ETag`
          returned by the corresponding read; the write is applied only if the resource
          still has that exact state, and otherwise fails with **412** and changes
          nothing. `*` asserts only that the resource exists. Optional: omitting it
          keeps the historical last-write-wins behaviour, so existing clients are
          unaffected — but two editors of the same article will then silently overwrite
          each other. Weak (`W/"..."`) tags never match, per RFC 9110 strong comparison.'
      - in: header
        name: X-Free2Z-Source-Language
        schema:
          type: string
        description: 'The article''s `source_language` as this client last read it.
          Two uses. (1) Required for translation writes when the canonical source
          language is unsupported/undetermined; the value must then exactly match
          the article''s current source_language, so stale editors fail closed with
          409. (2) With `If-Match`, on the canonical article and on translation writes:
          if the only change since the client''s read is the background language detector
          relabelling the article (`language_source` is `detected`), and this write
          does not itself set `source_language`, the precondition passes instead of
          returning 412. The response then carries the new `source_language`, and
          a client that sends this header is declaring that it will adopt it -- a
          client that does not follow the label should not send it on a canonical
          write. Omitted, `If-Match` is compared exactly. A write that sets a different
          `source_language` never gets this allowance.'
      - in: path
        name: id
        schema:
          type: string
        required: true
      - in: query
        name: lang
        schema:
          type: string
        description: 'Which language variant to render in the response body. Affects
          the representation only: it never sets or changes what is persisted. The
          source language comes from the `source_language` body field, on create and
          on update alike — it is mutable, and changing it to a language that already
          has a translation is a 409. An unsupported `lang` value here is ignored
          rather than failing the write. `Accept-Language` is NOT negotiated on a
          write: the response describes the variant that was written.'
      tags:
      - zpage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/zPageUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/zPageUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/zPageUpdate'
        required: true
      security:
      - cookieAuth: []
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/zPageDetail'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictDetail'
          description: ''
        '412':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreconditionFailed'
          description: ''
    patch:
      operationId: zpage_partial_update
      description: Partially update a zPage. `source_language` is mutable and owner-only;
        a target language already held by another variant is refused with **409**.
