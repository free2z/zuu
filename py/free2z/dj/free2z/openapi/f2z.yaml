    UserProfileSignature:
      type: object
      properties:
        tax_form_signature:
          type: string
          maxLength: 255
    ZPageCreateIdempotencyError:
      type: object
      description: |-
        409 from POST /api/zpage/ when its Idempotency-Key cannot be honoured.

        ``code`` is the stable, machine-readable part; ``error`` is the
        sentence to show. Nothing was created in either case.
      properties:
        code:
          allOf:
          - $ref: '#/components/schemas/ZPageCreateIdempotencyErrorCodeEnum'
          readOnly: true
        error:
          type: string
          readOnly: true
        key_resolved:
          type: boolean
          readOnly: true
          description: True when the request that spent this key has finished, so
            a fresh key is the right next step for a genuinely new page.
      required:
      - code
      - error
      - key_resolved
    ZPageCreateIdempotencyErrorCodeEnum:
      enum:
      - idempotency_mismatch
      - idempotency_page_gone
      type: string
      description: |-
        * `idempotency_mismatch` - idempotency_mismatch
        * `idempotency_page_gone` - idempotency_page_gone
    ZPageCreateNeeds2ZError:
      type: object
      description: |-
        402 from POST /api/zpage/: a second page needs a balance of 1 2Z.

        The ordinary ``insufficient_funds`` contract, so every client that already
        reads it (the composers, ZUULI's wallet) understands this refusal too.
        ``cost`` is the balance a second page requires; creating it debits
        nothing. ``detail`` is a sentence for a client that does not read
        ``code``.
      properties:
        code:
          $ref: '#/components/schemas/InsufficientFundsErrorCodeEnum'
        cost:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,3})?$
        balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,3})?$
        shortfall:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,3})?$
        action:
          type: string
          description: Stable identifier for the attempted paid action.
        charge_status:
          $ref: '#/components/schemas/ChargeStatus053Enum'
        tuzis_charged:
          type: integer
          minimum: 0
        detail:
          type: string
          readOnly: true
      required:
      - action
      - balance
      - code
      - cost
      - detail
      - shortfall
    ZPageTagDecision:
      type: object
      description: |-
        Accept and/or dismiss pending suggestions.

        Both lists are optional and an empty request is a valid no-op. Names are
        matched case-insensitively against pending suggestions; a name with no
        pending match is ignored rather than rejected, because the alternative is
        failing a whole request over one chip the creator already answered in
        another tab.

        A name in both lists is **accepted** — the constructive outcome, and the
        only one that cannot silently lose a tag the creator asked for.
      properties:
        accept:
          type: array
          items:
            type: string
            maxLength: 100
          description: Suggestions to add to the page's tags.
          maxItems: 100
        dismiss:
          type: array
          items:
            type: string
            maxLength: 100
          description: 'Suggestions to reject. A dismissal is permanent for that page:
            later AI passes will not propose the tag again.'
          maxItems: 100
    ZPageTagDecisionResult:
      type: object
      properties:
        accepted:
          type: array
          items:
            type: string
          description: Suggestions that were added to the page.
        dismissed:
          type: array
          items:
            type: string
          description: Suggestions that were rejected.
        tags:
          type: array
          items:
            type: string
          description: The page's complete tag list after the decision — authoritative,
            so the editor never has to guess what it now holds.
        suggestions:
          type: array
          items:
            $ref: '#/components/schemas/ZPageTagSuggestion'
          description: Whatever is still pending.
      required:
      - accepted
      - dismissed
      - suggestions
      - tags
    ZPageTagSuggestion:
      type: object
      description: One pending AI suggestion, with the breadth signal  defines.
      properties:
        name:
          type: string
          description: The proposed tag, exactly as it would be added.
        count:
          type: integer
          description: How many published zPages already carry this tag. `0` means
            the suggestion would introduce it to the platform.
        level:
          allOf:
          - $ref: '#/components/schemas/LevelEnum'
          description: |-
            `broad` or `narrow`, derived from how many published zPages carry the tag — NOT a stored attribute. The boundary is a percentile of the corpus, so it means the same thing as the platform grows. Broad tags are browse vocabulary; narrow tags are what makes long-tail discovery and “more like this” work. Treat it as a display hint: two tags either side of the boundary are near-identical in frequency, and the boundary itself moves as the corpus does.

            * `broad` - broad
            * `narrow` - narrow
      required:
      - count
      - level
      - name
    ZPageVariantSummary:
      type: object
      description: |-
        One row of `GET /api/zpage/{id}/variants/` — the translation manager's index.

        Not a `ModelSerializer` over `ZPageVariant` on purpose. Until  M5 flips
        reads, the legacy shape (`zPage` columns + `ZPageTranslation`) is the
        authority for *content* and publication state, while `ZPageVariant` is the
        only place that knows *provenance*. This serializer renders the join of the
        two, so a bug in the not-yet-read variant table can never make a variant's
        text or draft state wrong in a response.
      properties:
        language:
          type: string
          readOnly: true
          description: BCP-47 tag. Address this variant at `/api/zpage/{id}/variants/{language}/`.
        origin:
          readOnly: true
          nullable: true
          description: |-
            `source` is the article itself and cannot be deleted; `human` and `ai` are translations. `null` means the variant row has not been mirrored yet — unknown provenance, not `human`.

            * `source` - Source
            * `human` - Human translation
            * `ai` - AI translation
          oneOf:
          - $ref: '#/components/schemas/OriginEnum'
          - $ref: '#/components/schemas/NullEnum'
        is_published:
          type: boolean
          readOnly: true
          description: This variant's own publication state. Drafts appear only for
            the owner.
        is_stale:
          type: boolean
          readOnly: true
          nullable: true
          description: '`true` the source changed after this translation was made,
            `false` it is current, `null` unknown. Render `null` as nothing: translations
            without source-revision metadata are `null`; labeling them stale would
            give a false result.'
        title:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - description
      - is_published
      - is_stale
      - language
      - origin
      - title
      - updated_at
