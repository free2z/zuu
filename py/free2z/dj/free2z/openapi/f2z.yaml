          maxLength: 36
        description: Optional UUIDv4 key for retrying one boost. A completed keyed
          request is replayed rather than debiting 2Z again.
      tags:
      - zpage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FundPageRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FundPageRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FundPageRequest'
        required: true
      security:
      - cookieAuth: []
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - score
                - replayed
                properties:
                  score:
                    type: string
                    format: decimal
                  replayed:
                    type: boolean
          description: Authoritative score after the boost commits, plus whether this
            was a replay.
        '402':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsufficientFundsError'
          description: ''
  /api/zuuli/capabilities/:
    get:
      operationId: zuuli_capabilities
      description: Public release compatibility and backend capability discovery.
      parameters:
      - in: query
        name: platform
        schema:
          type: string
          enum:
          - android
          - ios
          - linux
          - macos
        description: Client platform; must be paired with version.
      - in: query
        name: version
        schema:
          type: string
          pattern: ^(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})$
        description: Canonical MAJOR.MINOR.PATCH app version; must be paired with
          platform.
      tags:
      - zuuli
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZuuliCapabilities'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZuuliError'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZuuliError'
          description: ''
components:
  schemas:
    AIIdempotencyError:
      type: object
      description: A malformed or conflicting idempotency request.
      properties:
        code:
          type: string
        error:
          type: string
      required:
      - code
      - error
    AIModel:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        provider:
          allOf:
          - $ref: '#/components/schemas/ProviderEnum'
          description: |-
            Which AI provider serves this model.

            * `openai` - OpenAI
            * `anthropic` - Anthropic
            * `xai` - xAI
            * `kimi` - Kimi (Moonshot)
        model:
          type: string
          description: Provider model name / id
          maxLength: 200
        display_name:
          type: string
          maxLength: 200
        system_message:
          type: string
          description: Default system message
        max_tokens:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          description: 'TOTAL context window: prompt AND reply are charged against
            this one number by every provider, so build_messages() trims the prompt
            to max_tokens - max_output_tokens and the reply is clamped to whatever
            the window has left.'
        max_output_tokens:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          description: 'RESERVE, despite the name (kept so a rolling deploy never
            sees a column change meaning under it): output tokens held back from the
            context window when trimming the prompt. This is the SHORTEST reply a
            maximally packed conversation is still guaranteed room for -- NOT a cap
            on the reply. The longest reply is max_response_tokens. Raising this gives
            long conversations more room to answer and less room to remember.'
        max_response_tokens:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          description: 'The LONGEST single reply this model will produce -- the provider''s
            own documented output limit. It is the ceiling on the output length a
            request may ask for (max_output_tokens in the request body) and the default
            when a request asks for nothing in particular, clamped to what the context
            window has left and to what the requester''s 2Z cover. Count reasoning
            tokens in here too: on models that bill them, they consume the same budget.
            Setting it above what the provider accepts earns a 400 on the requests
            that reach for it.'
        is_ga:
          type: boolean
          description: 'Lineup / product decision: does this row appear in the chat
            picker? A retired or preview model is is_ga=False. Paths that are not
            the picker deliberately ignore it -- zPage translation resolves its model
            from settings, not from GA. For ''we must not send content here at all'',
            use is_enabled.'
        is_enabled:
          type: boolean
          description: 'AVAILABILITY KILL SWITCH: may free2z route any content to
            this model? This is a policy decision about the provider''s terms, not
            a product one, so unlike is_ga it gates EVERY path -- the public catalogue,
            starting a conversation, forking one, generating a reply, zPage translation,
            and language detection. Turning it off deletes nothing: conversations
            already on the model stay readable, and turning it back on restores the
            model exactly as it was. EXCEPTION: rows whose provider is listed in f2z.ai.providers.POLICY_DISABLED_PROVIDERS
            are forced off on every save and cannot be re-enabled here -- lifting
            a vendor-terms decision is a reviewed code change, not a checkbox.'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        order:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        input_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,9})?$
          description: The cost per token for input. E.g., $0.0015 / 1K tokens means
            $0.0000015 per token.
        output_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,9})?$
          description: The cost per token for output. E.g., $0.002 / 1K tokens means
            $0.000002 per token.
        markup:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          description: 'The multiplier that we charge above our cost. Default: at
            cost'
      required:
      - created_at
      - display_name
      - id
      - max_tokens
      - model
      - system_message
      - updated_at
    AINotChargedError:
      type: object
      description: A refusal that explicitly confirms the request incurred no debit.
      properties:
        detail:
          type: string
        charge_status:
          $ref: '#/components/schemas/ChargeStatus053Enum'
        tuzis_charged:
          type: integer
          minimum: 0
      required:
      - charge_status
      - tuzis_charged
    AIParserError:
      type: object
      description: A malformed JSON body rejected by DRF before endpoint validation.
      properties:
        detail:
          type: string
      required:
      - detail
    AIPersonality:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        creator:
          type: string
          readOnly: true
        display_name:
          type: string
          maxLength: 200
        system_message:
          type: string
        is_public:
          type: boolean
      required:
      - creator
      - display_name
      - id
      - system_message
    AIRequestError:
      anyOf:
      - $ref: '#/components/schemas/AINotChargedError'
      - $ref: '#/components/schemas/AIIdempotencyError'
      - $ref: '#/components/schemas/AIParserError'
      - $ref: '#/components/schemas/ExpectedActorError'
    AIServiceError:
      oneOf:
      - $ref: '#/components/schemas/AINotChargedError'
      - $ref: '#/components/schemas/AISettledInterruptionError'
      discriminator:
        propertyName: charge_status
        mapping:
          not_charged: '#/components/schemas/AINotChargedError'
          settled: '#/components/schemas/AISettledInterruptionError'
    AISettledInterruptionError:
      type: object
      description: A provider interruption whose observed usage was charged.
      properties:
        detail:
          type: string
        charge_status:
          $ref: '#/components/schemas/AISettledInterruptionErrorChargeStatusEnum'
        tuzis_charged:
          type: integer
          minimum: 0
        response_saved:
          type: boolean
      required:
      - charge_status
      - detail
      - response_saved
      - tuzis_charged
    AISettledInterruptionErrorChargeStatusEnum:
      enum:
      - settled
      type: string
      description: '* `settled` - settled'
    AcceptAgreement:
      type: object
      properties:
        expected_actor_id:
          type: integer
        version:
          type: string
        digest:
          type: string
        schedules:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleReference'
        acknowledged:
          type: boolean
      required:
      - acknowledged
      - digest
      - expected_actor_id
      - schedules
      - version
    AcceptedAgreement:
      type: object
      properties:
        version:
          type: string
        digest:
          type: string
        accepted_at:
          type: string
          format: date-time
        agreement_accepted:
          type: boolean
      required:
      - accepted_at
      - agreement_accepted
      - digest
      - version
    AccessEnum:
      enum:
      - private
      - members
      - public
      type: string
      description: |-
        * `private` - private
        * `members` - members
        * `public` - public
    AccountDeletionBlockerEnum:
      enum:
      - earnings_owed
      - app_has_users
      - staff_account
      type: string
      description: |-
        * `earnings_owed` - earnings_owed
        * `app_has_users` - app_has_users
        * `staff_account` - staff_account
    AccountDeletionError:
      type: object
      properties:
        code:
          type: string
        detail:
          type: string
      required:
      - code
      - detail
    AccountDeletionKeepRequest:
      type: object
      properties:
        keep_token:
          type: string
          description: From a sign-in's 409 `deletion_pending` answer (or the keep
            page's link).
          maxLength: 2048
      required:
      - keep_token
    AccountDeletionKept:
      type: object
      properties:
        username:
          type: string
        token:
          type: string
          description: 'Only for a native sign-in (social, wallet): a Knox token.'
      required:
      - username
    AccountDeletionPreview:
      type: object
      properties:
        username:
          type: string
        balance_2z:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,3})?$
          description: 2Z credits the account still holds; they cannot be used after
            deletion.
        connected_apps:
          type: integer
          description: Apps with live access; all of them lose it.
        pages:
          type: integer
        grace_days:
          type: integer
          description: Days between the request and the purge; signing in before then
            keeps the account.
        username_reserved_days:
          type: integer
          description: Days after the purge before anyone else may take the username.
        deletion_cancelled_at:
          type: string
          format: date-time
          nullable: true
          description: When a sign-in last kept this account during a grace period.
        blockers:
          type: array
          items:
            $ref: '#/components/schemas/AccountDeletionBlockerEnum'
          description: 'Why the account cannot be deleted here yet. `earnings_owed`:
            creator earnings are owed or paid work is not yet settled; support settles
            them first. `app_has_users`: the account owns an SDK app with grants or
            purchases. `staff_account`: another admin must remove staff access first.'
      required:
      - balance_2z
      - blockers
      - connected_apps
      - deletion_cancelled_at
      - grace_days
      - pages
      - username
      - username_reserved_days
    AccountDeletionRequest:
      type: object
      properties:
        confirm_username:
          type: string
          description: The signed-in account's username, typed by its holder.
          maxLength: 150
      required:
      - confirm_username
    AccountDeletionScheduled:
      type: object
      properties:
        purge_after:
          type: string
          format: date-time
        username_free_after:
          type: string
          format: date-time
      required:
      - purge_after
      - username_free_after
    AccountRecoveryNextStepEnum:
      enum:
      - add_email
      - confirm_email
      - resend_email
      - replace_email
      type: string
      description: |-
        * `add_email` - add_email
        * `confirm_email` - confirm_email
        * `resend_email` - resend_email
        * `replace_email` - replace_email
    AccountRecoveryRiskEnum:
      enum:
      - none
      - no_recovery
      - no_credentials
      type: string
      description: |-
        * `none` - none
        * `no_recovery` - no_recovery
        * `no_credentials` - no_credentials
    ActionEnum:
      enum:
      - stream_join
      type: string
      description: '* `stream_join` - stream_join'
    AddEmailResponse:
      type: object
      properties:
        email:
          type: string
          format: email
        confirmed_at:
          type: string
          format: date-time
          nullable: true
      required:
      - confirmed_at
      - email
    AddEmailValidationError:
      type: object
      properties:
        email:
          type: array
          items:
            type: string
    Agreement:
      type: object
      properties:
        version:
          type: string
        digest:
          type: string
        text:
          type: string
        schedules:
          type: array
          items:
            $ref: '#/components/schemas/PublishedSchedule'
      required:
      - digest
      - schedules
      - text
      - version
    AllowedScopesEnum:
      enum:
      - openid
      - profile
      - email
      - offline_access
      - balance:read
      - purchase:create
      - ai:invoke
      type: string
      description: |-
        * `openid` - openid
        * `profile` - profile
        * `email` - email
        * `offline_access` - offline_access
        * `balance:read` - balance:read
        * `purchase:create` - purchase:create
        * `ai:invoke` - ai:invoke
    ApiStyleEnum:
      enum:
      - openai_responses
      - openai_chat
      - anthropic_messages
      type: string
      description: |-
        * `openai_responses` - openai_responses
        * `openai_chat` - openai_chat
        * `anthropic_messages` - anthropic_messages
    ApplicationStatusChange:
      type: object
      description: '`{"status":...}` from `POST /api/kyc/change-status`.'
      properties:
        status:
          type: string
      required:
      - status
    ApplicationStatusEnum:
      enum:
      - NEW
      - PENDING
      - APPROVED
      - REJECTED
      type: string
      description: |-
        * `NEW` - New
        * `PENDING` - Pending
        * `APPROVED` - Approved
        * `REJECTED` - Rejected
    AuthorityInfo:
      type: object
      description: The public half of the handle authority, for configuring a log.
      properties:
        public_key:
          type: string
          description: Ed25519 authority public key, 64 lowercase hex characters.
        authority_id:
          type: string
          description: BLAKE2b-256('free2z/kt/v1/authority-id' || public_key), 64
            hex. The same value `f2z-assert authority` prints.
        log_id:
          type: string
          description: The log_id this authority signs for, 64 hex.
        validity_ms:
          type: integer
          description: expires_ms - issued_ms of the assertions this deployment signs.
            Logs apply their own cap independently.
      required:
      - authority_id
      - log_id
      - public_key
      - validity_ms
    AuthorityUnavailable:
      type: object
      description: 'The 503 body: a bounded reason code, and nothing about the deployment.'
      properties:
        detail:
          type: string
        reason:
          allOf:
          - $ref: '#/components/schemas/AuthorityUnavailableReasonEnum'
          description: |-
            Why no assertion was issued. Every value is enumerated here: the field never carries an error string from the key store.

            * `account_epoch_unavailable` - account_epoch_unavailable
            * `authority_key_invalid` - authority_key_invalid
            * `authority_key_unavailable` - authority_key_unavailable
            * `authority_unconfigured` - authority_unconfigured
            * `log_unconfigured` - log_unconfigured
      required:
      - detail
      - reason
    AuthorityUnavailableReasonEnum:
      enum:
      - account_epoch_unavailable
      - authority_key_invalid
      - authority_key_unavailable
      - authority_unconfigured
      - log_unconfigured
      type: string
      description: |-
        * `account_epoch_unavailable` - account_epoch_unavailable
        * `authority_key_invalid` - authority_key_invalid
        * `authority_key_unavailable` - authority_key_unavailable
        * `authority_unconfigured` - authority_unconfigured
        * `log_unconfigured` - log_unconfigured
    AuthorizationRequest:
      type: object
      description: |-
        The authorization request parameters (spec §9.2), echoed back by the
        consent GET and re-submitted by the consent POST.
      properties:
        response_type:
          type: string
        client_id:
          type: string
        redirect_uri:
          type: string
        scope:
          type: string
        state:
          type: string
        code_challenge:
          type: string
        code_challenge_method:
          type: string
        nonce:
          type: string
        prompt:
          type: string
        max_age:
          type: string
        acr_values:
          type: string
        login_hint:
          type: string
        ui_locales:
          type: string
        response_mode:
          type: string
        f2z_login_ticket:
          type: string
          description: 'Not an OAuth parameter: the `login_ticket` of an earlier `login`
            answer, carried back after the sign-in it asked for. A sign-in at or after
            the ticket''s time satisfies `prompt=login` and `max_age` (including `max_age=0`).
            An invalid or expired ticket is ignored.'
        f2z_spend_cap:
          type: string
          description: 'Not an OAuth parameter: the app''s suggested spend cap, echoed
            so the POST''s `request_id` still matches. The POST never records it;
            only its own `spend_cap_2z` counts.'
        f2z_spend_period:
          type: string
          description: 'Not an OAuth parameter: the period of `f2z_spend_cap`, echoed
            like it.'
      required:
      - client_id
      - code_challenge
      - code_challenge_method
      - redirect_uri
      - response_type
      - scope
      - state
    AuthorizeResponse:
      type: object
      description: |-
        The consent step's answer.

        ``action`` decides what the page does: ``login`` (sign the user in, then
        repeat the GET; ``reason`` says why), ``consent`` (show the screen and
        POST the decision), ``approve`` (nothing to ask: POST ``allow: true``
        right away), ``redirect`` (navigate to ``redirect_to``; the response,
        success or error, is already encoded in it).
      properties:
        action:
          $ref: '#/components/schemas/OidcAuthorizeActionEnum'
        reason:
          type: string
        login_ticket:
          type: string
          description: 'With `action: login`: opaque and signed. Send it back as `f2z_login_ticket`
            on the repeated request after the sign-in; valid for 10 minutes.'
        redirect_to:
          type: string
        request_id:
          type: string
          description: Opaque, signed; must be sent back on the POST.
        authorization_request:
          $ref: '#/components/schemas/AuthorizationRequest'
        consent:
          $ref: '#/components/schemas/ConsentPrompt'
      required:
      - action
    AvailabilityEnum:
      enum:
      - available
      - maintenance
      - update_required
      type: string
      description: |-
        * `available` - available
        * `maintenance` - maintenance
        * `update_required` - update_required
    Balance:
      type: object
      description: |-
        Spec §1.1, and ``f2z_ai_proto::balance::Balance`` field for field:
        four non-negative integers of milli-2Z and an RFC 3339 UTC instant.
      properties:
        available_milli_2z:
          type: integer
          minimum: 0
          description: 'What can be spent now: `balance - held`, and `0` while `debt_milli_2z`
            is non-zero. Apps show this.'
        held_milli_2z:
          type: integer
          minimum: 0
          description: The sum of open AI-call holds; normally `0` when nothing is
            streaming.
        balance_milli_2z:
          type: integer
          minimum: 0
          description: The balance, holds included. Never has the debt folded into
            it.
        debt_milli_2z:
          type: integer
          minimum: 0
          description: What the account owes after a reversal took back 2Z already
            spent. Always present, never negative; while non-zero every spend is refused
            with 403 `account_in_debt`.
        as_of:
          type: string
          format: date-time
          description: When the numbers were read, RFC 3339 UTC.
      required:
      - as_of
      - available_milli_2z
      - balance_milli_2z
      - debt_milli_2z
      - held_milli_2z
    BasicInfo:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        is_us:
          type: boolean
          nullable: true
        is_individual:
          type: boolean
          nullable: true
        application_status:
          allOf:
          - $ref: '#/components/schemas/ApplicationStatusEnum'
          readOnly: true
        rejection_reason:
          type: string
          readOnly: true
      required:
      - application_status
      - id
      - rejection_reason
    BlankEnum:
      enum:
      - ''
    CallReport:
      type: object
      properties:
        report_id:
          type: string
          format: uuid
        call_id:
          type: string
          format: uuid
        reason:
          $ref: '#/components/schemas/Reason2c3Enum'
        created_at:
          type: string
          format: date-time
      required:
      - call_id
      - created_at
      - reason
      - report_id
    CallReportRequest:
      type: object
      properties:
        reason:
          allOf:
          - $ref: '#/components/schemas/Reason2c3Enum'
          description: |-
            Why the output is being reported.

            * `incorrect` - Incorrect
            * `inappropriate` - Inappropriate
            * `unsafe` - Unsafe
            * `other` - Other
        detail:
          type: string
          description: Optional, one line, at most 200 characters. Apps that children
            may use should send a preset value rather than offer a free-text box.
            Never AI output.
          maxLength: 200
      required:
      - reason
    CapPeriodEnum:
      enum:
      - day
      - week
      - month
      - total
      type: string
      description: |-
        * `day` - per day
        * `week` - per week
        * `month` - per month
        * `total` - in total
    Capabilities:
      type: object
      properties:
        policy_version:
          $ref: '#/components/schemas/PolicyVersionEnum'
        active:
          type: boolean
        creator_compensation_available:
          type: boolean
        zec_funding_method:
          $ref: '#/components/schemas/FundingMethod'
      required:
      - active
      - creator_compensation_available
      - policy_version
      - zec_funding_method
    CardFees:
      type: object
      description: |-
        The card fee is ``max(min_fee_cents, ceil(base_cents * percent_fee))``.

        Informational only: clients must display the authoritative `card_cents`
        from `/api/pricing/quote/` (or the checkout quote) rather than recomputing
        a charge from these.
      properties:
        percent_fee:
          type: string
          description: Card processing markup, e.g. '0.10'.
        min_fee_cents:
          type: integer
          description: Minimum card fee in USD cents; the markup only applies above
            it.
      required:
      - min_fee_cents
      - percent_fee
    Catalog:
      type: object
      description: Crate ``Catalog`` (schema 1).
      properties:
        schema:
          type: integer
          description: Always 1.
        version:
          type: integer
          description: Unix microseconds of the newest change or the per-minute re-issue.
            Increases over time, but a later response can be LOWER by up to ~7 minutes
            (pods straddling a minute, a deleted model); see dj.apps.pricing.catalog
            for the bound.
        issued_at:
          type: integer
          description: Unix seconds.
        expires_at:
          type: integer
          description: Unix seconds; issued_at + 72h.
        rate_card_version:
          type: integer
        platform_margin_bps:
          type: integer
        disabled_providers:
          type: array
          items:
            type: string
        models:
          type: array
          items:
            $ref: '#/components/schemas/CatalogModel'
      required:
      - disabled_providers
      - expires_at
      - issued_at
      - models
      - platform_margin_bps
      - rate_card_version
      - schema
      - version
    CatalogModel:
      type: object
      properties:
        id:
          type: string
          description: Public model id a client names.
        provider:
          type: string
        provider_model_id:
