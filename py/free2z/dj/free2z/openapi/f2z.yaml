    post:
      operationId: purchases_intents_create
      description: Create a purchase intent and open its rail's payment surface.
      summary: Create a purchase intent (buy 2Z)
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: 'Required. 1-128 printable ASCII characters, scoped to (app,
          user); an OAuth app and a first-party session are separate scopes. A replay
          with the same body returns the original intent, as it is NOW, with the original
          status code, and opens no second checkout. The same key with a different
          body is 409 `idempotency_conflict`; while the original request is still
          running it is 409 `idempotency_conflict` with `details.in_flight: true`.
          Missing or malformed: 400 `invalid_request`. Keys are honoured for at least
          24 hours.'
        required: true
      tags:
      - sdk
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseIntentCreate'
          application/x-www-form-urlencoded:
            schema:
