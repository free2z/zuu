            When supplied, it must still identify the creator in the URL.
        expected_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,7}(?:\.\d{0,0})?$
          description: Exact 2Z amount approved for this immediate purchase. A new
            subscription uses it as the renewal ceiling; an existing subscription
