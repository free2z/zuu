    LanguageCatalog:
      type: object
      description: The catalog, plus the locale its names are actually in.
      properties:
        locale:
          type: string
          description: The locale `name` is written in — the *resolved* one, which
            may differ from what was requested (`es-MX` resolves to `es`, an unknown
            locale to `en`). Cache the catalog under this value, not under the one
            you asked for.
        languages:
          type: array
          items:
            $ref: '#/components/schemas/LanguageEntry'
      required:
      - languages
      - locale
    LanguageEntry:
      type: object
      description: One language, with everything a picker needs and nothing it does
        not.
      properties:
        tag:
          type: string
          description: Canonical BCP-47 tag, e.g. `pt-BR`, `zh-Hant`.
        name:
          type: string
          description: The language's name in the response's `locale`. Never a raw
            subtag.
        autonym:
          type: string
          description: The language's name written in itself (`日本語`). Falls back to
            the English name where CLDR has no endonym.
        script:
          type: string
          nullable: true
          description: ISO 15924 script the tag is written in, from CLDR likely subtags
            — `zh-TW` answers `Hant` even though it does not spell it. `null` when
            unanswerable, which means *no constraint*, not *Latin*.
        direction:
          allOf:
          - $ref: '#/components/schemas/DirectionEnum'
          description: |-
            Text direction for `script`. Derived from the script, not the language: `ku` is `ltr` and `ckb` is `rtl`.

            * `ltr` - ltr
            * `rtl` - rtl
        translatable:
          type: boolean
          description: Whether we sell an AI translation into this language. Every
            entry currently served is `true`; the flag exists so that a language listed
            but demoted to detect-only stops being offered without a client release.
      required:
      - autonym
      - direction
      - name
      - script
      - tag
      - translatable
