            to spend.
        enforcement_reason:
          allOf:
          - $ref: '#/components/schemas/EnforcementReasonEnum'
          description: |-
            Coarse reason for `enforced`: `ok` exactly when `enforced` is true; otherwise the first unmet prerequisite. `platform_disabled` and `ledger_cutover_pending` are platform-wide rollout states; `ledger_cap_pending` means the ledger has no current exact projection of this grant. Additive: clients must treat any unknown value as not enforced, and `enforced` stays authoritative.

            * `ok` - Ok
            * `platform_disabled` - Platform Disabled
            * `ledger_cutover_pending` - Ledger Cutover Pending
            * `ledger_cap_pending` - Ledger Cap Pending
        as_of:
          type: string
          format: date-time
      required:
      - account_epoch
      - as_of
      - cap_period
      - client_id
