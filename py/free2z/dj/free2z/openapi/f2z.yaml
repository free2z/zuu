          type: integer
          minimum: 10000
        context_window:
          type: integer
          minimum: 0
          description: Tokens.
        max_output_tokens:
          type: integer
          minimum: 0
          description: Tokens.
        ttfb_timeout_ms:
          type: integer
          minimum: 0
          description: Milliseconds.
        idle_timeout_ms:
          type: integer
