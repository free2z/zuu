    SubscriptionRenewalSummary:
      type: object
      description: Snapshot of the balance required for the fan's next renewals.
      properties:
        status:
          $ref: '#/components/schemas/SubscriptionRenewalSummaryStatusEnum'
        balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,17}(?:\.\d{0,3})?$
          nullable: true
        total_upcoming:
          type: string
          format: decimal
          pattern: ^-?\d{0,17}(?:\.\d{0,3})?$
          nullable: true
          description: 'Total 2Z of the renewal charges the worker will ATTEMPT within
            `horizon_days`, at current creator prices. A subscription is charged at
            most once in that window, so this is a count of real attempts rather than
            a projection of recurring cost — but an attempt is not a debit: when this
            exceeds the balance, later charges fail instead of drawing.'
        shortfall:
          type: string
          format: decimal
          pattern: ^-?\d{0,17}(?:\.\d{0,3})?$
          nullable: true
          description: Amount by which `total_upcoming` exceeds the balance.
        next_renewal:
          type: string
          format: date-time
          nullable: true
          description: 'Earliest subscription expiry inside the window. Informational:
            renewal attempts begin 24h before expiry and retry hourly, so this is
            NOT a top-up deadline.'
        horizon_days:
          type: integer
          description: Length of the window the totals cover, in days. One billing
            cycle — the interval over which each subscription renews at most once.
      required:
      - balance
      - horizon_days
      - next_renewal
      - shortfall
      - status
      - total_upcoming
    SubscriptionRenewalSummaryStatusEnum:
      enum:
      - none
