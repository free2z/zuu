          nullable: true
          readOnly: true
        variants:
          type: array
          items:
            $ref: '#/components/schemas/ImageVariant'
          readOnly: true
        poster:
          type: string
          nullable: true
          description: |-
            Extracted still for a VIDEO upload; None for everything else.

            Served under the video's own access prefix -- never copied to a
            second, more public location. None means no poster
            exists: render a blank player, and do NOT declare a `thumbnailUrl`
            for it.
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        title:
          type: string
          maxLength: 128
        description:
          type: string
          maxLength: 255
        access:
          $ref: '#/components/schemas/AccessEnum'
        mime_type:
          allOf:
          - $ref: '#/components/schemas/MimeTypeEnum'
          readOnly: true
