    CreditError:
      type: object
      properties:
        code:
          type: string
        error:
          type: string
        key_resolved:
          type: boolean
          description: 'Only on `idempotency_mismatch`, and only when this endpoint
            can prove it: true means the request recorded under your Idempotency-Key
            has FINISHED and cannot be the one you are making now -- it is another
            recipient''s, or it bought a membership that has since ended -- so retire
            that key and mint a new one. Note what it does not mean: ''a different
            request finished'' is not enough on its own. A finished receipt for a
            membership you are STILL holding is your own purchase under a stale price,
            and is answered 200 `replayed` instead, never with this flag, because
            retiring the key there would buy a second month. False means the other
            request may still be committing -- reuse the SAME key. Absent means the
            endpoint could not tell (a receipt it cannot attribute), which is also
            a reason to reuse the same key. Without this a client that keeps one key
            per purchase intent can be answered 409 for the receipt''s whole retention
            horizon with no way to recover.'
        balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,3})?$
          nullable: true
        current_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,7}(?:\.\d{0,0})?$
          nullable: true
      required:
      - code
      - error
