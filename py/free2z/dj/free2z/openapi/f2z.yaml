              schema:
                $ref: '#/components/schemas/PaginatedPromptResponseList'
          description: ''
    post:
      operationId: ai_conversations_promptresponses_create
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
        description: Optional UUIDv4 operation key. Reuse it only to retry the exact
          same provider request.
      - in: header
        name: X-AI-Generation-Model
        schema:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
        description: Optional legacy receipt discriminator. On retries of a chat whose
          stored receipt includes a model id, provide that original id so the server
          can replay the response after the conversation model changes. This header
          never selects the model for a new generation.
      - in: path
        name: conversation_id
        schema:
          type: string
          pattern: ^[0-9a-f-]+$
        required: true
      tags:
      - ai
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromptRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PromptRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PromptRequest'
        required: true
      security:
      - cookieAuth: []
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromptResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIRequestError'
          description: Application validation refusals include an explicit no-charge
            outcome; malformed or conflicting idempotency requests use code/error.
            Invalid JSON rejected by the request parser returns detail only.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIRequestError'
          description: Application validation refusals include an explicit no-charge
            outcome; malformed or conflicting idempotency requests use code/error.
            Invalid JSON rejected by the request parser returns detail only.
        '402':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsufficientFundsError'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIServiceError'
          description: A pre-provider failure is not charged; an accepted interrupted
            provider stream reports its settled amount and that no response was saved.
