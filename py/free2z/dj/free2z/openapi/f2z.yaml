    ConsentDecision:
      type: object
      description: The consent POST.
      properties:
        request_id:
          type: string
        authorization_request:
          $ref: '#/components/schemas/AuthorizationRequest'
        allow:
          type: boolean
        scope:
          type: array
          items:
            $ref: '#/components/schemas/ScopeEnum'
          description: The scopes the user grants; a subset of the request. Defaults
            to every requested scope.
        spend_cap_2z:
          type: integer
          minimum: 0
          nullable: true
          description: 'REQUIRED on a first consent that grants ai:invoke: the user''s
            choice, null meaning no cap (400 when absent). On a re-consent, absent
            keeps the existing cap.'
        cap_period:
          $ref: '#/components/schemas/CapPeriodEnum'
      required:
      - allow
      - authorization_request
      - request_id
    ConsentPrompt:
      type: object
      description: '``action: consent`` -- what the consent screen shows.'
      properties:
        application:
          $ref: '#/components/schemas/ConsentApplication'
        scopes:
          type: array
          items:
            type: string
          description: The requested scopes, in request order.
        scope_descriptions:
          type: object
          additionalProperties:
            type: string
        already_granted:
          type: array
          items:
            type: string
          description: Scopes the existing grant (if any) already covers.
        cap_required:
          type: boolean
          description: 'True when ai:invoke is requested: the cap control is shown.'
        spend_cap:
          allOf:
          - $ref: '#/components/schemas/SpendCap'
          description: 'What the screen pre-selects: the existing grant''s budget
            on re-consent; on first consent, the app''s optional per-user suggestion
            without a platform clamp. A request''s `f2z_spend_cap` hint replaces it
            only when it fits the registration''s default and the existing grant by
            a lower amount at their period, so it is never higher. Null means prepaid
            balance without an extra app budget.'
        spend_cap_source:
          allOf:
          - $ref: '#/components/schemas/SpendCapSourceEnum'
          description: |-
            Where `spend_cap` came from: the existing `grant`, the `app` registration's default, the `platform` default, or the authorization `request`'s clamped hint.

            * `grant` - grant
            * `app` - app
            * `platform` - platform
            * `request` - request
        current_spend_cap:
          allOf:
          - $ref: '#/components/schemas/SpendCap'
          nullable: true
          description: 'The budget a change is judged against: the user''s last grant
            for the app (live or revoked), or null when there is none or it never
            made an AI spending decision. A raise over it -- a higher amount, no cap,
            or any other period -- needs a recent sign-in.'
        is_raise_step_up_required:
          type: boolean
          description: On a re-consent, choosing a higher cap than the existing one
            needs a recent authentication (RFC 9470).
      required:
      - already_granted
      - application
      - cap_required
      - current_spend_cap
      - is_raise_step_up_required
      - scope_descriptions
      - scopes
      - spend_cap
      - spend_cap_source
