      type: object
      properties:
        meeting_id:
          type: string
        auth_token:
          type: string
        host_session:
          type: string
          format: uuid
          description: Host only. The seat this tab now holds; renew it with `POST
            /api/dyte/{username}/host-session`.
        meeting_type:
          $ref: '#/components/schemas/PublicMeetingListMeetingTypeEnum'
        resumed:
          type: boolean
          description: Host only. True when an already-live session was resumed or
            taken over instead of a new one being started.
