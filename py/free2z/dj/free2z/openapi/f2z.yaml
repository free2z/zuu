    RecoveryStatus:
      type: object
      properties:
        can_recover:
          type: boolean
          description: 'True when a confirmed, mailable address exists, i.e. when
            /api/emails/reset-password would actually send this account a link. Necessary,
            and -- when mfa_required is true -- not sufficient: see that field.'
        mfa_required:
          type: boolean
          description: An active TOTP factor is enrolled, so redeeming a reset link
            ALSO needs a current authenticator code. can_recover cannot account for
            whether the user still has that authenticator -- nothing can -- so a client
            must surface this rather than implying the emailed link is the whole story.
        email_on_file:
          type: boolean
          description: An address row exists, in any state. Needed to tell 'you have
            no address' apart from 'you have one whose confirmation link is dead'.
        email_confirmed:
          type: boolean
          description: A confirmed address is on file.
        email_pending:
          type: boolean
          description: 'An unconfirmed address is on file and needs user action. This
            does not reveal whether a confirmation was sent or whether its token is
            live; use `next_step: resend_email` for a safe retry. Suppressed addresses
            are reported separately.'
        email_suppressed:
          type: boolean
          description: The address on file is on the opt-out list, so we send it nothing
            -- neither confirmations nor reset links. False when no address is on
            file.
        password_set:
          type: boolean
          description: The account has a usable password. Derived from the stored
            hash (has_usable_password()), not from the Creator.password_set flag that
            /api/emails/password-is-set reports -- see the view docstring for why
            those two can disagree.
        risk:
          allOf:
          - $ref: '#/components/schemas/AccountRecoveryRiskEnum'
          description: |-
            'none' when can_recover. Otherwise 'no_recovery' if a password still gets the user in, and 'no_credentials' when there is no password either -- a linked social identity is the only door and nothing restores it.

            * `none` - none
            * `no_recovery` - no_recovery
            * `no_credentials` - no_credentials
        next_step:
          nullable: true
          description: |-
            The one action that would establish recovery, or null when there is nothing to do. 'resend_email' means an unconfirmed address is on file; POST /api/emails/resend safely issues or refreshes its link without revealing whether a prior message was sent. 'replace_email' means the address is on the opt-out list, where resending sends nothing and only a different address helps.

            * `add_email` - add_email
            * `confirm_email` - confirm_email
            * `resend_email` - resend_email
            * `replace_email` - replace_email
          oneOf:
          - $ref: '#/components/schemas/AccountRecoveryNextStepEnum'
          - $ref: '#/components/schemas/NullEnum'
      required:
      - can_recover
      - email_confirmed
      - email_on_file
      - email_pending
      - email_suppressed
      - mfa_required
      - next_step
      - password_set
      - risk
