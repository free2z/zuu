            with this request is not spent.
        '409':
          headers:
            Idempotency-Key-Honored:
              schema:
                type: string
                enum:
                - 'true'
              description: 'Always `true` on every response from this operation: this
                server honours `Idempotency-Key` on page creation. A backend that
                predates the key never sends it, and ignores the key -- so a client
                must not retry a timed-out create under its key until it has seen
                this header from the server it is talking to, and should stop trusting
                it the moment a keyed create is answered without it.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZPageCreateIdempotencyError'
          description: 'The Idempotency-Key cannot be honoured: `idempotency_mismatch`
            (it created a page from a different body) or `idempotency_page_gone` (the
            page it created was deleted). Nothing was created.'
  /api/zpage/{free2zaddr}/translations/:
    get:
      operationId: zpage_translation_jobs
      description: |-
        Every AI translation job of this zPage that a client needs to show: the newest job per language from the last 30 days, plus the delivered job that produced any still-current draft, newest first, with the state of the translation it produced (or would overwrite). Read from the charge records themselves, so a job started on one device, or before a reload, is visible from any other. Read-only.

        Poll this while any job is `queued`. `in_flight` and `capacity` are account-wide, so a client can say how many more it may start.

        Owner only; a non-owner gets 404.
      parameters:
      - in: path
        name: free2zaddr
        schema:
          type: string
        description: The zPage's `free2zaddr` or its `vanity`.
        required: true
