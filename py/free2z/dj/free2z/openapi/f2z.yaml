  /api/tuzis/donate-idempotent/{username}:
    post:
      operationId: tuzis_donate_idempotent_create
      description: 'Atomically transfer 2Z and record a replayable response. The idempotency
        key is bound to recipient, amount, and anonymity. This explicit route supports
        backend-first rollout: clients must not fall back to the legacy donation POST
        after an ambiguous response. `intent: ppv` (the former pay-per-view unlock)
        is retired: a new request is refused with 400 `ppv_unlock_retired` and moves
        nothing, because PPV admission is a balance reserve and PPV is billed per
        minute watched; a key that completed a `ppv` unlock before the retirement
        still replays its receipt. Completed results replay for 365 days.'
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
        description: 'UUIDv4 retry key. Reuse it only for the exact same confirmed
          2Z request. The value is parsed as a UUID and stored in its canonical lowercase
          hyphenated form, so the braced, `urn:uuid:` and unhyphenated 32-character
          spellings of one UUID are the SAME key, not three. The key is scoped to
          this operation: a key spent here is spent here, and no other endpoint replays
          it.'
        required: true
      - in: path
        name: username
        schema:
          type: string
        required: true
      tags:
      - tuzis
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdempotentDonationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/IdempotentDonationRequest'
          multipart/form-data:
