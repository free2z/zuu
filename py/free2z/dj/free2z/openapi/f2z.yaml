    Transaction:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        status:
          type: string
          readOnly: true
          description: Credited only where original actual issuance is proven; historical
            nominal amounts alone are unavailable.
        credited:
          type: boolean
          readOnly: true
        credited_m2z:
          type: string
          nullable: true
          readOnly: true
          description: Exact original issued m2Z as a digit string; null when original
            issuance is unproved.
        usage_credited_m2z:
          type: string
          nullable: true
          readOnly: true
          description: Exact original m2Z added to usage; null when unproved. The
            original total also includes purchase-origin debt repayment.
        usage_debt_repaid_m2z:
          type: string
          nullable: true
          readOnly: true
          description: Exact original purchase m2Z applied to prior usage debt; null
            when unproved. The two usage fields sum to credited_m2z.
        amount:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Total amount paid to stripe in cents
        tuzis_credited:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Number of Tuzis credited to the user.
        timestamp:
          type: string
          format: date-time
          readOnly: true
          description: Timestamp when the transaction was made.
        stripe_charge_id:
          type: string
          description: Unique identifier for the transaction from Stripe.
          maxLength: 255
        user:
          type: integer
          description: Reference to the creator that made the transaction.
      required:
      - amount
      - credited
      - credited_m2z
      - id
      - status
      - stripe_charge_id
      - timestamp
      - tuzis_credited
      - usage_credited_m2z
      - usage_debt_repaid_m2z
      - user
    TranslationBatchError:
      type: object
      description: Every non-2xx answer of the bulk purchase except 402.
      properties:
        code:
          type: string
          description: '`items_refused` (see `items` -- the batch is all-or-nothing,
            so NOTHING was bought), `source_changed` (the article moved; every item
            is listed), `translation_in_progress` (the account cap: `in_flight` of
            `max_in_flight` are running), `translation_backlog`, `translation_failure_cooldown`,
            `translation_failing`, `translation_unavailable`, `idempotency_key_required`,
            `idempotency_mismatch`, `request_in_progress`, `invalid_request`, `invalid_language`,
            `duplicate_language`, `too_many_languages`.'
        error:
          type: string
          description: Human-readable message.
        items:
          type: array
          items:
            $ref: '#/components/schemas/TranslationItemFailure'
          description: The languages that failed, and why. Only the failing ones;
            an item absent here would have been accepted.
        source_digest:
          type: string
          description: 'On `source_changed`: the article''s current digest.'
        in_flight:
          type: integer
        max_in_flight:
          type: integer
        max_items:
          type: integer
        retry_after:
          type: integer
      required:
      - code
      - error
    TranslationBatchItem:
      type: object
      properties:
        language:
          type: string
          description: BCP-47 tag to translate INTO. Same rules as the single-language
            purchase; bare `pt` canonicalizes to `pt-BR`.
          maxLength: 35
        expected_price:
          type: integer
          minimum: 0
          description: This language's `price` from `GET .../translations/quote/`,
            as shown to the creator.
      required:
      - expected_price
      - language
    TranslationBatchJobs:
      type: object
      description: 202 from the bulk purchase, and its idempotent replay.
      properties:
        batch_id:
          type: string
          description: The `Idempotency-Key` this batch was bought under. Every job
            it created carries it as `batch_id`.
        total:
          type: integer
          description: 2Z debited for the batch.
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/TranslationJob'
          description: One charge record per language, in request order. On a replay
            each reports its CURRENT status.
        replayed:
          type: boolean
      required:
      - batch_id
      - jobs
      - replayed
      - total
    TranslationBatchPurchase:
      type: object
      description: '`POST.../translations/` -- buy several translations at once.'
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TranslationBatchItem'
          description: One entry per target language, each with the price the creator
            approved. At most `max_items` from the quote; a language may appear once.
        source_digest:
          type: string
          description: The quote's `source_digest`. **Required** here (unlike the
            single-language purchase, there is no legacy caller to keep working).
            If the article changed, the whole batch is refused with 409 `source_changed`
            and nothing is charged.
          maxLength: 64
          minLength: 64
          pattern: ^[0-9a-f]{64}$
        settlement_policy:
          type: integer
          minimum: 0
          description: 'Which refund terms the buyer was shown, applied to every job
            in the batch. Same meaning as on the single-language purchase: omit it
            and every failure is refunded in full.'
      required:
      - items
      - source_digest
    TranslationBatchQuote:
      type: object
      description: '`GET.../translations/quote/` -- per-language prices plus a total.'
      properties:
        source_language:
          type: string
        source_digest:
          type: string
          description: Send back as the purchase's `source_digest`.
        ai_model:
          type: string
          nullable: true
        balance:
          type: string
          description: The creator's 2Z balance.
        items:
          type: array
          items:
            $ref: '#/components/schemas/TranslationBatchQuoteItem'
        total:
          type: integer
          description: Sum of `price` over the AVAILABLE items.
        affordable:
          type: boolean
          description: '`balance >= total`.'
        capacity:
          type: integer
          description: How many more translations this account may start now (its
            own cap and the platform queue, whichever is tighter). A purchase of more
            is refused whole.
        in_flight:
          type: integer
          description: Translations this account has running.
        max_items:
          type: integer
          description: Most languages one quote or purchase may name.
      required:
      - affordable
      - ai_model
      - balance
      - capacity
      - in_flight
      - items
      - max_items
      - source_digest
      - source_language
      - total
    TranslationBatchQuoteItem:
      type: object
      properties:
        language:
          type: string
          description: 'The normalized tag, or the raw input when it could not be
            parsed (`reason: invalid_language`).'
        available:
          type: boolean
          description: 'Whether this language could be bought right now, in this batch.
            Advisory: the purchase re-checks under its locks.'
        price:
          type: integer
          nullable: true
          description: Price in whole 2Z; null when `available` is false.
        reason:
          type: string
          nullable: true
          description: Same codes as `TranslationItemFailure.code`; null when available.
        error:
          type: string
          nullable: true
        existing_variant:
          allOf:
          - $ref: '#/components/schemas/ExistingVariant'
          nullable: true
      required:
      - available
      - error
      - existing_variant
      - language
      - price
      - reason
    TranslationDraftReview:
      type: object
      description: Current saved draft, trusted provenance and prior warning context.
      properties:
        job_id:
          type: string
          nullable: true
          description: The delivered job whose exact output is still this draft.
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/TranslationWarning'
        prior_warnings:
          type: array
          items:
            $ref: '#/components/schemas/TranslationWarning'
          description: Warnings from the newest delivery for this language. Historical
            context only; they do not describe an edited draft's current contents
            and never authorize publication.
        revision:
          type: string
          description: Strong variant ETag; send as `If-Match` when publishing.
      required:
      - job_id
      - revision
      - warnings
    TranslationError:
      type: object
      description: Every non-2xx answer except 402 on these routes has this shape.
      properties:
        code:
          type: string
          description: 'Stable machine-readable reason. Branch on this, never on the
            prose: `idempotency_key_required`, `idempotency_mismatch`, `request_in_progress`,
            `price_changed`, `source_changed`, `variant_published`, `published_variant_limit`,
            `draft_variant_limit`, `not_translatable`, `same_language`, `empty_article`,
            `unknown_source_language`, `translation_unavailable`, `translation_in_progress`,
            `translation_backlog`, `translation_failure_cooldown`, `translation_failing`,
            `translation_too_long`.'
        error:
          type: string
          description: Human-readable message.
        price:
          type: integer
          description: 'On `price_changed`: the current price in 2Z. Re-quote and
            re-confirm with the creator before retrying.'
        retry_after:
          type: integer
          description: 'On the 429s (`translation_failure_cooldown`, `translation_failing`):
            seconds to wait before buying again. Nothing was charged. Deliberately
            the whole cooldown window rather than the exact moment the rolling total
            clears it.'
      required:
      - code
      - error
    TranslationItemFailure:
      type: object
      properties:
        language:
          type: string
        code:
          type: string
          description: 'Why THIS language was refused: `price_changed`, `source_changed`,
            `variant_published`, `translation_in_progress` (a job for this exact language
            is already running), `published_variant_limit`, `draft_variant_limit`,
            `not_translatable`, `same_language`, `empty_article`, `unknown_source_language`,
            `invalid_language`, `duplicate_language`.'
        error:
          type: string
          description: Human-readable message.
        price:
          type: integer
          description: 'On `price_changed`: this language''s current price.'
      required:
      - code
      - error
      - language
    TranslationJob:
      type: object
      description: |-
        The charge record: what was paid, and what became of it.

        Returned by the purchase (202) and by `GET.../translate/`. Retrying the
        purchase with the same `Idempotency-Key` replays this same record, so a
        client that lost a response can always recover the truth about its money.
      properties:
        job_id:
          type: string
          description: Opaque id for this purchase. Poll `GET .../translate/`.
        status:
          allOf:
          - $ref: '#/components/schemas/TranslationJobStatusEnum'
          description: |-
            `queued` paid, translation in progress. `delivered` a DRAFT variant now exists -- review it, edit it, publish it; see `warnings` for anything it did not preserve. `refunded` the full amount was credited back and nothing was written. `settled` nothing was written and PART of the charge was kept, covering provider work that had already been done and billed to us when the buyer changed the article under their own paid job again -- see `fault` and `billed`. All three of `delivered`, `refunded` and `settled` are terminal: stop polling.

            * `queued` - queued
            * `delivered` - delivered
            * `refunded` - refunded
            * `settled` - settled
        zpage_id:
          type: integer
        language:
          type: string
        source_digest:
          type: string
        target_digest:
          type: string
          nullable: true
          description: 'Digest of the draft that occupied this language at purchase,
            or null. Covers its title, description AND content -- everything a delivery
            overwrites -- so polishing only a translated title still counts as a change.
            The worker refuses to deliver over a draft that changed since: a creator''s
            own edits are never overwritten by machine output, and the purchase is
            refunded instead.'
        price:
          type: integer
          description: Quoted price in whole 2Z.
        charged:
          type: string
          description: Amount debited.
        refunded:
          type: string
          description: Amount credited back. Equal to `charged` when `status` is `refunded`
            -- which is every failure caused by us, by the provider, or before any
            generation happened. On `settled` it is `charged` minus `billed`.
        billed:
          type: string
          description: Amount KEPT out of `charged`, in 2Z. `0` for everything except
            a `settled` record. Never exceeds `price`, and never exceeds the metered
            cost of provider work that was actually performed.
        settlement_policy:
          type: integer
          nullable: true
          description: 'The refund terms this purchase recorded, echoed back from
            what the client declared. `null` means legacy terms: every failure is
            refunded in full. A client that sent a version and reads `null` here did
            not get the terms it thought it did.'
        fault:
          allOf:
          - $ref: '#/components/schemas/FaultEnum'
          description: |-
            Who the failure was attributed to. `platform` our defect -- a mis-set cap, our timeout, our bug, a kill switch: always a full refund. `provider` an outage or unusable output: always a full refund. `request` the buyer changed the article under a job they had already paid for, repeatedly: settled at metered cost.

            * `platform` - platform
            * `provider` - provider
            * `request` - request
        metered_cost:
          type: integer
          description: 'The most this failure could have been billed at, in whole
            2Z: the provider work actually performed, priced with the same cost-plus
            arithmetic as the quote and deliberately under-counted so an estimate
            can never over-bill. Recorded on every failure, including the ones refunded
            in full.'
        estimated_cost:
          type: integer
          description: The better estimate of what this failure cost Free2Z, in whole
            2Z -- not discounted. Never billed to anyone; it exists so the number
            used for a charge can err low while the number used to describe a loss
            errs high.
        provider_billed:
          type: boolean
          description: Whether the provider did billable work before the failure.
            False means nobody paid for anything.
        provider_input_tokens:
          type: integer
          description: Prompt tokens sent across every provider call, including attempts
            whose answer was discarded.
        provider_output_tokens:
          type: integer
          description: Completion tokens generated across every provider call, including
            attempts whose answer was discarded -- a provider bills a stream it generated
            whether or not we keep it.
        provider_calls:
          type: integer
          description: Provider calls made before the failure.
        settled_at:
          type: string
          nullable: true
          description: ISO-8601 timestamp of the terminal failure transition.
        balance:
          type: string
          description: The creator's balance as of the last change to this record.
        ai_model:
          type: string
        ai_model_id:
          type: string
        error:
          type: string
          nullable: true
          description: 'Why it failed, if it did: `provider_error`, `failure_cooldown`,
            `empty_output`, `output_truncated`, `timeout`, `output_too_long`, `source_changed`,
            `variant_published`, `variant_changed`, `same_language`, `model_unavailable`,
            `mirror_disabled`, `provenance_unwritten`, `zpage_gone`, `abandoned`,
            `wrong_script`, or a safety code (`url_not_in_source`, `zip321_amount_not_in_source`,
            `payment_math_not_verified`, `payment_scan_limit`, `unsafe_url_scheme`,
            `markup_not_in_source`, `amount_not_in_source`). Payment destination,
            amount, unverifiable math, and scan-budget failures reject the draft and
            refund the charge. Other safety codes are delivered as warnings.'
        error_detail:
          type: string
          nullable: true
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/TranslationWarning'
          description: 'On `delivered`: the content-preservation checks this draft
            did NOT pass. The draft was delivered anyway, and billed in full, because
            it is an unpublished draft the creator reviews -- these name what to look
            at before publishing. An empty list is a clean delivery; the key is absent
            on records delivered before warnings existed.'
        attempted_output_preview:
          type: string
          description: 'Reserved: the start of what the model produced on a failed
            job, served only for failure codes whose output provably cannot be a usable
            translation -- currently NONE, because a refund that hands back a translation
            is a free translation. Use `error`, `error_detail` and `attempted_output_chars`
            to explain a failure. Owner-only if ever served. Untrusted model output:
            display it as PLAIN TEXT, never render it as Markdown or HTML.'
        attempted_output_chars:
          type: integer
          description: 'On a failure of the output itself: how many characters the
            model had produced. Present whether or not `attempted_output_preview`
            is.'
        actual_cost:
          type: integer
          description: What the finished translation actually cost in 2Z at the model's
            real token usage. Recorded for transparency; the creator is always billed
            `price`.
        replayed:
          type: boolean
          description: True when this response is the replay of an earlier identical
            purchase rather than a new one.
      required:
      - ai_model
      - ai_model_id
      - balance
      - charged
      - error
      - job_id
      - language
      - price
      - refunded
      - source_digest
      - status
      - zpage_id
    TranslationJobList:
      type: object
      description: '`GET.../translations/` -- the job tray, rediscoverable from any
        device.'
      properties:
        source_digest:
          type: string
          description: The article's current content digest.
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/TranslationJobListItem'
          description: Newest job per language, newest first, from the last 30 days.
        drafts:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/TranslationDraftReview'
          description: Current unpublished drafts and trusted review provenance, independent
            of whether their producing jobs remain in the recent jobs list.
        in_flight:
          type: integer
          description: Translations this ACCOUNT has running (any article).
        capacity:
          type: integer
          description: How many more this account may start now.
        max_in_flight:
          type: integer
          description: The per-account concurrent-translation cap.
      required:
      - capacity
      - drafts
      - in_flight
      - jobs
      - max_in_flight
      - source_digest
    TranslationJobListItem:
      type: object
      description: The newest job for one language of this zPage.
      properties:
        language:
          type: string
        job_id:
          type: string
        batch_id:
          type: string
          description: Present when the job was bought in a bulk purchase.
        status:
          type: string
          description: '`queued`, `delivered`, `refunded` or `settled` -- same meaning
            as `TranslationJob.status`.'
        source_digest:
          type: string
          nullable: true
          description: The source text this job translates. Not equal to the list's
            own `source_digest` means it was bought against an older revision.
        price:
          type: integer
          nullable: true
        charged:
          type: string
          nullable: true
        refunded:
          type: string
          nullable: true
        billed:
          type: string
        fault:
          type: string
        error:
          type: string
          nullable: true
        error_detail:
          type: string
          nullable: true
        ai_model:
          type: string
          nullable: true
        created_at:
          type: string
          description: ISO-8601 purchase time.
        settled_at:
          type: string
          description: ISO-8601 time of a failure's settlement.
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/TranslationWarning'
          description: 'On `delivered`: the content-preservation checks this draft
            did not pass, passed through from the charge record. Delivered and billed
            anyway; these name what the creator should review. Empty for a clean delivery;
            absent on records delivered before warnings existed.'
        draft:
          allOf:
          - $ref: '#/components/schemas/TranslationDraftReview'
          nullable: true
          description: The current saved draft, when one exists. `revision` is its
            strong variant ETag and must be sent as `If-Match` when publishing the
            reviewed text. `job_id` and `warnings` identify the delivery only when
            its persisted output digest still matches the draft; otherwise the draft
            has no trusted AI provenance.
        has_attempted_output_preview:
          type: boolean
          description: Whether the charge record carries an `attempted_output_preview`.
            The text itself is not listed here; read it from `GET .../variants/{language}/translate/`
            for the one job being opened.
        is_published:
          type: boolean
          nullable: true
          description: Whether this language's translation is live, in either storage
            shape. Null when no translation exists in it.
        is_stale:
          type: boolean
          nullable: true
          description: True when the translation was made from an older source revision;
            null when that is unknown or nothing exists.
      required:
      - ai_model
      - charged
      - created_at
      - error
      - error_detail
      - has_attempted_output_preview
      - is_published
      - is_stale
      - job_id
      - language
      - price
      - refunded
      - source_digest
      - status
    TranslationJobStatusEnum:
      enum:
      - queued
      - delivered
      - refunded
      - settled
      type: string
      description: |-
        * `queued` - queued
        * `delivered` - delivered
        * `refunded` - refunded
        * `settled` - settled
    TranslationPurchase:
      type: object
      description: '`POST.../translate/` -- confirm the quoted price and buy.'
      properties:
        expected_price:
          type: integer
          minimum: 0
          description: 'The price the creator was shown and approved, from `GET .../translate/quote/`.
            Required: with no flat price and no cap, a purchase that did not name
            a number would be a charge the creator never saw. A mismatch against the
            server''s own recomputed price is refused with 409 `price_changed` and
            no money moves.'
        source_digest:
          type: string
          description: SHA-256 of the article body shown in the quote. New clients
            must send it; the purchase is refused with 409 `source_changed` when the
            body has moved. It is optional for legacy callers, whose purchase is checked
            against the body read at request start.
          maxLength: 64
          minLength: 64
          pattern: ^[0-9a-f]{64}$
        settlement_policy:
          type: integer
          minimum: 0
          description: |-
            Which refund terms the buyer was SHOWN, as a version number (current: `1`). Send `1` only from a screen that states the one case in which a failed translation is not refunded in full: repeatedly changing or publishing the article while a translation you have already paid for is generating.

            **Omit it and every failure is refunded in full, always.** That is the legacy contract and it is the safe default on purpose -- a creator can only be charged against terms they actually saw, and the server cannot know what an already-open page is displaying. It never changes the price, only what happens if the job fails.
      required:
      - expected_price
    TranslationQuote:
      type: object
      description: |-
        `GET.../translate/quote/` -- the price, and the arithmetic behind it.

        Cost-plus and always metered, so there is no price list to look this up in:
        the number here is what this exact article, on this exact model, costs. It
        is computed from the token count of the REAL prompt and is stable for as
        long as the article is unchanged -- which `source_digest` lets a client
        prove.
      properties:
        price:
          type: integer
          description: What buying this translation costs, in whole 2Z. Show this
            to the creator and send it back as `expected_price`.
        balance:
          type: string
          description: The creator's current 2Z balance.
        affordable:
          type: boolean
          description: '`balance >= price` at the moment of the quote. Advisory: the
            purchase re-checks authoritatively.'
        source_language:
          type: string
        language:
          type: string
          description: The target language (BCP-47).
        source_digest:
          type: string
          description: 'SHA-256 of the article body this price was computed against.
            The purchase is bound to it: edit the article and the quote is void (the
            purchase answers 409 `price_changed` or is refunded), which is what keeps
            the quote and the charge about the same text.'
        ai_model:
          type: string
          description: Display name of the model that will do the work.
        input_tokens:
          type: integer
          description: Prompt tokens across every chunk, including the per-chunk instruction
            overhead.
        estimated_output_tokens:
          type: integer
          description: Estimated completion tokens. Unknowable exactly before generation;
            the settlement bills this quote regardless and absorbs an overrun.
        chunks:
          type: integer
          description: Provider calls this translation will take. Code blocks are
            never sent, so a code-heavy article costs less.
        existing_variant:
          allOf:
          - $ref: '#/components/schemas/ExistingVariant'
          nullable: true
          description: The variant already in this language, or null. A PUBLISHED
            one cannot be overwritten by machine output -- unpublish or delete it
            first.
      required:
      - affordable
      - ai_model
      - balance
      - chunks
      - estimated_output_tokens
      - existing_variant
      - input_tokens
      - language
      - price
      - source_digest
      - source_language
    TranslationWarning:
      type: object
      description: One content-preservation check a delivered draft did not pass.
      properties:
        code:
          allOf:
          - $ref: '#/components/schemas/TranslationWarningCodeEnum'
          description: |-
            Which check. Branch on this, never on `detail`. `url_not_in_source`, `zip321_amount_not_in_source`, `payment_math_not_verified`, and `payment_scan_limit` fail the job rather than deliver unverifiable payment instructions.

            * `code_identifier_not_preserved` - code_identifier_not_preserved
            * `reference_not_in_source` - reference_not_in_source
            * `brand_term_not_preserved` - brand_term_not_preserved
            * `amount_not_in_source` - amount_not_in_source
            * `markup_not_in_source` - markup_not_in_source
            * `unsafe_url_scheme` - unsafe_url_scheme
        detail:
          type: string
          description: Human-readable explanation.
        items:
          type: array
          items:
            type: string
          description: 'The offending strings -- the identifiers that changed, the
            schemes or tags that appeared, the amounts that differ -- sorted, at most
            20. Untrusted model output: display as plain text.'
      required:
      - code
      - detail
      - items
    TranslationWarningCodeEnum:
      enum:
      - code_identifier_not_preserved
      - reference_not_in_source
      - brand_term_not_preserved
      - amount_not_in_source
      - markup_not_in_source
      - unsafe_url_scheme
      type: string
      description: |-
        * `code_identifier_not_preserved` - code_identifier_not_preserved
        * `reference_not_in_source` - reference_not_in_source
        * `brand_term_not_preserved` - brand_term_not_preserved
        * `amount_not_in_source` - amount_not_in_source
        * `markup_not_in_source` - markup_not_in_source
        * `unsafe_url_scheme` - unsafe_url_scheme
    TwitterProfileSummary:
      type: object
      description: The public Twitter identity embedded in the private profile response.
      properties:
        id:
          type: string
        name:
          type: string
