  /api/tuzis/subscribe-confirmed/{username}:
    post:
      operationId: tuzis_subscribe_confirmed_create
      description: 'Purchase 30 days only when the creator''s transaction-locked price
        equals expected_price. A new subscription renews at that ceiling; an existing
        subscription retains its current renewal ceiling, including zero after cancellation.
        This explicit route supports backend-first rollout; clients must not fall
        back to the legacy subscription POST after an ambiguous response. Completed
        results replay for 365 days. A key that already completed a legacy POST /api/tuzis/subscribe/{username}/
        for the same creator is replayed here too (replayed: true, nothing charged)
        rather than claimed anew, so a client may move an outstanding purchase intent
        from that route to this one without paying twice. That replay is the ONE 200
        on this route that expected_price does not constrain, and it cannot be: the
        legacy route binds no price and records none, so the amount it debited is
        not recoverable from its receipt. Read it as ''this key already bought this
        membership, on a route that charged whatever the price was then'' -- nothing
        is charged now, and `balance` is the fan''s real balance either way. The same
        applies to a receipt reached through X-Superseded-Idempotency-Key. That carry-over
        replay only happens while the membership it bought is still running: receipts
        are kept far longer than 30 days, so a receipt whose month has already ENDED
        is not replayed -- you are not subscribed and it would be false -- and is
        not charged under that key either. It is 409 `idempotency_mismatch` with `key_resolved:
        true`, and the month is bought by the next request, under the fresh key that
        answer tells you to mint. Every replay on this route is guarded that way,
        including the replay of a receipt recorded under this very key. One other
        200 is unbound for the same kind of reason: if your key already completed
        a purchase HERE, of a membership you are STILL holding from this creator,
        a retry of it at a different expected_price replays that purchase (replayed:
        true, nothing charged) rather than refusing. That key bought the month you
        are holding, so reporting it is the honest answer, and telling you to mint
        a fresh one would buy a second month for a fan trying to recover one purchase.
        Retire the key on that 200 like any other, and a deliberate extra month is
        then a normal purchase at the current price. Once the membership has lapsed
        the same retry is a 409 `idempotency_mismatch` with `key_resolved: true`,
        because then the receipt really does describe a request that is over. A NEW
        debit is always bound to expected_price. expected_price 0 confirms a FREE
        membership (a free follow): it grants the same 30 days and moves no 2Z, so
        `charged: true` there means the membership was extended, not that 2Z moved.
        On every 200, `balance` is the fan''s balance as of this reply, including
        a replay; `charged` and `expires` describe the original request.'
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
        description: 'UUIDv4 retry key. Reuse it only for the exact same confirmed
          2Z request. The value is parsed as a UUID and stored in its canonical lowercase
          hyphenated form, so the braced, `urn:uuid:` and unhyphenated 32-character
          spellings of one UUID are the SAME key, not three. A key spent here is also
          spent on the legacy POST /api/tuzis/subscribe/{username}/ and vice versa:
          each route reads the other''s COMMITTED receipts, so a purchase intent that
          moves between the two after an ambiguous answer replays instead of charging
          a second month. Three bounds on that, stated because a guarantee a client
          cannot see the edge of is worse than a narrower one: it covers committed
          receipts, not two genuinely CONCURRENT requests under one key; it identifies
          the creator by id, so a retry sent after the path username changed hands
          is a different recipient and is charged as one; and it covers a membership
          that is still running. Receipts are kept far longer than a membership lasts,
          so a key whose month has already ENDED is neither replayed (you are not
          subscribed) nor charged again under that same key -- it is 409 `idempotency_mismatch`
          with `key_resolved: true`, which means retire the key and buy the new month
          under a fresh one.'
        required: true
      - in: header
        name: X-Superseded-Idempotency-Key
        schema:
          type: string
          minLength: 1
          maxLength: 200
        description: 'A retry key this client is RETIRING because it can no longer
          be sent: a value that predates the UUIDv4 rule now enforced on Idempotency-Key.
          Send it alongside the fresh Idempotency-Key that replaces it and this route
          looks for a committed receipt under it first, replaying that purchase (`replayed:
          true`, nothing charged) instead of buying a second month for an intent the
          retired key already paid for. The RETIRED value is only ever looked up:
          it is never claimed, never binds a price, and never charges. A value that
          is unknown, blank, longer than 200 characters, or absent is ignored and
          the request proceeds as a normal purchase under Idempotency-Key -- an unusable
          hint never fails a write. A lookup that DOES find a receipt ends the purchase
          intent under both keys: the fresh Idempotency-Key you sent with it is recorded
          as a receipt for that same replayed purchase, so a later retry of it --
          from an older tab, or on the legacy route -- replays instead of buying a
          second month. No 2Z moves, but that key is then spent and bound to this
          request''s expected_price, exactly as if the purchase had happened here.
          A value that IS a canonical UUIDv4 is ignored too, deliberately: such a
          key can be sent as Idempotency-Key itself, where it replays AND claims,
          so honouring it here would be a second, weaker way to spend a key. Retire
          the header once the purchase resolves, exactly like the key it replaces.'
      - in: path
        name: username
        schema:
          type: string
        required: true
      tags:
      - tuzis
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmedSubscriptionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConfirmedSubscriptionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConfirmedSubscriptionRequest'
        required: true
      security:
      - cookieAuth: []
      - knoxApiToken: []
