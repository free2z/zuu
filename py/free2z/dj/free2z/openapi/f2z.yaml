    ConfirmedSubscriptionResult:
      type: object
      properties:
        balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,3})?$
          description: 'The fan''s 2Z balance as of THIS reply, on a replay as well
            as on a new purchase. It is deliberately not the balance frozen in a replayed
            receipt: one of the replay paths (a receipt carried over from the legacy
            subscribe route) has no recorded balance to return, so live is the only
            meaning all of them can share, and a frozen number can be several charges
            out of date. `charged` and `expires` do describe the original request.'
        charged:
          type: boolean
        replayed:
          type: boolean
        expires:
          type: string
          format: date-time
        subscription:
          $ref: '#/components/schemas/Subscription'
      required:
      - balance
      - charged
      - expires
      - replayed
      - subscription
    ConflictDetail:
      type: object
      description: |-
        The body DRF actually returns for a 409 on these routes.

        Declared because `409: None` -- "a 409 exists, with no body" -- is what
        the schema said first, and orval faithfully generated the error type as
        `void`. The message is the whole point of this status code: it names the
        language and tells the creator what to delete. A contract that hides it
        guarantees the UI shows "something went wrong" instead.
      properties:
        detail:
          type: string
          readOnly: true
          description: Human-readable and actionable — show it to the creator verbatim
            rather than substituting a generic failure message.
      required:
      - detail
