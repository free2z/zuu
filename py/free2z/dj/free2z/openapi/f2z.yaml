    MeetingJoinRequestSchema:
      type: object
      description: Body of a start/join POST to a public meeting.
      properties:
        expected_actor_id:
          type: integer
          description: Original viewer account ID; required for a first-party paid
            PPV join under the active economic policy.
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          description: |-
            `host` starts (or resumes) the caller's own broadcast from this tab. `viewer` joins as an audience member, which is what the creator's own public stream page sends so it can never publish or claim the broadcaster seat. Omitted: legacy inference -- the creator is a host, anyone else a viewer. Only meaningful for the creator; everyone else is always a viewer.

            * `host` - host
            * `viewer` - viewer
        host_session:
          type: string
          format: uuid
          description: 'Host only. A random id the broadcasting tab generates once
            per page load. Re-sending the same id (a retry, a double click) resumes
            that tab''s seat instead of starting a second broadcast. Omitted by a
            legacy client: the server mints one, which simply expires if nothing renews
            it.'
        takeover:
          type: boolean
          default: false
          description: Host only. Deliberately move the broadcaster seat to this tab
            when another tab or device holds it. The other tab is told on its next
            heartbeat and leaves the room. The live room is kept, so viewers stay
            connected.
        price_per_minute:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
          description: 'Host only, PPV only. Ignored when resuming or taking over
            a live session: a live stream''s price never changes mid-session.'
