      type: string
      description: |-
        * `day` - per day
        * `week` - per week
        * `month` - per month
        * `total` - in total
    DeveloperApp:
      type: object
      description: A registration as its developer sees it.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        client_id:
          type: string
          readOnly: true
        client_type:
          allOf:
          - $ref: '#/components/schemas/ClientTypeEnum'
          description: |-
            Fixed at registration: `public` (native or browser app, no secret) or `confidential` (server-side, issued a secret).

            * `public` - public
            * `confidential` - confidential
        name:
          type: string
          description: Shown on the consent screen. May not contain "Free2Z" in any
            spelling or lookalike form (only Free2Z's own apps may), nor control,
            bidirectional or zero-width characters.
          maxLength: 255
        redirect_uris:
          type: array
          items:
            type: string
          description: 'Exact redirect URIs (spec §3): https, loopback http (127.0.0.1
            or [::1]), or a reverse-DNS private-use scheme. A confidential client
            may register https only.'
        allowed_scopes:
          type: array
          items:
            $ref: '#/components/schemas/AllowedScopesEnum'
          description: The scopes the app may request.
        allowed_origins:
          type: array
          items:
            type: string
          description: 'https origins a browser client calls the token endpoint from
            (spec §3.1), exactly as the browser sends them: `https://host[:port]`,
            lowercase, no path, query or fragment. Hosts on Free2Z''s own domains
            are refused.'
        markup_bps:
          type: integer
          maximum: 5000
          minimum: 0
          description: The markup the app ASKS for, in basis points (0..5000). Applied
            only up to the platform's manual approval.
        approved_markup_bps:
          type: integer
          readOnly: true
          nullable: true
          description: Set by the platform, by hand. Null = never reviewed.
        effective_markup_bps:
          type: integer
          readOnly: true
          description: min(markup_bps, approved_markup_bps or 0).
        markup_approval:
          allOf:
          - $ref: '#/components/schemas/MarkupApprovalEnum'
          readOnly: true
        default_spend_cap_2z:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
          description: Optional budget suggested separately to each user at first
            AI consent, in whole 2Z; not a shared app quota. Null suggests prepaid
            balance without an extra budget. Users may change or remove it.
        default_cap_period:
          allOf:
          - $ref: '#/components/schemas/DefaultCapPeriodEnum'
          description: |-
            The period of `default_spend_cap_2z`; `total` never resets. It also bounds a sign-in's `f2z_spend_cap` / `f2z_spend_period` hint: the consent screen never pre-selects more than this default allows.

            * `day` - per day
            * `week` - per week
            * `month` - per month
            * `total` - in total
        logo_url:
          description: https only.
          oneOf:
          - type: string
            format: uri
            maxLength: 1024
          - type: string
            maxLength: 0
        privacy_url:
          description: https only.
          oneOf:
          - type: string
            format: uri
            maxLength: 1024
          - type: string
            maxLength: 0
        terms_url:
          description: https only.
          oneOf:
          - type: string
            format: uri
            maxLength: 1024
          - type: string
            maxLength: 0
        child_directed:
          type: boolean
          description: The app is directed to children or to all ages. The consent
            screen then addresses the adult account holder, and access tokens carry
            `child_directed` for the AI gateway. A developer may set it; turning it
            off needs Free2Z staff.
        first_party:
          type: boolean
          readOnly: true
        frozen:
          type: boolean
          readOnly: true
        has_client_secret:
          type: boolean
          readOnly: true
        created:
          type: string
          format: date-time
          readOnly: true
        updated:
          type: string
          format: date-time
          readOnly: true
      required:
      - approved_markup_bps
      - client_id
      - client_type
      - created
      - effective_markup_bps
      - first_party
      - frozen
      - has_client_secret
      - id
      - markup_approval
      - name
      - redirect_uris
      - updated
