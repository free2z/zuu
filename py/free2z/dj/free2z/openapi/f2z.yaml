  /api/ai/prompt/:
    post:
      operationId: ai_prompt_create
      description: 'Send one prompt to a catalogue model and get the reply back synchronously.
        The charge is metered on the prompt and reply token counts at the model''s
        published prices and debited from your 2Z balance; the response says exactly
        what was charged. The most this request can be charged (the prompt plus the
        longest reply asked for, plus a reasoning allowance on models whose output
        limit does not cover their reasoning) is held from your balance before the
        model is called -- refused with 402 if you do not hold it -- and the difference
        is returned when the reply is priced. No transcript is kept: use the conversation
        endpoints for one. Send an Idempotency-Key to be able to retry a dropped connection
        and get the same reply back without paying twice; the reply is kept with that
        key for replay.'
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
        description: Optional UUIDv4 operation key. Reuse it only to retry the exact
          same provider request.
      - in: header
        name: X-Expected-Actor
        schema:
          type: string
        description: Optional authenticated user ID observed when this paid request
          was prepared. If it differs from the current authenticated user, the request
          is refused with 409 account_changed before a receipt claim, provider call,
          or debit. It never chooses the actor or supplies persisted data.
      tags:
      - ai
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeteredPromptRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MeteredPromptRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MeteredPromptRequest'
        required: true
      security:
      - cookieAuth: []
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeteredPromptResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIRequestError'
          description: Application validation refusals include an explicit no-charge
            outcome; malformed or conflicting idempotency requests use code/error.
            Invalid JSON rejected by the request parser returns detail only.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIRequestError'
          description: Application validation refusals include an explicit no-charge
            outcome; malformed or conflicting idempotency requests use code/error.
            Invalid JSON rejected by the request parser returns detail only.
        '402':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsufficientFundsError'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIServiceError'
          description: A pre-provider failure is not charged; an accepted interrupted
            provider stream reports its settled amount and that no response was saved.
