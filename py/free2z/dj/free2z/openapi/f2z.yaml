  /api/tagging/autocomplete:
    get:
      operationId: tagging_autocomplete_list
      description: 'Tags in use on the platform, most-used first. The tag vocabulary
        is open (`django-taggit`): this endpoint enumerates what exists, it does not
        define what is allowed. Tags with a zero count are omitted. Public zPage counts
        include only published pages from active creators. For an authenticated owner''s
        vocabulary, pass `type=zpage&mine=true`; that mode includes the caller''s
        drafts.'
      parameters:
      - in: query
        name: mine
        schema:
          type: boolean
        description: For `type=zpage`, restrict counts to the authenticated caller's
          own zPages, including drafts. Anonymous callers are refused. When `username`
          is supplied too, it must match the caller's username (case-insensitive);
          a mismatch returns no rows.
      - in: query
        name: num_results
        schema:
          type: integer
        description: How many tags to return. Clamped to 1-100; a non-integer falls
          back to the default of 10.
      - in: query
        name: query
        schema:
          type: string
        description: Substring match on the tag name, case-insensitive.
      - in: query
        name: search
        schema:
          type: string
        description: Free-text filter applied to the *tagged objects* before counting,
          so counts describe a search result rather than the whole corpus. Requires
          `type`.
      - in: query
        name: selected_tags
        schema:
          type: string
        description: Comma-separated tags already chosen. They are excluded from the
          results, and — when `type` is given — the remaining counts are narrowed
          to objects carrying all of them, i.e. what can still be added. Without `type`
          the names are excluded but the counts are not narrowed. At most 50 entries
          are read; the rest are ignored.
      - in: query
        name: type
        schema:
          type: string
          enum:
          - comment
          - zpage
        description: 'Which corpus the counts describe. Omit to count both — visible
          zPages plus visible comments — which is a rough popularity signal across
          the platform. Every mode applies the caller''s own visibility rules: drafts,
          pages by deactivated creators, and comments on parents the caller cannot
          see are never counted. Any other value is a 400.'
      - in: query
        name: username
        schema:
          type: string
        description: Restrict to tags used by one creator. Requires `type`; without
          it the filter is ignored.
      tags:
      - tagging
      security:
      - cookieAuth: []
      - knoxApiToken: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TagSuggestion'
          description: ''
  /api/tagging/hub/{slug}:
    get:
      operationId: tagging_hub_retrieve
      description: |-
        Resolve a `/tag/<slug>` hub: which tag names share the slug, how much published content they cover, and whether that is enough to be worth indexing. The pages themselves come from `GET /api/zpage/?hub_slug=`, which resolves the complete component server-side.

        The slug is lowercase, with every character that is not a Unicode letter, number or mark folded to `-`. The mapping is deliberately lossy, so distinct tags can share a slug; the hub browses their union rather than picking a winner, which is why `names` is a list.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - tagging
      security:
      - cookieAuth: []
      - knoxApiToken: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagHub'
          description: ''
        '404':
          description: 'No live content under this slug. Deliberately a 404 rather
            than a 200 with an empty list: an indexable URL with nothing on it is
            a soft-404 that costs sitewide quality, and a tag whose every page belongs
            to a deactivated creator must look exactly like a tag that never existed.
            Also returned for a slug that is not in canonical form at all — `/tag/Zcash`,
            `/tag/a--b`, `/tag/..` — since none of those is a URL this platform emits.'
        '503':
          description: The alias graph exceeded the fixed public traversal bound;
            retry after reconciliation. No partial hub is returned.
  /api/tagging/zpage/{free2zaddr}/suggestions:
    get:
      operationId: tagging_zpage_suggestions_list
      description: |-
        Pending AI tag suggestions for one of your own zPages.

        Suggestions are produced asynchronously by the `zpage-tag` subscriber when a published page's content changes. On a page that already carries at least one tag they are **never** applied on their own — this endpoint plus a `POST` to the same path is the only way one becomes a tag. A published page with **zero** tags when the pass finishes has the pass's tags applied directly instead, so nothing is left pending for it. Tags the page already carries are filtered out, and a suggestion the creator has previously dismissed never reappears.

        Owner-only; any other caller gets **404**.
