  /api/oauth/authorize:
    get:
      operationId: oidc_authorize_evaluate
      description: |-
        Answer what the consent page must do for this request.

        Writes nothing. `action` is `login`, `consent`, `approve` or
        `redirect`; see the response schema.
      summary: Evaluate an authorization request (the consent step, read-only)
      parameters:
      - in: query
        name: acr_values
        schema:
          type: string
      - in: query
        name: client_id
        schema:
          type: string
        required: true
      - in: query
        name: code_challenge
        schema:
          type: string
        required: true
      - in: query
        name: code_challenge_method
        schema:
          type: string
        required: true
      - in: query
        name: f2z_login_ticket
        schema:
          type: string
        description: 'Not an OAuth parameter: the `login_ticket` of an earlier `login`
          answer, carried back after the sign-in it asked for. A sign-in at or after
          the ticket''s time satisfies `prompt=login` and `max_age` (including `max_age=0`).
          An invalid or expired ticket is ignored, never an error.'
      - in: query
        name: f2z_spend_cap
        schema:
          type: string
        description: 'Not an OAuth parameter: the app''s SUGGESTED spend cap for `ai:invoke`,
          a whole number of 2Z from 1. The consent screen may pre-select it, but only
          its AMOUNT is ever clamped: a capped registration default, and the user''s
          capped last grant for the app, each fix the period and bound the amount.
          A hint for another period than either is ignored (a period change is a raise:
          it starts a fresh spend window), so an applied hint never exceeds the registration''s
          default nor needs a fresh sign-in. It is never recorded by itself: only
          the cap the user confirms in the consent POST''s own `spend_cap_2z` / `cap_period`
          is. A silent (`approve`) authorization ignores it; send `prompt=consent`
          to ask the user again. A malformed value is ignored, never an error.'
      - in: query
        name: f2z_spend_period
        schema:
          type: string
        description: 'Not an OAuth parameter: the period of `f2z_spend_cap` -- `day`,
          `week`, `month` or `total` (never resets). Ignored without `f2z_spend_cap`;
          an unknown value makes the whole hint ignored. Absent, the hint keeps the
          period the screen would have pre-selected. Never rewritten: a period the
          registration''s default or the user''s capped grant does not have makes
          the hint ignored.'
      - in: query
        name: login_hint
        schema:
          type: string
      - in: query
        name: max_age
        schema:
          type: string
      - in: query
        name: nonce
        schema:
          type: string
      - in: query
        name: prompt
        schema:
          type: string
      - in: query
        name: redirect_uri
        schema:
          type: string
        required: true
      - in: query
        name: response_mode
        schema:
          type: string
      - in: query
        name: response_type
        schema:
          type: string
        required: true
      - in: query
        name: scope
        schema:
          type: string
        required: true
      - in: query
        name: state
        schema:
          type: string
        required: true
      - in: query
        name: ui_locales
        schema:
          type: string
      tags:
      - oauth
      security:
      - cookieAuth: []
      - knoxApiToken: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizeResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
          description: ''
        '409':
          description: The app is no longer available.
    post:
      operationId: oidc_authorize_decide
      description: The consent step (spec §5, §9.2, §9.3). See the module docstring.
      summary: Record the user's decision and mint the authorization code
      tags:
