    CatalogModelCapabilities:
      type: object
      description: Signed provider/model policy; the gateway also requires safe implementation.
      properties:
        vision:
          type: boolean
          default: false
        tools:
          type: boolean
          default: false
        reasoning:
          type: boolean
          default: false
        structured_output:
          type: boolean
          description: Strict JSON-schema response_format is supported. Always emitted
            by this signer; a gateway reads absence as 'not declared', never as false.
        strict_tools:
          type: boolean
          description: '`strict: true` on a function tool is supported. Always emitted
            by this signer; a gateway reads absence as ''not declared'', never as
            false.'
        reasoning_effort:
          type: boolean
          default: false
          description: '`reasoning_effort` is supported (zuu#1170); not implied by
            `reasoning`. Always emitted by this signer; absent reads as false.'
    CatalogModelControls:
      type: object
