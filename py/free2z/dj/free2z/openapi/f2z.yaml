                max_price:
                  type: string
                  pattern: ^(?:[1-9]\d{0,5}|1000000)$
                  description: Maximum 2Z the authenticated fan permits per renewal.
                  example: '100'
      security:
      - cookieAuth: []
      - knoxApiToken: []
