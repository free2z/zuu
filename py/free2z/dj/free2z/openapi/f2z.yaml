  /api/zpage/{free2zaddr}/variants/{language}/translate/:
    get:
      operationId: zpage_translation_status
      description: |-
        The most recent AI translation purchase for this zPage and language, and what became of it. 404 when the creator has never bought one.

        Poll this after a 202. `status` moves `queued` -> `delivered`, `refunded` or `settled` (all three terminal), and never leaves `queued` forever: a charge whose job never ran is refunded in full by the `g12f.reap_translation_charges` sweep within ten minutes of its deadline. A job still WAITING in the queue has not 'never run': it keeps its charge until it runs, or until the outer deadline of six hours from purchase.

        Owner only; a non-owner gets 404.
      parameters:
      - in: path
        name: free2zaddr
        schema:
          type: string
        description: The zPage's `free2zaddr` or its `vanity`.
        required: true
      - in: path
        name: language
        schema:
          type: string
        description: BCP-47 tag of the language to translate INTO. Must be one we
          sell into (`f2z.languages.TRANSLATABLE`); bare `pt` canonicalizes to `pt-BR`.
          The article's own `source_language` is refused -- that is the article, not
          a translation of it.
        required: true
      tags:
      - zpage
      security:
      - cookieAuth: []
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
