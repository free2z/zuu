  /api/auth/account-deletion/:
    get:
      operationId: account_deletion_preview
      summary: What deleting this account would do
      tags:
      - auth
      security:
      - cookieAuth: []
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDeletionPreview'
          description: ''
  /api/auth/account-deletion/keep/:
    post:
      operationId: account_deletion_keep
      description: |-
        ``POST /api/auth/account-deletion/keep/``: "Keep my account".

        A sign-in to an account in its deletion grace period is answered with a
        keep token instead of a credential. Spending it here cancels the deletion
        (``account_deletion.keep_account``: the account is active again, app
        grants stay revoked, the cancel is recorded and notified) and THEN signs
        the holder in -- a session for a browser, a Knox token for a native app --
        recording the proof the original sign-in made. Anonymous by definition;
        the keep token is the credential, short-lived and single-use.
      summary: Keep an account whose deletion is pending, and sign in
      parameters:
      - in: cookie
        name: f2z_keep
        schema:
          type: string
        description: Set (HttpOnly, SameSite=Strict) by the sign-in answer that issued
          a browser keep token; binds that token to this browser. Without it, a browser
          keep token answers 400 `keep_token_invalid`. Native (Knox) keep tokens need
          none.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountDeletionKeepRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AccountDeletionKeepRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AccountDeletionKeepRequest'
        required: true
      security:
      - cookieAuth: []
      - knoxApiToken: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDeletionKept'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDeletionError'
          description: '`keep_token_invalid`: expired, already spent, issued to another
            browser, or the account is no longer waiting to be kept. Sign in again.'
        '403':
          description: A browser keep (one that answers with a session) without a
            valid CSRF token.
  /api/auth/account-deletion/schedule/:
    post:
      operationId: account_deletion_schedule
      description: Schedules deletion after a 30-day grace period; signing in before
        then offers to keep the account. Replaces `POST /api/auth/account-deletion/`,
        which deleted at once and now answers 405 (that path is the preview, GET only).
      summary: Request deletion of the signed-in account
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountDeletionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AccountDeletionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AccountDeletionRequest'
        required: true
      security:
      - cookieAuth: []
      - knoxApiToken: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDeletionScheduled'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDeletionError'
          description: '`confirmation_mismatch`: `confirm_username` is not the signed-in
            account''s username.'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDeletionError'
          description: '`insufficient_user_authentication`: no sign-in within the
            last 5 minutes. Sign in again, then retry.'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDeletionError'
          description: '`earnings_owed`, `app_has_users` or `staff_account` (see the
            preview''s `blockers`), or `inactive` (the account is already deleted
            or deactivated). Nothing was changed.'
  /api/auth/login/:
