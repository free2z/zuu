      - CHAT2Z
      - PLATFORM_FEE
      - PAY_PER_VIEW_REVENUE
      - PAY_PER_VIEW_SPEND
      - ENCRYPTED_CHAT_REQUEST
      type: string
      description: |-
        * `AISCORE_COMMENT` - AISCORE_COMMENT
        * `MADE_COMMENT` - MADE_COMMENT
        * `VOTE_COMMENT_RECEIVED` - VOTE_COMMENT_RECEIVED
        * `VOTE_COMMENT_SENT` - VOTE_COMMENT_SENT
        * `NEW_REPLY` - NEW_REPLY
        * `PAGE_UPDATE` - PAGE_UPDATE
        * `PAGE_VOTE` - PAGE_VOTE
        * `PAGE_MENTION` - PAGE_MENTION
        * `DONATION_RECEIVED` - DONATION_RECEIVED
        * `DONATION_SENT` - DONATION_SENT
        * `SUBSCRIPTION_RECEIVED` - SUBSCRIPTION_RECEIVED
        * `SUBSCRIPTION_SENT` - SUBSCRIPTION_SENT
        * `BOUGHT_TUZI` - BOUGHT_TUZI
        * `ZEC_PENDING` - ZEC_PENDING
        * `CHAT2Z` - CHAT2Z
        * `PLATFORM_FEE` - PLATFORM_FEE
        * `PAY_PER_VIEW_REVENUE` - PAY_PER_VIEW_REVENUE
        * `PAY_PER_VIEW_SPEND` - PAY_PER_VIEW_SPEND
        * `ENCRYPTED_CHAT_REQUEST` - ENCRYPTED_CHAT_REQUEST
    UploadCreateUnsupported:
      type: object
      description: Why `POST /api/myuploads/` refused, and where to upload instead.
      properties:
        file:
          type: array
          items:
            type: string
          description: Why this route cannot create an upload, and which endpoint
            to upload through instead.
      required:
      - file
    UploadInUse:
      type: object
      description: |-
        The body of the 409 below. Declared so a generated client can SEE the
        actionable failure instead of an untyped error — drf-spectacular cannot
        infer a response from an exception raised inside `perform_destroy`, so
        regenerating the spec would otherwise stay green while documenting only
        the 204 (codex review of, finding 3).
      properties:
        detail:
          type: string
          description: Why the file cannot be deleted yet, and what to remove first.
      required:
      - detail
    UploadLimit:
      type: object
      description: What the caller may upload, and what would raise it.
      properties:
        tuzis:
          type: integer
          description: The caller's 2Z balance truncated to a whole number — the value
            the tiers below were compared against, NOT the exact balance.
        max_bytes:
          type: integer
          description: |-
            Largest upload REQUEST the caller may make right now, in bytes. A larger one is refused by nginx with a bodiless 403 before the body is proxied. The maximum is 250 MiB for every account with at least 1 whole 2Z; 5000 2Z no longer raises this cap. This cap keeps every admitted request below nginx's 300,000,000-byte buffering boundary.

            This is the size of the whole REQUEST, not just the file: nginx compares Content-Length, which for a multipart upload also carries the boundaries, the part headers, the filename and any metadata field (a few hundred bytes in practice). A file of exactly `max_bytes` is therefore refused. Budget for the envelope rather than treating this as a file-size allowance.
        tiers:
          type: array
          items:
            $ref: '#/components/schemas/UploadSizeTier'
          description: Every rung of the ladder, ascending. The 5000 2Z rung is kept
            for compatibility but has the same 250 MiB request cap as the 1 2Z rung;
            it does not represent an upload-size upgrade.
      required:
      - max_bytes
      - tiers
      - tuzis
    UploadSizeTier:
      type: object
      description: One rung of the upload-size ladder; repeated ceilings are allowed.
      properties:
        min_tuzis:
          type: integer
          description: The whole-number 2Z balance at which this tier applies. Compared
            against the balance truncated to an integer, so 0.999 2Z is still the
            0 tier.
        max_bytes:
          type: integer
          description: Ceiling for this tier, in bytes, compared against the whole
            upload REQUEST (see `max_bytes` on the response).
      required:
      - max_bytes
      - min_tuzis
    UsagePurchase:
      type: object
      properties:
        expected_actor_id:
          type: integer
        amount:
          type: string
        idempotency_key:
          type: string
          pattern: ^[A-Za-z0-9._:-]{1,128}$
        quote_token:
          type: string
          maxLength: 8192
        acknowledged:
          type: boolean
      required:
      - acknowledged
      - amount
      - expected_actor_id
      - idempotency_key
      - quote_token
    UserInfo:
      type: object
