    PatchedzPageUpdate:
      type: object
      description: Overlay content fields and append language-resolution metadata.
      properties:
        free2zaddr:
          type: string
          readOnly: true
          description: UUID to get the zPage
        vanity:
          type: string
          nullable: true
          description: 'Optional vanity URL segment. Normalized on write: lowercased,
            spaces become hyphens, punctuation and accents are dropped (`Café 6.4`
            becomes `cafe-64`). Letters or digits outside a-z/0-9 (Arabic, Korean,
            ...) are refused rather than silently dropped. At most 128 characters
            after normalization.'
          maxLength: 256
        p2paddr:
          type: string
          description: Creator's zaddress for funding and sending private memos
          maxLength: 255
        title:
          type: string
          maxLength: 128
        content:
          type: string
          maxLength: 100000
        is_published:
          type: boolean
        is_subscriber_only:
          type: boolean
        category:
          oneOf:
          - $ref: '#/components/schemas/CategoryEnum'
          - $ref: '#/components/schemas/BlankEnum'
        f2z_score:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,8})?$
          readOnly: true
          description: Cache of rank calculation
        get_url:
          type: string
          readOnly: true
        featured_image:
          type: integer
          nullable: true
        tags:
          type: array
          items:
            type: string
        publish_at:
          type: string
          format: date-time
          nullable: true
        description:
          type: string
          description: Description for meta tag, AI if blank
          maxLength: 255
        canonical_url:
          description: Optional original article URL used as the canonical URL when
            this page republishes content from another site
          oneOf:
          - type: string
            format: uri
            maxLength: 2048
          - type: string
            maxLength: 0
        source_language:
          type: string
          description: BCP-47 language tag of the canonical title, description and
            content — any real human language (`en`, `de`, `ja`, `pt-PT`). Normalized
            on write (`pt` becomes `pt-BR`). Mutable. The legacy-only value `und`
            may appear in a response but cannot be written.
        detected_language:
          type: string
          readOnly: true
          nullable: true
          description: Most recent machine-detected language of the source text.
        detection_confidence:
          type: number
          format: double
          readOnly: true
          nullable: true
          description: 'Detector confidence, 0.0-1.0. Low confidence is not an error:
            it drives a soft ''is this right?'' affordance, never a block.'
        language_source:
          readOnly: true
          nullable: true
          description: |-
            Whether source_language came from the detector or from the creator. A creator override is never overwritten by a later detection.

            * `detected` - Detected
            * `creator` - Creator
          oneOf:
          - $ref: '#/components/schemas/LanguageSourceEnum'
          - $ref: '#/components/schemas/NullEnum'
        requested_language:
          type: string
          readOnly: true
        actual_language:
          type: string
          readOnly: true
        fallback_used:
          type: boolean
          readOnly: true
        available_languages:
          type: array
          items:
            type: string
          readOnly: true
        variant_is_published:
          type: boolean
          readOnly: true
        origin:
          readOnly: true
          nullable: true
          description: |-
            Provenance of the variant this response rendered: `source` (the article itself), `human`, or `ai`. `null` means the variant rows were not loaded on this route -- unknown, never assume `human`.

            * `source` - Source
            * `human` - Human translation
            * `ai` - AI translation
          oneOf:
          - $ref: '#/components/schemas/OriginEnum'
          - $ref: '#/components/schemas/NullEnum'
        is_stale:
          type: boolean
          readOnly: true
          nullable: true
          description: 'Whether this translation was made from content the source
            has since changed. THREE states: `true` stale, `false` current, `null`
            unknown. `null` is the common case -- the source variant has nothing to
            be stale against, and no legacy translation recorded which revision it
            was made from. Render `null` as nothing at all: unknown source history
            cannot prove staleness.'
