  /api/openai/image:
    post:
      operationId: openai_image_create
      description: Generate an image, save it to the authenticated user's uploads,
        and return the stored WebP URL. Costs 6 2Zs.
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
        description: Optional UUIDv4 operation key for OpenAI image generation; required
          when hosted fal is selected. It is scoped to the authenticated actor and
          exact image intent (provider, model, prompt, size, and choice disclosure).
          A present non-UUIDv4 value is refused with 400 idempotency_key_required
          before a receipt, charge, or provider call. A different intent under a used
          key is refused with 409 idempotency_mismatch; an unresolved live claim returns
          409 request_in_progress. Reuse the key only for an identical request. An
          OpenAI request is retried only when its durable receipt proves dispatch
          never started. If OpenAI acceptance is uncertain, its authorization hold
          is retained and it is not automatically resubmitted; start a new intent
          only after an explicit user action.
      - in: header
        name: X-Expected-Actor
        schema:
          type: string
        description: Optional authenticated user ID observed when this paid request
          was prepared. If it differs from the current authenticated user, the request
          is refused with 409 account_changed before a receipt claim, provider call,
          or debit. It never chooses the actor or supplies persisted data.
      - in: header
        name: X-Require-Existing-Receipt
        schema:
          type: boolean
        description: For an adopted pre-choice retry key, only replay an existing
          image receipt. If no receipt exists, refuse before provider I/O or debit.
      tags:
      - openai
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageGenerationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ImageGenerationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImageGenerationRequest'
        required: true
      security:
      - cookieAuth: []
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                oneOf:
                - type: string
                - type: object
                  properties:
                    url:
                      type: string
                    provider:
                      type: string
                    model:
                      type: string
                  required:
                  - url
                  - provider
                  - model
          description: Legacy callers receive a URL; choice-aware callers also receive
            model attribution.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageRequestError'
          description: A present non-UUIDv4 Idempotency-Key is refused with idempotency_key_required
            before receipt creation, charge, or provider dispatch. Also includes provider
            safety refusals, malformed JSON, and request field errors.
        '402':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsufficientFundsError'
          description: ''
        '429':
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    enum:
                    - image_daily_budget_exceeded
                  key_resolved:
                    type: boolean
                  detail:
                    type: string
                required:
                - code
                - key_resolved
                - detail
          description: The authenticated account's daily fal allowance is exhausted;
            no hold or provider call was started. Existing receipts can still be replayed.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageRequestPreconditionError'
          description: The authenticated account differs from X-Expected-Actor; no
            receipt, provider call, or debit was started.
