openapi: 3.0.3
info:
  title: f2z
  version: 0.1.0
  description: Free2z is a tool for content and peer-2-peer giving that does not compromise
    on privacy. This is the Django REST Framework API contract and the source of the
    generated clients. It does not cover the non-API surfaces of the same deployment
    (server-rendered pages, RSS feeds, storage auth subrequests, health probes, the
    Stripe webhook), nor a short, enumerated backlog of hand-written JSON endpoints
    not yet ported to DRF.
paths:
  /api/ai/catalog/v1:
    get:
      operationId: ai_catalog_v1
      description: |-
        The signed AI model catalogue the f2z-ai gateway prices from.

        PUBLIC, deliberately. Everything in it is already public -- per-model
        provider prices and limits are on ``GET /api/ai/models/`` and the gateway's
        ``/v1/models``, and the platform margin is a published policy -- and the
        response is authenticated by its Ed25519 signature, not by who fetched it:
        the gateway trusts a key from its own configuration, never from here.
        Gating it behind internal auth would add a credential to the one path
        the gateway cannot price without, and protect nothing.

        Stateless: built from the active rate card and ``AIModel`` rows and
        signed on every request (see ``dj.apps.pricing.catalog``). ``ETag`` is a
        hash of the exact body; ``If-None-Match`` answers 304.

        No refusal is a 5xx: this is a public URL, and a 5xx here would feed the
        site-wide page-tier LB alerts.

        * key not provisioned -> 404 ``catalog_not_provisioned``, logged, NOT
          alerted (the expected state until the owner provisions it);
        * a whole-document refusal -- a malformed or test key, no active rate
          card, a revision stamped in the future -> 409 ``catalog_refused`` with
          the ``reason``, plus the alerted ``ai_catalog_refused`` line;
        * a bad MODEL (no rate row, bad limits, all-zero prices, a duplicate id,
          a per-image price on a provider that bills images as tokens) is left
          OUT of an otherwise published catalogue, with an alerted
          ``ai_catalog_model_excluded`` line -- it never blocks the document.

        A genuinely unexpected error still surfaces as a 500.
      parameters:
      - in: header
        name: If-None-Match
        schema:
          type: string
        description: An ETag from a previous response. When it matches the current
          catalogue the answer is 304 with no body. Selects a representation only;
          this endpoint writes nothing.
      tags:
      - ai
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignedCatalog'
          description: 'The signed catalogue. Verify with f2z-ai-proto verify_catalog(<bytes
            of `catalog`>, signature, trusted keys, now). Headers: ETag, Cache-Control:
            no-cache.'
        '304':
          description: Not modified (If-None-Match matched).
        '404':
          description: 'No signing key is provisioned on this deployment. Body: {code:
            catalog_not_provisioned}.'
        '409':
          description: 'Refused to sign the whole document. Body: {code: catalog_refused,
            reason}; reason is one of signing_key_malformed, test_key_not_allowed,
            no_active_rate_card, future_revision, invalid_catalog. Per-model problems
            never refuse the document: the model is omitted instead.'
  /api/ai/conversations/:
    get:
      operationId: ai_conversations_list
      description: This is to get your own conversations and fork others.
      parameters:
