                - 'true'
              description: 'Always `true` on every response from this operation: this
                server honours `Idempotency-Key` on page creation. A backend that
                predates the key never sends it, and ignores the key -- so a client
                must not retry a timed-out create under its key until it has seen
                this header from the server it is talking to, and should stop trusting
                it the moment a keyed create is answered without it.'
            Idempotent-Replayed:
              schema:
                type: string
                enum:
                - 'true'
              description: Present (`true`) only when this 201 replays the page an
                earlier request under the same Idempotency-Key created; nothing new
