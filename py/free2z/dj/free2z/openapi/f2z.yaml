    MeteredPromptRequest:
      type: object
      description: Send one prompt to a catalogue model and get the reply, metered.
      properties:
        model:
          type: string
          format: uuid
          description: The id of the model to prompt, as listed by GET /api/ai/models/.
        prompt:
          type: string
          description: The prompt to send to the model.
        system_message:
          type: string
          nullable: true
          description: System message for this request. Omit it to use the model's
            default system message; send an empty string for none.
        quote_token:
          type: string
        max_output_tokens:
          type: integer
          maximum: 1000000
          minimum: 1
          nullable: true
          description: How long a reply to ask for, in tokens. Omit it to get the
            longest reply the model can give for this prompt that your 2Z already
            cover. Naming a number larger than the model can produce -- or than the
            context window has left after the prompt -- is clamped down to that, never
            rejected; naming one your 2Z do not cover answers 402 with the number
            of 2Z it would take.
      required:
      - model
      - prompt
    MeteredPromptResponse:
      type: object
      description: The reply and exactly what it cost.
      properties:
        response:
          type: string
          description: The model's reply.
        provider:
          type: string
          description: The provider that received the prompt.
        model:
          type: string
          description: The provider's model identifier.
        display_name:
          type: string
          description: The catalog name shown to the user.
        tuzis_charged:
          type: integer
          description: The 2Z debited for this request.
        input_tokens:
          type: integer
          description: Total prompt tokens reported by the provider, including cached
            and cache-write input; falls back to the model tokenizer when usage is
            unavailable.
        output_tokens:
          type: integer
          description: Output tokens billed for the reply, including any hidden reasoning
            tokens the provider bills as output.
      required:
      - display_name
      - input_tokens
      - model
      - output_tokens
      - provider
      - response
      - tuzis_charged
