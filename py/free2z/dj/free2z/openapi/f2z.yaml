        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmedSubscriptionResult'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditError'
          description: ''
        '402':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsufficientFundsError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditError'
