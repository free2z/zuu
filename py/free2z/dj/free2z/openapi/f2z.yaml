      type: object
      description: |-
        ``PUT /api/oauth/grants/<application_id>/cap/``. Both fields are
        REQUIRED: the cap never fails open, so "no cap" is an explicit null and
        an absent key is a 400, not "keep whatever was there".
      properties:
        spend_cap_2z:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
          description: 'Whole 2Z; null means no cap. Raising the cap (a higher amount,
            a different period, or no cap) needs a sign-in within the last 5 minutes
            (401 insufficient_user_authentication). A period change is a raise whichever
            way the periods rank: it starts a fresh spend window.'
        cap_period:
          $ref: '#/components/schemas/CapPeriodEnum'
      required:
      - cap_period
      - spend_cap_2z
