    IdempotentDonationRequest:
      type: object
      properties:
        intent:
          allOf:
          - $ref: '#/components/schemas/IdempotentDonationRequestIntentEnum'
          default: donation
          description: |-
            The paid intent. `donation` and `ppv` are separate replay identities even when recipient and amount match. `ppv` is retired: it is accepted only so a receipt recorded before the retirement replays; a new `ppv` request is refused with 400 `ppv_unlock_retired` and moves no 2Z.

            * `donation` - donation
            * `ppv` - ppv
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,0})?$
          description: Whole 2Z amount to transfer (maximum 2147483647).
        anon:
          type: boolean
          default: false
      required:
      - amount
    IdempotentDonationRequestIntentEnum:
      enum:
      - donation
      - ppv
      type: string
