  /api/creator/{username__iexact}/block/:
    get:
      operationId: creator_block_retrieve
      description: List Creators on Free2z
      parameters:
      - in: path
        name: username__iexact
        schema:
          type: string
          pattern: ^[^/]+$
        required: true
      tags:
      - creator
      security:
      - cookieAuth: []
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatorRelationshipState'
          description: ''
    put:
      operationId: creator_block_update
      description: Idempotent. Takes no request body. While the block exists the caller
        is no longer served the blocked account's comments (thread, reply and comment
        lists), zPages (every public zPage list, including search and that account's
        profile list), reply/mention/comment-vote/page-vote/page-update notifications,
        or realtime notification pushes, and a new chat request from the blocked account
        to the caller answers 404 `recipient_not_found` and charges nothing (nor is
        a queued one emailed). Money receipts (donations, subscription and pay-per-view
        revenue, chat requests already paid for) stay listed. A zPage or comment opened
        directly by its identifier still resolves. The blocked account is not notified
        and its own reads are unchanged. Blocking yourself is refused with 400.
      summary: Block a creator
      parameters:
      - in: path
        name: username__iexact
        schema:
          type: string
          pattern: ^[^/]+$
        required: true
      tags:
      - creator
      security:
      - cookieAuth: []
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatorRelationshipState'
          description: ''
    delete:
      operationId: creator_block_destroy
      description: 'Idempotent. Removes the block if it exists and reports `active:
        false` either way; everything the block hid is served again.'
      summary: Unblock a creator
      parameters:
      - in: path
        name: username__iexact
        schema:
          type: string
          pattern: ^[^/]+$
        required: true
      tags:
      - creator
      security:
      - cookieAuth: []
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatorRelationshipState'
          description: ''
  /api/creator/{username__iexact}/follow/:
    get:
      operationId: creator_follow_retrieve
      description: 'The authenticated caller''s follow state for one creator, plus
        the creator''s public follow counts. This is the FREE follow graph: it never
        reads or writes 2Z, a Subscription, subscriber entitlement or `member_price`.
        A creator who does not exist and a creator who is deactivated are deliberately
        indistinguishable (both 404).'
      summary: Am I following this creator?
      parameters:
      - in: path
        name: username__iexact
        schema:
          type: string
          pattern: ^[^/]+$
        required: true
      tags:
      - creator
      security:
      - cookieAuth: []
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatorFollowState'
          description: ''
        '401':
          description: Authentication required.
        '404':
          description: No such active creator.
    put:
      operationId: creator_follow_update
      description: Idempotent. The first call creates the relationship; every later
        call is a no-op that reports the same state. Takes no request body -- the
        pair is the entire state, and it is identified by the authenticated caller
        and the path segment. Following yourself is refused with 400 and creates no
        row.
      summary: Follow a creator
      parameters:
      - in: path
        name: username__iexact
        schema:
          type: string
          pattern: ^[^/]+$
        required: true
      tags:
      - creator
      security:
      - cookieAuth: []
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatorFollowState'
          description: ''
        '400':
          description: A creator cannot follow themselves.
        '401':
          description: Authentication required.
        '404':
          description: No such active creator.
    delete:
      operationId: creator_follow_destroy
      description: 'Idempotent. Removes the relationship if it exists and reports
        `following: false` either way. Unlike cancelling a paid Subscription, this
        leaves nothing behind: there is no entitlement to run out and no renewal ceiling
        to zero. Returns 200 with the resulting state rather than 204 so a client
        can render the new counts without a second round trip.'
      summary: Unfollow a creator
      parameters:
      - in: path
        name: username__iexact
        schema:
          type: string
          pattern: ^[^/]+$
        required: true
      tags:
      - creator
      security:
      - cookieAuth: []
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatorFollowState'
          description: ''
        '401':
          description: Authentication required.
        '404':
          description: No such active creator.
