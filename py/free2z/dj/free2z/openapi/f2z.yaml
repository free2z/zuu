  /api/e2ee/chat-requests/{username}/:
    post:
      operationId: e2ee_chat_requests_create
      description: 'Charge the server-set price (GET /api/e2ee/chat-requests/price/)
        from the caller and credit it to the recipient, atomically, and notify the
        recipient with an ENCRYPTED_CHAT_REQUEST event whose content_url opens e2e2z''s
        first-contact screen for the caller''s handle (the caller gets a read ENCRYPTED_CHAT_REQUEST
        row of their own, with no link, as the record of the spend). No message is
        sent. The Idempotency-Key is bound to the recipient; a replay returns the
        original result with `replayed: true` and never charges twice. Completed results
        replay for 365 days. Refusals (402, 404, 409 price_changed, 422, 429, 503)
        charge nothing and release (or never take) the key. Rate limits, per sender:
        10 per hour, 30 per 24 hours, and 3 per 24 hours to the same recipient.'
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
        description: 'UUIDv4 retry key. Reuse it only for the exact same confirmed
          2Z request. The value is parsed as a UUID and stored in its canonical lowercase
          hyphenated form, so the braced, `urn:uuid:` and unhyphenated 32-character
          spellings of one UUID are the SAME key, not three. The key is scoped to
          this operation: a key spent here is spent here, and no other endpoint replays
          it.'
        required: true
      - in: path
        name: username
        schema:
          type: string
        required: true
      tags:
      - e2ee
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequestBody'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChatRequestBody'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChatRequestBody'
      security:
      - cookieAuth: []
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatRequestResult'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditError'
          description: ''
        '402':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsufficientFundsError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditError'
          description: '`self_request`: you cannot send a chat request to yourself.
            `price_changed`: `expected_cost` was sent and differs from the current
            price (in `current_price`); nothing was charged. Also the shared idempotency
            answers `request_in_progress`, `idempotency_mismatch` and `invalid_idempotency_record`.'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditError'
          description: '`sender_handle_unavailable`: your account has no messaging
            handle yet, so there is no one for the recipient to reply to. Nothing
            was charged.'
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatRequestRateLimited'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditError'
          description: '`chat_requests_disabled`: new chat requests are switched off.
            THIS attempt charged nothing and took no key. It is not proof that an
            earlier attempt under the same key did not charge (one may still be committing
            on another server), so keep the key and retry it later. A key whose request
            already COMPLETED replays with 200, and one with a visible unfinished
            request answers 409 `request_in_progress`.'
  /api/e2ee/chat-requests/price/:
    get:
      operationId: e2ee_chat_requests_price_retrieve
      description: 'Whole 2Z charged by POST /api/e2ee/chat-requests/{username}/.
        Set by the server; the client never supplies an amount. `enabled: false` means
        new requests are switched off and the POST will answer 503 `chat_requests_disabled`.'
      tags:
