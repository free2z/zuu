      - expires
      - max_price
      - username
    TagHub:
      type: object
      description: |-
        What `GET /api/tagging/hub/{slug}` answers.

        Declared for the schema and used to build the response, so a client can
        see the contract instead of guessing it. Deliberately carries no zPage
        rows: the hub's list is `GET /api/zpage/?hub_slug=…`, one paginated,
        already-audited surface rather than a second one that drifts. The slug
        filter resolves the complete hub component server-side; the serialized
        names list is only a bounded display sample.
      properties:
        slug:
          type: string
          description: The canonical slug for this hub. When it differs from the slug
            in the request path, the request named an ALIASED spelling — including
            a still-live alias — and the caller should redirect (301) to this one.
            The response's `names` and `count` already cover the union, so the redirect
            does not strand alias pages.
        name:
          type: string
          description: 'The spelling to display, exactly as stored: whichever of `names`
            the most published zPages actually carry.'
        names:
          type: array
          items:
            type: string
          description: Every tag name in this public hub, most-used first. Usually
            one. More than one means distinct tags collided on the slug, or a still-live
            alias belongs to the canonical tag — `t-shirts`, `t shirts` and `T/Shirts`
            all slug to `t-shirts`, while a casefold alias can slug differently. The
            hub browses their union. Use `GET /api/zpage/?hub_slug=` with the response's
            canonical `slug` to get the complete page set this `count` counts; `names`
            is display-only and bounded.
        count:
          type: integer
          description: Published zPages carrying any of `names`, from creators who
            have not been deactivated, counted across the WHOLE result set rather
            than one page of it.
        indexable:
          type: boolean
          description: 'Whether this hub carries enough content to be worth indexing
            (at least 3 pages). A false value is not an error: render the page, but
            declare `noindex, follow` and keep it out of the sitemap.'
      required:
      - count
      - indexable
      - name
      - names
      - slug
    TagSuggestion:
      type: object
      description: |-
        One row of the autocomplete response.

        Declared for the schema only — the view builds plain dicts and returns a
        `JsonResponse`, so this never validates anything. It exists because the
        endpoint is the only enumeration of the tag vocabulary, and a client that
        cannot see its shape ends up hardcoding a vocabulary instead.
      properties:
        name:
          type: string
          description: The tag, exactly as stored.
        count:
          type: integer
          description: How many objects of the requested `type` carry the tag, under
            the caller's own visibility rules. Ordering is by this count descending,
            which is what makes the first page of results the platform's de facto
            popular tags.
        level:
          allOf:
          - $ref: '#/components/schemas/LevelEnum'
          description: |-
            `broad` or `narrow`, derived from how many published zPages carry the tag — NOT a stored attribute. The boundary is a percentile of the corpus, so it means the same thing as the platform grows. Broad tags are browse vocabulary; narrow tags are what makes long-tail discovery and “more like this” work. Treat it as a display hint: two tags either side of the boundary are near-identical in frequency, and the boundary itself moves as the corpus does.

            * `broad` - broad
            * `narrow` - narrow
      required:
      - count
      - level
      - name
    TargetKindEnum:
      enum:
      - comment
      - zpage
      - creator
      type: string
      description: |-
        * `comment` - Comment
        * `zpage` - zPage
        * `creator` - Creator
    TaxFormFile:
