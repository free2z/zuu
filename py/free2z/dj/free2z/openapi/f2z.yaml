        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationError'
          description: ''
    post:
      operationId: zpage_translation_batch_purchase
      description: |-
        Buy AI translations of this zPage into several languages at once. **All or nothing**: either every item is bought and enqueued (202, one job per language) or nothing is charged.

        Each item is checked exactly as `POST .../variants/{language}/translate/` checks one: `expected_price` must equal the server's price, nothing published is overwritten, no job for that exact language may already be running, and the result must fit the published- and draft-translation ceilings -- counting the drafts that already-running jobs will create -- and the translation must be able to finish inside the time limit (`translation_too_long`). Any failure answers 409 `items_refused` listing EVERY failing language with its own `code`. A changed article answers 409 `source_changed`.

        Then the batch as a whole: the account's concurrent-translation cap (409 `translation_in_progress`, with `in_flight` and `max_in_flight`), the platform queue (503 `translation_backlog`) and the balance -- 402 if the TOTAL is unaffordable, naming the total. Recent-failure cooldowns answer 429 as on the single-language purchase.

        Every job settles independently afterwards, exactly as a single-language purchase does: each lands as a DRAFT, and each failure is refunded (or, under the accepted refund terms, settled) on its own. One edit of the article that aborts several running jobs counts as ONE change toward the accepted edit allowance, not one per job.

        Owner only; a non-owner gets 404.
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
        description: '**Required** UUIDv4 naming the WHOLE batch. Reuse the same key
          for every retry of one bulk purchase and a new key for a new one. A retry
          of a completed batch replays it -- every job with its CURRENT status --
          and charges nothing, for 365 days. A retry while the original is still deciding
          answers 409 `request_in_progress`. The key is bound to the article, the
          source digest and the exact set of (language, price) pairs, in any order;
          reusing it for a different set answers 409 `idempotency_mismatch`. A refused
          batch (409, 402, 429, 503) moved no 2Z and does NOT burn the key. Each job
          the batch creates carries this key as its `batch_id`. Not generated by orval:
          the call site must send the header itself.'
        required: true
      - in: path
        name: free2zaddr
        schema:
          type: string
        description: The zPage's `free2zaddr` or its `vanity`.
        required: true
      tags:
      - zpage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TranslationBatchPurchase'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TranslationBatchPurchase'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TranslationBatchPurchase'
        required: true
      security:
      - cookieAuth: []
      - knoxApiToken: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationBatchJobs'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationBatchError'
          description: ''
        '402':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsufficientFundsError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationBatchError'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationBatchError'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationBatchError'
          description: ''
