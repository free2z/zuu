  /api/languages/:
    get:
      operationId: languages_catalog
      description: |-
        The languages we sell a translation into, named for the viewer.

        Public and unauthenticated on purpose: the picker is on screen before a
        visitor signs in, and the answer is the same for everyone.
      parameters:
      - in: header
        name: Accept-Language
        schema:
          type: string
        description: Fallback naming locale when `locale` is absent, parsed with `q`
          weights. Same degrade-never-refuse contract. Note that orval emits no code
          for header parameters, so a generated TypeScript client will not send this
          unless the call site passes it through the request options.
      - in: header
        name: If-None-Match
        schema:
          type: string
        description: Conditional GET. Send back the `ETag` from a previous response
          to get `304 Not Modified` with no body.
      - in: query
        name: locale
        schema:
          type: string
        description: 'BCP-47 locale to name the languages in. A pure representation
          selector: it changes nothing stored and **never fails the request**. A locale
          we have no name table for degrades to the closest one we do (`es-MX` ->
          `es`), and an unknown or malformed value degrades to `en` — never a 4xx.
          The locale actually used is returned as `locale`. Omit it to negotiate from
          `Accept-Language`.'
      tags:
      - languages
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LanguageCatalog'
          description: ''
        '304':
          description: The caller's `If-None-Match` matches the current catalog. No
            body.
