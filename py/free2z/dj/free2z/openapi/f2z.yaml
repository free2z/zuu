  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    knoxApiToken:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
    oauth2Jwt:
      type: oauth2
      description: Free2Z OAuth 2.0 / OpenID Connect (authorization code + PKCE S256).
        The access token is an ES256 JWT (RFC 9068) valid for five minutes; see zuu
        docs/free2z/sdk/spec/oidc.md.
      flows:
        authorizationCode:
          authorizationUrl: https://free2z.cash/oauth/authorize
          tokenUrl: https://free2z.cash/api/oauth/token
          refreshUrl: https://free2z.cash/api/oauth/token
          scopes:
            openid: Sign you in and identify your account
            profile: Your username, display name and avatar
            email: Your email address
            offline_access: Stay signed in (a refresh token)
            balance:read: Read your 2Z balance
            purchase:create: Start 2Z purchases on your behalf
            ai:invoke: Call AI through the gateway, paid from your 2Z
