  /api/zpage/:
    get:
      operationId: zpage_list
      description: |-
        API endpoint that allows zpages to be viewed or edited.
        This is the workhorse.
      parameters:
      - in: header
        name: Accept-Language
        schema:
          type: string
        description: 'Standard weighted preference list, used when `lang` is absent.
          The full list is honoured in `q` order; an exact tag match beats a primary-subtag
          match (`en-GB` finds the `en` variant), `q=0` refuses a language, and a
          preference for a language this page does not have falls through to the source
          variant rather than failing. Responses carry `Vary: Accept-Language, Cookie`.'
      - in: query
        name: any_tags
        schema:
          type: array
          items:
            type: string
        description: 'Tag names, **repeated** (`?any_tags=a&any_tags=b`) rather than
          comma-joined. A zPage matches if it carries **any** of them (OR). Matching
          is case-insensitive and alias-resolved, exactly like `tags`. Combining the
          two ANDs the groups: `?tags=zcash&any_tags=t-shirts&any_tags=t shirts` means
          *zcash* AND (*t-shirts* OR *t shirts*). Repeated rather than comma-separated
          because a tag name may itself contain a comma, and this parameter''s reason
          to exist — the `/tag/<slug>` hub — is precisely the set of spellings that
          collide on one slug. At most 50 names are read; the rest are ignored rather
          than rejected.'
        explode: true
        style: form
      - in: query
        name: cursor
        schema:
          type: string
        description: Opaque continuation token returned in `next`; use only with `pagination=cursor`.
      - in: query
        name: hub_slug
        schema:
          type: string
        description: A public tag-hub slug. The server resolves the complete canonical
          component and filters by it, so the bounded `names` display list cannot
          strand pages from a hub with more than 50 spellings. This is the list counterpart
          to `GET /api/tagging/hub/{slug}`.
      - in: query
        name: lang
        schema:
          type: string
        description: 'Which language variant to render. Any real BCP-47 language tag
          (`en`, `de`, `ja`, `pt-PT`); bare `pt` is accepted as `pt-BR`. A tag that
          is not a language at all is a 400. Omit to negotiate: the `Accept-Language`
          header is consulted next, and the article''s source variant last.'
      - in: query
        name: mine
        schema:
          type: boolean
        description: Owner-only draft access. Set this explicitly from the dashboard
          or editor; ordinary public profile and article reads are published-only
          and use the public paywall representation even for the owner. An anonymous
          request with `mine=true` is rejected with 403.
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: pagination
        schema:
          type: string
          enum:
          - cursor
        description: Opt into stable keyset pagination for infinite feeds. Omit this
          parameter to retain the default page-number contract.
      - in: query
        name: tags
        schema:
          type: string
        description: Comma-separated tag names. A zPage matches only if it carries
          **all** of them (AND, not OR). Matching is case-insensitive, so `zcash`
          and `ZCASh` select the same pages. Tags are a free-form vocabulary (`django-taggit`)
          — there is no fixed list to choose from; `GET /api/tagging/autocomplete`
          enumerates the ones in use.
      tags:
      - zpage
      security:
      - cookieAuth: []
      - knoxApiToken: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedzPageListList'
          description: ''
    post:
      operationId: zpage_create
      description: Create a zPage. Send an `Idempotency-Key` to make a retry of this
        create safe; the header documents the exact replay and refusal semantics.
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
          format: uuid
        description: |-
          Optional UUIDv4 retry key for ONE page creation. Scoped to the authenticated user and to this operation: another account's identical key is a different key, and no other endpoint replays it. Parsed as a UUID and stored canonically, so spellings of one UUID are the same key. Semantics:

          * First use: the page is created and the key is bound to a fingerprint of the request body, atomically with the page.
          * Same key, same body: **no new page**. The response is `201` with the ORIGINAL page (same `free2zaddr`) as it is now and the response header `Idempotent-Replayed: true`. Its `ETag` is the validator the page had when this key CREATED it, so an `If-Match` update sent from the replaying client returns **412** if the page was changed since (the client only knows the body it created). A retry sent while the original is still running waits for it and then replays it.
          * Same key, different body: **409** `idempotency_mismatch`; nothing is created.
          * Same key, original page since deleted: **409** `idempotency_page_gone`; nothing is created.
          * A header that is present but not a UUIDv4: **400** `idempotency_key_required`; nothing is created.
          * A create that fails (400, 5xx) does not spend the key.

          Receipts expire 365 days after the create, after which the key is unknown again and would create a new page. Without the header every POST creates a new page, so a client that abandons a create at a timeout cannot safely retry it.
      - in: query
        name: lang
        schema:
          type: string
        description: 'Which language variant to render in the response body. Affects
          the representation only: it never sets or changes what is persisted. The
          source language comes from the `source_language` body field, on create and
          on update alike — it is mutable, and changing it to a language that already
          has a translation is a 409. An unsupported `lang` value here is ignored
          rather than failing the write. `Accept-Language` is NOT negotiated on a
          write: the response describes the variant that was written.'
      tags:
      - zpage
      requestBody:
        content:
          application/json:
