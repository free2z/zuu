        * `refresh_token` - refresh_token
    HandleAssertionRequest:
      type: object
      description: What a device asks for when it enrolls.
      properties:
        identity_key:
          type: string
          description: 'The Ed25519 identity signing key (ISK.public) to vouch for:
            32 bytes, base64url (RFC 4648 section 5), padding optional.'
          maxLength: 64
        intent:
          allOf:
          - $ref: '#/components/schemas/HandleAssertionRequestIntentEnum'
          description: |-
            'bind' for a handle's first directory entry, 'reset' for the ADR 0014 platform-reset path on an established one. The log ties each to a position in the handle's entry sequence, so the wrong one is refused rather than reinterpreted.

            * `bind` - bind
            * `reset` - reset
      required:
      - identity_key
      - intent
    HandleAssertionRequestIntentEnum:
      enum:
      - bind
      - reset
      type: string
      description: |-
        * `bind` - bind
        * `reset` - reset
    HandleAssertionResponse:
      type: object
      description: The signed assertion, and when it stops being usable.
      properties:
        assertion:
          type: string
          description: tls_codec(HandleAssertion) -- the signed body followed by its
            64-byte Ed25519 signature -- as unpadded base64url. Present it to the
            log with a submission signed by the identity key it names; on its own
            it authorizes nothing.
        handle:
          type: string
          description: The handle vouched for, derived from the authenticated account.
            Echoed so a client need not parse the assertion to see it.
        issued_ms:
          type: integer
          description: 'issued_ms as signed: milliseconds since the Unix epoch.'
        expires_ms:
          type: integer
          description: expires_ms as signed. The log applies its own cap on expires_ms
            - issued_ms independently of this value.
      required:
      - assertion
      - expires_ms
      - handle
      - issued_ms
    HandleClaimError:
      type: object
      properties:
