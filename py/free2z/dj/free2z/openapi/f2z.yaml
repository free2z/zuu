  /api/emails/opt-out/{link}:
    get:
      operationId: emails_opt_out_retrieve
      description: Renders the page the emailed unsubscribe link points at. This operation
        performs no write, so a prefetching mail client or security scanner cannot
        unsubscribe an address. The page contains a form that POSTs to this same URL;
        that POST is the unsubscribe.
      summary: Unsubscribe landing page. Changes nothing.
      parameters:
      - in: path
        name: link
        schema:
          type: string
        description: |-
          The opaque unsubscribe link token from the message we sent: the per-address token, and the only credential this operation needs. It is unguessable and carries no information about the address, so the address never appears in the URL.

          DEPRECATED SHAPE, still accepted: legacy messages put the URL-encoded **email address** in this position and the token in the `token` query parameter. Those links keep working — they are sitting in inboxes — and are read as the address whenever the value is not a valid signed token. Do not build new links in that shape: an address whose local part contains `/` cannot be routed at all.
        required: true
      - in: query
        name: token
        schema:
          type: string
        description: 'Legacy links only: the per-address token, which the deprecated
          URL shape carries here instead of in the path. Ignored when the path segment
          is a link token.'
      tags:
      - emails
      security:
      - cookieAuth: []
      - knoxApiToken: []
      - {}
      responses:
        '200':
          description: 'HTML: either the unsubscribe button, or confirmation that
            this address is already on the do-not-email list.'
        '404':
          description: 'HTML page: no address matches this token.'
    post:
      operationId: emails_opt_out_create
      description: |-
        The write half of the unsubscribe link, and the RFC 8058 one-click target advertised in the outgoing `List-Unsubscribe` / `List-Unsubscribe-Post` headers. Adds the address to the do-not-email list and DELETES the account's `Email` row, which is also its password-recovery address.

        The link token in the path is the credential and nothing else is needed. On a legacy link — the address in the path, no token there — the token travels in the body when the landing page's button is used, with the query string accepted as a fallback because an RFC 8058 client POSTs a fixed `List-Unsubscribe=One-Click` body to the published URL and can put nothing of its own in it.
      summary: Unsubscribe this address and delete it from the account.
      parameters:
      - in: path
        name: link
        schema:
          type: string
        description: |-
          The opaque unsubscribe link token from the message we sent: the per-address token, and the only credential this operation needs. It is unguessable and carries no information about the address, so the address never appears in the URL.

          DEPRECATED SHAPE, still accepted: legacy messages put the URL-encoded **email address** in this position and the token in the `token` query parameter. Those links keep working — they are sitting in inboxes — and are read as the address whenever the value is not a valid signed token. Do not build new links in that shape: an address whose local part contains `/` cannot be routed at all.
        required: true
      - in: query
        name: token
        schema:
          type: string
        description: 'Legacy links only: fallback for the body field of the same name.
          Ignored when the path carries a link token.'
      tags:
      - emails
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailOptOutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailOptOutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailOptOutRequest'
      security:
      - cookieAuth: []
      - knoxApiToken: []
      - {}
      responses:
        '200':
          description: RFC 8058 one-click unsubscribe accepted (text/plain), or the
            address was already on the do-not-email list.
        '303':
          description: 'Browser flow: unsubscribed, redirect back to the landing page
            so a reload does not re-submit.'
        '404':
          description: 'HTML page: no address matches this token.'
