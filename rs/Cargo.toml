# The `rs/` workspace — one [workspace], one Cargo.lock.
#
# See rs/README.md for why this tree exists, why it is named `rs/`, and why a
# fourth package root here sits inside the workspace boundary decided for #341
# in docs/architecture/CARGO-WORKSPACE.md rather than cutting across it.

[workspace]
resolver = "3"
members = ["crates/*"]

# Deliberately minimal. `rust-version` and `license` are NOT inherited from
# here: `scripts/check-rust-toolchain.sh --manifest` reads the literal
# `rust-version` line out of each crate's own manifest, and the licence boundary
# of rs/README.md is worth stating in the file a reader of that crate opens. Both
# are restated per crate and both are machine-checked there.
[workspace.package]
edition = "2024"
repository = "https://github.com/free2z/zuu"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
# The relay's parser is the unauthenticated attack surface. A panic there is a
# remote denial of service, so the arithmetic and unwrap families are denied in
# the workspace rather than remembered per crate.
arithmetic_side_effects = "deny"
indexing_slicing = "deny"
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"

[workspace.dependencies]
blake2 = { version = "0.10", default-features = false }
tls_codec = { version = "0.4", default-features = false, features = ["derive"] }
# Ed25519, `WIRE.md` §5. `default-features = false` drops `std` and `fast`:
# `fast` is curve25519-dalek's precomputed-tables, which trades roughly 30 KiB
# of table for signing speed, and this graph reaches wasm32 for the browser
# client (ADR 0001) where the bundle is the scarce resource and the workload is
# a handful of signatures per connection, not a batch verifier. `zeroize` is
# kept: it is the only feature that touches what happens to a secret key's
# bytes when it is dropped.
ed25519-dalek = { version = "3", default-features = false, features = [
  "zeroize",
] }
# `WIRE.md` §10: the existence-oracle rule requires key comparisons to be
# constant time. Already in the graph beneath ed25519-dalek; named here so the
# dependency is a decision rather than an accident of resolution.
subtle = { version = "2", default-features = false }
# Dev-dependency only. It builds for the host test runner, never for
# wasm32-unknown-unknown, so its `std` default costs this crate nothing: the
# library itself is `no_std` and the wasm job builds `--lib`.
proptest = "1"
# **0.37 is a repository-wide singleton and this line is not free to move.**
# `libsqlite3-sys` declares `links = "sqlite3"`, and Cargo refuses outright to
# build a graph containing two versions of a `links` package — a hard error, not
# a warning. Everything under `wallet/` reaches SQLite through
# `wallet/plugins/tauri-plugin-zcash`'s `rusqlite = "0.37"`, so any crate
# anywhere in this repository that wants SQLite must resolve to the same
# version (`AGENTS.md`, "What NOT to do"). `bundled` compiles SQLite from the
# vendored amalgamation rather than linking whatever the host happens to ship:
# a relay's durability depends on `PRAGMA journal_mode`, `synchronous` and
# `secure_delete` behaving exactly as `f2z-relay-store` verifies at open, and a
# distro's build flags are not ours to assume. Native only — `rs_wasm` in
# `.github/workflows/rs.yml` deliberately does not name the crate that uses it.
rusqlite = { version = "0.37", features = ["bundled"] }
