# The `rs/` workspace — one [workspace], one Cargo.lock.
#
# See rs/README.md for why this tree exists, why it is named `rs/`, and why a
# fourth package root here sits inside the workspace boundary decided for #341
# in docs/architecture/CARGO-WORKSPACE.md rather than cutting across it.

[workspace]
resolver = "3"
members = ["crates/*"]

# Deliberately minimal. `rust-version` and `license` are NOT inherited from
# here: `scripts/check-rust-toolchain.sh --manifest` reads the literal
# `rust-version` line out of each crate's own manifest, and the licence boundary
# of rs/README.md is worth stating in the file a reader of that crate opens. Both
# are restated per crate and both are machine-checked there.
[workspace.package]
edition = "2024"
repository = "https://github.com/free2z/zuu"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
# The relay's parser is the unauthenticated attack surface. A panic there is a
# remote denial of service, so the arithmetic and unwrap families are denied in
# the workspace rather than remembered per crate.
arithmetic_side_effects = "deny"
indexing_slicing = "deny"
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"

[workspace.dependencies]
blake2 = { version = "0.10", default-features = false }
# The canonical wire encoding itself — `WIRE.md` §3, and therefore the most
# consequential line in this file. `f2z-codec` implements §3.3's
# re-encode-equality rule on top of it, so a change here is a change to what
# every deployed client considers a well-formed frame.
#
# **0.5, and the version is the point.** `openmls 0.9` moved to `tls_codec 0.5`
# while this workspace was on `0.4`, so the lock carried both majors at once:
# our own wire types spoke one and the MLS engine the other. Nothing crossed
# that seam — `f2z-msg-mls` reaches the traits through `openmls::prelude` and
# hands MLS a credential as opaque bytes — so it was survivable, but it was
# survivable by accident, and the accident was one `use tls_codec::…` away from
# a trait-not-implemented error whose cause is invisible. It also quietly
# falsified the second of `WIRE.md` §3.1's three reasons for choosing this codec
# at all: "it is already in the client's dependency graph… the crypto core
# already contains this decoder, already ships it to WASM". Two majors mean two
# decoders in the bundle and two in the audit scope, which is the cost §3.2
# refused to pay for CBOR.
#
# **The bump is byte-compatible with 0.4.2, and that was measured rather than
# assumed** (#854). 0.5.0's only breaking change on the surface this tree uses
# is the *method* rename `SerializeBytes::tls_serialize` →
# `tls_serialize_bytes`; every encode path we reach — the derived
# `SerializeBytes`, the integer `to_be_bytes`, `[u8; N]`, `TlsByteVecU8/16/24`,
# `Option<T>` — emits the same bytes it did before. Its other changes are on the
# **decode** side and are strictly narrowing (element vectors must now consume
# their declared length exactly, and a zero-length element is refused), plus
# overflow guards that are compiled out entirely on 64-bit and can only turn a
# wrapped length into an error on 32-bit and wasm32.
#
# How that was proved, and **the order is the whole point**: every value the
# workspace's test suite encodes was dumped through
# `f2z_codec::canonical::encode` while the tree was still on **0.4.2** — 30,315
# distinct (type, bytes) vectors over 81 types in seven crates — and then, after
# the bump, replayed through `decode_canonical` under **0.5.0**, which decodes,
# re-encodes and byte-compares. 30,314 of them round-tripped identically; the
# one vector not replayed is `f2z-relay-proto`'s private `Empty`, whose encoding
# is zero bytes and cannot differ. Generating the
# vectors after the bump would have proved nothing except that 0.5 agrees with
# itself. `f2z-codec/tests/wire_vectors.rs` — whose expectations are derived by
# hand from the spec text rather than from this codec — is the independent half,
# and it passes unchanged.
#
# Anyone bumping this again owes the same measurement. A `tls_codec` release
# that changes one byte of one encoding is a wire-format break for deployed
# clients, and neither the type checker nor the round-trip tests would say so:
# `TlsSerializeBytes` and `TlsDeserializeBytes` move together, so a re-encode of
# a re-decode stays green through a format change (#564).
tls_codec = { version = "0.5", default-features = false, features = ["derive"] }
# Ed25519, `WIRE.md` §5. `default-features = false` drops `std` and `fast`:
# `fast` is curve25519-dalek's precomputed-tables, which trades roughly 30 KiB
# of table for signing speed, and this graph reaches wasm32 for the browser
# client (ADR 0001) where the bundle is the scarce resource and the workload is
# a handful of signatures per connection, not a batch verifier. `zeroize` is
# kept: it is the only feature that touches what happens to a secret key's
# bytes when it is dropped.
ed25519-dalek = { version = "3", default-features = false, features = [
  "zeroize",
] }
# `WIRE.md` §10: the existence-oracle rule requires key comparisons to be
# constant time. Already in the graph beneath ed25519-dalek; named here so the
# dependency is a decision rather than an accident of resolution.
subtle = { version = "2", default-features = false }
# HKDF-SHA256, and the SHA-256 beneath it. `ARCHITECTURE.md` §4.2 expands the
# four account leaves out of one account key with
# `HKDF-Expand(PRK = ik_account, info = label, L)`; only the Expand half is
# used, because the PRK is already a uniformly random BLAKE2b output and an
# Extract over it would buy nothing.
#
# `sha2` is pinned to the 0.10 line, and the reason is the SHIPPING WALLET, not
# this workspace. An earlier version of this comment said 0.10 "resolves to the
# copy `akd_core`'s graph already carries"; that was wrong. `akd_core` 0.13.0
# does not depend on `sha2` at all — its digest is `blake3` — and reaches
# `sha2 0.10.9` only transitively through `ed25519-dalek` 2. The real
# constraint: `f2z-msg-identity` is linked into `wallet/zuuli/src-tauri`, and in
# that binary `sha2 0.10.9` is what `zcash_primitives`, `zcash_transparent`,
# `zcash_script`, `tauri-plugin-zcash`, `bip0039`, `bs58`, `tauri-codegen` and
# `wry` all resolve to, because librustzcash's workspace declares
# `sha2 = "0.10"`. Moving to 0.11 would put a second SHA-256 in the shipped
# wallet. `hkdf` 0.12 is the line that pairs with it (both on `digest` 0.10), so
# the two move together and only when upstream librustzcash moves.
# `docs/DEPENDENCIES.md` section 3 tracks that, and
# `scripts/check-dependency-register.mjs` re-reads upstream's manifest so this
# paragraph cannot go stale unnoticed a second time.
hkdf = { version = "0.12", default-features = false }
sha2 = { version = "0.10", default-features = false }
# The CSPRNG **boundary** for `ARCHITECTURE.md` §4.1's device keys, and not a
# CSPRNG: this graph reaches wasm32 and is `no_std` with no I/O, so the crate
# that derives keys cannot read an OS generator itself. `rand_core` supplies the
# `CryptoRng` marker a caller has to satisfy, and nothing else — it has no
# features, pulls nothing, and cannot itself produce a byte.
#
# It is already in this lock as `ed25519-dalek` 3's optional `rand_core`
# dependency, which stays **off**: dalek's `SigningKey::generate` is behind that
# feature and enabling it would also switch on `curve25519-dalek/rand_core` for
# every crate here. Filling a `Zeroizing<[u8; 32]>` and calling
# `SigningKey::from_bytes` is the same operation with none of that reach.
rand_core = { version = "0.10", default-features = false }
# Zeroization on drop for the secrets `f2z-msg-identity` holds that are not
# already a dalek `SigningKey`. Already in the graph beneath ed25519-dalek's
# `zeroize` feature; named here for the same reason `subtle` is.
zeroize = { version = "1", default-features = false, features = ["derive"] }

# First-party. `f2z-kt-core` builds the transparency envelope on top of
# `f2z-codec`'s canonical encoding, so the re-encode-equality rule of WIRE.md
# §3.3 has exactly one implementation in this tree.
#
# `version` is carried alongside `path` even though nothing here is published:
# a bare path dependency has no version requirement, and `rs/deny.toml` sets
# `wildcards = "deny"` for every dependency including ours.
f2z-codec = { path = "crates/f2z-codec", version = "0.1.0" }

# ---------------------------------------------------------------------------
# MLS (RFC 9420), ARCHITECTURE.md §5.
#
# The 0.9 train (`openmls 0.9.0`, `openmls_traits 0.6.0`,
# `openmls_libcrux_crypto 0.4.0`), taken for a **security** reason and not for
# freshness: 0.4.0 of the provider moves to `libcrux-aead 0.0.9` /
# `libcrux-ed25519 0.0.9`, which is the first libcrux release train whose
# `libcrux-secrets` requirement admits `0.0.6` — the fix for RUSTSEC-2026-0212,
# the aarch64 constant-time swap/select defect that #701 could not patch around
# without forking libcrux. Ten `ignore` entries came out of `rs/deny.toml` with
# this bump; see #723.
#
# None of these is free to move on a whim, and the floor beneath `openmls` and
# `openmls_traits` is enforced by `[[bans.deny]]` in rs/deny.toml rather than by
# these lines.
# ---------------------------------------------------------------------------

# The storage trait, and nothing else. `f2z-msg-store` implements
# `openmls_traits::storage::StorageProvider` and deliberately does **not**
# depend on `openmls`: the storage layer is defined entirely by the trait, and
# keeping the engine out of that crate's graph is what lets a browser build the
# store without the crypto core.
#
# 0.6.0's `StorageProvider` is byte-for-byte the same trait as 0.5.0's on the
# surface this tree implements: every method 0.6.0 adds is behind
# `virtual-clients-draft`, which nothing here enables. The one break that
# reached us is a **feature rename** — `extensions-draft-08` became
# `extensions-draft` — and `f2z-msg-store`'s forwarding feature is renamed with
# it.
openmls_traits = { version = "0.6", default-features = false }
# 0.9.0 is a HARD FLOOR, and it subsumes the 0.8.1 one. Every release before
# 0.8.1 carries the High-severity MAC authentication defect
# (GHSA-3wpg-h9qc-hjwj / RUSTSEC-2025-0069); every release before 0.9.0 resolves
# to a `libcrux-secrets 0.0.5` carrying RUSTSEC-2026-0212. A floor nobody
# enforces is a comment, so rs/deny.toml holds this one with `[[bans.deny]]`:
# a `[patch.crates-io]`, a path dependency or a vendored copy all walk under a
# manifest requirement without a word.
#
# `default-features = false` and then features by name:
#
#   * `libcrux-provider` — the default provider is `openmls_rust_crypto`, which
#     is a *second* crypto core, and ADR 0001 has exactly one.
#   * `draft-ietf-mls-pq-ciphersuites` — **newly required in 0.9.0, and it is
#     not optional for us.** 0.9.0 moved every post-quantum codepoint, X-Wing
#     included, behind this feature; without it
#     `Ciphersuite::MLS_256_XWING_CHACHA20POLY1305_SHA256_Ed25519` and
#     `HpkeKemType::XWingKemDraft6` do not exist and §5.2's hybrid ciphersuite
#     cannot be named. It gates a set of codepoints, not an alternative
#     implementation: `engine::CIPHERSUITE` is unchanged and
#     `the_ciphersuite_uses_chacha20poly1305_and_not_aes_gcm` still checks it.
#
# `test-utils` is deliberately absent — it pulls `openmls_memory_storage` and
# `openmls_basic_credential` back in, which are the two crates this tree
# replaces.
openmls = { version = "0.9.0", default-features = false, features = [
  "libcrux-provider",
  "draft-ietf-mls-pq-ciphersuites",
] }
# Cryspen's formally verified core, and the only one this tree links.
# #385 proved `MLS_256_XWING_CHACHA20POLY1305_SHA256_Ed25519` on it against the
# NIST ACVP ML-KEM vectors, RFC 7748, RFC 8032 and draft-connolly-cfrg-xwing-06
# Appendix C, on nine targets — against 0.3.1. #723 re-ran the two-instance
# exchange, the crash suite and the cross-compilation matrix against 0.4.0;
# what it could not re-run is recorded on that issue.
openmls_libcrux_crypto = { version = "0.4.0", default-features = false }
# Ed25519, straight from the libcrux core. This is the *same* crate and the same
# functions `openmls_libcrux_crypto`'s `CryptoProvider::sign` /
# `verify_signature` call, so naming it here adds nothing to the graph — it lets
# `f2z-msg-mls` implement `openmls_traits::signatures::Signer` itself instead of
# taking `openmls_basic_credential`, which is #693.
#
# 0.0.9 rather than 0.0.6 because `openmls_libcrux_crypto 0.4.0` requires it,
# and unifying is the point — a second copy would mean MLS framing signed by one
# build of the primitive and verified by another. It is also the release that
# fixes RUSTSEC-2026-0075: `generate_key_pair` now returns `Error::KeyGen`
# instead of an all-zero secret key when the CSPRNG fails 100 times running.
# `sign` is unchanged, which is the only function this tree calls.
libcrux-ed25519 = { version = "0.0.9", default-features = false }
# Direct dependencies of the permanent known-answer harness. These versions
# are the same packages already selected beneath openmls_libcrux_crypto; naming
# them lets the harness exercise the primitives themselves without introducing
# an implementation outside ADR 0001's single crypto core.
libcrux-ecdh = { version = "0.0.8", default-features = false }
libcrux-kem = { version = "0.0.9", default-features = false }
# `openmls_basic_credential` is NOT here and must not be added. It signs with
# `ed25519-dalek` and `p256` outside the libcrux provider (#693), which
# contradicts ADR 0001's single crypto core; `f2z-msg-mls` implements
# `openmls_traits::signatures::Signer` over the libcrux provider instead.

# The `Entity`/`Key` bounds of `openmls_traits::storage` are serde bounds, so
# a storage provider cannot avoid serde. `serde_json` is the encoding
# `openmls_memory_storage` uses, kept identical so that a store written by
# either implementation is readable by the other.
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }

# The append-only zero-knowledge set, ADR 0013.
#
# `>= 0.13.0` is a HARD FLOOR and it is NOT held by these lines. A
# `[patch.crates-io]`, a path dependency or a vendored copy all walk under a
# manifest requirement without comment, and facebook/akd#495 — the auditor
# append-only bypass this floor exists for — has no RustSec/OSV advisory, so
# `cargo audit` passes on a vulnerable pin forever. The floor is the
# `[[bans.deny]]` entries in rs/deny.toml. Do not remove them.
#
# `akd_core` is the client verifier and reaches wasm32-unknown-unknown; `akd`
# is the server/witness crate and does not (KT.md §11.3).
#
# NOTE, and it is worth a reviewer's attention: `akd_core` 0.13 requires
# `ed25519-dalek ^2`, so this graph carries **two** major versions of that crate
# — 3 for our own signing and verification, 2 inside `akd_core`'s ECVRF. That is
# a `multiple-versions` warning we cannot resolve from here; it goes away when
# upstream moves. Nothing crosses the boundary: no `ed25519-dalek` type from
# either version appears in an interface between `akd_core` and our code.
akd_core = { version = "0.13", default-features = false, features = [
  "vrf",
  "whatsapp_v1",
  "protobuf",
] }
akd = { version = "0.13", default-features = false, features = [
  "whatsapp_v1",
  "public_auditing",
] }
# Only to reach `protobuf::Message::parse_from_bytes` for `akd_core`'s own proof
# types (KT.md §9.4). Declared rather than inherited through `akd_core`, per
# AGENTS.md: a feature enabled only by another crate's unification is a feature
# we do not actually have.
protobuf = { version = "3", default-features = false }
# Dev-dependency only. It builds for the host test runner, never for
# wasm32-unknown-unknown, so its `std` default costs this crate nothing: the
# library itself is `no_std` and the wasm job builds `--lib`.
proptest = "1"

# ---------------------------------------------------------------------------
# Server-side only. Nothing below is reachable from a crate that builds for
# wasm32-unknown-unknown, and the wasm CI job builds `--lib` for the three
# portable crates by name, so a mistake here cannot silently reach the browser.
# ---------------------------------------------------------------------------

# The log server's runtime. The witness takes only `rt-multi-thread`, because
# `akd::auditor::audit_verify` reaches `tokio::task::spawn` (`KT.md` §11.3) and
# a witness needs a runtime for that one call and for nothing else.
tokio = { version = "1", default-features = false }
# The proof-serving API (`KT.md` §9.2). Plain HTTPS, not the relay's WebSocket
# protocol, so a witness needs no protocol library and a researcher can fetch a
# tree head with `curl`. TLS is terminated ahead of this process; see
# `f2z-kt/src/api.rs`.
# `default-features = false` is load-bearing: it drops `json`, `form` and
# `query`, which is what keeps `serde` out of the log's graph. The two path and
# query parameters this API takes are parsed by hand in `f2z-kt/src/api.rs`.
axum = { version = "0.8", default-features = false, features = [
  "http1",
  "tokio",
] }
# The witness's outbound HTTPS client. Blocking, because a poll loop is
# blocking-shaped, and `rustls` rather than a system TLS library so that the
# distroless image carries no shared object the binary needs.
ureq = { version = "3", default-features = false, features = [
  "rustls",
  "platform-verifier",
] }
# `akd` already logs through this facade. Declaring it means our own binaries
# can emit on the same one, and that the log's operational output goes through
# a single sink an operator configures once — see `f2z-kt/src/logging.rs` for
# what is never written to it.
log = { version = "0.4", default-features = false }
# Required to *implement* `akd_core::ecvrf::VRFKeyStorage`, which is declared
# `#[async_trait]`. Already in the graph beneath `akd`; named here so that
# depending on it is a decision rather than an accident of resolution, exactly
# as `subtle` is above.
async-trait = { version = "0.1", default-features = false }
# **0.37 is a repository-wide singleton and this line is not free to move.**
# `libsqlite3-sys` declares `links = "sqlite3"`, and Cargo refuses outright to
# build a graph containing two versions of a `links` package — a hard error, not
# a warning. Everything under `wallet/` reaches SQLite through
# `wallet/plugins/tauri-plugin-zcash`'s `rusqlite = "0.37"`, so any crate
# anywhere in this repository that wants SQLite must resolve to the same
# version (`AGENTS.md`, "What NOT to do"). `bundled` compiles SQLite from the
# vendored amalgamation rather than linking whatever the host happens to ship:
# a relay's durability depends on `PRAGMA journal_mode`, `synchronous` and
# `secure_delete` behaving exactly as `f2z-relay-store` verifies at open, and a
# distro's build flags are not ours to assume. Native only — `rs_wasm` in
# `.github/workflows/rs.yml` deliberately does not name the crate that uses it.
rusqlite = { version = "0.37", features = ["bundled"] }
