# Supply-chain policy for every Rust crate under rs/.
#
# Separate from wallet/deny.toml on purpose. "Which advisories we accept" is a
# judgement about a *particular dependency graph*, and this one is not the
# wallet's: no Tauri, no GTK, no librustzcash, no SQLite. Sharing a policy
# between two graphs that have nothing in common would mean every entry is
# either irrelevant to one of them or hiding something in the other.
#
# `scripts/check-rust-deny.sh --root rs` enforces this file.
#
# =============================================================================
# THE `ignore` LIST IS EMPTY, AND IT STAYS THAT WAY UNTIL SOMEONE MEASURES ONE.
# =============================================================================
#
# wallet/deny.toml's list is the *measured* backlog from the day the wallet gate
# landed on a tree that had never had one — real work, tracked in #351. This
# tree is greenfield. There is nothing here to grandfather, so grandfathering
# nothing is not strictness, it is just the truth.
#
# Do not copy an entry across from wallet/deny.toml. Those justifications were
# written about a graph that does not exist here; re-stating one would launder
# an out-of-date assumption about someone else's dependencies as a reviewed
# decision about ours. If an advisory ever fires here, either fix the dependency
# or write a fresh entry naming the advisory, the version that fixes it, and why
# we are not on that version yet.

[graph]
# Evaluate every target. This tree compiles for wasm32-unknown-unknown as well
# as for the servers' hosts, and a host-only view would miss whatever the wasm
# half pulls in.
#
# `targets` is the knob that decides that, and an empty list is cargo-deny's
# "every target". It is stated rather than left absent because this is a
# property we rely on: an absent key is indistinguishable from an unconsidered
# one, and a default that changes upstream would narrow the graph silently,
# between two CI runs, with no commit of ours in between.
targets = []

# A *feature* knob, not a target one. `--all-features` would judge a graph
# nothing in this tree compiles; the crates here are checked with the features
# they actually build with. Restated rather than inherited so that turning it on
# is a visible, reviewed edit.
all-features = false

# =============================================================================
# Advisories.
# =============================================================================
[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]

# Yanking is registry state, not repository state: a crate can be yanked
# upstream between two CI runs with no commit of ours in between, which would
# turn an unrelated pull request red for reasons its author cannot act on. It is
# reported on every run and triaged deliberately instead.
yanked = "warn"

# =============================================================================
# THE MEASURED LIST. Every entry below was produced by reading the advisory,
# finding the crate in `cargo tree`, and deciding whether this tree's code can
# reach the affected function — not by copying an id out of a red CI log.
#
# **It has one entry.** It had ten until #723, and the nine that went were the
# whole libcrux family that arrived with `openmls_libcrux_crypto 0.3.1`:
#
#   RUSTSEC-2026-0073  libcrux-poly1305           standalone MAC panic
#   RUSTSEC-2026-0075  libcrux-ed25519            all-zero key on RNG failure
#   RUSTSEC-2026-0124  libcrux-chacha20poly1305   encrypt panics on a long buffer
#   RUSTSEC-2026-0207  libcrux-sha3               incremental SHAKE squeeze
#   RUSTSEC-2026-0208  libcrux-sha3               AVX2 SHAKE-256 panic
#   RUSTSEC-2026-0209  libcrux-aesgcm             AES-GCM AAD length limit
#   RUSTSEC-2026-0210  libcrux-aesgcm             unmaintained (renamed)
#   RUSTSEC-2026-0211  libcrux-aesgcm             non-constant-time tag check
#   RUSTSEC-2026-0212  libcrux-secrets            aarch64 constant-time defect
#
# They are **fixed, not re-argued**. The 0.9 train resolves to
# `libcrux-secrets 0.0.6`, `libcrux-sha3 0.0.10`, `libcrux-ed25519 0.0.9`,
# `libcrux-poly1305 0.0.6`, `libcrux-chacha20poly1305 0.0.9` and
# `libcrux-aes 0.0.9`, none of which is affected. The per-advisory reachability
# reasoning that stood here — which of them our ciphersuite could reach, and why
# — has been **deleted rather than kept as history**: a justification for a risk
# that no longer exists teaches the next reader that the risk is still being
# accepted, which is worse than saying nothing. #701 and #723 hold the record.
#
# The one that mattered was RUSTSEC-2026-0212. `libcrux-secrets 0.0.5`'s
# constant-time swap/select returned incorrect results on **aarch64** — every
# phone we ship to and every Apple Silicon desktop — underneath the AEAD we
# actually use, and #701 established that it could not be patched around
# without forking the libcrux release train. It was carried as an accepted risk
# for one day. It is now simply fixed.
#
# =============================================================================
# THE `[patch.crates-io]` WARNING, AND IT OUTLIVES THIS MIGRATION.
# =============================================================================
#
# #701 tried to force `libcrux-secrets 0.0.6` under the old graph with a
# `[patch.crates-io]` entry. **The build went green and linked 0.0.5.** Cargo's
# `[patch]` replaces a package's *source*, not its version, so a 0.0.6 patch
# cannot satisfy `libcrux-aead`'s `=0.0.5`; cargo emits
#
#     warning: patch `libcrux-secrets v0.0.6 (...)` was not used in the crate graph
#
# and carries on. Trusting the exit code would have meant reporting the advisory
# fixed while the vulnerable code was still in the binary.
#
# **Anyone patching a pinned transitive dependency must check
# `cargo tree -i <crate>`, not the build result.** That is a fact about cargo,
# not about libcrux, and it will be true again the next time someone tries this.
ignore = [
  # ---------------------------------------------------------------------------
  # BUILD-TIME ONLY, and the only entry left. `proc-macro-error2` is
  # unmaintained (a fork of an already unmaintained crate). It reaches this
  # graph as a proc-macro dependency of `hax-lib-macros`, which libcrux uses for
  # its formal-verification annotations. It runs on the build host and no code
  # from it is linked into any shipped artifact, so "unmaintained" here is a
  # supply-chain-of-the-build concern and not a runtime one. Nothing we control
  # can drop it while libcrux is in the graph.
  { id = "RUSTSEC-2026-0173", reason = "unmaintained proc-macro; build-host only, nothing from it is linked into a shipped artifact" },
]

# =============================================================================
# Licences — and the permissive/AGPL boundary, made mechanical.
#
# Per the owner decision recorded on #305: the relay and directory **server
# binaries** will be AGPL-3.0, while every **shared crate** stays permissive so
# that the ZUULI client, the WASM web client, and third-party implementations
# can link them. A permissive core with copyleft servers is only a real boundary
# if something checks it, and this section is that something.
#
# `private.ignore = false` is the load-bearing line. cargo-deny's default is to
# skip crates marked `publish = false`, which is every crate in this workspace —
# with the default, our own licences would never be looked at and the boundary
# would be a comment. With it off, every first-party `license` field is judged
# against the allow list below, so:
#
#   * a shared crate that forgets `license` fails;
#   * a shared crate that declares AGPL-3.0 fails;
#   * an AGPL-3.0 **server binary** fails until it is added to `exceptions` by
#     name, which is a reviewed, one-line, deliberate act.
#
# That last case is the boundary: crossing it is possible, and it is impossible
# to cross by accident.
# =============================================================================
[licenses]
private = { ignore = false }

allow = [
  # Exactly the licences this workspace's graph actually carries today, and
  # nothing else. An aspirational allow list is a claim about dependencies we do
  # not have; cargo-deny reports every unmatched entry, and a policy that emits
  # warnings on a clean run trains people to ignore its output.
  #
  # Adding a permissive licence here when a new dependency needs one is a
  # one-line, reviewed edit. That is the intended cost.
  "MIT",
  "Apache-2.0",
  "BSD-3-Clause",
  "Unicode-3.0",

  # `webpki-roots` — Mozilla's CA root store, redistributed as *data* under the
  # Community Data License Agreement, Permissive 2.0. It is a data licence
  # rather than a code licence and imposes no condition on distributing this
  # binary; it is here because a trust store has to come from somewhere and the
  # alternative is trusting whatever the host image happens to carry.
  "CDLA-Permissive-2.0",
  # Zlib arrives with SQLite: rusqlite -> hashlink -> hashbrown -> foldhash,
  # which is `Zlib` and is reached through hashbrown's default hasher rather
  # than by any choice of ours. It is permissive — OSI-approved, FSF Free/Libre,
  # no copyleft and no attribution-in-binary requirement — so it sits on the
  # correct side of the boundary this section exists to police, which is
  # permissive-crates versus AGPL-server-binaries and not licence-family
  # bookkeeping. wallet/deny.toml already allows it for an unrelated graph
  # (the objc2 family, bytemuck, miniz_oxide, tinyvec); this entry is judged
  # against ours and names the crate that needs it.
  "Zlib",
  # ISC arrives with TLS, and only with TLS: `rustls-webpki` and `untrusted`
  # are ISC, and `ring` is `Apache-2.0 AND ISC`. None of them is reached by any
  # crate a client links — the wasm32 job builds `f2z-codec`,
  # `f2z-relay-proto`, `f2z-authority` and `f2z-kt-core`'s verifier, and none
  # pulls rustls — so this entry widens the policy for the server side of the
  # tree only.
  #
  # ISC is the two-clause BSD licence with the redundant words removed:
  # OSI-approved, FSF Free/Libre, permissive, no copyleft, no
  # attribution-in-binary requirement. It sits on the same side of the boundary
  # this section polices — permissive crates versus AGPL server binaries — as
  # MIT and Apache-2.0 do, and it is added because a dependency needs it rather
  # than in anticipation of one. `f2z-relay` needs TLS 1.3 because WIRE.md §5.3
  # binds every signature to the TLS exporter and §2.1 forbids TLS 1.2.
  "ISC",
]

# Per-crate escapes, **by name**, and this is the licence boundary being
# crossed deliberately.
#
# Adding an AGPL identifier to `allow` above instead would silently permit it
# for every crate in the tree, including the ones the ZUULI client links, which
# is exactly the drift this section exists to prevent. Each entry below is one
# server binary and nothing else; a library crate that appeared here would be a
# review failure, because a client cannot link it.
#
# Every entry passes the same test: it opens a listening socket or runs
# unattended for other people, it links a runtime, it is deliberately absent
# from rs.yml's wasm32 line, and no client links it.
exceptions = [
  # ---------------------------------------------------------------------------
  # MPL-2.0, arriving with HPKE, and **this one needs an owner's eye**.
  #
  # `openmls_libcrux_crypto 0.4.0` reaches HPKE (RFC 9180) through Cryspen's
  # `hpke-rs` family, and all three of those crates are MPL-2.0. There is no
  # alternative inside the decision #385 settled: HPKE is how MLS does its
  # asymmetric encryption, and this is the HPKE the libcrux provider uses.
  #
  # Why they are `exceptions` and not an entry in `allow` above: MPL-2.0 is
  # **not permissive**, and `allow` is the permissive list. Adding it there
  # would silently admit MPL-2.0 for every crate in the tree, which is exactly
  # the drift the AGPL entries below exist to prevent.
  #
  # Why it is nevertheless on the correct side of this section's boundary:
  # MPL-2.0's copyleft is **per file**, not per program. §3.3 of the licence
  # permits distributing a Larger Work under different terms provided the
  # MPL-covered *files* remain MPL, and §1.10/§3.2 scope the source-disclosure
  # obligation to those files and their modifications. Linking `hpke-rs`
  # therefore imposes no obligation on ZUULI's source, on the WASM client's
  # source, or on a third-party implementation's — which is the property this
  # whole section polices. The obligation we *do* take on is real and should be
  # stated: if we ever modify one of these three files, that modification must
  # be published under MPL-2.0.
  #
  # **This is a judgement about licence policy and it belongs to the owner, not
  # to the agent that needed the dependency.** It is recorded here rather than
  # laundered into `allow` so that reverting it is a three-line edit and so that
  # a reviewer sees the decision instead of inheriting it.
  { name = "hpke-rs", allow = ["MPL-2.0"] },
  { name = "hpke-rs-crypto", allow = ["MPL-2.0"] },
  { name = "hpke-rs-libcrux", allow = ["MPL-2.0"] },

  # The relay daemon (#628, WIRE.md). The first to land.
  { name = "f2z-relay", allow = ["AGPL-3.0"] },
  # The key-transparency log server (KT.md §5, §6, §9). Owner decision on #305:
  # THREAT-MODEL.md §4.5 concedes that server-side deletion is "auditable, not
  # verifiable", and a copyleft obligation for network use is the only lever we
  # have over an operator we do not run.
  { name = "f2z-kt", allow = ["AGPL-3.0-only"] },
  # The cosigning daemon (KT.md §7). A modified witness that skips §7.1 step 4
  # is worthless in a way nobody can see from outside (§7.4), which is precisely
  # the case for requiring the source of a running modification.
  { name = "f2z-witness", allow = ["AGPL-3.0-only"] },
]

# =============================================================================
# Bans.
#
# Unlike the wallet, this tree is small enough for the duplicate-version report
# to be signal rather than noise, so it is left on. A second copy of a crate in
# a relay is a second parser on the unauthenticated path or a second copy of a
# crypto primitive; either is worth a look. Downgrade this only with a reason.
# =============================================================================
[bans]
multiple-versions = "warn"
wildcards = "deny"

[[bans.deny]]
# akd < 0.13.0 contains an auditor append-only bypass, facebook/akd#495, merged
# 2026-08-12 and released in 0.13.0 on 2026-08-13: a malicious log can rewrite an
# existing label's value while still producing a VALID append-only proof, which
# defeats the witness role entirely (see docs/e2ee/KT.md §7).
# There is no RustSec/OSV advisory — an OSV query for `akd` returns {} — so
# `cargo audit` and `cargo deny advisories` will NOT catch a downgrade. This entry
# is the floor. Do not remove it, and do not assume tooling is holding it.
name = "akd"
version = "<0.13.0"

[[bans.deny]]
name = "akd_core"
version = "<0.13.0"

[[bans.deny]]
# akd_mysql's last release is 0.8.9 (2023-03-15) and it is not maintained.
# The durable Database impl is ours (KT.md §11.2).
name = "akd_mysql"

[[bans.deny]]
# The floor carries **two** defects now, and it is raised rather than replaced.
#
#   * openmls < 0.8.1 carries a High-severity MAC authentication defect
#     (GHSA-3wpg-h9qc-hjwj / RUSTSEC-2025-0069).
#   * openmls < 0.9.0 resolves, through `openmls_libcrux_crypto <= 0.3.1`, to a
#     `libcrux-aead` pinned at `libcrux-secrets =0.0.5` — RUSTSEC-2026-0212,
#     the aarch64 constant-time swap/select defect. `openmls_libcrux_crypto` is
#     the crate that actually carries that, but a floor on the provider alone
#     would leave `openmls 0.8.1` free to select it, and 0.9.0 is the release
#     that requires 0.4.0.
#
# The same reasoning as the `akd` floor above applies and is the reason this is
# an entry rather than a comment: a `[patch.crates-io]`, a path dependency or a
# vendored copy all satisfy a manifest requirement of `"0.9.0"` without a word,
# and a floor nobody enforces is a wish. This is the mechanism.
name = "openmls"
version = "<0.9.0"

[[bans.deny]]
# The provider, floored in its own right. `openmls 0.9.0` requires
# `openmls_libcrux_crypto 0.4.0` today, so this is redundant with the entry
# above *given today's manifests* — which is exactly why it is written down: it
# is the crate that resolves `libcrux-secrets`, and a future `openmls` that
# widened its provider requirement back across the 0.3 line would otherwise
# reintroduce RUSTSEC-2026-0212 without changing a single version this file
# names.
name = "openmls_libcrux_crypto"
version = "<0.4.0"

[[bans.deny]]
# The trait crate that ships with it. Held at the release matching the audited
# `openmls 0.9.0` for the same reason: `f2z-msg-store` implements
# `StorageProvider` against this trait, and an older trait would silently mean
# fewer methods — a storage provider that compiles while never being asked to
# persist something OpenMLS now persists.
name = "openmls_traits"
version = "<0.6.0"

[[bans.deny]]
# `openmls_basic_credential` must not enter this graph. It signs with
# `ed25519-dalek` and `p256` *outside* the libcrux provider, which contradicts
# ADR 0001's single Rust crypto core: sign with one implementation and verify
# with another and the disagreement is a signature that validates for one peer
# and not another. #693 records it; `f2z-msg-mls`'s `DeviceSigner` replaces it
# with about twenty lines over `libcrux-ed25519`, the same primitive
# `openmls_libcrux_crypto` itself calls.
#
# A ban rather than "we just did not add it": it is the obvious crate to reach
# for, every OpenMLS example uses it, and nothing else would notice it arriving.
name = "openmls_basic_credential"

[[bans.deny]]
# The default OpenMLS crypto provider, and the second crypto core ADR 0001 does
# not have. `openmls`'s `default-features = false` plus `libcrux-provider` keeps
# it out; this entry is what makes a future feature edit fail review instead of
# quietly linking RustCrypto's whole stack beside libcrux.
name = "openmls_rust_crypto"

# `openmls_memory_storage` is deliberately NOT banned, and the reason is worth
# recording because banning it was the first instinct. It is the reference
# implementation `f2z-msg-store` is a port of, and it is also a **hard,
# non-optional dependency of `openmls_libcrux_crypto 0.4.0`**, whose `Provider`
# struct owns a `MemoryStorage` field. A ban would therefore be unsatisfiable
# without forking the provider. What matters is that nothing in this tree
# *hands it to OpenMLS*: `f2z-msg-mls::F2zProvider` implements `OpenMlsProvider`
# itself and never constructs `openmls_libcrux_crypto::Provider`, so the
# transaction-free store is linked and unreachable.

# =============================================================================
# Sources. Everything resolves to crates.io. Making that a rule rather than a
# coincidence means a `git = "..."` dependency on someone's fork cannot appear
# in a relay's dependency graph without amending this file.
# =============================================================================
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
