# Supply-chain policy for every Rust crate under rs/.
#
# Separate from wallet/deny.toml on purpose. "Which advisories we accept" is a
# judgement about a *particular dependency graph*, and this one is not the
# wallet's: no Tauri, no GTK, no librustzcash, no SQLite. Sharing a policy
# between two graphs that have nothing in common would mean every entry is
# either irrelevant to one of them or hiding something in the other.
#
# `scripts/check-rust-deny.sh --root rs` enforces this file.
#
# =============================================================================
# THE `ignore` LIST IS EMPTY, AND IT STAYS THAT WAY UNTIL SOMEONE MEASURES ONE.
# =============================================================================
#
# wallet/deny.toml's list is the *measured* backlog from the day the wallet gate
# landed on a tree that had never had one — real work, tracked in #351. This
# tree is greenfield. There is nothing here to grandfather, so grandfathering
# nothing is not strictness, it is just the truth.
#
# Do not copy an entry across from wallet/deny.toml. Those justifications were
# written about a graph that does not exist here; re-stating one would launder
# an out-of-date assumption about someone else's dependencies as a reviewed
# decision about ours. If an advisory ever fires here, either fix the dependency
# or write a fresh entry naming the advisory, the version that fixes it, and why
# we are not on that version yet.

[graph]
# Evaluate every target. This tree compiles for wasm32-unknown-unknown as well
# as for the servers' hosts, and a host-only view would miss whatever the wasm
# half pulls in.
#
# `targets` is the knob that decides that, and an empty list is cargo-deny's
# "every target". It is stated rather than left absent because this is a
# property we rely on: an absent key is indistinguishable from an unconsidered
# one, and a default that changes upstream would narrow the graph silently,
# between two CI runs, with no commit of ours in between.
targets = []

# A *feature* knob, not a target one. `--all-features` would judge a graph
# nothing in this tree compiles; the crates here are checked with the features
# they actually build with. Restated rather than inherited so that turning it on
# is a visible, reviewed edit.
all-features = false

# =============================================================================
# Advisories.
# =============================================================================
[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]

# Yanking is registry state, not repository state: a crate can be yanked
# upstream between two CI runs with no commit of ours in between, which would
# turn an unrelated pull request red for reasons its author cannot act on. It is
# reported on every run and triaged deliberately instead.
yanked = "warn"

# Empty. See the header. This is the whole point of the file.
ignore = []

# =============================================================================
# Licences — and the permissive/AGPL boundary, made mechanical.
#
# Per the owner decision recorded on #305: the relay and directory **server
# binaries** will be AGPL-3.0, while every **shared crate** stays permissive so
# that the ZUULI client, the WASM web client, and third-party implementations
# can link them. A permissive core with copyleft servers is only a real boundary
# if something checks it, and this section is that something.
#
# `private.ignore = false` is the load-bearing line. cargo-deny's default is to
# skip crates marked `publish = false`, which is every crate in this workspace —
# with the default, our own licences would never be looked at and the boundary
# would be a comment. With it off, every first-party `license` field is judged
# against the allow list below, so:
#
#   * a shared crate that forgets `license` fails;
#   * a shared crate that declares AGPL-3.0 fails;
#   * an AGPL-3.0 **server binary** fails until it is added to `exceptions` by
#     name, which is a reviewed, one-line, deliberate act.
#
# That last case is the boundary: crossing it is possible, and it is impossible
# to cross by accident.
# =============================================================================
[licenses]
private = { ignore = false }

allow = [
  # Exactly the licences this workspace's graph actually carries today, and
  # nothing else. An aspirational allow list is a claim about dependencies we do
  # not have; cargo-deny reports every unmatched entry, and a policy that emits
  # warnings on a clean run trains people to ignore its output.
  #
  # Adding a permissive licence here when a new dependency needs one is a
  # one-line, reviewed edit. That is the intended cost.
  "MIT",
  "Apache-2.0",
  "BSD-3-Clause",
  "Unicode-3.0",

  # ---------------------------------------------------------------------------
  # Added for the witness's TLS stack. `f2z-witness` polls a log over outbound
  # HTTPS (KT.md §9.2, §9.3) and reaches rustls through `ureq`; none of these
  # is in a crate the ZUULI or WASM clients link, and all three are permissive
  # and OSI-approved.
  # ---------------------------------------------------------------------------
  #
  # `ring` is "Apache-2.0 AND ISC"; `rustls-webpki` and `untrusted` are ISC.
  # ISC is a two-clause permissive licence, functionally equivalent to
  # BSD-2-Clause and already accepted elsewhere in the ecosystem.
  "ISC",
  # `webpki-roots` — Mozilla's CA root store, redistributed as *data* under the
  # Community Data License Agreement, Permissive 2.0. It is a data licence
  # rather than a code licence and imposes no condition on distributing this
  # binary; it is here because a trust store has to come from somewhere and the
  # alternative is trusting whatever the host image happens to carry.
  "CDLA-Permissive-2.0",
]

# Per-crate escapes, **by name**, and this is the licence boundary being
# crossed deliberately.
#
# Adding "AGPL-3.0" to `allow` above instead would silently permit it for every
# crate in the tree, including the ones the ZUULI client links, which is exactly
# the drift this section exists to prevent. Each entry below is one server
# binary and nothing else; a library crate that appeared here would be a review
# failure, because a client cannot link it.
exceptions = [
  # The key-transparency log server (KT.md §5, §6, §9). Owner decision on #305:
  # THREAT-MODEL.md §4.5 concedes that server-side deletion is "auditable, not
  # verifiable", and a copyleft obligation for network use is the only lever we
  # have over an operator we do not run.
  { name = "f2z-kt", allow = ["AGPL-3.0-only"] },
  # The cosigning daemon (KT.md §7). A modified witness that skips §7.1 step 4
  # is worthless in a way nobody can see from outside (§7.4), which is precisely
  # the case for requiring the source of a running modification.
  { name = "f2z-witness", allow = ["AGPL-3.0-only"] },
]

# =============================================================================
# Bans.
#
# Unlike the wallet, this tree is small enough for the duplicate-version report
# to be signal rather than noise, so it is left on. A second copy of a crate in
# a relay is a second parser on the unauthenticated path or a second copy of a
# crypto primitive; either is worth a look. Downgrade this only with a reason.
# =============================================================================
[bans]
multiple-versions = "warn"
wildcards = "deny"

[[bans.deny]]
# akd < 0.13.0 contains an auditor append-only bypass, facebook/akd#495, merged
# 2026-08-12 and released in 0.13.0 on 2026-08-13: a malicious log can rewrite an
# existing label's value while still producing a VALID append-only proof, which
# defeats the witness role entirely (see docs/e2ee/KT.md §7).
# There is no RustSec/OSV advisory — an OSV query for `akd` returns {} — so
# `cargo audit` and `cargo deny advisories` will NOT catch a downgrade. This entry
# is the floor. Do not remove it, and do not assume tooling is holding it.
name = "akd"
version = "<0.13.0"

[[bans.deny]]
name = "akd_core"
version = "<0.13.0"

[[bans.deny]]
# akd_mysql's last release is 0.8.9 (2023-03-15) and it is not maintained.
# The durable Database impl is ours (KT.md §11.2).
name = "akd_mysql"

# =============================================================================
# Sources. Everything resolves to crates.io. Making that a rule rather than a
# coincidence means a `git = "..."` dependency on someone's fork cannot appear
# in a relay's dependency graph without amending this file.
# =============================================================================
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
