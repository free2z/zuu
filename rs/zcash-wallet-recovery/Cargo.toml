[package]
name = "zcash-wallet-recovery"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
nix = { version = "0.30", default-features = false, features = ["user"] }
rand = "0.10"
rusqlite = { version = "0.37", features = ["bundled", "array"] }
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tonic = { version = "0.14", features = ["transport", "tls-webpki-roots"] }
zcash_client_backend = { version = "=0.25.0", default-features = false, features = ["orchard", "lightwalletd-tonic-transport", "lightwalletd-tonic-tls-webpki-roots"] }
zcash_client_sqlite = { version = "=0.23.0", default-features = false, features = ["orchard"] }
zcash_keys = { version = "=0.17.0", features = ["sapling", "orchard"] }
zcash_primitives = "=0.31.0"
zcash_protocol = "=0.11.0"

[dev-dependencies]
tempfile = "3"
sapling = { package = "sapling-crypto", version = "0.9", default-features = false }
zcash_note_encryption = "0.5.1"
transparent = { package = "zcash_transparent", version = "0.11", default-features = false }
zip32 = "0.3"

[profile.dev]
debug = 0

[profile.test]
debug = 0

[workspace]
