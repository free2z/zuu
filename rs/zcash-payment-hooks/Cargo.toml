[package]
name = "zcash-paymentd"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
publish = false
description = "Receive-only Zcash Payment Hooks: shielded payments to durable JSON executable events"
repository = "https://github.com/free2z/zuu"

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
hex = "0.4"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "signal", "time", "io-util"] }
toml = "0.9"
zcash_client_backend = { version = "=0.24.0", default-features = false, features = ["orchard"] }
zcash_keys = { version = "=0.16.1", features = ["sapling", "orchard"] }
zcash_primitives = "=0.30.1"
zcash_protocol = "=0.10.6"
zip32 = "0.2"

[dev-dependencies]
tempfile = "3"
rand = "0.8"
nonempty = "0.11"
orchard = { version = "0.15", default-features = false }
sapling = { package = "sapling-crypto", version = "0.7", default-features = false }
zcash_note_encryption = "0.4.2"
zcash_address = "=0.13.0"
transparent = { package = "zcash_transparent", version = "0.10", default-features = false }
zcash_script = "0.4"

[profile.dev]
debug = 0

[profile.test]
debug = 0

# Independent resolution: this daemon is not linked into the messaging or wallet workspace.
[workspace]
