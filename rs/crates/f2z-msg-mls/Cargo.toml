[package]
name = "f2z-msg-mls"
version = "0.1.0"
description = "The MLS (RFC 9420) engine for free2z messaging: X-Wing hybrid PQ, DeviceCredential-bound membership, and the §5.4 exporter labels (docs/e2ee/ARCHITECTURE.md §5)"
edition.workspace = true
# A restatement of wallet/rust-toolchain.toml's channel in Cargo's MSRV form,
# registered with `scripts/check-rust-toolchain.sh --manifest` so it cannot
# drift. Not inherited from the workspace: that check reads this literal line.
rust-version = "1.97"
# Permissive, deliberately and explicitly. ZUULI native, the WASM web client and
# any third-party implementation link this; the AGPL-3.0 boundary starts at the
# server binaries. Stated literally rather than inherited so it is visible to
# anyone opening the crate. rs/deny.toml enforces it.
license = "MIT"
repository.workspace = true
publish.workspace = true

[features]
# The native durable store. Off in the browser build: `f2z-msg-store`'s SQLite
# backend links SQLite's C amalgamation and cannot reach wasm32.
default = ["sqlite"]
sqlite = ["f2z-msg-store/sqlite"]

# See `f2z-msg-store`'s manifest. Off by default and never in anything that
# ships; `tests/crash_safety.rs` is what needs it.
crash-injection = ["f2z-msg-store/crash-injection"]

# The browser build (ADR 0001's web client). OpenMLS refuses to compile for
# wasm32 without it — it needs JavaScript APIs for secure randomness and for the
# current time, and says so with a `compile_error!` rather than producing a
# binary that traps. Never enabled on a native target.
js = ["openmls/js"]

[lints]
workspace = true

[dependencies]
# `version` beside `path` is not redundant: rs/deny.toml sets
# `wildcards = "deny"`, and a bare path dependency is a wildcard requirement.
# `default-features = false` so that a consumer targeting the browser does not
# get SQLite by transitive default; this crate's own `sqlite` feature forwards.
f2z-msg-store = { path = "../f2z-msg-store", version = "0.1.0", default-features = false }
# `DeviceCredential` and `DeviceCredentialTBS` are **`f2z-kt-core`'s**, and this
# crate re-exports them rather than restating them: an MLS peer and the
# transparency log must agree byte-for-byte about what a credential is, and two
# copies of a `tls_codec` struct are one field-order edit away from disagreeing.
# `default-features = false` drops `verifier` and `auditor` — `akd_core` and
# `akd` — which this crate does not need: `entry`, `labels`, `sig` and `types`
# are unconditional. That also keeps the browser build small and keeps `akd`,
# which cannot reach wasm32 (KT.md §11.3), out of the graph entirely.
f2z-kt-core = { path = "../f2z-kt-core", version = "0.1.0", default-features = false }
# The canonical encoding every free2z wire structure uses (`WIRE.md` §1.2, §3.3),
# and the newtypes the credential is built from.
f2z-codec = { workspace = true }
openmls = { workspace = true }
openmls_traits = { workspace = true }
openmls_libcrux_crypto = { workspace = true }
# Our own `Signer`, closing #693. `openmls_basic_credential` signs with
# `ed25519-dalek` and `p256` *outside* the libcrux provider, which contradicts
# ADR 0001's single crypto core; this is the same primitive the provider itself
# uses (`openmls_libcrux_crypto`'s `crypto.rs` calls exactly these functions),
# so naming it here adds no crate to the graph and removes two.
libcrux-ed25519 = { workspace = true }
# `tls_codec` is deliberately NOT a dependency of this crate, and it stays that
# way even though the workspace and `openmls 0.9` now agree on 0.5 (#853). The
# only two `tls_codec` calls here are on OpenMLS's own types, so `src/engine.rs`
# reaches them through `openmls::prelude::tls_codec`: the trait a derive
# generated must be the one that crate derived it with, whether or not the
# resolver currently makes those the same crate. See the note at that import.
serde = { workspace = true }

[dev-dependencies]
tempfile = "3"
# The tests issue credentials through the **real** issuer rather than by hand:
# `AccountKeys::from_seed` → `IdentitySigningKey::issue_device_credential`. That
# makes `tests/` the coordination test between #694's crate and this one — if
# the two ever disagree about the structure, the engine stops accepting
# credentials the identity crate issues, here, rather than on a user's phone.
#
# A dev-dependency and not a dependency: this crate never issues a credential.
# Issuance needs the account key hierarchy and the seed, and
# `CLIENT-CONTRACT.md` §2.2 keeps the seed in the app crate for reasons that
# have nothing to do with MLS.
f2z-msg-identity = { path = "../f2z-msg-identity", version = "0.1.0" }
# The libcrux Ed25519 primitive, for the tests that check `DeviceSigner`
# directly. Already a dependency of the library; named again so the test's use
# of it is declared.
libcrux-ed25519 = { workspace = true }
# `version.rs`'s test round-trips a `ProtocolVersion` through the encoding the
# store uses.
serde_json = { workspace = true }

# wasm32 only, and only to turn a feature on. `getrandom` refuses to compile for
# wasm32-unknown-unknown until a backend is selected — a `compile_error!`, not a
# binary that traps — and the browser build (ADR 0001) needs one.
#
# **There used to be two entries here and now there is one**, which is a real
# change in the graph rather than a tidy-up. Against `openmls 0.8.1` this crate
# pulled getrandom 0.3 (through `rand_core 0.9`) *and* getrandom 0.4 (through
# `rand 0.10` inside `hpke-rs-libcrux`), so both had to be named. On the 0.9
# train nothing in this crate's wasm graph reaches `rand_core 0.9` any more:
# getrandom 0.3 survives in this workspace's lockfile only under `proptest` and
# `f2z-relay`'s dev-dependencies, neither of which the `--lib` browser build
# compiles. Declaring it here would put a crate in the browser bundle that
# nothing in the browser bundle uses. Verified with
# `cargo tree --target wasm32-unknown-unknown -p f2z-msg-mls
# --no-default-features --features js -i getrandom@0.3`, which now matches
# nothing.
#
# **The `--cfg getrandom_backend="wasm_js"` RUSTFLAG went with it**, and that is
# a version difference rather than an oversight: getrandom **0.3** required the
# feature *and* the cfg, while **0.4** selects its wasm backend from the
# `wasm_js` feature alone (`src/backends.rs`, the
# `target_family = "wasm"` arm). `.github/workflows/rs.yml` no longer sets it.
#
# The entry below is kept even though `openmls/js` also turns `getrandom/wasm_js`
# on by unification, per `AGENTS.md`: a feature enabled only because some other
# crate happens to enable it is a feature we do not actually have. Target-gated,
# so a native build gains nothing.
#
# If getrandom 0.3 ever re-enters this graph the wasm job fails at compile time
# with getrandom's own `compile_error!`. It cannot fail quietly.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_v04 = { package = "getrandom", version = "0.4", default-features = false, features = ["wasm_js"] }
