name: wallet/surfaces

# Compiles the two delegated surfaces of the three-app split (#904/#906):
#
#   wallet/free2z  — the content surface. Links NO privileged plugin.
#   wallet/e2e2z   — the messaging surface. Links tauri-plugin-f2zmsg only.
#
# What this workflow is NOT is the thing that keeps those surfaces unprivileged,
# and since #915 it is no longer the thing that runs their tests either. Both
# now live inside the required `gate` in zuuli.yml, which carries no `paths:`
# filter and so reports on every pull request:
#
#   * `wallet/zuuli/scripts/surface-capability-authority.mjs` (+ its node test)
#     runs inside the protected `zuuli / frontend` job via `npm run test`. It is
#     the contract test #906 asks for: free2z may hold no `zcash:*` and no
#     `f2zmsg:*` entry, e2e2z no `zcash:*` and never the blanket
#     `f2zmsg:default`, and neither may link a plugin it is not allowed.
#   * `wallet/zuuli/scripts/project-boundary.mjs`, same job, refuses a cross-
#     application import in either direction.
#   * `rust_fmt` / `rust_clippy` / `rust_deny` discover crates rather than
#     listing them, so both new `src-tauri` crates are gated.
#   * zuuli.yml's `surfaces` job — added by #915 — runs each surface's own
#     typecheck, vitest, ui-copy and Playwright suites, including
#     wallet/e2e2z/tests/enrollment-gap.pw.ts. Those suites MOVED there rather
#     than being copied there: running ~900 vitest cases and two Playwright
#     suites twice per pull request is the cost #949 is about.
#
# So what is left here is the `cargo` build and test of each backend, on a
# `paths:` filter. That is the shape of `zuuallet.yml`, and like it this
# workflow publishes no gate and is registered in
# `scripts/check-workflow-gates.mjs`'s UNGATED_WORKFLOWS.
#
# The contract test that holds the messaging client to
# `docs/e2ee/CLIENT-CONTRACT.md` — `messaging-contract.node-test.mjs` — never
# moved out of ZUULI at all: it stays in `wallet/zuuli/scripts` so it keeps
# running inside the protected `gate`, and it reads across both trees.

on:
  pull_request:
    paths:
      - 'wallet/free2z/**'
      - 'wallet/e2e2z/**'
      - 'wallet/shared/**'
      - 'wallet/package.json'
      - 'wallet/package-lock.json'
      - 'wallet/plugins/tauri-plugin-f2zmsg/**'
      - 'wallet/rust-toolchain.toml'
      - 'wallet/deny.toml'
      - 'rs/crates/f2z-codec/**'
      - 'rs/crates/f2z-kt-client/**'
      - 'rs/crates/f2z-kt-core/**'
      - 'rs/crates/f2z-msg-dag/**'
      - 'rs/crates/f2z-msg-identity/**'
      - 'rs/crates/f2z-msg-mls/**'
      - 'rs/crates/f2z-msg-store/**'
      - 'rs/crates/f2z-relay-proto/**'
      - 'rs/crates/f2z-relay-testkit/**'
      - 'scripts/check-rust-toolchain.sh'
      - 'scripts/install-ubuntu-deps.sh'
      - 'scripts/test-ubuntu-apt-isolation.py'
      - '.github/workflows/wallet-surfaces.yml'
  push:
    branches: [main]
    paths:
      - 'wallet/free2z/**'
      - 'wallet/e2e2z/**'
      - 'wallet/shared/**'
      - 'wallet/package.json'
      - 'wallet/package-lock.json'
      - 'wallet/plugins/tauri-plugin-f2zmsg/**'
      - 'wallet/rust-toolchain.toml'
      - 'wallet/deny.toml'
      - 'rs/crates/f2z-codec/**'
      - 'rs/crates/f2z-kt-client/**'
      - 'rs/crates/f2z-kt-core/**'
      - 'rs/crates/f2z-msg-dag/**'
      - 'rs/crates/f2z-msg-identity/**'
      - 'rs/crates/f2z-msg-mls/**'
      - 'rs/crates/f2z-msg-store/**'
      - 'rs/crates/f2z-relay-proto/**'
      - 'rs/crates/f2z-relay-testkit/**'
      - 'scripts/check-rust-toolchain.sh'
      - 'scripts/install-ubuntu-deps.sh'
      - 'scripts/test-ubuntu-apt-isolation.py'
      - '.github/workflows/wallet-surfaces.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wallet-surfaces-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------------------
  # Rust: compile each Tauri backend against the committed lockfile.
  #
  # Neither crate path-depends on z/zcash/librustzcash, so no submodule is
  # fetched: free2z links no privileged plugin at all, and e2e2z links only
  # tauri-plugin-f2zmsg, whose graph is the messaging crates under rs/.
  # ---------------------------------------------------------------------------
  surfaces_rust:
    name: surfaces / rust (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        app: [free2z, e2e2z]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Tauri system dependencies
        run: |
          sudo bash scripts/install-ubuntu-deps.sh \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libxdo-dev \
            libdbus-1-dev \
            libssl-dev \
            build-essential curl wget file pkg-config

      - name: Resolve the pinned Rust toolchain
        id: rust_toolchain
        run: |
          set -euo pipefail
          version=$(scripts/check-rust-toolchain.sh --print-channel)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ steps.rust_toolchain.outputs.version }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: wallet/${{ matrix.app }}/src-tauri
          key: wallet-surfaces-${{ matrix.app }}

      # --locked: the committed Cargo.lock must build as-is, so whoever bumps a
      # dependency also commits the regenerated lock.
      #
      # `--all-targets` so the crate's own `#[cfg(test)]` assertions — that
      # free2z links no privileged plugin, and that e2e2z links no wallet
      # plugin — are compiled, and `cargo test` so they are executed.
      - name: Build the Tauri backend
        env:
          # The build script watches this value. Changing it on every attempt
          # forces schema generation even when Cargo artifacts were restored.
          TAURI_SCHEMA_GENERATION_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}
          TAURI_PERMISSION_GENERATION_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}
        run: >-
          cargo build --locked --all-targets
          --manifest-path wallet/${{ matrix.app }}/src-tauri/Cargo.toml

      - name: Test the Tauri backend
        run: >-
          cargo test --locked
          --manifest-path wallet/${{ matrix.app }}/src-tauri/Cargo.toml
