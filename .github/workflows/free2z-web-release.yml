name: Free2Z website release
on:
  push:
    branches:
      - main
    paths:
      - rs/zcash-payment-hooks/**
      - rust-toolchain.toml
      - LICENSE
      - .github/workflows/free2z-host-release.yml
      - py/free2z/**
      - ts/svelte/free2z/**
      - ts/react/free2z/**
      - ts/free2z/bridge/**
      - docs/about-free2z/**
      - docs/free2z/website/**
      - build/free2z/**
      - scripts/free2z/**
      - .github/workflows/free2z-web-*.yml
      - .github/dependency-audit-baseline.json
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: free2z-web-release
  cancel-in-progress: false
jobs:
  checks:
    if: github.repository == 'free2z/zuu' && github.ref == 'refs/heads/main' && github.ref_protected
    uses: ./.github/workflows/free2z-web-ci.yml
    permissions:
      contents: read
  publish:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        kind:
          - backend
          - web
          - static
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Select verified CI trust before clients
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          CI_TRUST_CONTAINER: ${{ job.container.id != '' && '1' || '0' }}
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then ci_python=python; else ci_python=python3; fi
          "$ci_python" -I - <<'PY'
          import hashlib, os, pathlib, subprocess, sys, urllib.request
          url = 'https://raw.githubusercontent.com/corpora-inc/encorpora/086efd078bf7179df466449f194d716916e11305/.github/scripts/ci_trust.py'
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
          with opener.open(url, timeout=30) as response:
              if response.url != url: raise SystemExit('Unexpected CI helper redirect')
              data = response.read(50001)
          if len(data) > 50000 or hashlib.sha256(data).hexdigest() != 'ba1fe4e0b829fdb18dd619751479fbafdd791ecc51b834f3399cb972d8ddf167':
              raise SystemExit('CI helper checksum mismatch')
          mode = os.environ['CI_TRUST_CONTAINER']
          if mode not in ('0', '1'): raise SystemExit('Unclassified CI container context')
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'corpora-ci-trust-bootstrap.py'
          with os.fdopen(os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600), 'wb') as output:
              output.write(data)
          subprocess.run([sys.executable, '-I', str(path), '--source-commit', '086efd078bf7179df466449f194d716916e11305'] + (['--clients-only'] if mode == '1' else []), check=True)
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # reviewed immutable repository pin
        with:
          persist-credentials: false
      - name: Require complete public application release
        env:
          APPLICATION_COMPLETE: ${{ needs.checks.outputs.complete }}
        run: test "$APPLICATION_COMPLETE" = true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # reviewed immutable repository pin
        with:
          name: free2z-image-${{ matrix.kind }}-${{ github.sha }}-${{ github.run_attempt }}
          path: image-bundle
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # reviewed immutable repository pin
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Push the already-tested image without executing it
        id: image
        env:
          KIND: ${{ matrix.kind }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$KIND" in backend|web|static) ;; *) exit 1;; esac
          docker load -i image-bundle/image.tar
          test "$(docker image inspect "free2z-$KIND:candidate" --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
          image_id=$(docker image inspect "free2z-$KIND:candidate" --format '{{.Id}}')
          python3 scripts/free2z/prepare-image-sbom.py check image-bundle/image.spdx.json --image-id "$image_id" --binding image-bundle/image-sbom-binding.json
          repository="ghcr.io/free2z/free2z-$KIND"
          tag="$repository:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker tag "free2z-$KIND:candidate" "$tag"
          docker push "$tag"
          digest=$(docker image inspect "$tag" --format '{{index .RepoDigests 0}}')
          digest="${digest##*@}"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'digest=%s
          repository=%s
          ' "$digest" "$repository" >> "$GITHUB_OUTPUT"
          printf '%s
          ' "$digest" > "image-bundle/$KIND.digest"
      - name: Require anonymous image consumption
        env:
          IMAGE: ${{ steps.image.outputs.repository }}@${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          anonymous_config=$(mktemp -d)
          trap 'rm -rf "$anonymous_config"' EXIT
          DOCKER_CONFIG="$anonymous_config" docker manifest inspect "$IMAGE" > "$anonymous_config/manifest.json"
          python3 - "$anonymous_config/manifest.json" <<'PYMANIFEST'
          import json, sys
          value = json.load(open(sys.argv[1]))
          if value.get('mediaType') not in ('application/vnd.oci.image.manifest.v1+json', 'application/vnd.docker.distribution.manifest.v2+json') or 'manifests' in value:
              raise SystemExit('Release digest must identify one linux/amd64 image manifest')
          PYMANIFEST
      - name: Attest published image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # reviewed immutable repository pin
        with:
          subject-name: ${{ steps.image.outputs.repository }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Attest image SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # reviewed immutable repository pin
        with:
          subject-name: ${{ steps.image.outputs.repository }}
          subject-digest: ${{ steps.image.outputs.digest }}
          predicate-type: https://spdx.dev/Document
          predicate-path: image-bundle/image.spdx.json
          push-to-registry: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # reviewed immutable repository pin
        with:
          name: free2z-published-${{ matrix.kind }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |-
            image-bundle/*.digest
            image-bundle/static-assets.json
          if-no-files-found: error
          retention-days: 3
  release:
    needs:
      - checks
      - publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Select verified CI trust before clients
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          CI_TRUST_CONTAINER: ${{ job.container.id != '' && '1' || '0' }}
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then ci_python=python; else ci_python=python3; fi
          "$ci_python" -I - <<'PY'
          import hashlib, os, pathlib, subprocess, sys, urllib.request
          url = 'https://raw.githubusercontent.com/corpora-inc/encorpora/086efd078bf7179df466449f194d716916e11305/.github/scripts/ci_trust.py'
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
          with opener.open(url, timeout=30) as response:
              if response.url != url: raise SystemExit('Unexpected CI helper redirect')
              data = response.read(50001)
          if len(data) > 50000 or hashlib.sha256(data).hexdigest() != 'ba1fe4e0b829fdb18dd619751479fbafdd791ecc51b834f3399cb972d8ddf167':
              raise SystemExit('CI helper checksum mismatch')
          mode = os.environ['CI_TRUST_CONTAINER']
          if mode not in ('0', '1'): raise SystemExit('Unclassified CI container context')
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'corpora-ci-trust-bootstrap.py'
          with os.fdopen(os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600), 'wb') as output:
              output.write(data)
          subprocess.run([sys.executable, '-I', str(path), '--source-commit', '086efd078bf7179df466449f194d716916e11305'] + (['--clients-only'] if mode == '1' else []), check=True)
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # reviewed immutable repository pin
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # reviewed immutable repository pin
        with:
          pattern: free2z-published-*-${{ github.sha }}-${{ github.run_attempt }}
          path: published
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # reviewed immutable repository pin
        with:
          name: free2z-task-registry-${{ github.sha }}-${{ github.run_attempt }}
          path: task-registry
      - name: Create immutable release selection document
        run: |
          set -euo pipefail
          mkdir release
          cp published/static-assets.json release/static-assets.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          values={k:Path('published',k+'.digest').read_text().strip() for k in ('backend','web','static')}
          Path('digests.json').write_text(json.dumps(values))
          PY
          python3 scripts/free2z/release-manifest.py create --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --digests digests.json --inventory release/static-assets.json --task-registry task-registry/task-registry.json --output release/release.json
      - name: Attest release manifest
        id: manifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # reviewed immutable repository pin
        with:
          subject-path: release/release.json
      - name: Retain manifest verification bundle
        env:
          BUNDLE_PATH: ${{ steps.manifest.outputs.bundle-path }}
        run: |-
          test -s "$BUNDLE_PATH"
          cp "$BUNDLE_PATH" release/release.intoto.jsonl
          python3 scripts/free2z/release-manifest.py check release/release.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # reviewed immutable repository pin
        with:
          name: free2z-release-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release/
          if-no-files-found: error
          retention-days: 90
      - name: Publish anonymously downloadable release evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          with ZipFile('free2z-release.zip', 'w', compression=ZIP_DEFLATED) as archive:
              for name in ('release.json', 'static-assets.json', 'release.intoto.jsonl'):
                  archive.write(Path('release', name), arcname=name)
          PY
          tag="free2z-web-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          gh release create "$tag" free2z-release.zip --repo free2z/zuu --target "$GITHUB_SHA" --title "Free2Z website $GITHUB_SHA" --notes "Verified application artifacts. Deployment selects exact digests through its independent release gates." --prerelease --latest=false
env:
  NODE_OPTIONS: --use-openssl-ca
