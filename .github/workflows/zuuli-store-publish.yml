name: ZUULI / Store listing publication gate

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact current main commit containing reviewed store media
        required: true
        type: string
      identity:
        description: Exact current release identity (for example 0.1.0+10)
        required: true
        type: string
      locales:
        description: Exact manifest locale allowlist
        required: true
        default: en-US
        type: string
      confirmation:
        description: Type PUBLISH_INTERNAL_LISTING after reviewing the manifest
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: zuuli-mobile-store
  cancel-in-progress: false

env:
  NODE_OPTIONS: --use-openssl-ca

jobs:
  publication-gate:
    name: Prove immutable publication inputs
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: zuuli-app-stores
    defaults:
      run:
        working-directory: wallet/zuuli
    steps:
      - name: Select verified CI trust before clients
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          CI_TRUST_CONTAINER: ${{ job.container.id != '' && '1' || '0' }}
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then ci_python=python; else ci_python=python3; fi
          "$ci_python" -I - <<'PY'
          import hashlib, os, pathlib, subprocess, sys, urllib.request
          url = 'https://raw.githubusercontent.com/corpora-inc/encorpora/086efd078bf7179df466449f194d716916e11305/.github/scripts/ci_trust.py'
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
          with opener.open(url, timeout=30) as response:
              if response.url != url: raise SystemExit('Unexpected CI helper redirect')
              data = response.read(50001)
          if len(data) > 50000 or hashlib.sha256(data).hexdigest() != 'ba1fe4e0b829fdb18dd619751479fbafdd791ecc51b834f3399cb972d8ddf167':
              raise SystemExit('CI helper checksum mismatch')
          mode = os.environ['CI_TRUST_CONTAINER']
          if mode not in ('0', '1'): raise SystemExit('Unclassified CI container context')
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'corpora-ci-trust-bootstrap.py'
          with os.fdopen(os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600), 'wb') as output:
              output.write(data)
          subprocess.run([sys.executable, '-I', str(path), '--source-commit', '086efd078bf7179df466449f194d716916e11305'] + (['--clients-only'] if mode == '1' else []), check=True)
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.22.1"
      - name: Verify exact current-main release and locale allowlist
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          CONFIRMED_IDENTITY: ${{ inputs.identity }}
          CONFIRMED_LOCALES: ${{ inputs.locales }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "source SHA must be a full lowercase commit SHA" >&2
            exit 1
          }
          test "$CONFIRMATION" = PUBLISH_INTERNAL_LISTING
          actual_locales=$(jq -r '[.locales[].id] | join(",")' store/manifest.json)
          test "$actual_locales" = "$CONFIRMED_LOCALES"
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse refs/remotes/origin/main)" = "$SOURCE_SHA"
          actual_identity=$(jq -r '.version + "+" + (.build | tostring)' release.json)
          test "$actual_identity" = "$CONFIRMED_IDENTITY"
          git diff --exit-code -- .
          git diff --cached --exit-code -- .
      - run: npm ci --ignore-scripts
      - name: Verify transaction contracts offline
        run: |
          npm run test:store-listing
          npm run release:verify
      - name: Require complete reviewed media before any credential or network access
        run: npm run store:validate -- --publish
      - name: Phase A has no enabled store writer
        run: |
          echo "store mutation remains disabled until the reviewed screenshot phase adds and tests the provider transaction" >&2
          exit 1
