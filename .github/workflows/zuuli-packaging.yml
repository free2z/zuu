name: ZUULI / packaging smoke

on:
  pull_request:
    paths:
      - wallet/zuuli/**
      - wallet/plugins/tauri-plugin-zcash/**
      - wallet/rust-toolchain.toml
      - scripts/check-rust-toolchain.sh
      - z/zcash/librustzcash
      - .gitmodules
      - .github/workflows/zuuli.yml
      - .github/workflows/zuuli-packaging.yml
      - .github/workflows/zuuli-release.yml
      - .github/workflows/cache-cleanup.yml
      - .github/workflows/zuuli-store-audit.yml
      - .github/workflows/zuuli-store-publish.yml
      - .github/workflows/zuuli-testflight-bootstrap.yml
      - .github/workflows/zuuli-testflight-recovery.yml
      - .github/actions/zuuli-rust-cache/**
  push:
    branches: [main]
    paths:
      - wallet/zuuli/**
      - wallet/plugins/tauri-plugin-zcash/**
      - wallet/rust-toolchain.toml
      - scripts/check-rust-toolchain.sh
      - z/zcash/librustzcash
      - .gitmodules
      - .github/workflows/zuuli.yml
      - .github/workflows/zuuli-packaging.yml
      - .github/workflows/zuuli-release.yml
      - .github/workflows/cache-cleanup.yml
      - .github/workflows/zuuli-store-audit.yml
      - .github/workflows/zuuli-store-publish.yml
      - .github/workflows/zuuli-testflight-bootstrap.yml
      - .github/workflows/zuuli-testflight-recovery.yml
      - .github/actions/zuuli-rust-cache/**
  schedule:
    # A weekly cache-free native build proves that warm dependency artifacts
    # never become the only evidence for a release target.
    - cron: "23 7 * * 1"
  workflow_dispatch:
    inputs:
      cold_rust_cache:
        description: Skip Rust dependency caches and rebuild every native target cold
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: zuuli-package-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CI: true
  ZUULI_NODE_VERSION: "24.18.0"
  # Restates wallet/rust-toolchain.toml because GitHub cannot compute a
  # workflow-level `env:` from a file. scripts/check-rust-toolchain.sh fails
  # the pull request if this ever stops matching the source of truth.
  ZUULI_RUST_VERSION: "1.97.1"
  ZUULI_JAVA_VERSION: "21.0.12"
  ZUULI_XCODE_VERSION: "26.6"
  ZUULI_ANDROID_NDK_VERSION: "27.0.12077973"

jobs:
  contract:
    name: Release identity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: wallet/zuuli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: wallet/zuuli/package-lock.json
      - run: npm ci
      - name: Verify one release identity
        run: npm run release:verify
      - name: Exercise generated iOS normalization
        run: node scripts/normalize-generated-ios-project.mjs --self-test
      - name: Exercise iOS IPA fail-closed verification
        run: bash scripts/verify-ios-ipa.sh --self-test
      - name: Verify release cache security policy
        run: |
          node scripts/verify-ci-cache-policy.mjs --self-test
          node scripts/verify-ci-cache-policy.mjs
      - name: Exercise immutable manifest generation
        run: |
          mkdir release-artifacts
          cp release.json release-artifacts/identity.json
          npm run release:manifest -- \
            --artifacts=release-artifacts \
            --checksums=release-artifacts/CHECKSUMS.sha256 \
            --output=release-artifacts/provenance.json

  android:
    name: Android / unsigned AAB
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: wallet/zuuli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Fetch librustzcash
        run: git submodule update --init z/zcash/librustzcash
        working-directory: .
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: wallet/zuuli/package-lock.json
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21.0.12"
          cache: gradle
      # dtolnay/rust-toolchain's version branches hardcode the compiler in
      # action.yml, so this commit is itself the version pin and the trailing
      # comment is its only readable record. Bumping the toolchain means moving
      # the SHA to the new version branch and updating the comment with it;
      # scripts/check-rust-toolchain.sh fails the pull request otherwise.
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          toolchain: ${{ env.ZUULI_RUST_VERSION }}
          targets: ${{ github.event_name == 'pull_request' && 'aarch64-linux-android' || 'aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android' }}
      - name: Install exact Android SDK components
        run: |
          java -version 2>&1 | grep -F '21.0.12'
          set +e
          yes 2>/dev/null | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;27.0.12077973' >/dev/null
          sdk_status=${PIPESTATUS[1]}
          set -e
          [[ "$sdk_status" -eq 0 ]] || { echo "sdkmanager failed ($sdk_status)" >&2; exit 1; }
          source scripts/android-toolchain-env.sh
          for name in NDK_HOME ANDROID_NDK_HOME \
            CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER \
            CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER \
            CARGO_TARGET_I686_LINUX_ANDROID_LINKER \
            CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER \
            CC_aarch64_linux_android CC_armv7_linux_androideabi \
            CC_i686_linux_android CC_x86_64_linux_android \
            CXX_aarch64_linux_android CXX_armv7_linux_androideabi \
            CXX_i686_linux_android CXX_x86_64_linux_android; do
            echo "$name=${!name}" >> "$GITHUB_ENV"
          done
      - name: Restore credential-free Android Rust dependencies
        if: github.event_name != 'schedule' && github.event.inputs.cold_rust_cache != 'true'
        uses: ./.github/actions/zuuli-rust-cache
        with:
          shared-key: zuuli-release-android-universal-v2-rust-${{ env.ZUULI_RUST_VERSION }}-ndk-${{ env.ZUULI_ANDROID_NDK_VERSION }}-api29-aarch64-armv7-i686-x86_64
          save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: npm ci
      - run: npm run release:verify
      - name: Verify Rust compiler
        run: rustc --version | grep -F "rustc $ZUULI_RUST_VERSION "
      - name: Build unsigned release bundle
        run: |
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            ./node_modules/.bin/tauri android build --ci --aab --target aarch64 -- --locked
          else
            # Main and manual/scheduled canaries compile every ABI shipped to
            # Play so the protected release can restore a complete cache.
            ./node_modules/.bin/tauri android build --ci --aab -- --locked
          fi
      - name: Verify generated Android project remains clean
        # scripts/mobile-release.sh runs exactly this pair after its build, so a
        # stale gen/android tree only surfaced during a protected store upload.
        # Repeating it here fails the pull request that introduces the drift.
        run: |
          node scripts/normalize-generated-android-manifest.mjs
          git diff --exit-code
      - name: Collect package
        run: |
          mkdir release-artifacts
          aab=$(find src-tauri/gen/android/app/build/outputs/bundle -type f -name '*.aab' -print -quit)
          test -n "$aab"
          cp "$aab" release-artifacts/ZUULI-android-unsigned.aab
      - name: Unpack Android AAB for shipped-artifact SBOM
        run: node scripts/artifact-sbom.mjs prepare --artifact=release-artifacts/ZUULI-android-unsigned.aab --root=artifact-sbom-work/android/root
      - uses: anchore/sbom-action@fbfd9c6c189226748411491745178e0c2017392d # v0.20.10
        with:
          syft-version: v1.50.0
          path: wallet/zuuli/artifact-sbom-work/android/root
          config: wallet/zuuli/syft-artifact.yaml
          format: cyclonedx-json
          output-file: wallet/zuuli/artifact-sbom-work/android/syft.raw.sbom.cdx.json
          upload-artifact: false
      - name: Bind Android shipped-artifact SBOM
        run: node scripts/artifact-sbom.mjs finalize-artifact --artifact=release-artifacts/ZUULI-android-unsigned.aab --root=artifact-sbom-work/android/root --raw-sbom=artifact-sbom-work/android/syft.raw.sbom.cdx.json --sbom=release-artifacts/ZUULI-android.artifact.sbom.cdx.json --binding=release-artifacts/ZUULI-android.artifact.sbom-binding.json
      - name: Record checksums and provenance
        run: |
          node scripts/artifact-sbom.mjs verify-artifact --artifact=release-artifacts/ZUULI-android-unsigned.aab --sbom=release-artifacts/ZUULI-android.artifact.sbom.cdx.json --binding=release-artifacts/ZUULI-android.artifact.sbom-binding.json
          npm run release:manifest -- --artifacts=release-artifacts --checksums=release-artifacts/CHECKSUMS.sha256 --output=release-artifacts/provenance.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: zuuli-android-unsigned-${{ github.sha }}
          path: wallet/zuuli/release-artifacts
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS / unsigned target app
    runs-on: macos-26
    timeout-minutes: 90
    defaults:
      run:
        working-directory: wallet/zuuli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Fetch librustzcash
        run: git submodule update --init z/zcash/librustzcash
        working-directory: .
      - name: Select and verify Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.6.app
          xcodebuild -version | grep -Fx 'Xcode 26.6'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: wallet/zuuli/package-lock.json
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          toolchain: ${{ env.ZUULI_RUST_VERSION }}
          targets: aarch64-apple-ios
      - name: Restore credential-free iOS Rust dependencies
        if: github.event_name != 'schedule' && github.event.inputs.cold_rust_cache != 'true'
        uses: ./.github/actions/zuuli-rust-cache
        with:
          shared-key: zuuli-release-ios-device-v2-rust-${{ env.ZUULI_RUST_VERSION }}-xcode-${{ env.ZUULI_XCODE_VERSION }}-ios18-aarch64-device
          save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: npm ci
      - run: npm run release:verify
      - name: Exercise Darwin signing-tool contracts
        run: bash scripts/verify-ios-ipa.sh --self-test-darwin
      - name: Exercise Xcode release formatting normalization
        run: |
          build=$(jq -r .build release.json)
          (cd src-tauri/gen/apple && xcrun agvtool new-version -all "$build")
          node scripts/normalize-generated-ios-project.mjs
          git diff --exit-code
      - name: Verify Rust compiler
        run: rustc --version | grep -F "rustc $ZUULI_RUST_VERSION "
      - name: Build without signing
        # A device archive has the same Rust target as TestFlight. It remains
        # unsigned and this job receives no Apple credentials.
        run: ./node_modules/.bin/tauri ios build --ci --no-sign --target aarch64 -- --locked
      - name: Verify the release archive collection path
        # The protected release resolves the .xcarchive it ships with this exact
        # script. Exercising it on every pull request is what keeps a
        # release-only path from breaking unobserved until a real release.
        run: scripts/resolve-ios-xcarchive.sh
      - name: Verify unsigned iOS bundle structure
        run: |
          apps=()
          while IFS= read -r -d '' app; do apps+=("$app"); done < <(
            find src-tauri/gen/apple/build -type d -name 'ZUULI.app' -print0
          )
          [[ ${#apps[@]} -eq 1 ]] || {
            echo "expected exactly one unsigned iOS app, found ${#apps[@]}" >&2
            exit 1
          }
          scripts/verify-ios-ipa.sh --verify-app-structure "${apps[0]}"
      - name: Verify post-build iOS project reproducibility
        run: |
          node scripts/normalize-generated-ios-project.mjs
          if [[ -n "$(git status --porcelain)" ]]; then
            git status --short
            git diff
            exit 1
          fi
      - name: Collect unsigned package
        run: |
          mkdir release-artifacts
          app=$(find src-tauri/gen/apple/build -type d -name '*.app' -print -quit)
          test -n "$app"
          ditto -c -k --keepParent "$app" release-artifacts/ZUULI-ios-unsigned.zip
      - name: Unpack iOS app ZIP for shipped-artifact SBOM
        run: node scripts/artifact-sbom.mjs prepare --artifact=release-artifacts/ZUULI-ios-unsigned.zip --root=artifact-sbom-work/ios/root
      - uses: anchore/sbom-action@fbfd9c6c189226748411491745178e0c2017392d # v0.20.10
        with:
          syft-version: v1.50.0
          path: wallet/zuuli/artifact-sbom-work/ios/root
          config: wallet/zuuli/syft-artifact.yaml
          format: cyclonedx-json
          output-file: wallet/zuuli/artifact-sbom-work/ios/syft.raw.sbom.cdx.json
          upload-artifact: false
      - name: Bind iOS shipped-artifact SBOM
        run: node scripts/artifact-sbom.mjs finalize-artifact --artifact=release-artifacts/ZUULI-ios-unsigned.zip --root=artifact-sbom-work/ios/root --raw-sbom=artifact-sbom-work/ios/syft.raw.sbom.cdx.json --sbom=release-artifacts/ZUULI-ios.artifact.sbom.cdx.json --binding=release-artifacts/ZUULI-ios.artifact.sbom-binding.json
      - name: Record checksums and provenance
        run: |
          node scripts/artifact-sbom.mjs verify-artifact --artifact=release-artifacts/ZUULI-ios-unsigned.zip --sbom=release-artifacts/ZUULI-ios.artifact.sbom.cdx.json --binding=release-artifacts/ZUULI-ios.artifact.sbom-binding.json
          npm run release:manifest -- --artifacts=release-artifacts --checksums=release-artifacts/CHECKSUMS.sha256 --output=release-artifacts/provenance.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: zuuli-ios-unsigned-${{ github.sha }}
          path: wallet/zuuli/release-artifacts
          if-no-files-found: error
          retention-days: 14

  desktop:
    name: Desktop / ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux packages
            os: ubuntu-24.04
            bundles: appimage,deb,rpm
            container: ghcr.io/free2z/zuuli-linux-ci@sha256:e94d8795fd3c3265caec0f5fc2fa814391e22d2d6e574649a75e686e6e967406
          - name: macOS universal app
            os: macos-26
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ matrix.container }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        working-directory: wallet/zuuli
        shell: bash
    steps:
      - name: Verify pinned Linux build image
        if: runner.os == 'Linux'
        working-directory: /
        run: |
          set -euo pipefail
          /usr/local/bin/verify-zuuli-linux-image
          test -n "$BASH_VERSION"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Configure exact Git workspace trust
        if: runner.os == 'Linux'
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Fetch librustzcash
        run: git submodule update --init z/zcash/librustzcash
        working-directory: .
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: wallet/zuuli/package-lock.json
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          toolchain: ${{ env.ZUULI_RUST_VERSION }}
      - name: Install macOS universal Rust targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Select and verify Xcode
        if: runner.os == 'macOS'
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.6.app
          xcodebuild -version | grep -Fx 'Xcode 26.6'
      - name: Restore credential-free Linux Rust dependencies
        if: runner.os == 'Linux' && github.event_name != 'schedule' && github.event.inputs.cold_rust_cache != 'true'
        uses: ./.github/actions/zuuli-rust-cache
        with:
          shared-key: zuuli-release-linux-v2-rust-${{ env.ZUULI_RUST_VERSION }}-ubuntu-24.04-gtk-webkit-4.1
          save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Restore credential-free macOS Rust dependencies
        if: runner.os == 'macOS' && github.event_name != 'schedule' && github.event.inputs.cold_rust_cache != 'true'
        uses: ./.github/actions/zuuli-rust-cache
        with:
          shared-key: zuuli-release-macos-universal-v2-rust-${{ env.ZUULI_RUST_VERSION }}-xcode-${{ env.ZUULI_XCODE_VERSION }}-macos-arm64-x86_64
          save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Install pinned Cargo audit instrumentation
        if: runner.os == 'Linux'
        run: |
          scripts/install-cargo-auditable.sh
      - run: npm ci
      - name: Verify macOS capture authority source policy
        if: runner.os == 'macOS'
        run: node scripts/macos-keychain-entitlements.mjs
      - name: Test Linux artifact inspectors against real packages
        if: runner.os == 'Linux'
        run: node scripts/run-linux-artifact-fixtures.mjs
      - run: npm run release:verify
      - name: Verify Rust compiler
        run: rustc --version | grep -F "rustc $ZUULI_RUST_VERSION "
      - name: Build packages
        run: |
          if [[ "${{ runner.os }}" == macOS ]]; then
            ./node_modules/.bin/tauri build --target universal-apple-darwin --bundles '${{ matrix.bundles }}' -- --locked
          else
            scripts/run-with-cargo-auditable.sh ./node_modules/.bin/tauri build --bundles '${{ matrix.bundles }}' -- --locked --features custom-protocol
          fi
      - name: Verify generated projects remain clean
        run: git diff --exit-code
        working-directory: .
      - name: Collect packages
        run: |
          mkdir release-artifacts
          find src-tauri/target -path '*/release/bundle/*' -type f \
            \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.dmg' \) \
            -exec cp {} release-artifacts/ \;
          if [[ "${{ runner.os }}" == macOS ]]; then
            app=$(find src-tauri/target -path '*/release/bundle/macos/*.app' -type d -print -quit)
            test -n "$app"
            plutil -lint "$app/Contents/Info.plist"
            test "$(plutil -extract NSCameraUsageDescription raw -expect string -o - -- "$app/Contents/Info.plist")" = 'ZUULI uses the camera when you broadcast or join a live video stream.'
            test "$(plutil -extract NSMicrophoneUsageDescription raw -expect string -o - -- "$app/Contents/Info.plist")" = 'ZUULI uses the microphone when you broadcast or join a live stream.'
            ditto -c -k --keepParent "$app" release-artifacts/ZUULI-macos-universal-unsigned.zip
          fi
          if [[ "${{ runner.os }}" == Linux ]]; then
            for extension in AppImage deb rpm; do
              test -n "$(find release-artifacts -type f -name "*.$extension" -size +0c -print -quit)"
            done
          else
            test -n "$(find release-artifacts -type f -print -quit)"
          fi
      - name: Prepare Linux shipped-artifact inventories
        if: runner.os == 'Linux'
        run: |
          appimages=(release-artifacts/*.AppImage)
          debs=(release-artifacts/*.deb)
          rpms=(release-artifacts/*.rpm)
          [[ ${#appimages[@]} -eq 1 && -f "${appimages[0]}" ]] || { echo "expected exactly one Linux AppImage" >&2; exit 1; }
          [[ ${#debs[@]} -eq 1 && -f "${debs[0]}" ]] || { echo "expected exactly one Linux deb" >&2; exit 1; }
          [[ ${#rpms[@]} -eq 1 && -f "${rpms[0]}" ]] || { echo "expected exactly one Linux rpm" >&2; exit 1; }
          node scripts/artifact-sbom.mjs prepare --artifact="${appimages[0]}" --root=artifact-sbom-work/linux-appimage/root
          node scripts/artifact-sbom.mjs prepare --artifact="${debs[0]}" --root=artifact-sbom-work/linux-deb/root
          node scripts/artifact-sbom.mjs prepare --artifact="${rpms[0]}" --root=artifact-sbom-work/linux-rpm/root
      - name: Scan Linux AppImage shipped artifact
        if: runner.os == 'Linux'
        uses: anchore/sbom-action@fbfd9c6c189226748411491745178e0c2017392d # v0.20.10
        with:
          syft-version: v1.50.0
          path: wallet/zuuli/artifact-sbom-work/linux-appimage/root
          config: wallet/zuuli/syft-artifact.yaml
          format: cyclonedx-json
          output-file: wallet/zuuli/artifact-sbom-work/linux-appimage/syft.raw.sbom.cdx.json
          upload-artifact: false
      - name: Scan Linux deb shipped artifact
        if: runner.os == 'Linux'
        uses: anchore/sbom-action@fbfd9c6c189226748411491745178e0c2017392d # v0.20.10
        with:
          syft-version: v1.50.0
          path: wallet/zuuli/artifact-sbom-work/linux-deb/root
          config: wallet/zuuli/syft-artifact.yaml
          format: cyclonedx-json
          output-file: wallet/zuuli/artifact-sbom-work/linux-deb/syft.raw.sbom.cdx.json
          upload-artifact: false
      - name: Scan Linux rpm shipped artifact
        if: runner.os == 'Linux'
        uses: anchore/sbom-action@fbfd9c6c189226748411491745178e0c2017392d # v0.20.10
        with:
          syft-version: v1.50.0
          path: wallet/zuuli/artifact-sbom-work/linux-rpm/root
          config: wallet/zuuli/syft-artifact.yaml
          format: cyclonedx-json
          output-file: wallet/zuuli/artifact-sbom-work/linux-rpm/syft.raw.sbom.cdx.json
          upload-artifact: false
      - name: Bind Linux shipped-artifact SBOMs
        if: runner.os == 'Linux'
        run: |
          appimages=(release-artifacts/*.AppImage)
          debs=(release-artifacts/*.deb)
          rpms=(release-artifacts/*.rpm)
          node scripts/artifact-sbom.mjs finalize-artifact --artifact="${appimages[0]}" --root=artifact-sbom-work/linux-appimage/root --raw-sbom=artifact-sbom-work/linux-appimage/syft.raw.sbom.cdx.json --sbom=release-artifacts/ZUULI-linux-appimage.artifact.sbom.cdx.json --binding=release-artifacts/ZUULI-linux-appimage.artifact.sbom-binding.json --cargo-lock=src-tauri/Cargo.lock --cargo-manifest=src-tauri/Cargo.toml --cargo-target=x86_64-unknown-linux-gnu --cargo-features=custom-protocol
          node scripts/artifact-sbom.mjs finalize-artifact --artifact="${debs[0]}" --root=artifact-sbom-work/linux-deb/root --raw-sbom=artifact-sbom-work/linux-deb/syft.raw.sbom.cdx.json --sbom=release-artifacts/ZUULI-linux-deb.artifact.sbom.cdx.json --binding=release-artifacts/ZUULI-linux-deb.artifact.sbom-binding.json --cargo-lock=src-tauri/Cargo.lock --cargo-manifest=src-tauri/Cargo.toml --cargo-target=x86_64-unknown-linux-gnu --cargo-features=custom-protocol
          node scripts/artifact-sbom.mjs finalize-artifact --artifact="${rpms[0]}" --root=artifact-sbom-work/linux-rpm/root --raw-sbom=artifact-sbom-work/linux-rpm/syft.raw.sbom.cdx.json --sbom=release-artifacts/ZUULI-linux-rpm.artifact.sbom.cdx.json --binding=release-artifacts/ZUULI-linux-rpm.artifact.sbom-binding.json --cargo-lock=src-tauri/Cargo.lock --cargo-manifest=src-tauri/Cargo.toml --cargo-target=x86_64-unknown-linux-gnu --cargo-features=custom-protocol
      - name: Prepare macOS shipped-artifact inventories
        if: runner.os == 'macOS'
        run: |
          dmgs=(release-artifacts/*.dmg)
          zips=(release-artifacts/*-macos-universal-unsigned.zip)
          [[ ${#dmgs[@]} -eq 1 && -f "${dmgs[0]}" ]] || { echo "expected exactly one macOS DMG" >&2; exit 1; }
          [[ ${#zips[@]} -eq 1 && -f "${zips[0]}" ]] || { echo "expected exactly one macOS app ZIP" >&2; exit 1; }
          node scripts/artifact-sbom.mjs prepare --artifact="${dmgs[0]}" --root=artifact-sbom-work/macos-dmg/root
          node scripts/artifact-sbom.mjs prepare --artifact="${zips[0]}" --root=artifact-sbom-work/macos-zip/root
      - name: Scan macOS DMG shipped artifact
        if: runner.os == 'macOS'
        uses: anchore/sbom-action@fbfd9c6c189226748411491745178e0c2017392d # v0.20.10
        with:
          syft-version: v1.50.0
          path: wallet/zuuli/artifact-sbom-work/macos-dmg/root
          config: wallet/zuuli/syft-artifact.yaml
          format: cyclonedx-json
          output-file: wallet/zuuli/artifact-sbom-work/macos-dmg/syft.raw.sbom.cdx.json
          upload-artifact: false
      - name: Scan macOS app ZIP shipped artifact
        if: runner.os == 'macOS'
        uses: anchore/sbom-action@fbfd9c6c189226748411491745178e0c2017392d # v0.20.10
        with:
          syft-version: v1.50.0
          path: wallet/zuuli/artifact-sbom-work/macos-zip/root
          config: wallet/zuuli/syft-artifact.yaml
          format: cyclonedx-json
          output-file: wallet/zuuli/artifact-sbom-work/macos-zip/syft.raw.sbom.cdx.json
          upload-artifact: false
      - name: Bind macOS shipped-artifact SBOMs
        if: runner.os == 'macOS'
        run: |
          dmgs=(release-artifacts/*.dmg)
          zips=(release-artifacts/*-macos-universal-unsigned.zip)
          node scripts/artifact-sbom.mjs finalize-artifact --artifact="${dmgs[0]}" --root=artifact-sbom-work/macos-dmg/root --raw-sbom=artifact-sbom-work/macos-dmg/syft.raw.sbom.cdx.json --sbom=release-artifacts/ZUULI-macos-dmg.artifact.sbom.cdx.json --binding=release-artifacts/ZUULI-macos-dmg.artifact.sbom-binding.json
          node scripts/artifact-sbom.mjs finalize-artifact --artifact="${zips[0]}" --root=artifact-sbom-work/macos-zip/root --raw-sbom=artifact-sbom-work/macos-zip/syft.raw.sbom.cdx.json --sbom=release-artifacts/ZUULI-macos-zip.artifact.sbom.cdx.json --binding=release-artifacts/ZUULI-macos-zip.artifact.sbom-binding.json
      - name: Prepare explicitly labeled source inventory
        run: mkdir -p artifact-sbom-work
      - uses: anchore/sbom-action@fbfd9c6c189226748411491745178e0c2017392d # v0.20.10
        with:
          syft-version: v1.50.0
          path: wallet/zuuli
          config: wallet/zuuli/syft.yaml
          format: cyclonedx-json
          output-file: wallet/zuuli/artifact-sbom-work/ZUULI-desktop.source.raw.sbom.cdx.json
          upload-artifact: false
      - name: Label desktop SBOM as source inventory
        run: node scripts/artifact-sbom.mjs label-source --raw-sbom=artifact-sbom-work/ZUULI-desktop.source.raw.sbom.cdx.json --sbom=release-artifacts/ZUULI-desktop.source.sbom.cdx.json --source-root=wallet/zuuli
      - name: Record checksums and provenance
        run: |
          if [[ "${{ runner.os }}" == Linux ]]; then
            appimages=(release-artifacts/*.AppImage)
            debs=(release-artifacts/*.deb)
            rpms=(release-artifacts/*.rpm)
            node scripts/artifact-sbom.mjs verify-artifact --artifact="${appimages[0]}" --sbom=release-artifacts/ZUULI-linux-appimage.artifact.sbom.cdx.json --binding=release-artifacts/ZUULI-linux-appimage.artifact.sbom-binding.json --cargo-lock=src-tauri/Cargo.lock --cargo-manifest=src-tauri/Cargo.toml --cargo-target=x86_64-unknown-linux-gnu --cargo-features=custom-protocol
            node scripts/artifact-sbom.mjs verify-artifact --artifact="${debs[0]}" --sbom=release-artifacts/ZUULI-linux-deb.artifact.sbom.cdx.json --binding=release-artifacts/ZUULI-linux-deb.artifact.sbom-binding.json --cargo-lock=src-tauri/Cargo.lock --cargo-manifest=src-tauri/Cargo.toml --cargo-target=x86_64-unknown-linux-gnu --cargo-features=custom-protocol
            node scripts/artifact-sbom.mjs verify-artifact --artifact="${rpms[0]}" --sbom=release-artifacts/ZUULI-linux-rpm.artifact.sbom.cdx.json --binding=release-artifacts/ZUULI-linux-rpm.artifact.sbom-binding.json --cargo-lock=src-tauri/Cargo.lock --cargo-manifest=src-tauri/Cargo.toml --cargo-target=x86_64-unknown-linux-gnu --cargo-features=custom-protocol
          else
            dmgs=(release-artifacts/*.dmg)
            zips=(release-artifacts/*-macos-universal-unsigned.zip)
            node scripts/artifact-sbom.mjs verify-artifact --artifact="${dmgs[0]}" --sbom=release-artifacts/ZUULI-macos-dmg.artifact.sbom.cdx.json --binding=release-artifacts/ZUULI-macos-dmg.artifact.sbom-binding.json
            node scripts/artifact-sbom.mjs verify-artifact --artifact="${zips[0]}" --sbom=release-artifacts/ZUULI-macos-zip.artifact.sbom.cdx.json --binding=release-artifacts/ZUULI-macos-zip.artifact.sbom-binding.json
          fi
          jq -e '(.metadata.properties // [] | any(.name == "free2z:inventory-scope" and .value == "source-tree")) and ((.components // []) | length >= 50)' release-artifacts/ZUULI-desktop.source.sbom.cdx.json
          npm run release:manifest -- --artifacts=release-artifacts --checksums=release-artifacts/CHECKSUMS.sha256 --output=release-artifacts/provenance.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: zuuli-${{ runner.os }}-unsigned-${{ github.sha }}
          path: wallet/zuuli/release-artifacts
          if-no-files-found: error
          retention-days: 14
