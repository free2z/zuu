      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # reviewed immutable repository pin
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ts/svelte/free2z/package-lock.json
      - run: npm ci
      - name: Regenerate the API client from the committed f2z.yaml
        run: |
          set -euo pipefail
          for dir in src/lib/api/*/; do
            tag="$(basename "$dir")"
            rm -f "$dir$tag.ts"
          done
          rm -f src/lib/api/f2z.schemas.ts
          npm run generate:api
      - name: Fail if the committed client differs from the regenerated one
        run: |
          set -euo pipefail
          # Include newly generated untracked files in the drift check.
          drift="$(git status --porcelain -- src/lib/api)"
          if [ -n "$drift" ]; then
            echo "$drift"
            git --no-pager diff -- src/lib/api
            echo "::error file=ts/svelte/free2z/src/lib/api::The generated API client does not match f2z.yaml. Run 'npm run generate:api' in ts/svelte/free2z and commit the result. If you changed the API, regenerate f2z.yaml first (./scripts/free2z/gen-openapi.sh)."
            exit 1
          fi
          echo "Generated API client matches f2z.yaml."
