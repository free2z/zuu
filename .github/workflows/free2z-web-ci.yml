      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # reviewed immutable repository pin
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            ts/svelte/free2z/package-lock.json
      - run: npm ci
      - name: Install Playwright Chromium headless shell
        run: |
          sudo "$GITHUB_WORKSPACE/scripts/free2z/install-ubuntu-ci-packages.sh" --playwright-deps "$(command -v node)" "$PWD/node_modules/playwright/cli.js"
          npx playwright install --only-shell chromium
      - name: Verify browser shard test coverage
        if: matrix.shard == 1
        run: |
          bash "$GITHUB_WORKSPACE/scripts/free2z/test-ci-browser-shard.sh"
          node "$GITHUB_WORKSPACE/scripts/free2z/test-check-ci-browser-test-lists.mjs"
          node "$GITHUB_WORKSPACE/scripts/free2z/check-ci-browser-test-lists.mjs" .
      - name: Run rendered UI regressions (shard ${{ matrix.shard }})
        run: '"$GITHUB_WORKSPACE/scripts/free2z/ci-browser-shard.sh"'
        env:
          BROWSER_SHARD: ${{ matrix.shard }}
      - name: Upload browser test diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # reviewed immutable repository pin
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            ts/svelte/free2z/playwright-report/
            ts/svelte/free2z/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload first-attempt browser diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # reviewed immutable repository pin
        with:
          name: playwright-first-failures-shard-${{ matrix.shard }}
          path: ts/svelte/free2z/test-results/first-failures/
          if-no-files-found: ignore
          retention-days: 7
