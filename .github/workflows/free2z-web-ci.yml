          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # reviewed immutable repository pin
        with:
          persist-credentials: false
      - name: Use Node 20 for deployed docs
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # reviewed immutable repository pin
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            docs/about-free2z/package-lock.json
            docs/free2z/website/package-lock.json
      - name: Install Docusaurus dependencies
        run: npm ci
        working-directory: docs/about-free2z
      - name: Build Docusaurus docs
        run: npm run build
        working-directory: docs/about-free2z
      - name: Check generated Terms artifact
        working-directory: docs/about-free2z
        run: node "$GITHUB_WORKSPACE/scripts/free2z/check-terms-artifact.mjs"
      - name: Check plain legal pages
        working-directory: docs/about-free2z
        run: |
          node --test src/legal-plain/remark-legal-links.test.js
          node scripts/check-legal-plain.mjs --self-test
          node scripts/check-legal-plain.mjs docsbuild
      - name: Install VitePress dependencies
        run: npm ci
        working-directory: docs/free2z/website
      - name: Build VitePress docs
