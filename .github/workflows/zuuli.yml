name: wallet/zuuli

# Stable, full-stack required check for ZUULI. The workflow runs for every PR
# and merge-group event so branch protection always receives `gate`; expensive
# jobs skip only after the checked-out diff proves that no release-impacting
# ZUULI surface changed.

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR updates supersede older runs; post-merge/manual runs use run_id and are
  # never cancelled merely because another main build started.
  group: zuuli-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      zuuli: ${{ steps.filter.outputs.zuuli }}
      zuuallet_schema: ${{ steps.filter.outputs.zuuallet_schema }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Diff locally instead of relying on the pull-request files API.
          fetch-depth: 0

      # This runs before change detection on every event. A workflow cannot
      # replace its own judge with a mutable external action, or mark a job the
      # required gate awaits as best-effort, then skip the full application
      # suite as an allegedly unrelated change.
      - name: Verify immutable actions and fail-closed required jobs
        run: |
          node scripts/check-github-actions-pins.mjs --self-test
          node scripts/check-github-actions-pins.mjs

      # Runs on every event, including changes this job would otherwise skip,
      # because a toolchain pin can drift from any workflow or manifest. The
      # self-test proves the check can still fail before its verdict is trusted.
      - name: Verify the Rust toolchain pin has not drifted
        run: |
          scripts/check-rust-toolchain.sh --self-test
          scripts/check-rust-toolchain.sh

      # Public-repository boundaries should be mechanically enforced rather
      # than depending on every contributor remembering private repo names.
      - name: Reject references to the private backend repository
        run: |
          scripts/check-public-repo-boundary.sh --self-test
          scripts/check-public-repo-boundary.sh

      # This policy checker owns the schema job's pinned build image, selector
      # coverage, and attachment to the required gate. Run both its mutation
      # controls and current-tree verdict in the always-required job so those
      # guarantees cannot regress behind an advisory workflow.
      - name: Verify the required schema build policy
        run: |
          node scripts/check-zuuli-linux-image.mjs --self-test
          node scripts/check-zuuli-linux-image.mjs

      - name: Verify the required 32-bit Android type-check policy
        run: |
          node scripts/check-zuuli-android-gate.mjs --self-test
          node scripts/check-zuuli-android-gate.mjs

      - name: Verify the required Rust/WASM build boundary
        run: |
          node wallet/zuuli/scripts/wasm-boundary.mjs --self-test
          node wallet/zuuli/scripts/wasm-boundary.mjs

      - name: Verify Zcash command and permission parity
        run: |
          node scripts/check-zcash-permissions.mjs --self-test
          node scripts/check-zcash-permissions.mjs

      - name: Detect release-impacting ZUULI changes
        id: filter
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          set -euo pipefail

          # Manual runs, first pushes, and incomplete event payloads fail open
          # into the full test suite, never into an unverified skip.
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] ||
             ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "::notice::No usable base commit; running the full ZUULI gate."
            echo "zuuli=true" >> "$GITHUB_OUTPUT"
            echo "zuuallet_schema=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! changed_files=$(git diff --name-only --no-renames "$BASE_SHA" "$GITHUB_SHA"); then
            echo "::warning::Diff failed; running the full ZUULI gate."
            echo "zuuli=true" >> "$GITHUB_OUTPUT"
            echo "zuuallet_schema=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          zuuli=false
          zuuallet_schema=false
          while IFS= read -r file; do
            case "$file" in
              Cargo.toml|Cargo.lock|.cargo/*|clippy.toml|.clippy.toml|wallet/Cargo.toml|wallet/Cargo.lock|wallet/.cargo/*|wallet/clippy.toml|wallet/.clippy.toml|wallet/*.rs|wallet/*/Cargo.toml|wallet/*/Cargo.lock|wallet/*/.cargo/*|wallet/*/clippy.toml|wallet/*/.clippy.toml|wallet/zuuli/*|wallet/plugins/*|wallet/zuuallet/src/hooks/useWallet.ts|wallet/zuuallet/src/lib/mnemonic.ts|wallet/zuuallet/src/lib/sensitive-seed-session.ts|wallet/zuuallet/src/lib/sensitive-seed.ts|wallet/zuuallet/src/lib/tauri.ts|wallet/zuuallet/src/pages/CreateWallet.tsx|wallet/zuuallet/src/pages/RestoreWallet.tsx|wallet/zuuallet/src/pages/Settings.tsx|wallet/zuuallet/src/pages/Welcome.tsx|wallet/zuuallet/src/types/index.ts|wallet/rust-toolchain.toml|wallet/deny.toml|scripts/check-github-actions-pins.mjs|scripts/check-rust-toolchain.sh|scripts/check-rust-fmt.sh|scripts/check-rust-deny.sh|scripts/check-rust-clippy.sh|scripts/check-zcash-permissions.mjs|scripts/check-zuuli-linux-image.mjs|scripts/check-zuuli-android-gate.mjs|z/zcash/librustzcash|.gitmodules|.github/containers/zuuli-linux/*|.github/workflows/zuuli.yml|.github/workflows/zuuli-linux-image.yml|.github/workflows/zuuli-packaging.yml|.github/workflows/zuuli-release.yml|.github/workflows/zuuli-store-audit.yml|.github/workflows/zuuli-store-publish.yml|.github/workflows/zuuli-testflight-bootstrap.yml|.github/workflows/zuuli-testflight-recovery.yml|.github/workflows/cache-cleanup.yml|.github/actions/zuuli-rust-cache/*|docs/ZUULI-LINUX-BUILD-IMAGE.md)
                zuuli=true
                ;;
            esac
            case "$file" in
              Cargo.toml|Cargo.lock|.cargo/*|clippy.toml|.clippy.toml|wallet/Cargo.toml|wallet/Cargo.lock|wallet/.cargo/*|wallet/clippy.toml|wallet/.clippy.toml|wallet/*.rs|wallet/*/Cargo.toml|wallet/*/Cargo.lock|wallet/*/.cargo/*|wallet/*/clippy.toml|wallet/*/.clippy.toml|wallet/zuuallet/src-tauri/*|wallet/plugins/*|wallet/rust-toolchain.toml|scripts/check-rust-toolchain.sh|scripts/check-rust-clippy.sh|scripts/check-zcash-permissions.mjs|scripts/check-zuuli-linux-image.mjs|z/zcash/librustzcash|.gitmodules|.github/containers/zuuli-linux/*|.github/workflows/zuuli.yml|.github/workflows/zuuli-linux-image.yml|.github/actions/zuuli-rust-cache/*)
                zuuallet_schema=true
                ;;
            esac
          done <<< "$changed_files"

          echo "zuuli=$zuuli" >> "$GITHUB_OUTPUT"
          echo "zuuallet_schema=$zuuallet_schema" >> "$GITHUB_OUTPUT"

  frontend:
    needs: changes
    if: needs.changes.outputs.zuuli == 'true'
    runs-on: ubuntu-latest
    # Retain bounded time for the mandatory viewport suite and production build,
    # including occasional hosted-runner provisioning delays.
    timeout-minutes: 35
    defaults:
      run:
        working-directory: wallet/zuuli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: wallet/zuuli/package-lock.json

      - name: Resolve the pinned frontend Rust toolchain
        id: frontend_rust_toolchain
        run: |
          set -euo pipefail
          version=$(../../scripts/check-rust-toolchain.sh --print-channel)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install the pinned Rust/WASM compiler
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ steps.frontend_rust_toolchain.outputs.version }}
          targets: wasm32-unknown-unknown

      - name: Install locked dependencies
        run: npm ci

      - name: Verify release cache security policy
        run: |
          node scripts/verify-ci-cache-policy.mjs --self-test
          node scripts/verify-ci-cache-policy.mjs

      - name: Verify generated app and store icons
        run: npm run icons:check

      - name: Test store listing contract and read-only audit
        run: npm run test:store-listing
      - name: Validate canonical store manifest and media
        run: npm run store:validate

      - name: Test App Store Connect state machine
        run: npm run test:asc-testflight

      # The current lockfile has moderate advisories but no high/critical ones.
      # Dependency upgrades belong in focused PRs; this gate prevents severity
      # from regressing while making the existing baseline explicit.
      - name: Audit dependencies (high and critical)
        run: |
          for attempt in 1 2 3; do
            npm audit --audit-level=high && exit 0
            [ "$attempt" -eq 3 ] && exit 1
            sleep $((attempt * 5))
          done

      - name: Typecheck
        run: npm run typecheck

      # GitHub's Ubuntu runner image includes stable Google Chrome. Using it in
      # CI avoids an apt-mirror dependency while preserving real browser tests.
      - name: Verify the viewport-test browser
        run: google-chrome --version

      - name: Test frontend contracts
        run: npm run test

      - name: Build production frontend
        run: npm run build

  # Formatting is its own job rather than a step on rust_plugin/rust_app, which
  # are 45-minute builds. `cargo fmt` reads manifests with
  # `cargo metadata --no-deps`, so it resolves no dependency graph and compiles
  # nothing: no submodule fetch, no Tauri system packages, no Cargo cache. The
  # verdict lands in about a minute instead of behind a cold Zcash build, and a
  # formatting failure no longer costs a full rebuild to re-check.
  #
  # It covers every crate under wallet/, including wallet/zuuallet/src-tauri,
  # which this workflow's change filter does not select on its own; a
  # Zuuallet-only pull request is covered by the matching job in zuuallet.yml.
  rust_fmt:
    name: Rust / formatting
    needs: changes
    if: needs.changes.outputs.zuuli == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve the pinned Rust toolchain
        id: rust_toolchain
        run: |
          set -euo pipefail
          version=$(scripts/check-rust-toolchain.sh --print-channel)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # rustfmt is not in the minimal profile this action installs, and its
      # output differs between compiler versions — the pinned toolchain is what
      # makes the verdict reproducible, so the check refuses to run on any other.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ steps.rust_toolchain.outputs.version }}
          components: rustfmt

      - name: Check formatting of every Rust crate under wallet/
        run: scripts/check-rust-fmt.sh

  # Supply chain: RustSec advisories, licences, and crate sources for all three
  # wallet lockfiles. Like rust_fmt this compiles nothing — cargo-deny works
  # from `cargo metadata` and the lockfiles — but unlike rust_fmt it does need
  # the dependency graph resolved, so the librustzcash submodule is fetched.
  # Still a couple of minutes rather than 45.
  rust_deny:
    name: Rust / supply chain
    needs: changes
    if: needs.changes.outputs.zuuli == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # cargo-deny resolves the whole graph, and the wallet crates reach the
      # Zcash crates by path into this submodule.
      - name: Fetch librustzcash submodule
        run: git submodule update --init z/zcash/librustzcash

      - name: Resolve the pinned Rust toolchain
        id: rust_toolchain
        run: |
          set -euo pipefail
          version=$(scripts/check-rust-toolchain.sh --print-channel)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # cargo-deny shells out to `cargo metadata`, so a toolchain is required
      # even though nothing is compiled.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ steps.rust_toolchain.outputs.version }}

      # The script fetches a checksum-verified cargo-deny release binary itself;
      # the version and digests are pinned in the script. Deliberately not a
      # third-party installer action — the tool that polices our supply chain
      # should not arrive through an unpinned one.
      - name: Check advisories, licences and sources
        run: scripts/check-rust-deny.sh

  # Lints, at `-D warnings`, for every crate under wallet/. Unlike rust_fmt and
  # rust_deny this one genuinely compiles — clippy is a rustc driver and needs
  # the whole dependency graph — so it carries the submodule, the Tauri system
  # libraries and a cache of its own. It is still cheaper than rust_plugin and
  # rust_app because it only checks: no codegen, no linking.
  #
  # Its cache is separate from theirs on purpose. Clippy writes different
  # artifacts into the same target directory names, so sharing a key would make
  # the two kinds of job evict each other's work on every run.
  #
  # Like rust_fmt it covers wallet/zuuallet/src-tauri, which this workflow's
  # change filter does not select on its own; the matching job in zuuallet.yml
  # covers a Zuuallet-only pull request.
  rust_clippy:
    name: Rust / lints
    needs: changes
    if: needs.changes.outputs.zuuli == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/free2z/zuuli-linux-ci@sha256:e94d8795fd3c3265caec0f5fc2fa814391e22d2d6e574649a75e686e6e967406
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Verify pinned Linux build image
        working-directory: /
        run: |
          set -euo pipefail
          /usr/local/bin/verify-zuuli-linux-image
          test -n "$BASH_VERSION"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure exact Git workspace trust
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Fetch librustzcash submodule
        run: git submodule update --init z/zcash/librustzcash

      - name: Resolve the pinned Rust toolchain
        id: rust_toolchain
        run: |
          set -euo pipefail
          version=$(scripts/check-rust-toolchain.sh --print-channel)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # clippy is not in the minimal profile this action installs, and its lint
      # set differs between compiler versions — the pinned toolchain is what
      # makes the verdict reproducible, so the check refuses to run on any other.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ steps.rust_toolchain.outputs.version }}
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            wallet/plugins/tauri-plugin-zcash
            wallet/zuuli/src-tauri
            wallet/zuuallet/src-tauri
          key: zuuli-clippy

      - name: Lint every Rust crate under wallet/ at -D warnings
        run: scripts/check-rust-clippy.sh

  # Linux cannot compile the target-specific Keychain, Credential Manager,
  # filesystem, and OAuth branches. Run the same all-wallet clippy verdict on
  # both native hosts and make it a dependency of the protected `gate`. The
  # negative control also asserts Cargo selected the matrix target OS, so an
  # inherited CARGO_BUILD_TARGET cannot silently turn both lanes into Linux.
  rust_native_clippy:
    name: Rust / native lints (${{ matrix.target_os }})
    needs: changes
    if: needs.changes.outputs.zuuli == 'true' || needs.changes.outputs.zuuallet_schema == 'true'
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target_os: macos
          - os: windows-latest
            target_os: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch librustzcash submodule
        run: git submodule update --init z/zcash/librustzcash

      - name: Resolve the pinned Rust toolchain
        id: rust_toolchain
        shell: bash
        run: |
          set -euo pipefail
          version=$(scripts/check-rust-toolchain.sh --print-channel)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ steps.rust_toolchain.outputs.version }}
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            wallet/plugins/tauri-plugin-zcash
            wallet/zuuli/src-tauri
            wallet/zuuallet/src-tauri
          key: zuuli-native-clippy-${{ matrix.target_os }}

      - name: Prove native target selection and -D warnings
        shell: bash
        run: scripts/check-rust-clippy.sh --self-test "${{ matrix.target_os }}"

      - name: Lint every Rust crate under wallet/ at -D warnings
        shell: bash
        run: scripts/check-rust-clippy.sh

  rust_plugin:
    name: Rust / shared plugin
    needs: changes
    if: needs.changes.outputs.zuuli == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/free2z/zuuli-linux-ci@sha256:e94d8795fd3c3265caec0f5fc2fa814391e22d2d6e574649a75e686e6e967406
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Verify pinned Linux build image
        working-directory: /
        run: |
          set -euo pipefail
          /usr/local/bin/verify-zuuli-linux-image
          test -n "$BASH_VERSION"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure exact Git workspace trust
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Fetch only the in-source dependency required by the app/plugin graph.
      - name: Fetch librustzcash submodule
        run: git submodule update --init z/zcash/librustzcash

      # Keep CI explicit as well as repository-pinned so runner state cannot
      # silently select a newer compiler. The version is read from
      # wallet/rust-toolchain.toml rather than restated here.
      - name: Resolve the pinned Rust toolchain
        id: rust_toolchain
        run: |
          set -euo pipefail
          version=$(scripts/check-rust-toolchain.sh --print-channel)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ steps.rust_toolchain.outputs.version }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: wallet/plugins/tauri-plugin-zcash
          key: zuuli-plugin

      - name: Build and test shared Zcash plugin
        run: cargo test --locked --all-targets --manifest-path wallet/plugins/tauri-plugin-zcash/Cargo.toml

  # PR packaging builds only arm64 Android. Keep one cheap 32-bit type-check in
  # the required gate because libc's Android ABI types can differ on armv7; the
  # exact class escaped arm64 CI and broke build 7 only in the release lane.
  rust_android_32:
    name: Rust / Android 32-bit
    needs: changes
    if: needs.changes.outputs.zuuli == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch librustzcash submodule
        run: git submodule update --init z/zcash/librustzcash

      - name: Resolve the pinned Rust toolchain
        id: rust_toolchain
        run: |
          set -euo pipefail
          version=$(scripts/check-rust-toolchain.sh --print-channel)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install the pinned 32-bit Android Rust target
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ steps.rust_toolchain.outputs.version }}
          targets: armv7-linux-androideabi

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21.0.12'

      - name: Install the pinned Android NDK
        run: |
          set -euo pipefail
          set +e
          yes 2>/dev/null | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'ndk;27.0.12077973' >/dev/null
          sdk_status=${PIPESTATUS[1]}
          set -e
          [[ "$sdk_status" -eq 0 ]] || { echo "sdkmanager failed ($sdk_status)" >&2; exit 1; }

      - name: Restore the 32-bit Android Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: wallet/plugins/tauri-plugin-zcash
          key: zuuli-plugin-android-armv7-ndk27.0.12077973-api29

      - name: Type-check the shared plugin on 32-bit Android
        run: |
          set -euo pipefail
          source wallet/zuuli/scripts/android-toolchain-env.sh
          cargo check --locked --target armv7-linux-androideabi --manifest-path wallet/plugins/tauri-plugin-zcash/Cargo.toml

  # The app and standalone plugin have independent lockfiles and resolve some
  # crates differently. Run them in parallel so a cold gate takes the slower
  # job's time instead of compiling both graphs serially.
  rust_app:
    name: Rust / ZUULI backend
    needs: changes
    if: needs.changes.outputs.zuuli == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/free2z/zuuli-linux-ci@sha256:e94d8795fd3c3265caec0f5fc2fa814391e22d2d6e574649a75e686e6e967406
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Verify pinned Linux build image
        working-directory: /
        run: |
          set -euo pipefail
          /usr/local/bin/verify-zuuli-linux-image
          test -n "$BASH_VERSION"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure exact Git workspace trust
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Fetch librustzcash submodule
        run: git submodule update --init z/zcash/librustzcash

      - name: Resolve the pinned Rust toolchain
        id: rust_toolchain
        run: |
          set -euo pipefail
          version=$(scripts/check-rust-toolchain.sh --print-channel)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ steps.rust_toolchain.outputs.version }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: wallet/zuuli/src-tauri
          key: zuuli-app

      - name: Build ZUULI Tauri backend
        env:
          # The build script watches this value. Changing it on every attempt
          # forces schema generation even when Cargo artifacts were restored.
          TAURI_SCHEMA_GENERATION_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}
          TAURI_PERMISSION_GENERATION_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}
        run: cargo build --locked --manifest-path wallet/zuuli/src-tauri/Cargo.toml

      # ZUULI intentionally does not commit target-specific Tauri schemas. A
      # fresh build must generate them, and keeping the directory ignored means
      # it cannot acquire the stale committed state that affected Zuuallet.
      - name: Verify generated Tauri schema policy
        run: |
          set -euo pipefail
          schemas=wallet/zuuli/src-tauri/gen/schemas
          test -s "$schemas/linux-schema.json"
          test -z "$(git ls-files -- "$schemas")"
          git check-ignore -q "$schemas/linux-schema.json"
          permissions=wallet/plugins/tauri-plugin-zcash/permissions
          git diff --exit-code -- "$permissions"
          untracked=$(git ls-files --others --exclude-standard -- "$permissions")
          test -z "$untracked" || {
            echo "Unexpected generated permission files:" >&2
            echo "$untracked" >&2
            exit 1
          }

      - name: Test ZUULI Tauri backend
        run: cargo test --locked --manifest-path wallet/zuuli/src-tauri/Cargo.toml

  # A static permission parity check cannot see schema-shape drift introduced
  # by a Tauri dependency update. Regenerate Zuuallet's Linux target schema in
  # a clean required-gate job, then reject every tracked or untracked change.
  zuuallet_schema:
    name: Zuuallet / generated schema freshness
    needs: changes
    if: needs.changes.outputs.zuuallet_schema == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/free2z/zuuli-linux-ci@sha256:e94d8795fd3c3265caec0f5fc2fa814391e22d2d6e574649a75e686e6e967406
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - name: Verify pinned Linux build image
        working-directory: /
        run: |
          set -euo pipefail
          /usr/local/bin/verify-zuuli-linux-image
          test -n "$BASH_VERSION"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure exact Git workspace trust
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Fetch librustzcash submodule
        run: git submodule update --init z/zcash/librustzcash

      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: wallet/zuuallet/src-tauri -> ${{ github.workspace }}/target
          key: zuuallet-required-schema

      - name: Regenerate Zuuallet permissions and target schema
        env:
          # These values are build-script inputs, so restored Cargo artifacts
          # cannot turn this freshness assertion into a no-op.
          TAURI_SCHEMA_GENERATION_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}
          TAURI_PERMISSION_GENERATION_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}
        run: cargo build --locked --manifest-path wallet/zuuallet/src-tauri/Cargo.toml

      - name: Reject generated permission or schema drift
        run: |
          set -euo pipefail
          node scripts/check-zcash-permissions.mjs --self-test
          node scripts/check-zcash-permissions.mjs
          for generated in \
            wallet/plugins/tauri-plugin-zcash/permissions \
            wallet/zuuallet/src-tauri/gen/schemas; do
            git diff --exit-code -- "$generated"
            untracked=$(git ls-files --others --exclude-standard -- "$generated")
            test -z "$untracked" || {
              echo "Unexpected generated files under $generated:" >&2
              echo "$untracked" >&2
              exit 1
            }
          done

  # Branch protection requires this stable context. It succeeds only when the
  # change detector and every applicable full-stack job succeeded; legitimate
  # non-ZUULI skips continue to report success instead of remaining pending.
  gate:
    needs: [changes, frontend, rust_fmt, rust_deny, rust_clippy, rust_native_clippy, rust_plugin, rust_android_32, rust_app, zuuallet_schema]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Re-run the workflow policy here so even job-level continue-on-error on
      # `changes` cannot turn that job's deliberately failing policy verdict
      # into the `success` conclusion this gate consumes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Recheck immutable actions and fail-closed required jobs
        id: policy
        run: |
          node scripts/check-github-actions-pins.mjs --self-test
          node scripts/check-github-actions-pins.mjs

      - name: Verify required jobs succeeded or legitimately skipped
        env:
          POLICY_OUTCOME: ${{ steps.policy.outcome }}
          REQUIRED_JOBS_JSON: ${{ toJSON(needs) }}
        run: |
          node scripts/check-github-actions-pins.mjs
          node scripts/check-github-actions-pins.mjs --verify-gate-results
