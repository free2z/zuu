name: wallet/zuuli

# Stable, full-stack required check for ZUULI. The workflow runs for every PR
# and merge-group event so branch protection always receives `gate`; expensive
# jobs skip only after the checked-out diff proves that no release-impacting
# ZUULI surface changed.

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR updates supersede older runs; post-merge/manual runs use run_id and are
  # never cancelled merely because another main build started.
  group: zuuli-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      zuuli: ${{ steps.filter.outputs.zuuli }}
      zuuallet_schema: ${{ steps.filter.outputs.zuuallet_schema }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Diff locally instead of relying on the pull-request files API.
          fetch-depth: 0

      # This runs before change detection on every event. A workflow cannot
      # replace its own judge with a mutable external action, or mark a job the
      # required gate awaits as best-effort, then skip the full application
      # suite as an allegedly unrelated change.
      # The workflow-gates half is a separate hazard — see the header of
      # scripts/check-workflow-gates.mjs.
      - name: Verify immutable actions and fail-closed required jobs
        run: |
          node scripts/check-github-actions-pins.mjs --self-test
          node scripts/check-github-actions-pins.mjs
          node scripts/check-workflow-gates.mjs --self-test
          node scripts/check-workflow-gates.mjs
          node scripts/check-librustzcash-compat.mjs --self-test
          node scripts/check-librustzcash-compat.mjs
          node scripts/check-pow-policy.mjs --self-test
          node scripts/check-pow-policy.mjs

      # Runs on every event, including changes this job would otherwise skip,
      # because a toolchain pin can drift from any workflow or manifest. The
      # self-test proves the check can still fail before its verdict is trusted.
      - name: Verify the Rust toolchain pin has not drifted
        run: |
          scripts/check-rust-toolchain.sh --self-test
          scripts/check-rust-toolchain.sh

      # Public-repository boundaries should be mechanically enforced rather
      # than depending on every contributor remembering private repo names.
      - name: Reject references to the private backend repository
        run: |
          scripts/check-public-repo-boundary.sh --self-test
          scripts/check-public-repo-boundary.sh

      # This policy checker owns the schema job's pinned build image, selector
      # coverage, and attachment to the required gate. Run both its mutation
      # controls and current-tree verdict in the always-required job so those
      # guarantees cannot regress behind an advisory workflow.
      - name: Verify the required schema build policy
        run: |
          node scripts/check-zuuli-linux-image.mjs --self-test
          node scripts/check-zuuli-linux-image.mjs

      - name: Verify the store-capture build image policy
        run: |
          node scripts/check-zuuli-store-capture-image.mjs --self-test
          node scripts/check-zuuli-store-capture-image.mjs

      - name: Verify the required 32-bit Android type-check policy
        run: |
          node scripts/check-zuuli-android-gate.mjs --self-test
          node scripts/check-zuuli-android-gate.mjs

      - name: Verify the required Rust/WASM build boundary
        run: |
          node wallet/zuuli/scripts/wasm-boundary.mjs --self-test
          node wallet/zuuli/scripts/wasm-boundary.mjs

      - name: Verify messaging contract, command, and permission parity
        run: |
          node --test wallet/zuuli/scripts/messaging-contract.node-test.mjs
          node scripts/check-tauri-plugin-permissions.mjs --self-test
          node scripts/check-tauri-plugin-permissions.mjs

      - name: Detect release-impacting ZUULI changes
        id: filter
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          set -euo pipefail

          # Manual runs, first pushes, and incomplete event payloads fail open
          # into the full test suite, never into an unverified skip.
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] ||
             ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "::notice::No usable base commit; running the full ZUULI gate."
            echo "zuuli=true" >> "$GITHUB_OUTPUT"
            echo "zuuallet_schema=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files=$(mktemp "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/zuuli-changed-files.XXXXXX")
          trap 'rm -f -- "$changed_files"' EXIT
          if ! git diff --name-only -z --no-renames "$BASE_SHA" "$GITHUB_SHA" > "$changed_files"; then
            echo "::warning::Diff failed; running the full ZUULI gate."
            echo "zuuli=true" >> "$GITHUB_OUTPUT"
            echo "zuuallet_schema=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          zuuli=false
          zuuallet_schema=false
          while IFS= read -r -d '' file; do
            # Prose under an application directory — STATUS.md, README.md,
            # CLAUDE.md, docs/**.md — describes the app; it is not compiled into
            # it and no job below reads it. Without this guard the broad
            # `wallet/zuuli/*`, `wallet/free2z/*` and `wallet/e2e2z/*` patterns
            # in the arm below match it, so a STATUS re-derivation — which every
            # release needs at least once — pays the full ~40-minute native
            # matrix, as does a README edit on either delegated surface.
            #
            # `==` inside `[[ ]]` is a glob match, not a string compare, and a
            # glob `*` spans `/`, so one pattern per app covers every depth:
            # wallet/zuuli/STATUS.md and wallet/zuuli/docs/e2ee/notes.md alike.
            #
            # It is scoped to those three application prefixes and so cannot
            # reach the markdown that genuinely gates behaviour:
            # docs/e2ee/CLIENT-CONTRACT.md, docs/e2ee/WIRE.md and
            # docs/ZUULI-LINUX-BUILD-IMAGE.md all live outside them and still
            # select the full gate. It also runs only per-file, so it cannot
            # affect the fail-open paths above, and a commit that touches prose
            # *and* source still selects the full gate on the source file.
            if [[ "$file" == wallet/zuuli/*.md ||
                  "$file" == wallet/free2z/*.md ||
                  "$file" == wallet/e2e2z/*.md ]]; then
              continue
            fi
            case "$file" in
              Cargo.toml|Cargo.lock|.cargo/*|clippy.toml|.clippy.toml|wallet/Cargo.toml|wallet/Cargo.lock|wallet/.cargo/*|wallet/clippy.toml|wallet/.clippy.toml|wallet/*.rs|wallet/*/Cargo.toml|wallet/*/Cargo.lock|wallet/*/.cargo/*|wallet/*/clippy.toml|wallet/*/.clippy.toml|wallet/package.json|wallet/package-lock.json|wallet/shared/*|wallet/zuuli/*|wallet/zuuallet/*|wallet/free2z/*|wallet/e2e2z/*|wallet/plugins/*|rs/crates/f2z-codec/*|rs/crates/f2z-intent/*|rs/crates/f2z-kt-client/*|rs/crates/f2z-kt-core/*|rs/crates/f2z-msg-dag/*|rs/crates/f2z-msg-identity/*|rs/crates/f2z-msg-mls/*|rs/crates/f2z-msg-store/*|rs/crates/f2z-relay-proto/*|rs/crates/f2z-relay-testkit/*|rs/rust-toolchain.toml|wallet/zuuallet/package.json|wallet/zuuallet/package-lock.json|wallet/zuuallet/src/hooks/useWallet.ts|wallet/zuuallet/src/lib/mnemonic.ts|wallet/zuuallet/src/lib/sensitive-entry.ts|wallet/zuuallet/src/lib/sensitive-seed-session.ts|wallet/zuuallet/src/lib/sensitive-seed.ts|wallet/zuuallet/src/lib/tauri.ts|wallet/zuuallet/src/pages/CreateWallet.tsx|wallet/zuuallet/src/pages/RestoreWallet.tsx|wallet/zuuallet/src/pages/Settings.tsx|wallet/zuuallet/src/pages/Welcome.tsx|wallet/zuuallet/src/pages/sensitive-entry-routes.test.tsx|wallet/zuuallet/src/types/index.ts|wallet/rust-toolchain.toml|wallet/deny.toml|docs/e2ee/CLIENT-CONTRACT.md|docs/e2ee/WIRE.md|scripts/check-github-actions-pins.mjs|scripts/check-librustzcash-compat.mjs|scripts/check-rust-toolchain.sh|scripts/check-rust-fmt.sh|scripts/check-rust-deny.sh|scripts/check-rust-clippy.sh|scripts/check-tauri-plugin-permissions.mjs|scripts/check-zuuli-linux-image.mjs|scripts/check-zuuli-store-capture-image.mjs|scripts/check-zuuli-android-gate.mjs|z/zcash/librustzcash|.gitmodules|.github/containers/zuuli-linux/*|.github/containers/zuuli-store-capture/*|.github/workflows/zuuli.yml|.github/workflows/zuuli-linux-image.yml|.github/workflows/zuuli-store-capture-image.yml|.github/workflows/zuuli-packaging.yml|.github/workflows/zuuli-release.yml|.github/workflows/zuuli-store-audit.yml|.github/workflows/zuuli-store-publish.yml|.github/workflows/zuuli-testflight-bootstrap.yml|.github/workflows/zuuli-testflight-recovery.yml|.github/workflows/cache-cleanup.yml|.github/actions/zuuli-rust-cache/*|docs/ZUULI-LINUX-BUILD-IMAGE.md|docs/ZUULI-STORE-CAPTURE-IMAGE.md)
                zuuli=true
                ;;
            esac
            case "$file" in
              Cargo.toml|Cargo.lock|.cargo/*|clippy.toml|.clippy.toml|wallet/Cargo.toml|wallet/Cargo.lock|wallet/.cargo/*|wallet/clippy.toml|wallet/.clippy.toml|wallet/*.rs|wallet/*/Cargo.toml|wallet/*/Cargo.lock|wallet/*/.cargo/*|wallet/*/clippy.toml|wallet/*/.clippy.toml|wallet/zuuallet/src-tauri/*|wallet/plugins/*|wallet/rust-toolchain.toml|scripts/check-librustzcash-compat.mjs|scripts/check-rust-toolchain.sh|scripts/check-rust-clippy.sh|scripts/check-tauri-plugin-permissions.mjs|scripts/check-zuuli-linux-image.mjs|z/zcash/librustzcash|.gitmodules|.github/containers/zuuli-linux/*|.github/workflows/zuuli.yml|.github/workflows/zuuli-linux-image.yml|.github/actions/zuuli-rust-cache/*)
                zuuallet_schema=true
                ;;
            esac
          done < "$changed_files"

          echo "zuuli=$zuuli" >> "$GITHUB_OUTPUT"
          echo "zuuallet_schema=$zuuallet_schema" >> "$GITHUB_OUTPUT"

  frontend:
    name: zuuli / frontend
    needs: changes
    if: needs.changes.outputs.zuuli == 'true'
    runs-on: ubuntu-latest
    # Retain bounded time for the mandatory viewport suite and production build,
    # including occasional hosted-runner provisioning delays.
    timeout-minutes: 35
    defaults:
      run:
        working-directory: wallet/zuuli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            wallet/zuuli/package-lock.json
            wallet/zuuallet/package-lock.json

      - name: Resolve the pinned frontend Rust toolchain
        id: frontend_rust_toolchain
        run: |
          set -euo pipefail
          version=$(../../scripts/check-rust-toolchain.sh --print-channel)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install the pinned Rust/WASM compiler
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ steps.frontend_rust_toolchain.outputs.version }}
          targets: wasm32-unknown-unknown

      - name: Install locked dependencies
        run: |
          npm ci
          npm ci --prefix ../zuuallet

      # Zuuallet owns an independent npm root. Keep its high-severity audit in
      # this protected-gate job as well as the faster advisory workflow so a
      # newly vulnerable lockfile cannot merge behind a non-required check.
      - name: Audit Zuuallet dependencies (high and critical)
        run: |
          for attempt in 1 2 3; do
            npm --prefix ../zuuallet audit --audit-level=high && exit 0
            [ "$attempt" -eq 3 ] && exit 1
            sleep $((attempt * 5))
          done

      - name: Verify release cache security policy
        run: |
          node scripts/verify-ci-cache-policy.mjs --self-test
          node scripts/verify-ci-cache-policy.mjs

      - name: Verify generated app and store icons
        run: npm run icons:check

      - name: Test store listing contract and read-only audit
        run: npm run test:store-listing
      - name: Validate canonical store manifest and media
        run: npm run store:validate

      - name: Test App Store Connect state machine
        run: npm run test:asc-testflight

      # The current lockfile has moderate advisories but no high/critical ones.
      # Dependency upgrades belong in focused PRs; this gate prevents severity
      # from regressing while making the existing baseline explicit.
      - name: Audit dependencies (high and critical)
        run: |
          for attempt in 1 2 3; do
            npm audit --audit-level=high && exit 0
            [ "$attempt" -eq 3 ] && exit 1
            sleep $((attempt * 5))
          done

      - name: Typecheck
        run: |
          npm run typecheck
          npm run typecheck:tests

      - name: Verify wallet project boundaries
        run: |
          node --test scripts/project-boundary.node-test.mjs
          node scripts/project-boundary.mjs

      - name: Verify RTL source policy
        run: |
          node --test scripts/rtl-source-policy.node-test.mjs
          node scripts/rtl-source-policy.mjs

      # GitHub's Ubuntu runner image includes stable Google Chrome. Using it in
      # CI avoids an apt-mirror dependency while preserving real browser tests.
      - name: Verify the viewport-test browser
        run: google-chrome --version

      - name: Test frontend contracts
        run: |
          npm run test
          npm --prefix ../zuuallet run test:sensitive-entry

      - name: Build production frontend
        run: npm run build

  # Formatting is its own job rather than a step on rust_plugin/rust_app, which
  # are 45-minute builds. `cargo fmt` reads manifests with
  # `cargo metadata --no-deps`, so it resolves no dependency graph and compiles
  # nothing: no submodule fetch, no Tauri system packages, no Cargo cache. The
  # verdict lands in about a minute instead of behind a cold Zcash build, and a
  # formatting failure no longer costs a full rebuild to re-check.
  #
  # It covers every crate under wallet/, including wallet/zuuallet/src-tauri,
  # The root selector above deliberately selects every wallet/ path, including
  # future crates and Zuuallet-only changes.
  rust_fmt:
    name: Rust / formatting
    needs: changes
    if: needs.changes.outputs.zuuli == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve the pinned Rust toolchain
        id: rust_toolchain
        run: |
          set -euo pipefail
          version=$(scripts/check-rust-toolchain.sh --print-channel)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # rustfmt is not in the minimal profile this action installs, and its
      # output differs between compiler versions — the pinned toolchain is what
      # makes the verdict reproducible, so the check refuses to run on any other.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ steps.rust_toolchain.outputs.version }}
          components: rustfmt

      # A check nobody has watched fail is not a check: this builds a scratch
      # tree under --root and proves the verdict tracks it, unformatted case
      # included. Seconds, and it is what keeps --root honest for a second tree.
      - name: Prove the formatting gate still fails
        run: scripts/check-rust-fmt.sh --self-test

      - name: Check formatting of every Rust crate under wallet/
        run: scripts/check-rust-fmt.sh --root wallet

  # Supply chain: RustSec advisories, licences, and crate sources for all three
  # wallet lockfiles. Like rust_fmt this compiles nothing — cargo-deny works
  # from `cargo metadata` and the lockfiles — but unlike rust_fmt it does need
  # the dependency graph resolved, so the librustzcash submodule is fetched.
  # Still a couple of minutes rather than 45.
  rust_deny:
    name: Rust / supply chain
    needs: changes
    if: needs.changes.outputs.zuuli == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # cargo-deny resolves the whole graph, and the wallet crates reach the
      # Zcash crates by path into this submodule.
      - name: Fetch librustzcash submodule
        run: git submodule update --init z/zcash/librustzcash

      - name: Resolve the pinned Rust toolchain
        id: rust_toolchain
        run: |
          set -euo pipefail
          version=$(scripts/check-rust-toolchain.sh --print-channel)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # cargo-deny shells out to `cargo metadata`, so a toolchain is required
      # even though nothing is compiled.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ steps.rust_toolchain.outputs.version }}

      # The script fetches a checksum-verified cargo-deny release binary itself;
      # the version and digests are pinned in the script. Deliberately not a
      # third-party installer action — the tool that polices our supply chain
      # should not arrive through an unpinned one.
      # Judges one scratch crate under two policies that disagree about its
      # licence. Passing both ways would mean --config is decorative, which is
      # the whole mechanism a second tree's own policy rests on.
      - name: Prove the policy still decides the verdict
        run: scripts/check-rust-deny.sh --self-test

      - name: Check advisories, licences and sources
        run: scripts/check-rust-deny.sh --root wallet --config wallet/deny.toml

  # Lints, at `-D warnings`, for every crate under wallet/. Unlike rust_fmt and
  # rust_deny this one genuinely compiles — clippy is a rustc driver and needs
  # the whole dependency graph — so it carries the submodule, the Tauri system
  # libraries and a cache of its own. It is still cheaper than rust_plugin and
  # rust_app because it only checks: no codegen, no linking.
  #
  # Its cache is separate from theirs on purpose. Clippy writes different
  # artifacts into the same target directory names, so sharing a key would make
  # the two kinds of job evict each other's work on every run.
  #
  # Like rust_fmt it covers wallet/zuuallet/src-tauri through the exact wallet/
  # root selector rather than a hand-maintained list of today's crates.
  rust_clippy:
    name: Rust / lints
    needs: changes
    if: needs.changes.outputs.zuuli == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/free2z/zuuli-linux-ci@sha256:e94d8795fd3c3265caec0f5fc2fa814391e22d2d6e574649a75e686e6e967406
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Verify pinned Linux build image
        working-directory: /
        run: |
          set -euo pipefail
          /usr/local/bin/verify-zuuli-linux-image
          test -n "$BASH_VERSION"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure exact Git workspace trust
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Fetch librustzcash submodule
        run: git submodule update --init z/zcash/librustzcash

      - name: Resolve the pinned Rust toolchain
        id: rust_toolchain
        run: |
          set -euo pipefail
          version=$(scripts/check-rust-toolchain.sh --print-channel)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # clippy is not in the minimal profile this action installs, and its lint
      # set differs between compiler versions — the pinned toolchain is what
      # makes the verdict reproducible, so the check refuses to run on any other.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ steps.rust_toolchain.outputs.version }}
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            wallet/plugins/tauri-plugin-zcash
            wallet/zuuli/src-tauri
            wallet/zuuallet/src-tauri
          key: zuuli-clippy

      - name: Lint every Rust crate under wallet/ at -D warnings
        run: scripts/check-rust-clippy.sh --root wallet

  # Linux cannot compile the target-specific Keychain, Credential Manager,
  # filesystem, and OAuth branches. Run the same all-wallet clippy verdict on
  # both native hosts and make it a dependency of the protected `gate`. The
  # negative control also asserts Cargo selected the matrix target OS, so an
  # inherited CARGO_BUILD_TARGET cannot silently turn both lanes into Linux.
  rust_native_clippy:
    name: Rust / native lints (${{ matrix.target_os }})
    needs: changes
    if: needs.changes.outputs.zuuli == 'true' || needs.changes.outputs.zuuallet_schema == 'true'
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target_os: macos
          - os: windows-latest
            target_os: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch librustzcash submodule
        run: git submodule update --init z/zcash/librustzcash

      - name: Resolve the pinned Rust toolchain
        id: rust_toolchain
        shell: bash
        run: |
          set -euo pipefail
          version=$(scripts/check-rust-toolchain.sh --print-channel)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ steps.rust_toolchain.outputs.version }}
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            wallet/plugins/tauri-plugin-zcash
            wallet/zuuli/src-tauri
            wallet/zuuallet/src-tauri
          key: zuuli-native-clippy-${{ matrix.target_os }}

      - name: Prove native target selection and -D warnings
        shell: bash
        run: scripts/check-rust-clippy.sh --self-test "${{ matrix.target_os }}"

      - name: Lint every Rust crate under wallet/ at -D warnings
        shell: bash
        run: scripts/check-rust-clippy.sh --root wallet

  # Native *execution*, not just compilation. `rust_native_clippy` above proves
  # the macOS and Windows halves of the plugin compile; until #610 nothing that
  # could fail a merge ever ran them. The Win32 file-identity helper the
  # legacy-import preview relies on is reachable only from a Windows host, so a
  # regression in it passed every required check — the plugin's Windows suite
  # lived in the ungated .github/workflows/zuuallet.yml, which branch protection
  # does not require and which does not even run for a pull request outside its
  # `paths:` filter. That job moved here, where the required `gate` awaits it.
  #
  # Same selector and same matrix as the lint job deliberately: it is the same
  # code on the same two hosts, and two selectors over one body of code drift.
  rust_native_tests:
    name: Rust / native tests (${{ matrix.target_os }})
    needs: changes
    if: needs.changes.outputs.zuuli == 'true' || needs.changes.outputs.zuuallet_schema == 'true'
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target_os: macos
          - os: windows-latest
            target_os: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch librustzcash submodule
        run: git submodule update --init z/zcash/librustzcash

      - name: Resolve the pinned Rust toolchain
        id: rust_toolchain
        shell: bash
        run: |
          set -euo pipefail
          version=$(scripts/check-rust-toolchain.sh --print-channel)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ steps.rust_toolchain.outputs.version }}

      # Separate cache key from rust_native_clippy: clippy and rustc write
      # different artifacts under the same target directory names, so a shared
      # key has the two jobs evicting each other's work on every run.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: wallet/plugins/tauri-plugin-zcash
          key: zuuli-native-tests-${{ matrix.target_os }}

      # --all-targets so the integration and doc-adjacent targets build too;
      # this is the exact command the retired zuuallet.yml custody job ran, now
      # under a required context.
      - name: Test the shared plugin on the native host
        shell: bash
        run: >-
          cargo test --locked
          --all-targets
          --features production-route-probe
          --manifest-path wallet/plugins/tauri-plugin-zcash/Cargo.toml

  rust_plugin:
    name: Rust / shared plugin
    needs: changes
    if: needs.changes.outputs.zuuli == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/free2z/zuuli-linux-ci@sha256:e94d8795fd3c3265caec0f5fc2fa814391e22d2d6e574649a75e686e6e967406
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Verify pinned Linux build image
        working-directory: /
        run: |
          set -euo pipefail
          /usr/local/bin/verify-zuuli-linux-image
          test -n "$BASH_VERSION"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure exact Git workspace trust
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Fetch only the in-source dependency required by the app/plugin graph.
      - name: Fetch librustzcash submodule
        run: git submodule update --init z/zcash/librustzcash

      # Keep CI explicit as well as repository-pinned so runner state cannot
      # silently select a newer compiler. The version is read from
      # wallet/rust-toolchain.toml rather than restated here.
      - name: Resolve the pinned Rust toolchain
        id: rust_toolchain
        run: |
          set -euo pipefail
          version=$(scripts/check-rust-toolchain.sh --print-channel)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ steps.rust_toolchain.outputs.version }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: wallet/plugins/tauri-plugin-zcash
          key: zuuli-plugin

      - name: Build and test shared Zcash plugin
        run: cargo test --locked --all-targets --features production-route-probe --manifest-path wallet/plugins/tauri-plugin-zcash/Cargo.toml

  # The messaging plugin (docs/e2ee/CLIENT-CONTRACT.md §3). It needs a job of its
  # own rather than riding on `rust_plugin`: it is a different Cargo root with a
  # different lockfile, it does not link librustzcash at all, and the two-process
  # relay harness that proves the acceptance criterion — two independent engines
  # exchanging a message over a real WebSocket relay — is behind a feature flag
  # that nothing else turns on.
  #
  # `zuuli.yml`'s change detector already selects `wallet/plugins/*`, so the
  # filter needed nothing. What a new plugin gets no coverage from is `gate`, and
  # that is deliberate work rather than a freebie: it must appear in `gate`'s
  # `needs:` AND that gate must inspect its result.
  # `scripts/check-workflow-gates.mjs` enforces the second half — this gate is
  # the EXHAUSTIVE shape, so `toJSON(needs)` reaches
  # `check-github-actions-pins.mjs --verify-gate-results` and every entry is
  # judged — and its total-coverage rule enforces the first, because `needs:`
  # must cover every job in this file.
  rust_msg_plugin:
    name: Rust / messaging plugin
    needs: changes
    if: needs.changes.outputs.zuuli == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/free2z/zuuli-linux-ci@sha256:e94d8795fd3c3265caec0f5fc2fa814391e22d2d6e574649a75e686e6e967406
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Verify pinned Linux build image
        working-directory: /
        run: |
          set -euo pipefail
          /usr/local/bin/verify-zuuli-linux-image
          test -n "$BASH_VERSION"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure exact Git workspace trust
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      # No submodule fetch. This plugin depends on rs/crates by path and on
      # librustzcash not at all, and a job that fetched it anyway would hide the
      # day that stopped being true.
      - name: Resolve the pinned Rust toolchain
        id: rust_toolchain
        run: |
          set -euo pipefail
          version=$(scripts/check-rust-toolchain.sh --print-channel)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ steps.rust_toolchain.outputs.version }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            wallet/plugins/tauri-plugin-f2zmsg
            rs
          key: zuuli-msg-plugin

      # The client crate cannot link the AGPL relay daemon. Build its actual
      # production binary separately so the rollback/cursor regression can
      # spawn it across that licence boundary rather than substituting the MIT
      # FakeRelay behind a WebSocket.
      - name: Build the production relay daemon for integration tests
        run: |
          cargo build --locked --manifest-path rs/Cargo.toml \
            -p f2z-relay --bin f2z-relay

      # The acceptance criteria. `--features relay-harness` builds the
      # `f2zmsg-peer` binary for the two-process exchange and enables the exact
      # two-record rollback regression against the production relay binary.
      # Without it both integration tests compile to nothing and pass by not
      # existing.
      - name: Build and test the messaging plugin
        env:
          F2Z_RELAY_BIN: ${{ github.workspace }}/rs/target/debug/f2z-relay
          TAURI_PERMISSION_GENERATION_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          cargo test --locked --all-targets --features relay-harness \
            --manifest-path wallet/plugins/tauri-plugin-f2zmsg/Cargo.toml

      # A default build too, because `relay-harness` adds a dependency and a
      # binary, and what ships is the build without them.
      - name: Build the shipping configuration
        run: |
          cargo build --locked \
            --manifest-path wallet/plugins/tauri-plugin-f2zmsg/Cargo.toml

      - name: Reject generated permission drift
        run: |
          set -euo pipefail
          node scripts/check-tauri-plugin-permissions.mjs --self-test
          node scripts/check-tauri-plugin-permissions.mjs
          generated=wallet/plugins/tauri-plugin-f2zmsg/permissions
          git diff --exit-code -- "$generated"
          untracked=$(git ls-files --others --exclude-standard -- "$generated")
          test -z "$untracked" || {
            echo "Unexpected generated permission files under $generated:" >&2
            echo "$untracked" >&2
            exit 1
          }

  # PR packaging builds only arm64 Android. Keep one cheap 32-bit type-check in
  # the required gate because libc's Android ABI types can differ on armv7; the
  # exact class escaped arm64 CI and broke build 7 only in the release lane.
  rust_android_32:
    name: Rust / Android 32-bit
    needs: changes
    if: needs.changes.outputs.zuuli == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch librustzcash submodule
        run: git submodule update --init z/zcash/librustzcash

      - name: Resolve the pinned Rust toolchain
        id: rust_toolchain
        run: |
          set -euo pipefail
          version=$(scripts/check-rust-toolchain.sh --print-channel)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install the pinned 32-bit Android Rust target
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ steps.rust_toolchain.outputs.version }}
          targets: armv7-linux-androideabi

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21.0.12'

      - name: Install the pinned Android NDK
        run: |
          set -euo pipefail
          set +e
          yes 2>/dev/null | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'ndk;27.0.12077973' >/dev/null
          sdk_status=${PIPESTATUS[1]}
          set -e
          [[ "$sdk_status" -eq 0 ]] || { echo "sdkmanager failed ($sdk_status)" >&2; exit 1; }

      - name: Restore the 32-bit Android Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: wallet/plugins/tauri-plugin-zcash
          key: zuuli-plugin-android-armv7-ndk27.0.12077973-api29

      - name: Type-check the shared plugin on 32-bit Android
        run: |
          set -euo pipefail
          source wallet/zuuli/scripts/android-toolchain-env.sh
          cargo check --locked --target armv7-linux-androideabi --manifest-path wallet/plugins/tauri-plugin-zcash/Cargo.toml

  # The app and standalone plugin have independent lockfiles and resolve some
  # crates differently. Run them in parallel so a cold gate takes the slower
  # job's time instead of compiling both graphs serially.
  rust_app:
    name: Rust / ZUULI backend
    needs: changes
    if: needs.changes.outputs.zuuli == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/free2z/zuuli-linux-ci@sha256:e94d8795fd3c3265caec0f5fc2fa814391e22d2d6e574649a75e686e6e967406
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Verify pinned Linux build image
        working-directory: /
        run: |
          set -euo pipefail
          /usr/local/bin/verify-zuuli-linux-image
          test -n "$BASH_VERSION"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure exact Git workspace trust
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Fetch librustzcash submodule
        run: git submodule update --init z/zcash/librustzcash

      - name: Resolve the pinned Rust toolchain
        id: rust_toolchain
        run: |
          set -euo pipefail
          version=$(scripts/check-rust-toolchain.sh --print-channel)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ steps.rust_toolchain.outputs.version }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: wallet/zuuli/src-tauri
          key: zuuli-app

      - name: Build ZUULI Tauri backend
        env:
          # The build script watches this value. Changing it on every attempt
          # forces schema generation even when Cargo artifacts were restored.
          TAURI_SCHEMA_GENERATION_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}
          TAURI_PERMISSION_GENERATION_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}
        run: cargo build --locked --manifest-path wallet/zuuli/src-tauri/Cargo.toml

      # ZUULI intentionally does not commit target-specific Tauri schemas. A
      # fresh build must generate them, and keeping the directory ignored means
      # it cannot acquire the stale committed state that affected Zuuallet.
      - name: Verify generated Tauri schema policy
        run: |
          set -euo pipefail
          schemas=wallet/zuuli/src-tauri/gen/schemas
          test -s "$schemas/linux-schema.json"
          test -z "$(git ls-files -- "$schemas")"
          git check-ignore -q "$schemas/linux-schema.json"
          permissions=wallet/plugins/tauri-plugin-zcash/permissions
          git diff --exit-code -- "$permissions"
          untracked=$(git ls-files --others --exclude-standard -- "$permissions")
          test -z "$untracked" || {
            echo "Unexpected generated permission files:" >&2
            echo "$untracked" >&2
            exit 1
          }

      - name: Test ZUULI Tauri backend
        run: cargo test --locked --manifest-path wallet/zuuli/src-tauri/Cargo.toml

  # A static permission parity check cannot see schema-shape drift introduced
  # by a Tauri dependency update. Regenerate Zuuallet's Linux target schema in
  # a clean required-gate job, then reject every tracked or untracked change.
  zuuallet_schema:
    name: Zuuallet / generated schema freshness
    needs: changes
    if: needs.changes.outputs.zuuallet_schema == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/free2z/zuuli-linux-ci@sha256:e94d8795fd3c3265caec0f5fc2fa814391e22d2d6e574649a75e686e6e967406
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - name: Verify pinned Linux build image
        working-directory: /
        run: |
          set -euo pipefail
          /usr/local/bin/verify-zuuli-linux-image
          test -n "$BASH_VERSION"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure exact Git workspace trust
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Fetch librustzcash submodule
        run: git submodule update --init z/zcash/librustzcash

      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: wallet/zuuallet/src-tauri -> ${{ github.workspace }}/target
          key: zuuallet-required-schema

      - name: Regenerate Zuuallet permissions and target schema
        env:
          # These values are build-script inputs, so restored Cargo artifacts
          # cannot turn this freshness assertion into a no-op.
          TAURI_SCHEMA_GENERATION_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}
          TAURI_PERMISSION_GENERATION_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}
        run: cargo build --locked --manifest-path wallet/zuuallet/src-tauri/Cargo.toml

      - name: Reject generated permission or schema drift
        run: |
          set -euo pipefail
          node scripts/check-tauri-plugin-permissions.mjs --self-test
          node scripts/check-tauri-plugin-permissions.mjs
          for generated in \
            wallet/plugins/tauri-plugin-zcash/permissions \
            wallet/zuuallet/src-tauri/gen/schemas; do
            git diff --exit-code -- "$generated"
            untracked=$(git ls-files --others --exclude-standard -- "$generated")
            test -z "$untracked" || {
              echo "Unexpected generated files under $generated:" >&2
              echo "$untracked" >&2
              exit 1
            }
          done

  # Compile a runtime-dispatched modern cryptography probe for every Rust target
  # emitted by the release workflows. Cross-builds are deliberately described
  # as compile evidence; the host test is runtime evidence only for its runner.
  rust_crypto_targets:
    name: Rust / modern crypto targets (${{ matrix.family }})
    needs: changes
    if: needs.changes.outputs.zuuli == 'true'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: linux-android
            os: ubuntu-24.04
            targets: x86_64-unknown-linux-gnu,aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
          - family: apple
            os: macos-26
            targets: aarch64-apple-darwin,x86_64-apple-darwin,aarch64-apple-ios
          - family: windows
            os: windows-2025
            targets: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve the pinned Rust toolchain
        id: rust_toolchain
        shell: bash
        run: |
          set -euo pipefail
          version=$(scripts/check-rust-toolchain.sh --print-channel)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install the pinned compiler and release targets
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ steps.rust_toolchain.outputs.version }}
          targets: ${{ matrix.targets }}

      - name: Verify exact clean source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Build the representative crypto probe for every release target
        shell: bash
        run: |
          set -euo pipefail
          IFS=',' read -ra targets <<< '${{ matrix.targets }}'
          for target in "${targets[@]}"; do
            cargo build --locked --release --lib --target "$target" \
              --manifest-path wallet/zuuli/crypto-target-spike/Cargo.toml
          done

      - name: Execute the representative crypto probe on the hosted OS
        shell: bash
        run: cargo test --locked --manifest-path wallet/zuuli/crypto-target-spike/Cargo.toml -- --nocapture

  # Branch protection requires this stable context. It succeeds only when the
  # change detector and every applicable full-stack job succeeded; legitimate
  # non-ZUULI skips continue to report success instead of remaining pending.
  gate:
    needs: [changes, frontend, rust_fmt, rust_deny, rust_clippy, rust_native_clippy, rust_native_tests, rust_plugin, rust_msg_plugin, rust_android_32, rust_app, zuuallet_schema, rust_crypto_targets]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Re-run the workflow policy here so even job-level continue-on-error on
      # `changes` cannot turn that job's deliberately failing policy verdict
      # into the `success` conclusion this gate consumes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Recheck immutable actions and fail-closed required jobs
        id: policy
        run: |
          node scripts/check-github-actions-pins.mjs --self-test
          node scripts/check-github-actions-pins.mjs
          node scripts/check-workflow-gates.mjs --self-test
          node scripts/check-workflow-gates.mjs

      - name: Verify required jobs succeeded or legitimately skipped
        env:
          POLICY_OUTCOME: ${{ steps.policy.outcome }}
          REQUIRED_JOBS_JSON: ${{ toJSON(needs) }}
        run: |
          node scripts/check-github-actions-pins.mjs
          node scripts/check-github-actions-pins.mjs --verify-gate-results
