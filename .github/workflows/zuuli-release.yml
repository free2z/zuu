name: ZUULI / protected release

on:
  push:
    branches: [main]
    paths:
      - wallet/zuuli/release.json
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full 40-character commit SHA to release
        required: true
        type: string
      identity:
        description: Confirm version+build from release.json (for example 0.1.0+1)
        required: true
        type: string
      target:
        description: Artifact set to build
        required: true
        default: mobile
        type: choice
        options: [mobile, ios, android, desktop, all]
      dry_run:
        description: Build, sign, and validate without uploading to either store
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  # All protected store transactions share one lane, including different build
  # identities. GitHub reruns failed jobs without replaying successful jobs.
  group: zuuli-mobile-store
  cancel-in-progress: false

env:
  CI: true
  ZUULI_NODE_VERSION: "24.18.0"
  # Restates wallet/rust-toolchain.toml because GitHub cannot compute a
  # workflow-level `env:` from a file. scripts/check-rust-toolchain.sh fails
  # the pull request if this ever stops matching the source of truth.
  ZUULI_RUST_VERSION: "1.97.1"
  ZUULI_JAVA_VERSION: "21.0.12"
  ZUULI_XCODE_VERSION: "26.6"
  ZUULI_ANDROID_NDK_VERSION: "27.0.12077973"

jobs:
  prepare:
    name: Pin immutable source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      identity: ${{ steps.identity.outputs.identity }}
      tag: ${{ steps.identity.outputs.tag }}
      tag_exists: ${{ steps.identity.outputs.tag_exists }}
      source_sha: ${{ steps.identity.outputs.source_sha }}
      target: ${{ steps.identity.outputs.target }}
      dry_run: ${{ steps.identity.outputs.dry_run }}
      should_release: ${{ steps.identity.outputs.should_release }}
    defaults:
      run:
        working-directory: wallet/zuuli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'push' && github.sha || inputs.source_sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: wallet/zuuli/package-lock.json
      - run: npm ci
      - name: Verify exact source and release identity
        id: identity
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
          CONFIRMED_IDENTITY: ${{ inputs.identity }}
          INPUT_TARGET: ${{ inputs.target }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          git fetch origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/tags/*:refs/tags/*'

          if [[ "$EVENT_NAME" == push ]]; then
            [[ "$EVENT_REF" == refs/heads/main ]] || {
              echo "automatic store releases only accept main pushes" >&2
              exit 1
            }
            source_sha=$EVENT_SHA
            target=mobile
            dry_run=false
          else
            source_sha=$INPUT_SOURCE_SHA
            target=$INPUT_TARGET
            dry_run=$INPUT_DRY_RUN
          fi

          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "source SHA must be a full lowercase 40-character commit SHA" >&2
            exit 1
          }
          args=("--source-sha=$source_sha" --require-main)
          metadata=$(node scripts/release-identity.mjs "${args[@]}")
          actual=$(jq -r .identity <<<"$metadata")

          should_release=true
          if [[ "$EVENT_NAME" == push ]]; then
            if git cat-file -e "$BEFORE_SHA:wallet/zuuli/release.json" 2>/dev/null; then
              node scripts/release-identity.mjs \
                "--source-sha=$source_sha" \
                "--require-newer-than=$BEFORE_SHA" \
                --require-main >/dev/null
            else
              # Adding release.json establishes the baseline but must not turn
              # an infrastructure merge into an unreviewed first store upload.
              should_release=false
            fi
          else
            [[ "$actual" == "$CONFIRMED_IDENTITY" ]] || {
              echo "confirmed identity $CONFIRMED_IDENTITY does not match source identity $actual" >&2
              exit 1
            }
            identity_sha=$(git log -1 --format=%H "$source_sha" -- ':(top)wallet/zuuli/release.json')
            [[ "$identity_sha" == "$source_sha" ]] || {
              echo "manual release source must be the exact commit that established this identity ($identity_sha)" >&2
              exit 1
            }
            parent_sha=$(git rev-parse "$source_sha^1")
            if git cat-file -e "$parent_sha:wallet/zuuli/release.json" 2>/dev/null; then
              node scripts/release-identity.mjs \
                "--source-sha=$source_sha" \
                "--require-newer-than=$parent_sha" \
                --require-main >/dev/null
            fi
            tip_identity=$(git show refs/remotes/origin/main:wallet/zuuli/release.json |
              jq -r '.version + "+" + (.build | tostring)')
            [[ "$actual" == "$tip_identity" ]] || {
              echo "manual recovery identity $actual is stale; current main identity is $tip_identity" >&2
              exit 1
            }
          fi

          # A dry run may exercise packaging while STATUS.md is being
          # re-derived, but no real store promotion may cross a stale source
          # boundary. This runs before any protected-environment job starts.
          if [[ "$should_release" == true && "$dry_run" == false ]]; then
            node scripts/status-freshness.mjs "--source-sha=$source_sha"
          fi

          tag=$(jq -r .tag <<<"$metadata")
          tag_exists=false
          if [[ "$(git cat-file -t "refs/tags/$tag" 2>/dev/null || true)" == tag ]]; then
            tagged=$(git rev-list -n 1 "refs/tags/$tag")
            remote_tagged=$(git ls-remote --tags origin "refs/tags/$tag^{}" | awk '{print $1}')
            if [[ "$tagged" == "$source_sha" && "$remote_tagged" == "$source_sha" ]]; then
              tag_exists=true
            fi
          fi

          {
            echo "identity=$actual"
            echo "tag=$tag"
            echo "tag_exists=$tag_exists"
            echo "source_sha=$source_sha"
            echo "target=$target"
            echo "dry_run=$dry_run"
            echo "should_release=$should_release"
          } >> "$GITHUB_OUTPUT"

  android-build:
    name: Android / credential-free unsigned universal AAB
    needs: prepare
    if: >-
      needs.prepare.outputs.should_release == 'true' &&
      (needs.prepare.outputs.target == 'mobile' ||
      needs.prepare.outputs.target == 'android' ||
      needs.prepare.outputs.target == 'all')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      artifact_sha256: ${{ steps.unsigned.outputs.artifact_sha256 }}
      payload_sha256: ${{ steps.unsigned.outputs.payload_sha256 }}
    defaults:
      run:
        working-directory: wallet/zuuli
    env:
      ZUULI_RELEASE_SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      BUNDLE_FROZEN: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Fetch origin/main for ancestry check
        run: git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
        working-directory: .
      - name: Fetch librustzcash
        run: git submodule update --init z/zcash/librustzcash
        working-directory: .
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.18.0"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21.0.12"
      # dtolnay/rust-toolchain's version branches hardcode the compiler in
      # action.yml, so this commit is itself the version pin and the trailing
      # comment is its only readable record. Bumping the toolchain means moving
      # the SHA to the new version branch and updating the comment with it;
      # scripts/check-rust-toolchain.sh fails the pull request otherwise.
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          toolchain: ${{ env.ZUULI_RUST_VERSION }}
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: Install exact Android SDK components
        run: |
          java -version 2>&1 | grep -F '21.0.12'
          set +e
          yes 2>/dev/null | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.0.12077973' >/dev/null
          sdk_status=${PIPESTATUS[1]}
          set -e
          [[ "$sdk_status" -eq 0 ]] || { echo "sdkmanager failed ($sdk_status)" >&2; exit 1; }
          source scripts/android-toolchain-env.sh
          for name in NDK_HOME ANDROID_NDK_HOME \
            CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER \
            CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER \
            CARGO_TARGET_I686_LINUX_ANDROID_LINKER \
            CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER \
            CC_aarch64_linux_android CC_armv7_linux_androideabi \
            CC_i686_linux_android CC_x86_64_linux_android \
            CXX_aarch64_linux_android CXX_armv7_linux_androideabi \
            CXX_i686_linux_android CXX_x86_64_linux_android; do
            echo "$name=${!name}" >> "$GITHUB_ENV"
          done
      - name: Restore reviewed Android Rust dependencies
        uses: ./.github/actions/zuuli-rust-cache
        with:
          shared-key: zuuli-release-android-universal-v2-rust-${{ env.ZUULI_RUST_VERSION }}-ndk-${{ env.ZUULI_ANDROID_NDK_VERSION }}-api29-aarch64-armv7-i686-x86_64
          save: "false"
      - name: Prove Android credentials are absent before dependency code
        run: scripts/assert-no-android-credentials.sh
      - run: npm ci
      - name: Verify Rust compiler
        run: rustc --version | grep -F "rustc $ZUULI_RUST_VERSION "
      - name: Reverify exact release source
        run: node scripts/release-identity.mjs "--source-sha=$ZUULI_RELEASE_SOURCE_SHA" --require-main
      - name: Build source-bound unsigned universal AAB
        id: unsigned
        env:
          RELEASE_IDENTITY: ${{ needs.prepare.outputs.identity }}
          RELEASE_SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          set -euo pipefail
          scripts/assert-no-android-credentials.sh
          ./node_modules/.bin/tauri android build --ci --aab -- --locked
          node scripts/normalize-generated-android-manifest.mjs
          git diff --exit-code
          candidates=(src-tauri/gen/android/app/build/outputs/bundle/universalRelease/*.aab)
          [[ ${#candidates[@]} -eq 1 && -f "${candidates[0]}" ]] || { echo "expected exactly one universal release AAB" >&2; exit 1; }
          unsigned_report=$(jarsigner -verify "${candidates[0]}" 2>&1 || true)
          if ! grep -Fqi 'jar is unsigned' <<<"$unsigned_report" || grep -Fq 'jar verified.' <<<"$unsigned_report"; then
            echo "credential-free Android build unexpectedly produced a signed AAB" >&2
            exit 1
          fi
          source_tree=$(git rev-parse "$RELEASE_SOURCE_SHA^{tree}")
          scripts/android-release-artifact.sh record \
            "${candidates[0]}" "$RELEASE_IDENTITY" "$RELEASE_SOURCE_SHA" "$source_tree" unsigned-android >/dev/null
          verifier="$RUNNER_TEMP/bundletool-all-1.18.3.jar"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            --output "$verifier" \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar
          payload_sha256=$(scripts/android-release-artifact.sh seal-verifier unsigned-android "$verifier" \
            a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29)
          rm -f -- "$verifier"
          artifact_sha256=$(jq -er .artifact.sha256 unsigned-android/source-record.json)
          echo "artifact_sha256=$artifact_sha256" >> "$GITHUB_OUTPUT"
          echo "payload_sha256=$payload_sha256" >> "$GITHUB_OUTPUT"
      - name: Prove Android credentials remain absent after build
        run: scripts/assert-no-android-credentials.sh
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: wallet/zuuli/unsigned-android/CHECKSUMS.sha256
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: unsigned-zuuli-android-${{ needs.prepare.outputs.identity }}-${{ needs.prepare.outputs.source_sha }}
          path: wallet/zuuli/unsigned-android
          if-no-files-found: error
          retention-days: 1

  android-sign-upload:
    name: Android / protected sign and Play upload
    needs: [prepare, android-build]
    if: needs.android-build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: zuuli-app-stores
    permissions:
      contents: read
      attestations: read
    outputs:
      artifact_sha256: ${{ steps.sign.outputs.artifact_sha256 }}
    env:
      ANDROID_UPLOAD_CERT_SHA256: ${{ vars.ANDROID_UPLOAD_CERT_SHA256 }}
    steps:
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21.0.12"
      - name: Verify pinned Android signing JVM
        run: java -version 2>&1 | grep -F '21.0.12'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: unsigned-zuuli-android-${{ needs.prepare.outputs.identity }}-${{ needs.prepare.outputs.source_sha }}
          path: unsigned-android
      - name: Verify source-bound artifact checksum and attestation
        env:
          EXPECTED_ARTIFACT_SHA256: ${{ needs.android-build.outputs.artifact_sha256 }}
          EXPECTED_PAYLOAD_SHA256: ${{ needs.android-build.outputs.payload_sha256 }}
          EXPECTED_IDENTITY: ${{ needs.prepare.outputs.identity }}
          EXPECTED_SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_ARTIFACT_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "invalid expected Android artifact digest" >&2; exit 1; }
          [[ "$EXPECTED_PAYLOAD_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "invalid expected Android payload digest" >&2; exit 1; }
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid expected Android source SHA" >&2; exit 1; }
          expected_members=$(printf '%s\n' ./CHECKSUMS.sha256 ./ZUULI-android-unsigned.aab ./aab-members.txt ./bundletool-all-1.18.3.jar ./source-record.json | LC_ALL=C sort)
          actual_members=$(cd unsigned-android && find . -mindepth 1 -maxdepth 1 -print | LC_ALL=C sort)
          [[ "$actual_members" == "$expected_members" ]] || { echo "unexpected unsigned Android artifact inventory" >&2; exit 1; }
          for member in CHECKSUMS.sha256 ZUULI-android-unsigned.aab aab-members.txt bundletool-all-1.18.3.jar source-record.json; do
            [[ -f "unsigned-android/$member" && ! -L "unsigned-android/$member" ]] || { echo "unsafe unsigned Android artifact member: $member" >&2; exit 1; }
          done
          test "$(sha256sum unsigned-android/CHECKSUMS.sha256 | awk '{print $1}')" = "$EXPECTED_PAYLOAD_SHA256"
          (cd unsigned-android && sha256sum -c CHECKSUMS.sha256)
          test "$(sha256sum unsigned-android/ZUULI-android-unsigned.aab | awk '{print $1}')" = "$EXPECTED_ARTIFACT_SHA256"
          jq -e --arg identity "$EXPECTED_IDENTITY" --arg source "$EXPECTED_SOURCE_SHA" --arg sha "$EXPECTED_ARTIFACT_SHA256" \
            '.schemaVersion == 1 and .kind == "android-unsigned-universal-aab" and .applicationId == "cash.free2z.zuuli" and .identity == $identity and .source.repository == "free2z/zuu" and .source.sha == $source and .artifact.sha256 == $sha and .artifact.name == "ZUULI-android-unsigned.aab" and .abis == ["arm64-v8a","armeabi-v7a","x86","x86_64"] and .verifier == {name:"bundletool-all-1.18.3.jar",version:"1.18.3",sha256:"a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29"}' \
            unsigned-android/source-record.json >/dev/null
          test "$(jq -er .artifact.bytes unsigned-android/source-record.json)" = "$(wc -c < unsigned-android/ZUULI-android-unsigned.aab | tr -d '[:space:]')"
          expected_tree=$(gh api "repos/$EXPECTED_REPOSITORY/git/commits/$EXPECTED_SOURCE_SHA" --jq .tree.sha)
          test "$(jq -er .source.tree unsigned-android/source-record.json)" = "$expected_tree"
          gh attestation verify unsigned-android/CHECKSUMS.sha256 \
            --repo "$EXPECTED_REPOSITORY" \
            --signer-workflow free2z/zuu/.github/workflows/zuuli-release.yml \
            --source-digest "$EXPECTED_SOURCE_SHA" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners >/dev/null
      - name: Inspect attested Android artifact without credentials
        env:
          EXPECTED_IDENTITY: ${{ needs.prepare.outputs.identity }}
        run: |
          set -euo pipefail
          bundletool=unsigned-android/bundletool-all-1.18.3.jar
          echo 'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  '"$bundletool" | sha256sum -c -
          aab=unsigned-android/ZUULI-android-unsigned.aab
          test "$(java -jar "$bundletool" dump manifest --bundle="$aab" --xpath=/manifest/@package)" = cash.free2z.zuuli
          test "$(java -jar "$bundletool" dump manifest --bundle="$aab" --xpath=/manifest/@android:versionName)" = "${EXPECTED_IDENTITY%+*}"
          test "$(java -jar "$bundletool" dump manifest --bundle="$aab" --xpath=/manifest/@android:versionCode)" = "${EXPECTED_IDENTITY#*+}"
          actual_abis=$(unzip -Z1 "$aab" | awk -F/ '$2 == "lib" && NF >= 4 && $NF ~ /\.so$/ {print $3}' | LC_ALL=C sort -u | paste -sd, -)
          test "$actual_abis" = arm64-v8a,armeabi-v7a,x86,x86_64
          unzip -Z1 "$aab" | LC_ALL=C sort > "$RUNNER_TEMP/current-aab-members.txt"
          cmp unsigned-android/aab-members.txt "$RUNNER_TEMP/current-aab-members.txt"
          : > "$RUNNER_TEMP/unsigned-aab-payload.sha256"
          while IFS= read -r member; do
            case "$member" in META-INF/*|*/) continue ;; esac
            printf '%s  %s\n' "$(unzip -p "$aab" "$member" | sha256sum | awk '{print $1}')" "$member" >> "$RUNNER_TEMP/unsigned-aab-payload.sha256"
          done < "$RUNNER_TEMP/current-aab-members.txt"
          rm -f -- "$bundletool" "$RUNNER_TEMP/current-aab-members.txt"
          test ! -e "$bundletool"
      - name: Materialize, sign, verify, optionally upload, and destroy credentials
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SERVICE_ACCOUNT_BASE64: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
          DRY_RUN: ${{ needs.prepare.outputs.dry_run }}
          RELEASE_IDENTITY: ${{ needs.prepare.outputs.identity }}
          RELEASE_SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          set -euo pipefail
          umask 077
          : "${KEYSTORE_BASE64:?ANDROID_KEYSTORE_BASE64 is not configured}"
          : "${KEYSTORE_PASSWORD:?ANDROID_KEYSTORE_PASSWORD is not configured}"
          : "${KEY_ALIAS:?ANDROID_KEY_ALIAS is not configured}"
          : "${KEY_PASSWORD:?ANDROID_KEY_PASSWORD is not configured}"
          : "${ANDROID_UPLOAD_CERT_SHA256:?ANDROID_UPLOAD_CERT_SHA256 is not configured}"
          secret_dir=$(mktemp -d "$RUNNER_TEMP/zuuli-android-sign.XXXXXX")
          cleanup_failed="$RUNNER_TEMP/zuuli-android-sign-cleanup-failed"
          cleanup() {
            set +e
            find "$secret_dir" -depth -delete || : > "$cleanup_failed"
          }
          trap cleanup EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$secret_dir/upload.jks"
          cp unsigned-android/ZUULI-android-unsigned.aab "$secret_dir/ZUULI-signed.aab"
          [[ "$ANDROID_UPLOAD_CERT_SHA256" =~ ^([0-9A-F]{2}:){31}[0-9A-F]{2}$ ]] || { echo "invalid Android upload certificate fingerprint" >&2; exit 1; }
          expected_cert=$(tr -d ':' <<<"$ANDROID_UPLOAD_CERT_SHA256")
          test "$expected_cert" = "$(keytool -list -v -keystore "$secret_dir/upload.jks" -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" | awk -F': ' '/SHA256:/{gsub(":", "", $2); print $2; exit}')"
          jarsigner -keystore "$secret_dir/upload.jks" -storepass:env KEYSTORE_PASSWORD -keypass:env KEY_PASSWORD \
            -sigalg SHA256withRSA -digestalg SHA-256 "$secret_dir/ZUULI-signed.aab" "$KEY_ALIAS"
          signature_report=$(jarsigner -verify -certs "$secret_dir/ZUULI-signed.aab" 2>&1)
          grep -Fq 'jar verified.' <<<"$signature_report"
          if grep -Fqi 'unsigned' <<<"$signature_report"; then
            echo "signed Android bundle still contains unsigned entries" >&2
            exit 1
          fi
          test "$expected_cert" = "$(keytool -printcert -jarfile "$secret_dir/ZUULI-signed.aab" | awk -F': ' '/SHA256:/{gsub(":", "", $2); print $2; exit}')"
          : > "$RUNNER_TEMP/signed-aab-payload.sha256"
          unzip -Z1 "$secret_dir/ZUULI-signed.aab" | while IFS= read -r member; do
            case "$member" in META-INF/*|*/) continue ;; esac
            printf '%s  %s\n' "$(unzip -p "$secret_dir/ZUULI-signed.aab" "$member" | sha256sum | awk '{print $1}')" "$member" >> "$RUNNER_TEMP/signed-aab-payload.sha256"
          done
          cmp "$RUNNER_TEMP/unsigned-aab-payload.sha256" "$RUNNER_TEMP/signed-aab-payload.sha256"
          signed_abis=$(unzip -Z1 "$secret_dir/ZUULI-signed.aab" | awk -F/ '$2 == "lib" && NF >= 4 && $NF ~ /\.so$/ {print $3}' | LC_ALL=C sort -u | paste -sd, -)
          test "$signed_abis" = arm64-v8a,armeabi-v7a,x86,x86_64
          mkdir signed-android
          cp "$secret_dir/ZUULI-signed.aab" "signed-android/ZUULI-${RELEASE_IDENTITY}-android.aab"
          artifact_sha256=$(sha256sum "signed-android/ZUULI-${RELEASE_IDENTITY}-android.aab" | awk '{print $1}')
          jq -n --arg identity "$RELEASE_IDENTITY" --arg sourceSha "$RELEASE_SOURCE_SHA" \
            --arg unsignedSha256 "${{ needs.android-build.outputs.artifact_sha256 }}" --arg signedSha256 "$artifact_sha256" --arg certificateSha256 "$expected_cert" \
            '{schemaVersion:1,kind:"android-signed-universal-aab",identity:$identity,sourceSha:$sourceSha,unsignedSha256:$unsignedSha256,signedSha256:$signedSha256,certificateSha256:$certificateSha256,applicationId:"cash.free2z.zuuli",abis:["arm64-v8a","armeabi-v7a","x86","x86_64"]}' \
            > signed-android/signing-record.json
          (cd signed-android && sha256sum ZUULI-*.aab signing-record.json > CHECKSUMS.sha256)
          if [[ "$DRY_RUN" == false ]]; then
            : "${SERVICE_ACCOUNT_BASE64:?PLAY_SERVICE_ACCOUNT_JSON_BASE64 is not configured}"
            printf '%s' "$SERVICE_ACCOUNT_BASE64" | base64 --decode > "$secret_dir/service-account.json"
            jq -e '.type == "service_account" and .project_id == "corpora1" and .client_email == "corpan-play-verifier@corpora1.iam.gserviceaccount.com" and (.private_key | type == "string" and startswith("-----BEGIN PRIVATE KEY-----"))' "$secret_dir/service-account.json" >/dev/null
            client_email=$(jq -er .client_email "$secret_dir/service-account.json")
            private_key=$(jq -er .private_key "$secret_dir/service-account.json")
            test "$(jq -er .token_uri "$secret_dir/service-account.json")" = https://oauth2.googleapis.com/token
            printf '%s' "$private_key" > "$secret_dir/private-key.pem"
            now=$(date +%s)
            b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
            header=$(printf '%s' '{"alg":"RS256","typ":"JWT"}' | b64url)
            claims=$(jq -cn --arg iss "$client_email" --argjson iat "$now" --argjson exp "$((now + 300))" \
              '{iss:$iss,scope:"https://www.googleapis.com/auth/androidpublisher",aud:"https://oauth2.googleapis.com/token",iat:$iat,exp:$exp}' | b64url)
            unsigned_jwt="$header.$claims"
            signature=$(printf '%s' "$unsigned_jwt" | openssl dgst -sha256 -sign "$secret_dir/private-key.pem" | b64url)
            token=$(curl --fail --silent --show-error \
              --data-urlencode grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer \
              --data-urlencode assertion="$unsigned_jwt.$signature" \
              https://oauth2.googleapis.com/token | jq -er .access_token)
            api=https://androidpublisher.googleapis.com/androidpublisher/v3/applications/cash.free2z.zuuli
            edit_id=$(curl --fail --silent --show-error -X POST \
              -H "Authorization: Bearer $token" -H 'Content-Type: application/json' -d '{}' "$api/edits" | jq -er .id)
            version_code=$(curl --fail --silent --show-error --retry 3 --retry-all-errors -X POST \
              -H "Authorization: Bearer $token" -H 'Content-Type: application/octet-stream' \
              --data-binary @"signed-android/ZUULI-${RELEASE_IDENTITY}-android.aab" \
              "https://androidpublisher.googleapis.com/upload/androidpublisher/v3/applications/cash.free2z.zuuli/edits/$edit_id/bundles?uploadType=media" | jq -er .versionCode)
            test "$version_code" = "${RELEASE_IDENTITY#*+}"
            jq -n --arg versionCode "$version_code" '{releases:[{status:"completed",versionCodes:[$versionCode]}]}' > "$secret_dir/track.json"
            curl --fail --silent --show-error -X PUT \
              -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
              --data-binary @"$secret_dir/track.json" "$api/edits/$edit_id/tracks/internal" >/dev/null
            curl --fail --silent --show-error -X POST \
              -H "Authorization: Bearer $token" "$api/edits/$edit_id:commit" >/dev/null
          fi
          echo "artifact_sha256=$artifact_sha256" >> "$GITHUB_OUTPUT"
      - name: Destroy ephemeral Android credentials
        if: always()
        run: |
          set -euo pipefail
          if find "$RUNNER_TEMP" -maxdepth 1 -name 'zuuli-android-sign.*' -print -quit | grep -q .; then
            echo "ephemeral Android credential directory survived cleanup" >&2
            exit 1
          fi
          if [[ -e "$RUNNER_TEMP/zuuli-android-sign-cleanup-failed" ]]; then
            echo "Android credential cleanup failed" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: internal-zuuli-android-signed-${{ needs.prepare.outputs.identity }}-${{ needs.prepare.outputs.source_sha }}
          path: signed-android
          if-no-files-found: error
          retention-days: 1
      - name: Destroy signed Android output
        if: always()
        run: |
          set -euo pipefail
          find signed-android -depth -delete 2>/dev/null || true
          rm -f -- "$RUNNER_TEMP/unsigned-aab-payload.sha256" "$RUNNER_TEMP/signed-aab-payload.sha256"
          test ! -e signed-android

  android-finalize:
    name: Android / credential-free shipped-artifact provenance
    needs: [prepare, android-sign-upload]
    if: needs.android-sign-upload.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: wallet/zuuli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: internal-zuuli-android-signed-${{ needs.prepare.outputs.identity }}-${{ needs.prepare.outputs.source_sha }}
          path: wallet/zuuli/signed-android
      - name: Verify signed AAB and prepare shipped artifact
        env:
          EXPECTED_IDENTITY: ${{ needs.prepare.outputs.identity }}
          EXPECTED_SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          EXPECTED_SIGNED_SHA256: ${{ needs.android-sign-upload.outputs.artifact_sha256 }}
        run: |
          set -euo pipefail
          (cd signed-android && sha256sum -c CHECKSUMS.sha256)
          jq -e --arg identity "$EXPECTED_IDENTITY" --arg source "$EXPECTED_SOURCE_SHA" --arg sha "$EXPECTED_SIGNED_SHA256" \
            '.schemaVersion == 1 and .kind == "android-signed-universal-aab" and .identity == $identity and .sourceSha == $source and .signedSha256 == $sha and .applicationId == "cash.free2z.zuuli" and .abis == ["arm64-v8a","armeabi-v7a","x86","x86_64"]' signed-android/signing-record.json >/dev/null
          test "$(sha256sum "signed-android/ZUULI-${EXPECTED_IDENTITY}-android.aab" | awk '{print $1}')" = "$EXPECTED_SIGNED_SHA256"
          mkdir release-artifacts
          cp "signed-android/ZUULI-${EXPECTED_IDENTITY}-android.aab" release-artifacts/
      - name: Unpack Android AAB for shipped-artifact SBOM
        run: |
          artifacts=(release-artifacts/*.aab)
          [[ ${#artifacts[@]} -eq 1 && -f "${artifacts[0]}" ]] || { echo "expected exactly one Android AAB" >&2; exit 1; }
          artifact=${artifacts[0]}
          node scripts/artifact-sbom.mjs prepare --artifact="$artifact" --root=artifact-sbom-work/android/root
      - uses: anchore/sbom-action@fbfd9c6c189226748411491745178e0c2017392d # v0.20.10
        with:
          syft-version: v1.50.0
          path: wallet/zuuli/artifact-sbom-work/android/root
          config: wallet/zuuli/syft-artifact.yaml
          format: cyclonedx-json
          output-file: wallet/zuuli/artifact-sbom-work/android/syft.raw.sbom.cdx.json
          upload-artifact: false
      - name: Bind Android shipped-artifact SBOM
        run: |
          artifacts=(release-artifacts/*.aab)
          [[ ${#artifacts[@]} -eq 1 && -f "${artifacts[0]}" ]] || { echo "expected exactly one Android AAB" >&2; exit 1; }
          artifact=${artifacts[0]}
          node scripts/artifact-sbom.mjs finalize-artifact --artifact="$artifact" --root=artifact-sbom-work/android/root --raw-sbom=artifact-sbom-work/android/syft.raw.sbom.cdx.json --sbom=release-artifacts/ZUULI-android.artifact.sbom.cdx.json --binding=release-artifacts/ZUULI-android.artifact.sbom-binding.json
      - name: Record checksums and provenance
        run: |
          artifacts=(release-artifacts/*.aab)
          [[ ${#artifacts[@]} -eq 1 && -f "${artifacts[0]}" ]] || { echo "expected exactly one Android AAB" >&2; exit 1; }
          artifact=${artifacts[0]}
          node scripts/artifact-sbom.mjs verify-artifact --artifact="$artifact" --sbom=release-artifacts/ZUULI-android.artifact.sbom.cdx.json --binding=release-artifacts/ZUULI-android.artifact.sbom-binding.json
          npm run release:manifest -- --artifacts=release-artifacts --checksums=release-artifacts/CHECKSUMS.sha256 --output=release-artifacts/provenance.json
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: wallet/zuuli/release-artifacts/*
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: zuuli-android-${{ needs.prepare.outputs.identity }}-${{ needs.prepare.outputs.source_sha }}
          path: wallet/zuuli/release-artifacts
          if-no-files-found: error
          retention-days: 90

  ios-build:
    name: iOS / credential-free unsigned archive
    needs: prepare
    if: >-
      needs.prepare.outputs.should_release == 'true' &&
      (needs.prepare.outputs.target == 'mobile' ||
      needs.prepare.outputs.target == 'ios' ||
      needs.prepare.outputs.target == 'all')
    runs-on: macos-26
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: wallet/zuuli
    outputs:
      artifact_sha256: ${{ steps.unsigned.outputs.artifact_sha256 }}
      payload_sha256: ${{ steps.unsigned.outputs.payload_sha256 }}
    env:
      ZUULI_RELEASE_SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Fetch origin/main for ancestry check
        run: git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
        working-directory: .
      - name: Fetch librustzcash
        run: git submodule update --init z/zcash/librustzcash
        working-directory: .
      - name: Select and verify Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.6.app
          xcodebuild -version | grep -Fx 'Xcode 26.6'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.18.0"
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          toolchain: ${{ env.ZUULI_RUST_VERSION }}
          targets: aarch64-apple-ios
      - name: Restore reviewed iOS Rust dependencies
        uses: ./.github/actions/zuuli-rust-cache
        with:
          shared-key: zuuli-release-ios-device-v2-rust-${{ env.ZUULI_RUST_VERSION }}-xcode-${{ env.ZUULI_XCODE_VERSION }}-ios18-aarch64-device
          save: "false"
      - name: Prove Apple credentials are absent before dependency code
        run: scripts/assert-no-apple-credentials.sh
      - run: npm ci
      - name: Verify Rust compiler
        run: rustc --version | grep -F "rustc $ZUULI_RUST_VERSION "
      - name: Reverify exact release source
        run: node scripts/release-identity.mjs "--source-sha=$ZUULI_RELEASE_SOURCE_SHA" --require-main
      - name: Build source-bound unsigned archive
        id: unsigned
        env:
          RELEASE_IDENTITY: ${{ needs.prepare.outputs.identity }}
          RELEASE_SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          set -euo pipefail
          node scripts/normalize-generated-ios-project.mjs --prepare-manual-signing
          ./node_modules/.bin/tauri ios build --ci --no-sign --archive-only -- --locked
          node scripts/normalize-generated-ios-project.mjs
          git diff --exit-code
          # `test`, not `[[ ]]`: macOS runners execute this step with bash 3.2,
          # which does not apply `set -e` to a failing bare `[[ ]]`.
          archive=$(scripts/resolve-ios-xcarchive.sh)
          test -d "$archive"
          mkdir unsigned-ios
          ditto -c -k --sequesterRsrc --keepParent "$archive" unsigned-ios/ZUULI.xcarchive.zip
          cat > unsigned-ios/ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>destination</key><string>export</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>method</key><string>app-store-connect</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>signingStyle</key><string>manual</string>
            <key>stripSwiftSymbols</key><true/>
            <key>teamID</key><string>F9AV5HKF6N</string>
            <key>provisioningProfiles</key><dict>
              <key>cash.free2z.zuuli</key><string>ZUULI App Store CI</string>
            </dict>
          </dict></plist>
          PLIST
          version=${RELEASE_IDENTITY%+*}
          build=${RELEASE_IDENTITY#*+}
          jq -n --arg identity "$RELEASE_IDENTITY" --arg sourceSha "$RELEASE_SOURCE_SHA" \
            --arg version "$version" --arg build "$build" \
            '{schemaVersion:1,identity:$identity,sourceSha:$sourceSha,version:$version,build:$build,kind:"ios-unsigned-xcarchive"}' \
            > unsigned-ios/source-record.json
          (cd unsigned-ios && shasum -a 256 ZUULI.xcarchive.zip ExportOptions.plist source-record.json > CHECKSUMS.sha256)
          artifact_sha256=$(shasum -a 256 unsigned-ios/ZUULI.xcarchive.zip | awk '{print $1}')
          payload_sha256=$(shasum -a 256 unsigned-ios/CHECKSUMS.sha256 | awk '{print $1}')
          echo "artifact_sha256=$artifact_sha256" >> "$GITHUB_OUTPUT"
          echo "payload_sha256=$payload_sha256" >> "$GITHUB_OUTPUT"
      - name: Prove Apple credentials remained absent through the build
        run: scripts/assert-no-apple-credentials.sh
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: wallet/zuuli/unsigned-ios/*
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: internal-zuuli-ios-unsigned-${{ needs.prepare.outputs.identity }}-${{ needs.prepare.outputs.source_sha }}
          path: wallet/zuuli/unsigned-ios
          if-no-files-found: error
          retention-days: 1

  ios-sign:
    name: iOS / system export and signing
    needs: [prepare, ios-build]
    if: >-
      needs.prepare.outputs.should_release == 'true' &&
      needs.ios-build.result == 'success'
    runs-on: macos-26
    timeout-minutes: 30
    environment: zuuli-app-stores
    permissions:
      contents: read
      attestations: read
    outputs:
      artifact_sha256: ${{ steps.sign.outputs.artifact_sha256 }}
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: internal-zuuli-ios-unsigned-${{ needs.prepare.outputs.identity }}-${{ needs.prepare.outputs.source_sha }}
          path: unsigned-ios
      - name: Verify source-bound artifact
        env:
          EXPECTED_ARCHIVE_SHA256: ${{ needs.ios-build.outputs.artifact_sha256 }}
          EXPECTED_PAYLOAD_SHA256: ${{ needs.ios-build.outputs.payload_sha256 }}
          EXPECTED_IDENTITY: ${{ needs.prepare.outputs.identity }}
          EXPECTED_SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "invalid expected iOS archive digest" >&2; exit 1; }
          [[ "$EXPECTED_PAYLOAD_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "invalid expected iOS payload digest" >&2; exit 1; }
          expected_members=$(printf '%s\n' \
            ./CHECKSUMS.sha256 ./ExportOptions.plist ./ZUULI.xcarchive.zip ./source-record.json | LC_ALL=C sort)
          actual_members=$(cd unsigned-ios && find . -mindepth 1 -print | LC_ALL=C sort)
          [[ "$actual_members" == "$expected_members" ]] || { echo "unexpected unsigned iOS artifact inventory" >&2; exit 1; }
          for member in CHECKSUMS.sha256 ExportOptions.plist ZUULI.xcarchive.zip source-record.json; do
            [[ -f "unsigned-ios/$member" && ! -L "unsigned-ios/$member" ]] || { echo "unsafe unsigned iOS member: $member" >&2; exit 1; }
          done
          test "$(shasum -a 256 unsigned-ios/CHECKSUMS.sha256 | awk '{print $1}')" = "$EXPECTED_PAYLOAD_SHA256"
          (cd unsigned-ios && shasum -a 256 -c CHECKSUMS.sha256)
          test "$(shasum -a 256 unsigned-ios/ZUULI.xcarchive.zip | awk '{print $1}')" = "$EXPECTED_ARCHIVE_SHA256"
          jq -e --arg identity "$EXPECTED_IDENTITY" --arg source "$EXPECTED_SOURCE_SHA" \
            '.schemaVersion == 1 and .kind == "ios-unsigned-xcarchive" and .identity == $identity and .sourceSha == $source' \
            unsigned-ios/source-record.json
          # The attested canonical manifest and its build-job output bind every
          # unsigned payload member, including ExportOptions.plist.
          gh attestation verify unsigned-ios/CHECKSUMS.sha256 --repo "$GITHUB_REPOSITORY"
          mkdir archive-root
          ditto -x -k unsigned-ios/ZUULI.xcarchive.zip archive-root
          archives=(archive-root/*.xcarchive)
          [[ ${#archives[@]} -eq 1 && -d "${archives[0]}" ]] || { echo "expected exactly one unpacked iOS archive" >&2; exit 1; }
          echo "ZUULI_UNSIGNED_ARCHIVE=${archives[0]}" >> "$GITHUB_ENV"
      - name: Materialize, export, and destroy ephemeral iOS signing credential
        id: sign
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          RELEASE_IDENTITY: ${{ needs.prepare.outputs.identity }}
          RELEASE_SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          UNSIGNED_ARCHIVE_SHA256: ${{ needs.ios-build.outputs.artifact_sha256 }}
        run: |
          set -euo pipefail
          umask 077
          : "${CERTIFICATE_BASE64:?APPLE_DISTRIBUTION_CERTIFICATE_BASE64 is not configured}"
          : "${CERTIFICATE_PASSWORD:?APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD is not configured}"
          : "${PROVISIONING_PROFILE_BASE64:?APPLE_PROVISIONING_PROFILE_BASE64 is not configured}"
          secret_dir=$(mktemp -d "$RUNNER_TEMP/zuuli-ios-sign.XXXXXX")
          keychain="$secret_dir/release.keychain-db"
          original_keychains_file="$secret_dir/original-keychains.txt"
          cleanup_failed="$RUNNER_TEMP/zuuli-ios-sign-cleanup-failed"
          profile_path=""
          rm -f -- "$cleanup_failed"
          security list-keychains -d user | sed -E 's/^[[:space:]]*"([^"]+)"[[:space:]]*$/\1/' > "$original_keychains_file"
          test -s "$original_keychains_file"
          cleanup() {
            set +e
            cleanup_status=0
            if [[ -n "$profile_path" ]] && ! rm -f -- "$profile_path"; then cleanup_status=1; fi
            original_keychains=()
            while IFS= read -r original_keychain; do
              [[ -z "$original_keychain" ]] || original_keychains+=("$original_keychain")
            done < "$original_keychains_file"
            [[ ${#original_keychains[@]} -gt 0 ]] || cleanup_status=1
            [[ ${#original_keychains[@]} -eq 0 ]] || security list-keychains -d user -s "${original_keychains[@]}" || cleanup_status=1
            [[ ! -e "$keychain" ]] || security delete-keychain "$keychain" || cleanup_status=1
            find "$secret_dir" -depth -delete || cleanup_status=1
            [[ "$cleanup_status" -eq 0 ]] || : > "$cleanup_failed"
            return 0
          }
          trap cleanup EXIT
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$secret_dir/distribution.p12"
          printf '%s' "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$secret_dir/zuuli.mobileprovision"
          test -s "$secret_dir/distribution.p12"
          test -s "$secret_dir/zuuli.mobileprovision"
          security cms -D -i "$secret_dir/zuuli.mobileprovision" > "$secret_dir/profile.plist"
          profile_uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$secret_dir/profile.plist")
          profile_name=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$secret_dir/profile.plist")
          profile_team=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$secret_dir/profile.plist")
          profile_app=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$secret_dir/profile.plist")
          [[ "$profile_uuid" == e5ead62c-83ec-4e54-abb6-4770833b5e0d ]] || { echo "unexpected provisioning-profile UUID" >&2; exit 1; }
          [[ "$profile_name" == 'ZUULI App Store CI' ]] || { echo "unexpected provisioning-profile name" >&2; exit 1; }
          [[ "$profile_team" == F9AV5HKF6N ]] || { echo "unexpected provisioning-profile team" >&2; exit 1; }
          [[ "$profile_app" == F9AV5HKF6N.cash.free2z.zuuli ]] || { echo "unexpected provisioning-profile application identifier" >&2; exit 1; }
          keychain_password=$(openssl rand -hex 24)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 1800 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$secret_dir/distribution.p12" -P "$CERTIFICATE_PASSWORD" -t cert -f pkcs12 \
            -T /usr/bin/codesign -T /usr/bin/xcodebuild -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
          identity_sha=$(security find-identity -v -p codesigning "$keychain" | awk '/Apple Distribution: Corpora Inc/ {print $2; exit}')
          [[ "$identity_sha" =~ ^[0-9A-F]{40}$ ]] || { echo "expected exactly one Apple Distribution identity" >&2; exit 1; }
          profile_authorizes_identity=false
          certificate_index=0
          while certificate_base64=$(plutil -extract "DeveloperCertificates.$certificate_index" raw -o - "$secret_dir/profile.plist" 2>/dev/null); do
            printf '%s' "$certificate_base64" | base64 --decode > "$secret_dir/profile-certificate.der"
            profile_sha=$(openssl x509 -inform DER -in "$secret_dir/profile-certificate.der" -noout -fingerprint -sha1 | cut -d= -f2 | tr -d ':')
            [[ "$profile_sha" != "$identity_sha" ]] || profile_authorizes_identity=true
            certificate_index=$((certificate_index + 1))
          done
          [[ "$profile_authorizes_identity" == true ]] || { echo "provisioning profile does not authorize the imported signing identity" >&2; exit 1; }
          profile_dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profile_dir"
          profile_candidate="$profile_dir/$profile_uuid.mobileprovision"
          [[ ! -e "$profile_candidate" ]] || { echo "refusing to overwrite an existing provisioning profile" >&2; exit 1; }
          profile_path="$profile_candidate"
          cp "$secret_dir/zuuli.mobileprovision" "$profile_path"
          mkdir signed-export signed-ios
          xcodebuild -exportArchive \
            -archivePath "$ZUULI_UNSIGNED_ARCHIVE" \
            -exportPath signed-export \
            -exportOptionsPlist unsigned-ios/ExportOptions.plist
          ipas=(signed-export/*.ipa)
          [[ ${#ipas[@]} -eq 1 && -f "${ipas[0]}" ]] || { echo "expected exactly one exported iOS IPA" >&2; exit 1; }
          archive_listing=$(/usr/bin/unzip -Z1 "${ipas[0]}")
          embedded=$(awk -F/ '$1 == "Payload" && $2 ~ /\.app$/ && $3 == "embedded.mobileprovision" {print; exit}' <<<"$archive_listing")
          [[ -n "$embedded" ]] || { echo "exported IPA has no embedded provisioning profile" >&2; exit 1; }
          /usr/bin/unzip -p "${ipas[0]}" "$embedded" > "$secret_dir/embedded.mobileprovision"
          cmp -s "$secret_dir/zuuli.mobileprovision" "$secret_dir/embedded.mobileprovision"
          cp "${ipas[0]}" "signed-ios/ZUULI-${RELEASE_IDENTITY}-ios.ipa"
          ipa_sha256=$(shasum -a 256 "signed-ios/ZUULI-${RELEASE_IDENTITY}-ios.ipa" | awk '{print $1}')
          profile_sha256=$(shasum -a 256 "$secret_dir/zuuli.mobileprovision" | awk '{print $1}')
          jq -n --arg identity "$RELEASE_IDENTITY" --arg sourceSha "$RELEASE_SOURCE_SHA" \
            --arg unsignedArchiveSha256 "$UNSIGNED_ARCHIVE_SHA256" --arg ipaSha256 "$ipa_sha256" \
            --arg profileSha256 "$profile_sha256" --arg signerSha1 "$identity_sha" \
            '{schemaVersion:1,identity:$identity,sourceSha:$sourceSha,kind:"ios-signed-ipa",unsignedArchiveSha256:$unsignedArchiveSha256,ipaSha256:$ipaSha256,profileSha256:$profileSha256,signerSha1:$signerSha1}' \
            > signed-ios/signing-record.json
          (cd signed-ios && shasum -a 256 ./* > CHECKSUMS.sha256)
          artifact_sha256=$(shasum -a 256 "signed-ios/ZUULI-${RELEASE_IDENTITY}-ios.ipa" | awk '{print $1}')
          echo "artifact_sha256=$artifact_sha256" >> "$GITHUB_OUTPUT"
      - name: Destroy ephemeral iOS signing credential
        if: always()
        run: |
          set -euo pipefail
          if find "$RUNNER_TEMP" -maxdepth 1 -name 'zuuli-ios-sign.*' -print -quit | grep -q .; then
            echo "ephemeral iOS signing directory survived cleanup" >&2
            exit 1
          fi
          if security list-keychains -d user | grep -Fq 'zuuli-ios-sign.'; then
            echo "ephemeral iOS signing keychain survived cleanup" >&2
            exit 1
          fi
          if [[ -e "$HOME/Library/MobileDevice/Provisioning Profiles/e5ead62c-83ec-4e54-abb6-4770833b5e0d.mobileprovision" ]]; then
            echo "ephemeral iOS provisioning profile survived cleanup" >&2
            exit 1
          fi
          if [[ -e "$RUNNER_TEMP/zuuli-ios-sign-cleanup-failed" ]]; then
            echo "iOS signing credential cleanup or keychain restoration failed" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: internal-zuuli-ios-signed-${{ needs.prepare.outputs.identity }}-${{ needs.prepare.outputs.source_sha }}
          path: signed-ios
          if-no-files-found: error
          retention-days: 1

  ios-verify:
    name: iOS / credential-free signed artifact verification
    needs: [prepare, ios-sign]
    if: needs.ios-sign.result == 'success'
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      artifact_sha256: ${{ steps.verify.outputs.artifact_sha256 }}
    defaults:
      run:
        working-directory: wallet/zuuli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: internal-zuuli-ios-signed-${{ needs.prepare.outputs.identity }}-${{ needs.prepare.outputs.source_sha }}
          path: wallet/zuuli/signed-ios
      - name: Verify signed IPA and prepare upload payload
        id: verify
        env:
          EXPECTED_IDENTITY: ${{ needs.prepare.outputs.identity }}
          EXPECTED_SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          EXPECTED_IPA_SHA256: ${{ needs.ios-sign.outputs.artifact_sha256 }}
        run: |
          set -euo pipefail
          (cd signed-ios && shasum -a 256 -c CHECKSUMS.sha256)
          jq -e --arg identity "$EXPECTED_IDENTITY" --arg source "$EXPECTED_SOURCE_SHA" --arg sha "$EXPECTED_IPA_SHA256" \
            '.schemaVersion == 1 and .kind == "ios-signed-ipa" and .identity == $identity and .sourceSha == $source and .ipaSha256 == $sha' \
            signed-ios/signing-record.json
          ipa="signed-ios/ZUULI-${EXPECTED_IDENTITY}-ios.ipa"
          profile_sha=$(jq -er .profileSha256 signed-ios/signing-record.json)
          scripts/verify-ios-ipa.sh --expected-profile-sha256 "$profile_sha" "$ipa" F9AV5HKF6N cash.free2z.zuuli
          mkdir verified-ios
          cp "$ipa" signed-ios/signing-record.json scripts/asc-testflight.mjs verified-ios/
          (cd verified-ios && shasum -a 256 ./* > CHECKSUMS.sha256)
          artifact_sha256=$(shasum -a 256 "$ipa" | awk '{print $1}')
          echo "artifact_sha256=$artifact_sha256" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: wallet/zuuli/verified-ios/*
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: internal-zuuli-ios-verified-${{ needs.prepare.outputs.identity }}-${{ needs.prepare.outputs.source_sha }}
          path: wallet/zuuli/verified-ios
          if-no-files-found: error
          retention-days: 1

  ios-upload:
    name: iOS / App Store validation and TestFlight
    needs: [prepare, ios-verify]
    if: needs.ios-verify.result == 'success'
    runs-on: macos-26
    timeout-minutes: 60
    environment: zuuli-app-stores
    permissions:
      contents: read
      attestations: read
    outputs:
      payload_sha256: ${{ steps.upload.outputs.payload_sha256 }}
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: internal-zuuli-ios-verified-${{ needs.prepare.outputs.identity }}-${{ needs.prepare.outputs.source_sha }}
          path: verified-ios
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.18.0"
      - name: Verify source-bound artifact
        env:
          EXPECTED_IPA_SHA256: ${{ needs.ios-verify.outputs.artifact_sha256 }}
          EXPECTED_IDENTITY: ${{ needs.prepare.outputs.identity }}
          EXPECTED_SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd verified-ios && shasum -a 256 -c CHECKSUMS.sha256)
          ipa="verified-ios/ZUULI-${EXPECTED_IDENTITY}-ios.ipa"
          expected_members=$(printf '%s\n' \
            ./CHECKSUMS.sha256 "./ZUULI-${EXPECTED_IDENTITY}-ios.ipa" \
            ./asc-testflight.mjs ./signing-record.json | LC_ALL=C sort)
          actual_members=$(cd verified-ios && find . -mindepth 1 -print | LC_ALL=C sort)
          [[ "$actual_members" == "$expected_members" ]] || { echo "unexpected verified iOS artifact inventory" >&2; exit 1; }
          for member in CHECKSUMS.sha256 "ZUULI-${EXPECTED_IDENTITY}-ios.ipa" asc-testflight.mjs signing-record.json; do
            [[ -f "verified-ios/$member" && ! -L "verified-ios/$member" ]] || { echo "unsafe verified iOS member: $member" >&2; exit 1; }
          done
          test "$(shasum -a 256 "$ipa" | awk '{print $1}')" = "$EXPECTED_IPA_SHA256"
          jq -e --arg identity "$EXPECTED_IDENTITY" --arg source "$EXPECTED_SOURCE_SHA" \
            '.identity == $identity and .sourceSha == $source' verified-ios/signing-record.json
          gh attestation verify "$ipa" --repo "$GITHUB_REPOSITORY"
          gh attestation verify verified-ios/asc-testflight.mjs --repo "$GITHUB_REPOSITORY"
      - name: Materialize, upload, reconcile, and destroy ephemeral ASC credential
        id: upload
        env:
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
          ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
          DRY_RUN: ${{ needs.prepare.outputs.dry_run }}
          RELEASE_IDENTITY: ${{ needs.prepare.outputs.identity }}
        run: |
          set -euo pipefail
          umask 077
          : "${ASC_KEY_BASE64:?ASC_KEY_BASE64 is not configured}"
          : "${ASC_KEY_ID:?ASC_KEY_ID is not configured}"
          : "${ASC_ISSUER_ID:?ASC_ISSUER_ID is not configured}"
          secret_dir=$(mktemp -d "$RUNNER_TEMP/zuuli-ios-asc.XXXXXX")
          cleanup() { find "$secret_dir" -depth -delete 2>/dev/null || true; }
          trap cleanup EXIT
          mkdir "$secret_dir/private_keys"
          printf '%s' "$ASC_KEY_BASE64" | base64 --decode > "$secret_dir/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          test -s "$secret_dir/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          ipa="$GITHUB_WORKSPACE/verified-ios/ZUULI-${RELEASE_IDENTITY}-ios.ipa"
          (cd "$secret_dir" && xcrun altool --validate-app --type ios --file "$ipa" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID")
          mkdir uploaded-ios
          cp verified-ios/* uploaded-ios/
          if [[ "$DRY_RUN" == false ]]; then
            (cd "$secret_dir" && xcrun altool --upload-app --type ios --file "$ipa" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID")
            version=${RELEASE_IDENTITY%+*}
            build=${RELEASE_IDENTITY#*+}
            ASC_KEY_PATH="$secret_dir/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
              node verified-ios/asc-testflight.mjs --ensure "--version=$version" "--build=$build" \
                --output=uploaded-ios/testflight.json
          fi
          find uploaded-ios -name CHECKSUMS.sha256 -delete
          (cd uploaded-ios && shasum -a 256 ./* > CHECKSUMS.sha256)
          payload_sha256=$(shasum -a 256 uploaded-ios/CHECKSUMS.sha256 | awk '{print $1}')
          echo "payload_sha256=$payload_sha256" >> "$GITHUB_OUTPUT"
      - name: Destroy ephemeral ASC credential
        if: always()
        run: |
          set -euo pipefail
          if find "$RUNNER_TEMP" -maxdepth 1 -name 'zuuli-ios-asc.*' -print -quit | grep -q .; then
            echo "ephemeral ASC credential directory survived cleanup" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: internal-zuuli-ios-uploaded-${{ needs.prepare.outputs.identity }}-${{ needs.prepare.outputs.source_sha }}
          path: uploaded-ios
          if-no-files-found: error
          retention-days: 1

  ios-finalize:
    name: iOS / credential-free shipped-artifact provenance
    needs: [prepare, ios-upload]
    if: needs.ios-upload.result == 'success'
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: wallet/zuuli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.18.0"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: internal-zuuli-ios-uploaded-${{ needs.prepare.outputs.identity }}-${{ needs.prepare.outputs.source_sha }}
          path: wallet/zuuli/uploaded-ios
      - name: Verify uploaded payload and collect shipped artifact
        env:
          EXPECTED_PAYLOAD_SHA256: ${{ needs.ios-upload.outputs.payload_sha256 }}
          EXPECTED_IDENTITY: ${{ needs.prepare.outputs.identity }}
        run: |
          set -euo pipefail
          test "$(shasum -a 256 uploaded-ios/CHECKSUMS.sha256 | awk '{print $1}')" = "$EXPECTED_PAYLOAD_SHA256"
          (cd uploaded-ios && shasum -a 256 -c CHECKSUMS.sha256)
          mkdir release-artifacts
          cp "uploaded-ios/ZUULI-${EXPECTED_IDENTITY}-ios.ipa" uploaded-ios/signing-record.json release-artifacts/
          [[ ! -f uploaded-ios/testflight.json ]] || cp uploaded-ios/testflight.json release-artifacts/
      - name: Unpack iOS IPA for shipped-artifact SBOM
        run: |
          artifacts=(release-artifacts/*.ipa)
          [[ ${#artifacts[@]} -eq 1 && -f "${artifacts[0]}" ]] || { echo "expected exactly one iOS IPA" >&2; exit 1; }
          artifact=${artifacts[0]}
          node scripts/artifact-sbom.mjs prepare --artifact="$artifact" --root=artifact-sbom-work/ios/root
      - uses: anchore/sbom-action@fbfd9c6c189226748411491745178e0c2017392d # v0.20.10
        with:
          syft-version: v1.50.0
          path: wallet/zuuli/artifact-sbom-work/ios/root
          config: wallet/zuuli/syft-artifact.yaml
          format: cyclonedx-json
          output-file: wallet/zuuli/artifact-sbom-work/ios/syft.raw.sbom.cdx.json
          upload-artifact: false
      - name: Bind iOS shipped-artifact SBOM
        run: |
          artifacts=(release-artifacts/*.ipa)
          [[ ${#artifacts[@]} -eq 1 && -f "${artifacts[0]}" ]] || { echo "expected exactly one iOS IPA" >&2; exit 1; }
          artifact=${artifacts[0]}
          node scripts/artifact-sbom.mjs finalize-artifact --artifact="$artifact" --root=artifact-sbom-work/ios/root --raw-sbom=artifact-sbom-work/ios/syft.raw.sbom.cdx.json --sbom=release-artifacts/ZUULI-ios.artifact.sbom.cdx.json --binding=release-artifacts/ZUULI-ios.artifact.sbom-binding.json
      - name: Record checksums and provenance
        run: |
          artifacts=(release-artifacts/*.ipa)
          [[ ${#artifacts[@]} -eq 1 && -f "${artifacts[0]}" ]] || { echo "expected exactly one iOS IPA" >&2; exit 1; }
          artifact=${artifacts[0]}
          node scripts/artifact-sbom.mjs verify-artifact --artifact="$artifact" --sbom=release-artifacts/ZUULI-ios.artifact.sbom.cdx.json --binding=release-artifacts/ZUULI-ios.artifact.sbom-binding.json
          node scripts/release-manifest.mjs --artifacts=release-artifacts --checksums=release-artifacts/CHECKSUMS.sha256 --output=release-artifacts/provenance.json
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: wallet/zuuli/release-artifacts/*
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: zuuli-ios-${{ needs.prepare.outputs.identity }}-${{ needs.prepare.outputs.source_sha }}
          path: wallet/zuuli/release-artifacts
          if-no-files-found: error
          retention-days: 90

  linux:
    name: Linux release packages
    needs: prepare
    if: >-
      needs.prepare.outputs.should_release == 'true' &&
      (needs.prepare.outputs.target == 'desktop' ||
      needs.prepare.outputs.target == 'all')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
      id-token: write
      attestations: write
    container:
      image: ghcr.io/free2z/zuuli-linux-ci@sha256:e94d8795fd3c3265caec0f5fc2fa814391e22d2d6e574649a75e686e6e967406
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        working-directory: wallet/zuuli
        shell: bash
    steps:
      - name: Verify pinned Linux build image
        working-directory: /
        run: |
          set -euo pipefail
          /usr/local/bin/verify-zuuli-linux-image
          test -n "$BASH_VERSION"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Configure exact Git workspace trust
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Fetch origin/main for release verification
        run: git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
        working-directory: .
      - name: Fetch librustzcash
        run: git submodule update --init z/zcash/librustzcash
        working-directory: .
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: "24.18.0" }
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with: { toolchain: "${{ env.ZUULI_RUST_VERSION }}" }
      - name: Restore reviewed Linux Rust dependencies
        uses: ./.github/actions/zuuli-rust-cache
        with:
          shared-key: zuuli-release-linux-v2-rust-${{ env.ZUULI_RUST_VERSION }}-ubuntu-24.04-gtk-webkit-4.1
          save: "false"
      - name: Install pinned Cargo audit instrumentation
        run: |
          cargo install --locked cargo-auditable --version 0.7.5
          cargo install --list | grep -Fx 'cargo-auditable v0.7.5:'
      - run: npm ci
      - name: Reverify exact release source
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: node scripts/release-identity.mjs "--source-sha=$SOURCE_SHA" --require-main
      - name: Verify Rust compiler
        run: rustc --version | grep -F "rustc $ZUULI_RUST_VERSION "
      - name: Build Linux packages with Cargo audit instrumentation
        run: |
          scripts/run-with-cargo-auditable.sh ./node_modules/.bin/tauri build --bundles appimage,deb,rpm -- --locked
      - run: git diff --exit-code
      - name: Collect packages
        run: |
          mkdir release-artifacts
          find src-tauri/target -path '*/release/bundle/*' -type f \
            \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) -exec cp {} release-artifacts/ \;
          for extension in AppImage deb rpm; do
            test -n "$(find release-artifacts -type f -name "*.$extension" -size +0c -print -quit)"
          done
      - name: Prepare Linux shipped-artifact inventories
        run: |
          appimages=(release-artifacts/*.AppImage)
          debs=(release-artifacts/*.deb)
          rpms=(release-artifacts/*.rpm)
          [[ ${#appimages[@]} -eq 1 && -f "${appimages[0]}" ]] || { echo "expected exactly one Linux AppImage" >&2; exit 1; }
          [[ ${#debs[@]} -eq 1 && -f "${debs[0]}" ]] || { echo "expected exactly one Linux deb" >&2; exit 1; }
          [[ ${#rpms[@]} -eq 1 && -f "${rpms[0]}" ]] || { echo "expected exactly one Linux rpm" >&2; exit 1; }
          node scripts/artifact-sbom.mjs prepare --artifact="${appimages[0]}" --root=artifact-sbom-work/linux-appimage/root
          node scripts/artifact-sbom.mjs prepare --artifact="${debs[0]}" --root=artifact-sbom-work/linux-deb/root
          node scripts/artifact-sbom.mjs prepare --artifact="${rpms[0]}" --root=artifact-sbom-work/linux-rpm/root
      - name: Scan Linux AppImage shipped artifact
        uses: anchore/sbom-action@fbfd9c6c189226748411491745178e0c2017392d # v0.20.10
        with:
          syft-version: v1.50.0
          path: wallet/zuuli/artifact-sbom-work/linux-appimage/root
          config: wallet/zuuli/syft-artifact.yaml
          format: cyclonedx-json
          output-file: wallet/zuuli/artifact-sbom-work/linux-appimage/syft.raw.sbom.cdx.json
          upload-artifact: false
      - name: Scan Linux deb shipped artifact
        uses: anchore/sbom-action@fbfd9c6c189226748411491745178e0c2017392d # v0.20.10
        with:
          syft-version: v1.50.0
          path: wallet/zuuli/artifact-sbom-work/linux-deb/root
          config: wallet/zuuli/syft-artifact.yaml
          format: cyclonedx-json
          output-file: wallet/zuuli/artifact-sbom-work/linux-deb/syft.raw.sbom.cdx.json
          upload-artifact: false
      - name: Scan Linux rpm shipped artifact
        uses: anchore/sbom-action@fbfd9c6c189226748411491745178e0c2017392d # v0.20.10
        with:
          syft-version: v1.50.0
          path: wallet/zuuli/artifact-sbom-work/linux-rpm/root
          config: wallet/zuuli/syft-artifact.yaml
          format: cyclonedx-json
          output-file: wallet/zuuli/artifact-sbom-work/linux-rpm/syft.raw.sbom.cdx.json
          upload-artifact: false
      - name: Bind Linux shipped-artifact SBOMs
        run: |
          appimages=(release-artifacts/*.AppImage)
          debs=(release-artifacts/*.deb)
          rpms=(release-artifacts/*.rpm)
          node scripts/artifact-sbom.mjs finalize-artifact --artifact="${appimages[0]}" --root=artifact-sbom-work/linux-appimage/root --raw-sbom=artifact-sbom-work/linux-appimage/syft.raw.sbom.cdx.json --sbom=release-artifacts/ZUULI-linux-appimage.artifact.sbom.cdx.json --binding=release-artifacts/ZUULI-linux-appimage.artifact.sbom-binding.json --cargo-lock=src-tauri/Cargo.lock --cargo-manifest=src-tauri/Cargo.toml --cargo-target=x86_64-unknown-linux-gnu --cargo-features=default
          node scripts/artifact-sbom.mjs finalize-artifact --artifact="${debs[0]}" --root=artifact-sbom-work/linux-deb/root --raw-sbom=artifact-sbom-work/linux-deb/syft.raw.sbom.cdx.json --sbom=release-artifacts/ZUULI-linux-deb.artifact.sbom.cdx.json --binding=release-artifacts/ZUULI-linux-deb.artifact.sbom-binding.json --cargo-lock=src-tauri/Cargo.lock --cargo-manifest=src-tauri/Cargo.toml --cargo-target=x86_64-unknown-linux-gnu --cargo-features=default
          node scripts/artifact-sbom.mjs finalize-artifact --artifact="${rpms[0]}" --root=artifact-sbom-work/linux-rpm/root --raw-sbom=artifact-sbom-work/linux-rpm/syft.raw.sbom.cdx.json --sbom=release-artifacts/ZUULI-linux-rpm.artifact.sbom.cdx.json --binding=release-artifacts/ZUULI-linux-rpm.artifact.sbom-binding.json --cargo-lock=src-tauri/Cargo.lock --cargo-manifest=src-tauri/Cargo.toml --cargo-target=x86_64-unknown-linux-gnu --cargo-features=default
      - name: Prepare explicitly labeled source inventory
        run: mkdir -p artifact-sbom-work
      - uses: anchore/sbom-action@fbfd9c6c189226748411491745178e0c2017392d # v0.20.10
        with:
          {
            syft-version: v1.50.0,
            path: wallet/zuuli,
            config: wallet/zuuli/syft.yaml,
            format: cyclonedx-json,
            output-file: wallet/zuuli/artifact-sbom-work/ZUULI-linux.source.raw.sbom.cdx.json,
            upload-artifact: false,
          }
      - name: Label Linux SBOM as source inventory
        run: node scripts/artifact-sbom.mjs label-source --raw-sbom=artifact-sbom-work/ZUULI-linux.source.raw.sbom.cdx.json --sbom=release-artifacts/ZUULI-linux.source.sbom.cdx.json --source-root=wallet/zuuli
      - name: Record checksums and provenance
        run: |
          appimages=(release-artifacts/*.AppImage)
          debs=(release-artifacts/*.deb)
          rpms=(release-artifacts/*.rpm)
          node scripts/artifact-sbom.mjs verify-artifact --artifact="${appimages[0]}" --sbom=release-artifacts/ZUULI-linux-appimage.artifact.sbom.cdx.json --binding=release-artifacts/ZUULI-linux-appimage.artifact.sbom-binding.json --cargo-lock=src-tauri/Cargo.lock --cargo-manifest=src-tauri/Cargo.toml --cargo-target=x86_64-unknown-linux-gnu --cargo-features=default
          node scripts/artifact-sbom.mjs verify-artifact --artifact="${debs[0]}" --sbom=release-artifacts/ZUULI-linux-deb.artifact.sbom.cdx.json --binding=release-artifacts/ZUULI-linux-deb.artifact.sbom-binding.json --cargo-lock=src-tauri/Cargo.lock --cargo-manifest=src-tauri/Cargo.toml --cargo-target=x86_64-unknown-linux-gnu --cargo-features=default
          node scripts/artifact-sbom.mjs verify-artifact --artifact="${rpms[0]}" --sbom=release-artifacts/ZUULI-linux-rpm.artifact.sbom.cdx.json --binding=release-artifacts/ZUULI-linux-rpm.artifact.sbom-binding.json --cargo-lock=src-tauri/Cargo.lock --cargo-manifest=src-tauri/Cargo.toml --cargo-target=x86_64-unknown-linux-gnu --cargo-features=default
          jq -e '(.metadata.properties // [] | any(.name == "free2z:inventory-scope" and .value == "source-tree")) and ((.components // []) | length >= 50)' release-artifacts/ZUULI-linux.source.sbom.cdx.json
          npm run release:manifest -- --artifacts=release-artifacts --checksums=release-artifacts/CHECKSUMS.sha256 --output=release-artifacts/provenance.json
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with: { subject-path: "wallet/zuuli/release-artifacts/*" }
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          {
            name: "zuuli-linux-${{ needs.prepare.outputs.identity }}-${{ needs.prepare.outputs.source_sha }}",
            path: wallet/zuuli/release-artifacts,
            if-no-files-found: error,
            retention-days: 90,
          }

  macos-build:
    name: macOS / credential-free unsigned packages
    needs: prepare
    if: >-
      needs.prepare.outputs.should_release == 'true' &&
      (needs.prepare.outputs.target == 'desktop' ||
      needs.prepare.outputs.target == 'all')
    runs-on: macos-26
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: wallet/zuuli
    outputs:
      artifact_sha256: ${{ steps.unsigned.outputs.artifact_sha256 }}
      payload_sha256: ${{ steps.unsigned.outputs.payload_sha256 }}
    env:
      ZUULI_RELEASE_SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Fetch origin/main for release verification
        run: git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
        working-directory: .
      - name: Fetch librustzcash
        run: git submodule update --init z/zcash/librustzcash
        working-directory: .
      - name: Select and verify Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.6.app
          xcodebuild -version | grep -Fx 'Xcode 26.6'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: "24.18.0" }
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          {
            toolchain: "${{ env.ZUULI_RUST_VERSION }}",
            targets: "aarch64-apple-darwin,x86_64-apple-darwin",
          }
      - name: Restore reviewed macOS Rust dependencies
        uses: ./.github/actions/zuuli-rust-cache
        with:
          shared-key: zuuli-release-macos-universal-v2-rust-${{ env.ZUULI_RUST_VERSION }}-xcode-${{ env.ZUULI_XCODE_VERSION }}-macos-arm64-x86_64
          save: "false"
      - name: Prove Apple credentials are absent before dependency code
        run: scripts/assert-no-apple-credentials.sh
      - run: npm ci
      - name: Verify macOS Keychain entitlement policy
        run: node scripts/macos-keychain-entitlements.mjs
      - name: Reverify exact release source
        run: node scripts/release-identity.mjs "--source-sha=$ZUULI_RELEASE_SOURCE_SHA" --require-main
      - name: Verify Rust compiler
        run: rustc --version | grep -F "rustc $ZUULI_RUST_VERSION "
      - name: Build source-bound unsigned universal packages
        id: unsigned
        env:
          RELEASE_IDENTITY: ${{ needs.prepare.outputs.identity }}
          RELEASE_SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          set -euo pipefail
          unset APPLE_SIGNING_IDENTITY APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_PATH
          ./node_modules/.bin/tauri build --target universal-apple-darwin --bundles app,dmg --no-sign -- --locked
          git diff --exit-code
          apps=(src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app)
          dmgs=(src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          [[ ${#apps[@]} -eq 1 && -d "${apps[0]}" ]] || { echo "expected exactly one unsigned macOS app" >&2; exit 1; }
          [[ ${#dmgs[@]} -eq 1 && -f "${dmgs[0]}" ]] || { echo "expected exactly one unsigned macOS layout DMG" >&2; exit 1; }
          mkdir unsigned-macos
          ditto -c -k --sequesterRsrc --keepParent "${apps[0]}" unsigned-macos/ZUULI.app.zip
          cp "${dmgs[0]}" unsigned-macos/ZUULI-layout.dmg
          cp src-tauri/Entitlements.plist unsigned-macos/Entitlements.plist
          jq -n --arg identity "$RELEASE_IDENTITY" --arg sourceSha "$RELEASE_SOURCE_SHA" \
            '{schemaVersion:1,identity:$identity,sourceSha:$sourceSha,kind:"macos-unsigned-app-and-layout"}' \
            > unsigned-macos/source-record.json
          (cd unsigned-macos && shasum -a 256 Entitlements.plist ZUULI.app.zip ZUULI-layout.dmg source-record.json > CHECKSUMS.sha256)
          artifact_sha256=$(shasum -a 256 unsigned-macos/ZUULI.app.zip | awk '{print $1}')
          payload_sha256=$(shasum -a 256 unsigned-macos/CHECKSUMS.sha256 | awk '{print $1}')
          echo "artifact_sha256=$artifact_sha256" >> "$GITHUB_OUTPUT"
          echo "payload_sha256=$payload_sha256" >> "$GITHUB_OUTPUT"
      - name: Prove Apple credentials remained absent through the build
        run: scripts/assert-no-apple-credentials.sh
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: wallet/zuuli/unsigned-macos/*
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: internal-zuuli-macos-unsigned-${{ needs.prepare.outputs.identity }}-${{ needs.prepare.outputs.source_sha }}
          path: wallet/zuuli/unsigned-macos
          if-no-files-found: error
          retention-days: 1

  macos-sign:
    name: macOS / system signing and notarization
    needs: [prepare, macos-build]
    if: >-
      needs.prepare.outputs.should_release == 'true' &&
      needs.macos-build.result == 'success'
    runs-on: macos-26
    timeout-minutes: 90
    environment: zuuli-app-stores
    permissions:
      contents: read
      attestations: read
    outputs:
      artifact_sha256: ${{ steps.package.outputs.artifact_sha256 }}
    env:
      APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_DEVELOPER_ID_IDENTITY }}
      ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: internal-zuuli-macos-unsigned-${{ needs.prepare.outputs.identity }}-${{ needs.prepare.outputs.source_sha }}
          path: unsigned-macos
      - name: Verify source-bound artifact
        env:
          EXPECTED_APP_SHA256: ${{ needs.macos-build.outputs.artifact_sha256 }}
          EXPECTED_PAYLOAD_SHA256: ${{ needs.macos-build.outputs.payload_sha256 }}
          EXPECTED_IDENTITY: ${{ needs.prepare.outputs.identity }}
          EXPECTED_SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_APP_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "invalid expected macOS app digest" >&2; exit 1; }
          [[ "$EXPECTED_PAYLOAD_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "invalid expected macOS payload digest" >&2; exit 1; }
          expected_members=$(printf '%s\n' \
            ./CHECKSUMS.sha256 ./Entitlements.plist ./ZUULI-layout.dmg ./ZUULI.app.zip ./source-record.json | LC_ALL=C sort)
          actual_members=$(cd unsigned-macos && find . -mindepth 1 -print | LC_ALL=C sort)
          [[ "$actual_members" == "$expected_members" ]] || { echo "unexpected unsigned macOS artifact inventory" >&2; exit 1; }
          for member in CHECKSUMS.sha256 Entitlements.plist ZUULI-layout.dmg ZUULI.app.zip source-record.json; do
            [[ -f "unsigned-macos/$member" && ! -L "unsigned-macos/$member" ]] || { echo "unsafe unsigned macOS member: $member" >&2; exit 1; }
          done
          test "$(shasum -a 256 unsigned-macos/CHECKSUMS.sha256 | awk '{print $1}')" = "$EXPECTED_PAYLOAD_SHA256"
          (cd unsigned-macos && shasum -a 256 -c CHECKSUMS.sha256)
          test "$(shasum -a 256 unsigned-macos/ZUULI.app.zip | awk '{print $1}')" = "$EXPECTED_APP_SHA256"
          jq -e --arg identity "$EXPECTED_IDENTITY" --arg source "$EXPECTED_SOURCE_SHA" \
            '.schemaVersion == 1 and .kind == "macos-unsigned-app-and-layout" and .identity == $identity and .sourceSha == $source' \
            unsigned-macos/source-record.json
          # The attested canonical manifest and its build-job output bind both
          # the app archive and the creator-controlled shipping layout DMG.
          gh attestation verify unsigned-macos/CHECKSUMS.sha256 --repo "$GITHUB_REPOSITORY"
          mkdir signing-work
          ditto -x -k unsigned-macos/ZUULI.app.zip signing-work
          apps=(signing-work/*.app)
          [[ ${#apps[@]} -eq 1 && -d "${apps[0]}" ]] || { echo "expected exactly one unpacked macOS app" >&2; exit 1; }
          echo "ZUULI_SIGNED_APP=${apps[0]}" >> "$GITHUB_ENV"
      - name: Materialize, sign app, and destroy ephemeral Developer ID credential
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          : "${APPLE_SIGNING_IDENTITY:?APPLE_DEVELOPER_ID_IDENTITY is not configured}"
          : "${CERTIFICATE_BASE64:?APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 is not configured}"
          : "${CERTIFICATE_PASSWORD:?APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD is not configured}"
          : "${PROVISIONING_PROFILE_BASE64:?APPLE_DEVELOPER_ID_PROVISIONING_PROFILE_BASE64 is not configured}"
          secret_dir=$(mktemp -d "$RUNNER_TEMP/zuuli-macos-app-sign.XXXXXX")
          keychain="$secret_dir/signing.keychain-db"
          original_keychains_file="$secret_dir/original-keychains.txt"
          cleanup_failed="$RUNNER_TEMP/zuuli-macos-app-sign-cleanup-failed"
          keychain_password=$(openssl rand -hex 24)
          rm -f -- "$cleanup_failed"
          security list-keychains -d user | sed -E 's/^[[:space:]]*"([^"]+)"[[:space:]]*$/\1/' > "$original_keychains_file"
          test -s "$original_keychains_file"
          cleanup() {
            set +e
            cleanup_status=0
            original_keychains=()
            while IFS= read -r original_keychain; do
              [[ -z "$original_keychain" ]] || original_keychains+=("$original_keychain")
            done < "$original_keychains_file"
            [[ ${#original_keychains[@]} -gt 0 ]] || cleanup_status=1
            [[ ${#original_keychains[@]} -eq 0 ]] || security list-keychains -d user -s "${original_keychains[@]}" || cleanup_status=1
            [[ ! -e "$keychain" ]] || security delete-keychain "$keychain" || cleanup_status=1
            find "$secret_dir" -depth -delete || cleanup_status=1
            [[ "$cleanup_status" -eq 0 ]] || : > "$cleanup_failed"
            return 0
          }
          trap cleanup EXIT
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$secret_dir/developer-id.p12"
          printf '%s' "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$secret_dir/zuuli.provisionprofile"
          test -s "$secret_dir/developer-id.p12"
          test -s "$secret_dir/zuuli.provisionprofile"
          security cms -D -i "$secret_dir/zuuli.provisionprofile" > "$secret_dir/profile.plist"
          verify_developer_id_profile() {
            local profile_plist=$1
            local profile_now=$2
            local team_count group_count group_index group created expiration created_epoch expiration_epoch
            team_count=$(plutil -extract TeamIdentifier raw -expect array -o - -- "$profile_plist")
            [[ "$team_count" == 1 ]] || { echo "Developer ID profile must contain exactly one team identifier" >&2; return 1; }
            [[ "$(plutil -extract TeamIdentifier.0 raw -expect string -o - -- "$profile_plist")" == F9AV5HKF6N ]] || { echo "Developer ID profile team identifier is unauthorized" >&2; return 1; }
            [[ "$(plutil -extract ProvisionsAllDevices raw -expect bool -o - -- "$profile_plist")" == true ]] || { echo "Developer ID profile is not a distribution profile" >&2; return 1; }
            [[ "$(plutil -extract 'Entitlements.com\.apple\.application-identifier' raw -expect string -o - -- "$profile_plist")" == F9AV5HKF6N.cash.free2z.zuuli ]] || { echo "Developer ID profile application identifier is unauthorized" >&2; return 1; }
            group_count=$(plutil -extract Entitlements.keychain-access-groups raw -expect array -o - -- "$profile_plist")
            [[ "$group_count" =~ ^[0-9]+$ && "$group_count" -gt 0 ]] || { echo "Developer ID profile has no keychain access groups" >&2; return 1; }
            group_index=0
            while (( group_index < group_count )); do
              group=$(plutil -extract "Entitlements.keychain-access-groups.${group_index}" raw -expect string -o - -- "$profile_plist")
              [[ "$group" == F9AV5HKF6N.cash.free2z.zuuli || "$group" == 'F9AV5HKF6N.*' ]] || { echo "Developer ID profile contains an unauthorized keychain access group" >&2; return 1; }
              (( group_index += 1 ))
            done
            created=$(plutil -extract CreationDate raw -expect date -o - -- "$profile_plist")
            expiration=$(plutil -extract ExpirationDate raw -expect date -o - -- "$profile_plist")
            created_epoch=$(date -j -u -f "%Y-%m-%dT%H:%M:%SZ" "$created" "+%s")
            expiration_epoch=$(date -j -u -f "%Y-%m-%dT%H:%M:%SZ" "$expiration" "+%s")
            [[ "$profile_now" =~ ^[0-9]+$ ]] || { echo "current profile verification time is invalid" >&2; return 1; }
            (( created_epoch <= profile_now && profile_now < expiration_epoch )) || { echo "Developer ID profile is outside its validity window" >&2; return 1; }
          }
          profile_now=$(date -u +%s)
          verify_developer_id_profile "$secret_dir/profile.plist" "$profile_now"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 1800 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$secret_dir/developer-id.p12" -P "$CERTIFICATE_PASSWORD" -t cert -f pkcs12 \
            -T /usr/bin/codesign -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
          identity_count=$(security find-identity -v -p codesigning "$keychain" | grep -Fc "$APPLE_SIGNING_IDENTITY" || true)
          [[ "$identity_count" -eq 1 ]] || { echo "expected exactly one Developer ID signing identity" >&2; exit 1; }
          identity_sha=$(security find-identity -v -p codesigning "$keychain" | grep -F "$APPLE_SIGNING_IDENTITY" | awk '{print $2}')
          [[ "$identity_sha" =~ ^[0-9A-F]{40}$ ]] || { echo "invalid Developer ID signing identity digest" >&2; exit 1; }
          profile_authorizes_identity=false
          certificate_index=0
          while certificate_base64=$(plutil -extract "DeveloperCertificates.$certificate_index" raw -o - "$secret_dir/profile.plist" 2>/dev/null); do
            printf '%s' "$certificate_base64" | base64 --decode > "$secret_dir/profile-certificate.der"
            profile_sha=$(openssl x509 -inform DER -in "$secret_dir/profile-certificate.der" -noout -fingerprint -sha1 | cut -d= -f2 | tr -d ':')
            [[ "$profile_sha" != "$identity_sha" ]] || profile_authorizes_identity=true
            certificate_index=$((certificate_index + 1))
          done
          [[ "$profile_authorizes_identity" == true ]] || { echo "Developer ID profile does not authorize the imported signing identity" >&2; exit 1; }
          verify_keychain_entitlements() {
            local entitlements=$1
            plutil -lint "$entitlements"
            test "$(plutil -convert json -o - "$entitlements" | jq -r '."com.apple.application-identifier"')" = F9AV5HKF6N.cash.free2z.zuuli
            test "$(plutil -convert json -o - "$entitlements" | jq -r '."com.apple.developer.team-identifier"')" = F9AV5HKF6N
            test "$(plutil -convert json -o - "$entitlements" | jq -r '."keychain-access-groups"[0]')" = F9AV5HKF6N.cash.free2z.zuuli
            test "$(plutil -convert json -o - "$entitlements" | jq -r '."keychain-access-groups" | length')" = 1
            test "$(plutil -convert json -o - "$entitlements" | jq -r 'keys | sort | join(",")')" = com.apple.application-identifier,com.apple.developer.team-identifier,keychain-access-groups
          }
          verify_keychain_entitlements unsigned-macos/Entitlements.plist
          cp "$secret_dir/zuuli.provisionprofile" "$ZUULI_SIGNED_APP/Contents/embedded.provisionprofile"
          codesign --force --deep --options runtime --timestamp \
            --entitlements unsigned-macos/Entitlements.plist \
            --sign "$APPLE_SIGNING_IDENTITY" "$ZUULI_SIGNED_APP"
          codesign --verify --deep --strict --verbose=2 "$ZUULI_SIGNED_APP"
          codesign -d --entitlements :- "$ZUULI_SIGNED_APP" > "$secret_dir/signed-entitlements.plist" 2>/dev/null
          verify_keychain_entitlements "$secret_dir/signed-entitlements.plist"
      - name: Destroy ephemeral app-signing credential
        if: always()
        run: |
          set -euo pipefail
          if find "$RUNNER_TEMP" -maxdepth 1 -name 'zuuli-macos-app-sign.*' -print -quit | grep -q .; then
            echo "ephemeral app-signing directory survived cleanup" >&2
            exit 1
          fi
          if security list-keychains -d user | grep -Fq 'zuuli-macos-app-sign.'; then
            echo "ephemeral app-signing keychain survived cleanup" >&2
            exit 1
          fi
          if [[ -e "$RUNNER_TEMP/zuuli-macos-app-sign-cleanup-failed" ]]; then
            echo "app-signing credential cleanup or keychain restoration failed" >&2
            exit 1
          fi
      - name: Materialize, notarize app, and destroy ephemeral ASC credential
        env:
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          : "${ASC_KEY_BASE64:?ASC_KEY_BASE64 is not configured}"
          : "${ASC_KEY_ID:?ASC_KEY_ID is not configured}"
          : "${ASC_ISSUER_ID:?ASC_ISSUER_ID is not configured}"
          secret_dir=$(mktemp -d "$RUNNER_TEMP/zuuli-macos-app-notary.XXXXXX")
          cleanup() { find "$secret_dir" -depth -delete 2>/dev/null || true; }
          trap cleanup EXIT
          printf '%s' "$ASC_KEY_BASE64" | base64 --decode > "$secret_dir/AuthKey.p8"
          ditto -c -k --keepParent "$ZUULI_SIGNED_APP" "$secret_dir/ZUULI.app.zip"
          xcrun notarytool submit "$secret_dir/ZUULI.app.zip" --wait \
            --key "$secret_dir/AuthKey.p8" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID"
          xcrun stapler staple "$ZUULI_SIGNED_APP"
          xcrun stapler validate "$ZUULI_SIGNED_APP"
      - name: Destroy ephemeral app-notarization credential
        if: always()
        run: |
          set -euo pipefail
          if find "$RUNNER_TEMP" -maxdepth 1 -name 'zuuli-macos-app-notary.*' -print -quit | grep -q .; then
            echo "ephemeral app-notarization directory survived cleanup" >&2
            exit 1
          fi
      - name: Materialize, create and sign DMG, and destroy ephemeral Developer ID credential
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          RELEASE_IDENTITY: ${{ needs.prepare.outputs.identity }}
        run: |
          set -euo pipefail
          umask 077
          : "${APPLE_SIGNING_IDENTITY:?APPLE_DEVELOPER_ID_IDENTITY is not configured}"
          : "${CERTIFICATE_BASE64:?APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 is not configured}"
          : "${CERTIFICATE_PASSWORD:?APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD is not configured}"
          secret_dir=$(mktemp -d "$RUNNER_TEMP/zuuli-macos-dmg-sign.XXXXXX")
          keychain="$secret_dir/signing.keychain-db"
          original_keychains_file="$secret_dir/original-keychains.txt"
          cleanup_failed="$RUNNER_TEMP/zuuli-macos-dmg-sign-cleanup-failed"
          mountpoint="$secret_dir/mount"
          mounted=false
          rm -f -- "$cleanup_failed"
          security list-keychains -d user | sed -E 's/^[[:space:]]*"([^"]+)"[[:space:]]*$/\1/' > "$original_keychains_file"
          test -s "$original_keychains_file"
          cleanup() {
            set +e
            cleanup_status=0
            if [[ "$mounted" == true ]] && ! hdiutil detach "$mountpoint" -force >/dev/null; then cleanup_status=1; fi
            original_keychains=()
            while IFS= read -r original_keychain; do
              [[ -z "$original_keychain" ]] || original_keychains+=("$original_keychain")
            done < "$original_keychains_file"
            [[ ${#original_keychains[@]} -gt 0 ]] || cleanup_status=1
            [[ ${#original_keychains[@]} -eq 0 ]] || security list-keychains -d user -s "${original_keychains[@]}" || cleanup_status=1
            [[ ! -e "$keychain" ]] || security delete-keychain "$keychain" || cleanup_status=1
            find "$secret_dir" -depth -delete || cleanup_status=1
            [[ "$cleanup_status" -eq 0 ]] || : > "$cleanup_failed"
            return 0
          }
          trap cleanup EXIT
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$secret_dir/developer-id.p12"
          keychain_password=$(openssl rand -hex 24)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 1800 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$secret_dir/developer-id.p12" -P "$CERTIFICATE_PASSWORD" -t cert -f pkcs12 \
            -T /usr/bin/codesign -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
          [[ $(security find-identity -v -p codesigning "$keychain" | grep -Fc "$APPLE_SIGNING_IDENTITY" || true) -eq 1 ]] || { echo "expected exactly one Developer ID signing identity for DMG signing" >&2; exit 1; }
          hdiutil convert unsigned-macos/ZUULI-layout.dmg -format UDRW -o "$secret_dir/rewritable.dmg" >/dev/null
          image_bytes=$(stat -f %z "$secret_dir/rewritable.dmg")
          image_megabytes=$(( (image_bytes + 1048575) / 1048576 + 64 ))
          hdiutil resize -size "${image_megabytes}m" "$secret_dir/rewritable.dmg" >/dev/null
          mkdir "$mountpoint"
          hdiutil attach "$secret_dir/rewritable.dmg" -readwrite -nobrowse -mountpoint "$mountpoint" >/dev/null
          mounted=true
          [[ -d "$mountpoint/ZUULI.app" && ! -L "$mountpoint/ZUULI.app" ]] || { echo "layout DMG contains no safe ZUULI.app directory" >&2; exit 1; }
          find "$mountpoint/ZUULI.app" -depth -delete
          ditto "$ZUULI_SIGNED_APP" "$mountpoint/ZUULI.app"
          hdiutil detach "$mountpoint" >/dev/null
          mounted=false
          mkdir signed-macos
          hdiutil convert "$secret_dir/rewritable.dmg" -format UDZO -imagekey zlib-level=9 \
            -o "signed-macos/ZUULI-${RELEASE_IDENTITY}-macos.dmg" >/dev/null
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "signed-macos/ZUULI-${RELEASE_IDENTITY}-macos.dmg"
          codesign --verify --verbose=2 "signed-macos/ZUULI-${RELEASE_IDENTITY}-macos.dmg"
      - name: Destroy ephemeral DMG-signing credential
        if: always()
        run: |
          set -euo pipefail
          if find "$RUNNER_TEMP" -maxdepth 1 -name 'zuuli-macos-dmg-sign.*' -print -quit | grep -q .; then
            echo "ephemeral DMG-signing directory survived cleanup" >&2
            exit 1
          fi
          if security list-keychains -d user | grep -Fq 'zuuli-macos-dmg-sign.'; then
            echo "ephemeral DMG-signing keychain survived cleanup" >&2
            exit 1
          fi
          if hdiutil info | grep -Fq 'zuuli-macos-dmg-sign.'; then
            echo "ephemeral DMG-signing image remained mounted after cleanup" >&2
            exit 1
          fi
          if [[ -e "$RUNNER_TEMP/zuuli-macos-dmg-sign-cleanup-failed" ]]; then
            echo "DMG-signing credential cleanup or keychain restoration failed" >&2
            exit 1
          fi
      - name: Materialize, notarize DMG, and destroy ephemeral ASC credential
        id: package
        env:
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
          RELEASE_IDENTITY: ${{ needs.prepare.outputs.identity }}
          RELEASE_SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          UNSIGNED_APP_SHA256: ${{ needs.macos-build.outputs.artifact_sha256 }}
        run: |
          set -euo pipefail
          umask 077
          : "${ASC_KEY_BASE64:?ASC_KEY_BASE64 is not configured}"
          : "${ASC_KEY_ID:?ASC_KEY_ID is not configured}"
          : "${ASC_ISSUER_ID:?ASC_ISSUER_ID is not configured}"
          secret_dir=$(mktemp -d "$RUNNER_TEMP/zuuli-macos-dmg-notary.XXXXXX")
          cleanup() { find "$secret_dir" -depth -delete 2>/dev/null || true; }
          trap cleanup EXIT
          printf '%s' "$ASC_KEY_BASE64" | base64 --decode > "$secret_dir/AuthKey.p8"
          dmg="signed-macos/ZUULI-${RELEASE_IDENTITY}-macos.dmg"
          xcrun notarytool submit "$dmg" --wait \
            --key "$secret_dir/AuthKey.p8" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID"
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          ditto -c -k --sequesterRsrc --keepParent "$ZUULI_SIGNED_APP" \
            "signed-macos/ZUULI-${RELEASE_IDENTITY}-macos-universal.zip"
          app_sha256=$(shasum -a 256 "signed-macos/ZUULI-${RELEASE_IDENTITY}-macos-universal.zip" | awk '{print $1}')
          dmg_sha256=$(shasum -a 256 "$dmg" | awk '{print $1}')
          jq -n --arg identity "$RELEASE_IDENTITY" --arg sourceSha "$RELEASE_SOURCE_SHA" \
            --arg unsignedAppSha256 "$UNSIGNED_APP_SHA256" --arg appSha256 "$app_sha256" --arg dmgSha256 "$dmg_sha256" \
            '{schemaVersion:1,identity:$identity,sourceSha:$sourceSha,kind:"macos-signed-notarized",unsignedAppSha256:$unsignedAppSha256,appSha256:$appSha256,dmgSha256:$dmgSha256}' \
            > signed-macos/signing-record.json
          (cd signed-macos && shasum -a 256 ./* > CHECKSUMS.sha256)
          artifact_sha256=$(shasum -a 256 signed-macos/CHECKSUMS.sha256 | awk '{print $1}')
          echo "artifact_sha256=$artifact_sha256" >> "$GITHUB_OUTPUT"
      - name: Destroy ephemeral DMG-notarization credential
        if: always()
        run: |
          set -euo pipefail
          if find "$RUNNER_TEMP" -maxdepth 1 -name 'zuuli-macos-dmg-notary.*' -print -quit | grep -q .; then
            echo "ephemeral DMG-notarization directory survived cleanup" >&2
            exit 1
          fi
      - name: Destroy all ephemeral Apple credentials
        if: always()
        run: |
          set -euo pipefail
          if find "$RUNNER_TEMP" -maxdepth 1 \( -name 'zuuli-macos-*-sign.*' -o -name 'zuuli-macos-*-notary.*' \) -print -quit | grep -q .; then
            echo "ephemeral macOS Apple credential directory survived cleanup" >&2
            exit 1
          fi
          if security list-keychains -d user | grep -Fq 'zuuli-macos-'; then
            echo "ephemeral macOS Apple keychain survived cleanup" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: internal-zuuli-macos-signed-${{ needs.prepare.outputs.identity }}-${{ needs.prepare.outputs.source_sha }}
          path: signed-macos
          if-no-files-found: error
          retention-days: 1

  macos-finalize:
    name: macOS / credential-free shipped-artifact provenance
    needs: [prepare, macos-sign]
    if: needs.macos-sign.result == 'success'
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: wallet/zuuli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.18.0"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: internal-zuuli-macos-signed-${{ needs.prepare.outputs.identity }}-${{ needs.prepare.outputs.source_sha }}
          path: wallet/zuuli/signed-macos
      - name: Verify source-bound signed packages
        env:
          EXPECTED_PAYLOAD_SHA256: ${{ needs.macos-sign.outputs.artifact_sha256 }}
          EXPECTED_IDENTITY: ${{ needs.prepare.outputs.identity }}
          EXPECTED_SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(shasum -a 256 signed-macos/CHECKSUMS.sha256 | awk '{print $1}')" = "$EXPECTED_PAYLOAD_SHA256"
          (cd signed-macos && shasum -a 256 -c CHECKSUMS.sha256)
          jq -e --arg identity "$EXPECTED_IDENTITY" --arg source "$EXPECTED_SOURCE_SHA" \
            '.schemaVersion == 1 and .kind == "macos-signed-notarized" and .identity == $identity and .sourceSha == $source' \
            signed-macos/signing-record.json
          inspect=$(mktemp -d "$RUNNER_TEMP/zuuli-macos-verify.XXXXXX")
          trap 'find "$inspect" -depth -delete' EXIT
          ditto -x -k "signed-macos/ZUULI-${EXPECTED_IDENTITY}-macos-universal.zip" "$inspect"
          apps=("$inspect"/*.app)
          [[ ${#apps[@]} -eq 1 && -d "${apps[0]}" ]] || { echo "expected exactly one signed macOS app" >&2; exit 1; }
          codesign --verify --deep --strict --verbose=2 "${apps[0]}"
          embedded_profile="${apps[0]}/Contents/embedded.provisionprofile"
          [[ -f "$embedded_profile" && ! -L "$embedded_profile" ]] || { echo "signed app is missing its Developer ID provisioning profile" >&2; exit 1; }
          security cms -D -i "$embedded_profile" > "$inspect/profile.plist"
          verify_developer_id_profile() {
            local profile_plist=$1
            local profile_now=$2
            local team_count group_count group_index group created expiration created_epoch expiration_epoch
            team_count=$(plutil -extract TeamIdentifier raw -expect array -o - -- "$profile_plist")
            [[ "$team_count" == 1 ]] || { echo "Developer ID profile must contain exactly one team identifier" >&2; return 1; }
            [[ "$(plutil -extract TeamIdentifier.0 raw -expect string -o - -- "$profile_plist")" == F9AV5HKF6N ]] || { echo "Developer ID profile team identifier is unauthorized" >&2; return 1; }
            [[ "$(plutil -extract ProvisionsAllDevices raw -expect bool -o - -- "$profile_plist")" == true ]] || { echo "Developer ID profile is not a distribution profile" >&2; return 1; }
            [[ "$(plutil -extract 'Entitlements.com\.apple\.application-identifier' raw -expect string -o - -- "$profile_plist")" == F9AV5HKF6N.cash.free2z.zuuli ]] || { echo "Developer ID profile application identifier is unauthorized" >&2; return 1; }
            group_count=$(plutil -extract Entitlements.keychain-access-groups raw -expect array -o - -- "$profile_plist")
            [[ "$group_count" =~ ^[0-9]+$ && "$group_count" -gt 0 ]] || { echo "Developer ID profile has no keychain access groups" >&2; return 1; }
            group_index=0
            while (( group_index < group_count )); do
              group=$(plutil -extract "Entitlements.keychain-access-groups.${group_index}" raw -expect string -o - -- "$profile_plist")
              [[ "$group" == F9AV5HKF6N.cash.free2z.zuuli || "$group" == 'F9AV5HKF6N.*' ]] || { echo "Developer ID profile contains an unauthorized keychain access group" >&2; return 1; }
              (( group_index += 1 ))
            done
            created=$(plutil -extract CreationDate raw -expect date -o - -- "$profile_plist")
            expiration=$(plutil -extract ExpirationDate raw -expect date -o - -- "$profile_plist")
            created_epoch=$(date -j -u -f "%Y-%m-%dT%H:%M:%SZ" "$created" "+%s")
            expiration_epoch=$(date -j -u -f "%Y-%m-%dT%H:%M:%SZ" "$expiration" "+%s")
            [[ "$profile_now" =~ ^[0-9]+$ ]] || { echo "current profile verification time is invalid" >&2; return 1; }
            (( created_epoch <= profile_now && profile_now < expiration_epoch )) || { echo "Developer ID profile is outside its validity window" >&2; return 1; }
          }
          profile_now=$(date -u +%s)
          verify_developer_id_profile "$inspect/profile.plist" "$profile_now"
          signed_entitlements="$inspect/signed-entitlements.plist"
          codesign -d --entitlements :- "${apps[0]}" > "$signed_entitlements" 2>/dev/null
          plutil -lint "$signed_entitlements"
          test "$(plutil -convert json -o - "$signed_entitlements" | jq -r '."com.apple.application-identifier"')" = F9AV5HKF6N.cash.free2z.zuuli
          test "$(plutil -convert json -o - "$signed_entitlements" | jq -r '."com.apple.developer.team-identifier"')" = F9AV5HKF6N
          test "$(plutil -convert json -o - "$signed_entitlements" | jq -r '."keychain-access-groups"[0]')" = F9AV5HKF6N.cash.free2z.zuuli
          test "$(plutil -convert json -o - "$signed_entitlements" | jq -r '."keychain-access-groups" | length')" = 1
          test "$(plutil -convert json -o - "$signed_entitlements" | jq -r 'keys | sort | join(",")')" = com.apple.application-identifier,com.apple.developer.team-identifier,keychain-access-groups
          signature=$(codesign -dvv "${apps[0]}" 2>&1)
          grep -F 'Authority=Developer ID Application: Corpora Inc (F9AV5HKF6N)' <<<"$signature"
          grep -F 'TeamIdentifier=F9AV5HKF6N' <<<"$signature"
          xcrun stapler validate "${apps[0]}"
          spctl -a -vvv -t exec "${apps[0]}"
          dmg="signed-macos/ZUULI-${EXPECTED_IDENTITY}-macos.dmg"
          codesign --verify --verbose=2 "$dmg"
          xcrun stapler validate "$dmg"
          mountpoint="$inspect/dmg"
          mkdir "$mountpoint"
          mounted=false
          cleanup_dmg() {
            [[ "$mounted" != true ]] || hdiutil detach "$mountpoint" -force >/dev/null
          }
          trap 'cleanup_dmg; find "$inspect" -depth -delete' EXIT
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mountpoint" >/dev/null
          mounted=true
          [[ -d "$mountpoint/ZUULI.app" && ! -L "$mountpoint/ZUULI.app" ]] || { echo "signed DMG contains no safe ZUULI.app directory" >&2; exit 1; }
          [[ -L "$mountpoint/Applications" && "$(readlink "$mountpoint/Applications")" == /Applications ]] || { echo "signed DMG Applications link is not canonical" >&2; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$mountpoint/ZUULI.app"
          xcrun stapler validate "$mountpoint/ZUULI.app"
          hdiutil detach "$mountpoint" >/dev/null
          mounted=false
          mkdir release-artifacts
          cp "$dmg" "signed-macos/ZUULI-${EXPECTED_IDENTITY}-macos-universal.zip" \
            signed-macos/signing-record.json release-artifacts/
      - name: Prepare macOS shipped-artifact inventories
        env:
          RELEASE_IDENTITY: ${{ needs.prepare.outputs.identity }}
        run: |
          node scripts/artifact-sbom.mjs prepare --artifact="release-artifacts/ZUULI-${RELEASE_IDENTITY}-macos.dmg" --root=artifact-sbom-work/macos-dmg/root
          node scripts/artifact-sbom.mjs prepare --artifact="release-artifacts/ZUULI-${RELEASE_IDENTITY}-macos-universal.zip" --root=artifact-sbom-work/macos-zip/root
      - name: Scan macOS DMG shipped artifact
        uses: anchore/sbom-action@fbfd9c6c189226748411491745178e0c2017392d # v0.20.10
        with:
          {
            syft-version: v1.50.0,
            path: wallet/zuuli/artifact-sbom-work/macos-dmg/root,
            config: wallet/zuuli/syft-artifact.yaml,
            format: cyclonedx-json,
            output-file: wallet/zuuli/artifact-sbom-work/macos-dmg/syft.raw.sbom.cdx.json,
            upload-artifact: false,
          }
      - name: Scan macOS app ZIP shipped artifact
        uses: anchore/sbom-action@fbfd9c6c189226748411491745178e0c2017392d # v0.20.10
        with:
          {
            syft-version: v1.50.0,
            path: wallet/zuuli/artifact-sbom-work/macos-zip/root,
            config: wallet/zuuli/syft-artifact.yaml,
            format: cyclonedx-json,
            output-file: wallet/zuuli/artifact-sbom-work/macos-zip/syft.raw.sbom.cdx.json,
            upload-artifact: false,
          }
      - name: Bind macOS shipped-artifact SBOMs
        env:
          RELEASE_IDENTITY: ${{ needs.prepare.outputs.identity }}
        run: |
          node scripts/artifact-sbom.mjs finalize-artifact --artifact="release-artifacts/ZUULI-${RELEASE_IDENTITY}-macos.dmg" --root=artifact-sbom-work/macos-dmg/root --raw-sbom=artifact-sbom-work/macos-dmg/syft.raw.sbom.cdx.json --sbom=release-artifacts/ZUULI-macos-dmg.artifact.sbom.cdx.json --binding=release-artifacts/ZUULI-macos-dmg.artifact.sbom-binding.json
          node scripts/artifact-sbom.mjs finalize-artifact --artifact="release-artifacts/ZUULI-${RELEASE_IDENTITY}-macos-universal.zip" --root=artifact-sbom-work/macos-zip/root --raw-sbom=artifact-sbom-work/macos-zip/syft.raw.sbom.cdx.json --sbom=release-artifacts/ZUULI-macos-zip.artifact.sbom.cdx.json --binding=release-artifacts/ZUULI-macos-zip.artifact.sbom-binding.json
      - name: Prepare explicitly labeled source inventory
        run: mkdir -p artifact-sbom-work
      - uses: anchore/sbom-action@fbfd9c6c189226748411491745178e0c2017392d # v0.20.10
        with:
          {
            syft-version: v1.50.0,
            path: wallet/zuuli,
            config: wallet/zuuli/syft.yaml,
            format: cyclonedx-json,
            output-file: wallet/zuuli/artifact-sbom-work/ZUULI-macos.source.raw.sbom.cdx.json,
            upload-artifact: false,
          }
      - name: Label macOS SBOM as source inventory
        run: node scripts/artifact-sbom.mjs label-source --raw-sbom=artifact-sbom-work/ZUULI-macos.source.raw.sbom.cdx.json --sbom=release-artifacts/ZUULI-macos.source.sbom.cdx.json --source-root=wallet/zuuli
      - name: Record checksums and provenance
        run: |
          RELEASE_IDENTITY=${{ needs.prepare.outputs.identity }}
          node scripts/artifact-sbom.mjs verify-artifact --artifact="release-artifacts/ZUULI-${RELEASE_IDENTITY}-macos.dmg" --sbom=release-artifacts/ZUULI-macos-dmg.artifact.sbom.cdx.json --binding=release-artifacts/ZUULI-macos-dmg.artifact.sbom-binding.json
          node scripts/artifact-sbom.mjs verify-artifact --artifact="release-artifacts/ZUULI-${RELEASE_IDENTITY}-macos-universal.zip" --sbom=release-artifacts/ZUULI-macos-zip.artifact.sbom.cdx.json --binding=release-artifacts/ZUULI-macos-zip.artifact.sbom-binding.json
          jq -e '(.metadata.properties // [] | any(.name == "free2z:inventory-scope" and .value == "source-tree")) and ((.components // []) | length >= 50)' release-artifacts/ZUULI-macos.source.sbom.cdx.json
          node scripts/release-manifest.mjs --artifacts=release-artifacts --checksums=release-artifacts/CHECKSUMS.sha256 --output=release-artifacts/provenance.json
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with: { subject-path: "wallet/zuuli/release-artifacts/*" }
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          {
            name: "zuuli-macos-${{ needs.prepare.outputs.identity }}-${{ needs.prepare.outputs.source_sha }}",
            path: wallet/zuuli/release-artifacts,
            if-no-files-found: error,
            retention-days: 90,
          }

  release-index:
    name: Immutable GitHub release index
    needs: [prepare, android-build, android-sign-upload, android-finalize, ios-finalize, linux, macos-finalize]
    if: >-
      always() && !cancelled() &&
      needs.prepare.result == 'success' &&
      needs.prepare.outputs.should_release == 'true' &&
      (((needs.prepare.outputs.target == 'mobile' ||
      needs.prepare.outputs.target == 'android' ||
      needs.prepare.outputs.target == 'all') &&
      needs.android-build.result == 'success' &&
      needs.android-sign-upload.result == 'success' &&
      needs.android-finalize.result == 'success') ||
      ((needs.prepare.outputs.target != 'mobile' &&
      needs.prepare.outputs.target != 'android' &&
      needs.prepare.outputs.target != 'all') &&
      needs.android-build.result == 'skipped' &&
      needs.android-sign-upload.result == 'skipped' &&
      needs.android-finalize.result == 'skipped')) &&
      (needs.ios-finalize.result == 'success' || needs.ios-finalize.result == 'skipped') &&
      (needs.linux.result == 'success' || needs.linux.result == 'skipped') &&
      (needs.macos-finalize.result == 'success' || needs.macos-finalize.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: zuuli-{android,ios,linux,macos}-${{ needs.prepare.outputs.identity }}-${{ needs.prepare.outputs.source_sha }}
          path: release-downloads
          merge-multiple: false
      - name: Verify release-index source binding
        env:
          RELEASE_IDENTITY: ${{ needs.prepare.outputs.identity }}
          EXPECTED_SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: wallet/zuuli/scripts/verify-release-index.sh release-downloads "$RELEASE_IDENTITY" "$EXPECTED_SOURCE_SHA"
      - name: Publish idempotent draft release
        if: needs.prepare.outputs.dry_run == 'false' && needs.prepare.outputs.tag_exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_IDENTITY: ${{ needs.prepare.outputs.identity }}
          RELEASE_SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: wallet/zuuli/scripts/publish-github-release.sh "$RELEASE_TAG" "$RELEASE_IDENTITY" "$RELEASE_SOURCE_SHA" release-downloads
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: zuuli-release-index-${{ needs.prepare.outputs.identity }}-${{ needs.prepare.outputs.source_sha }}
          path: release-downloads
          if-no-files-found: error
          retention-days: 90
