name: Free2Z host preparation
on:
  pull_request:
    paths:
      - scripts/free2z/host_runtime/**
      - scripts/free2z/host-runtime*.py
      - scripts/free2z/host-rust-build.sh
      - scripts/free2z/tests/test_host_runtime.py
      - build/free2z/host-tools.json
      - build/free2z/host-nsswitch.conf
      - build/free2z/host-licenses/**
      - .github/workflows/free2z-host-release.yml
      - rust-toolchain.toml
  workflow_dispatch:
    inputs:
      web_release_tag:
        description: Signed website release tag for this exact main commit
        required: true
        type: string
permissions:
  contents: read
env:
  NODE_OPTIONS: --use-openssl-ca
concurrency:
  group: free2z-host-preparation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  policy:
    name: Free2Z host policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Select verified CI trust before clients
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          CI_TRUST_CONTAINER: ${{ job.container.id != '' && '1' || '0' }}
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then ci_python=python; else ci_python=python3; fi
          "$ci_python" -I - <<'PY'
          import hashlib, os, pathlib, subprocess, sys, urllib.request
          url = 'https://raw.githubusercontent.com/corpora-inc/encorpora/086efd078bf7179df466449f194d716916e11305/.github/scripts/ci_trust.py'
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
          with opener.open(url, timeout=30) as response:
              if response.url != url: raise SystemExit('Unexpected CI helper redirect')
              data = response.read(50001)
          if len(data) > 50000 or hashlib.sha256(data).hexdigest() != 'ba1fe4e0b829fdb18dd619751479fbafdd791ecc51b834f3399cb972d8ddf167':
              raise SystemExit('CI helper checksum mismatch')
          mode = os.environ['CI_TRUST_CONTAINER']
          if mode not in ('0', '1'): raise SystemExit('Unclassified CI container context')
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'corpora-ci-trust-bootstrap.py'
          with os.fdopen(os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600), 'wb') as output:
              output.write(data)
          subprocess.run([sys.executable, '-I', str(path), '--source-commit', '086efd078bf7179df466449f194d716916e11305'] + (['--clients-only'] if mode == '1' else []), check=True)
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # reviewed immutable repository pin
        with:
          persist-credentials: false
      - name: Test bounded native packaging and producer policy
        run: |
          python3 -W error::ResourceWarning -m unittest discover -s scripts/free2z/tests -p test_host_runtime.py -v
          python3 -m py_compile scripts/free2z/host-runtime.py scripts/free2z/host-runtime-qualify.py scripts/free2z/host_runtime/*.py
          sh -n scripts/free2z/host-rust-build.sh
  build:
    name: Free2Z host build
    needs: policy
    if: github.event_name == 'workflow_dispatch' && github.repository == 'free2z/zuu' && github.ref == 'refs/heads/main' && github.ref_protected
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      attempt: ${{ steps.built.outputs.attempt }}
    steps:
      - name: Select verified CI trust before clients
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          CI_TRUST_CONTAINER: ${{ job.container.id != '' && '1' || '0' }}
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then ci_python=python; else ci_python=python3; fi
          "$ci_python" -I - <<'PY'
          import hashlib, os, pathlib, subprocess, sys, urllib.request
          url = 'https://raw.githubusercontent.com/corpora-inc/encorpora/086efd078bf7179df466449f194d716916e11305/.github/scripts/ci_trust.py'
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
          with opener.open(url, timeout=30) as response:
              if response.url != url: raise SystemExit('Unexpected CI helper redirect')
              data = response.read(50001)
          if len(data) > 50000 or hashlib.sha256(data).hexdigest() != 'ba1fe4e0b829fdb18dd619751479fbafdd791ecc51b834f3399cb972d8ddf167':
              raise SystemExit('CI helper checksum mismatch')
          mode = os.environ['CI_TRUST_CONTAINER']
          if mode not in ('0', '1'): raise SystemExit('Unclassified CI container context')
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'corpora-ci-trust-bootstrap.py'
          with os.fdopen(os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600), 'wb') as output:
              output.write(data)
          subprocess.run([sys.executable, '-I', str(path), '--source-commit', '086efd078bf7179df466449f194d716916e11305'] + (['--clients-only'] if mode == '1' else []), check=True)
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # reviewed immutable repository pin
        with:
          persist-credentials: false
      - name: Verify same-commit website and image provenance
        env:
          GH_TOKEN: ${{ github.token }}
          WEB_RELEASE_TAG: ${{ inputs.web_release_tag }}
        run: |
          python3 scripts/free2z/host-runtime.py fetch --web-tag "$WEB_RELEASE_TAG" --work "$RUNNER_TEMP/host-work" --output "$RUNNER_TEMP/host-release"
      - name: Build and qualify without release credentials
        id: built
        run: |
          python3 scripts/free2z/host-runtime.py assemble --work "$RUNNER_TEMP/host-work" --output "$RUNNER_TEMP/host-release"
          printf 'attempt=%s\n' "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # reviewed immutable repository pin
        with:
          name: free2z-host-unsigned-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/host-release/
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
  publish:
    name: Free2Z host publish
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.repository == 'free2z/zuu' && github.ref == 'refs/heads/main' && github.ref_protected
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Select verified CI trust before clients
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          CI_TRUST_CONTAINER: ${{ job.container.id != '' && '1' || '0' }}
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then ci_python=python; else ci_python=python3; fi
          "$ci_python" -I - <<'PY'
          import hashlib, os, pathlib, subprocess, sys, urllib.request
          url = 'https://raw.githubusercontent.com/corpora-inc/encorpora/086efd078bf7179df466449f194d716916e11305/.github/scripts/ci_trust.py'
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
          with opener.open(url, timeout=30) as response:
              if response.url != url: raise SystemExit('Unexpected CI helper redirect')
              data = response.read(50001)
          if len(data) > 50000 or hashlib.sha256(data).hexdigest() != 'ba1fe4e0b829fdb18dd619751479fbafdd791ecc51b834f3399cb972d8ddf167':
              raise SystemExit('CI helper checksum mismatch')
          mode = os.environ['CI_TRUST_CONTAINER']
          if mode not in ('0', '1'): raise SystemExit('Unclassified CI container context')
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'corpora-ci-trust-bootstrap.py'
          with os.fdopen(os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600), 'wb') as output:
              output.write(data)
          subprocess.run([sys.executable, '-I', str(path), '--source-commit', '086efd078bf7179df466449f194d716916e11305'] + (['--clients-only'] if mode == '1' else []), check=True)
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # reviewed immutable repository pin
        with:
          persist-credentials: false
      - name: Require the build and publisher to share one attempt
        env:
          BUILT_ATTEMPT: ${{ needs.build.outputs.attempt }}
        run: |
          if [[ "$BUILT_ATTEMPT" != "$GITHUB_RUN_ATTEMPT" ]]; then
            echo '::error::Re-run all jobs: a publish-only retry cannot attest a previous build attempt.'
            exit 1
          fi
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # reviewed immutable repository pin
        with:
          name: free2z-host-unsigned-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/host-release/
      - name: Check opaque artifact hashes and invocation
        run: python3 scripts/free2z/host-runtime.py check --output "$RUNNER_TEMP/host-release"
      - name: Attest host selection manifest
        id: manifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # reviewed immutable repository pin
        with:
          subject-path: ${{ runner.temp }}/host-release/host-release.json
      - name: Attest qualified native archive
        id: archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # reviewed immutable repository pin
        with:
          subject-path: ${{ runner.temp }}/host-release/host-runtime.tar
      - name: Retain separate host verification evidence
        env:
          MANIFEST_BUNDLE: ${{ steps.manifest.outputs.bundle-path }}
          ARCHIVE_BUNDLE: ${{ steps.archive.outputs.bundle-path }}
        run: |
          test -s "$MANIFEST_BUNDLE"
          test -s "$ARCHIVE_BUNDLE"
          cp "$MANIFEST_BUNDLE" "$RUNNER_TEMP/host-release/host-release.json.intoto.jsonl"
          cp "$ARCHIVE_BUNDLE" "$RUNNER_TEMP/host-release/host-runtime.tar.intoto.jsonl"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # reviewed immutable repository pin
        with:
          name: free2z-host-release-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/host-release/
          compression-level: 0
          if-no-files-found: error
          retention-days: 90
      - name: Publish preparation files without executing their contents
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/free2z/host-runtime.py publish --output "$RUNNER_TEMP/host-release"
