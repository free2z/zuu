name: ts/svelte/free2z

on:
  pull_request:
    paths:
      - "ts/svelte/free2z/**"
      - ".github/workflows/ts-svelte-free2z.yml"

jobs:
  build:
    name: ts-svelte / build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: ts/svelte/free2z
        run: npm ci

      - name: Audit dependencies (high and critical)
        working-directory: ts/svelte/free2z
        run: |
          for attempt in 1 2 3; do
            node "$GITHUB_WORKSPACE/scripts/npm-audit-allowlist.mjs" && exit 0
            [ "$attempt" -eq 3 ] && exit 1
            sleep $((attempt * 5))
          done

      - name: Type-check
        working-directory: ts/svelte/free2z
        run: npm run check

      - name: Run tests
        working-directory: ts/svelte/free2z
        run: npm test
