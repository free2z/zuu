name: CI / closed PR cache cleanup

on:
  pull_request_target:
    types: [closed]
  schedule:
    # Reclaim entries left by PRs closed before this workflow existed or by a
    # transient failure of the close event. Also runs the footprint guard
    # below — see that job for why it needs its own schedule reasoning.
    - cron: "41 8 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: >-
          footprint-guard: report what would be evicted without deleting
          anything. Ignored by the closed-PR sweep.
        type: boolean
        default: false

# This workflow never checks out or executes PR code. `actions: write` is the
# minimum GitHub permission that can delete caches; the implementation narrows
# its use to entries under API-verified closed PR merge refs. The
# footprint-guard job below reads its own script's source at the commit that
# triggered the run via the read-only Contents API instead of a checkout action,
# for the same reason: nothing here ever materializes a working tree.
permissions:
  actions: write
  contents: none
  pull-requests: read

concurrency:
  group: ci-closed-pr-cache-cleanup-${{ github.event.pull_request.number || 'sweep' }}
  cancel-in-progress: false

jobs:
  closed-pr:
    name: Delete closed PR caches
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Delete only this PR merge-ref caches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
            echo "invalid PR number" >&2
            exit 1
          }
          pr_ref="refs/pull/$PR_NUMBER/merge"
          cache_output=$(
            gh cache list --ref "$pr_ref" --limit 10000 --json id --jq '.[].id'
          )
          cache_ids=()
          if [[ -n "$cache_output" ]]; then
            mapfile -t cache_ids <<< "$cache_output"
          fi
          echo "Found ${#cache_ids[@]} cache entries scoped to $pr_ref."
          for cache_id in "${cache_ids[@]}"; do
            [[ "$cache_id" =~ ^[1-9][0-9]*$ ]] || {
              echo "invalid cache ID returned by GitHub" >&2
              exit 1
            }
            gh cache delete "$cache_id"
          done

  sweep:
    name: Delete caches for verified-closed PRs
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Delete only caches whose PR is closed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cache_rows=$(
            gh cache list --limit 10000 --json id,ref --jq \
              '.[] | select(.ref | startswith("refs/pull/")) | [.id, .ref] | @tsv'
          )
          if [[ -z "$cache_rows" ]]; then
            echo "No pull-request caches found."
            exit 0
          fi
          while IFS=$'\t' read -r cache_id cache_ref; do
            [[ "$cache_id" =~ ^[1-9][0-9]*$ ]] || {
              echo "invalid cache ID returned by GitHub" >&2
              exit 1
            }
            if [[ ! "$cache_ref" =~ ^refs/pull/([1-9][0-9]*)/merge$ ]]; then
              echo "Skipping unexpected pull-request cache ref: $cache_ref" >&2
              continue
            fi
            pr_number=${BASH_REMATCH[1]}
            if ! state=$(gh api "repos/$GH_REPO/pulls/$pr_number" --jq .state); then
              echo "Could not verify PR #$pr_number; retaining its cache." >&2
              continue
            fi
            if [[ "$state" == closed ]]; then
              echo "Deleting cache $cache_id for verified-closed PR #$pr_number."
              gh cache delete "$cache_id"
            elif [[ "$state" != open ]]; then
              echo "refusing unknown PR state for #$pr_number: $state" >&2
              exit 1
            fi
          done <<< "$cache_rows"

  footprint-guard:
    name: Guard total cache footprint below the eviction ceiling
    # Never runs from `pull_request_target`: the closed-PR sweep above already
    # owns that trigger, and this job's job-level `contents: read` (below) is
    # scoped away from it deliberately.
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Overrides (does not add to) the workflow-level permissions above:
    # `actions: write` to delete caches, `contents: read` only to fetch this
    # one script file by exact commit SHA below (never a full checkout).
    permissions:
      actions: write
      contents: read
      pull-requests: none
    steps:
      - name: Fetch the footprint-guard script at this commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh api -H "Accept: application/vnd.github.raw" \
            "repos/$GH_REPO/contents/scripts/check-actions-cache-footprint.mjs?ref=$SHA" \
            > check-actions-cache-footprint.mjs
      - name: Self-test the footprint-guard selection logic
        run: node check-actions-cache-footprint.mjs --self-test
      - name: Guard the live cache footprint
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Explicit default: a schedule run deletes live; only an operator
          # dispatching with dry_run=true gets a report-only pass.
          mode=()
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && \
                "${{ github.event.inputs.dry_run }}" == "true" ]]; then
            mode=(--dry-run)
          fi
          node check-actions-cache-footprint.mjs "${mode[@]}"
