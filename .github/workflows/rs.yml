name: rs

# The required check for the rs/ Rust workspace.
#
# A separate workflow rather than more jobs in zuuli.yml, on purpose. The
# wallet's required gate carries a 45-minute Tauri build and a three-host
# clippy matrix; putting a messaging PR's five-minute feedback loop behind that
# would make the E2EE work slower for reasons that have nothing to do with it.
# The two change detectors are disjoint, and the PR that introduced this
# workflow demonstrated both directions: an rs/-only diff yields zuuli=false,
# and a wallet/-only diff yields rs=false.
#
# The `gate` job at the end publishes the context `rs / gate`, and that is what
# branch protection should require alongside the wallet's `gate`. Every job here
# carries an `rs / ` display name so none of them collides with a job id in
# another workflow: check-run names are the only thing branch protection matches
# on, and a name two workflows both publish resolves by report order rather than
# by policy. Adding `rs / gate` as a required status check is a
# repository-settings change and cannot be made in this file.

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR updates supersede older runs; post-merge and manual runs key on run_id
  # and are never cancelled because another main build started.
  group: rs-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  changes:
    name: rs / changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rs: ${{ steps.filter.outputs.rs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Diff locally instead of relying on the pull-request files API.
          fetch-depth: 0

      # These run on every event, including changes this workflow would
      # otherwise skip entirely, because a policy regression is not a code
      # change under rs/ and would sail through a skip. Each self-test runs
      # first, so the verdict that follows comes from a check that has just been
      # watched fail.
      - name: Verify immutable actions and fail-closed required jobs
        run: |
          node scripts/check-github-actions-pins.mjs --self-test
          node scripts/check-github-actions-pins.mjs

      - name: Verify every gate inspects every job it awaits
        run: |
          node scripts/check-workflow-gates.mjs --self-test
          node scripts/check-workflow-gates.mjs

      # Deliberately in this always-running job and not behind the rs/ filter.
      # The labels it judges live in docs/e2ee/*.md as much as in rs/, and the
      # collision it exists to catch (#602) arrived in a docs-only pull request
      # — a diff for which `filter` below sets rs=false and every rs job skips.
      # A check that only runs when Rust changes would not have run on the
      # commit that broke the invariant. Its own step rather than a line added
      # to one above, so the exact ordered command assertion that
      # scripts/check-github-actions-pins.mjs holds over the required workflow's
      # policy step stays a single reviewed unit.
      - name: Verify hash-domain labels are prefix-free across the tree
        run: |
          node scripts/check-hash-domain-labels.mjs --self-test
          node scripts/check-hash-domain-labels.mjs

      # Also deliberately unconditional, and for a sharper reason than the one
      # above. `.github/workflows/f2z-images.yml` carries an `on: pull_request:
      # paths:` filter, so the way it fails is by *not running*: a filter that
      # has drifted off rs/** produces no red job anywhere, and the three server
      # images simply stop being rebuilt while the deployment goes on pulling a
      # digest nobody has rebuilt in months. A check that only ran when the
      # image workflow ran could never see that. This one runs on every pull
      # request and reads the filter as data.
      - name: Verify the f2z server image supply chain
        run: |
          node scripts/check-f2z-images.mjs --self-test
          node scripts/check-f2z-images.mjs

      # rs/rust-toolchain.toml and rs/crates/*/Cargo.toml restate
      # wallet/rust-toolchain.toml, and are registered in the script's own
      # TOOLCHAIN_RESTATEMENTS/MANIFESTS arrays rather than by flags here. A
      # flag in one workflow is not a registration: the bare invocation the
      # required zuuli gate runs passes no flags, so anything registered only
      # here would be unpoliced there. Registering in the script instead means
      # its census — which enumerates every tracked manifest and toolchain file
      # and fails on any that is unregistered — covers this tree from both
      # workflows. See #553.
      - name: Verify the Rust toolchain pin has not drifted
        run: |
          scripts/check-rust-toolchain.sh --self-test
          scripts/check-rust-toolchain.sh

      - name: Detect changes under rs/
        id: filter
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          set -euo pipefail

          # Manual runs, first pushes, and incomplete event payloads fail open
          # into the full suite, never into an unverified skip.
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] ||
             ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "::notice::No usable base commit; running the full rs gate."
            echo "rs=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files=$(mktemp "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/rs-changed-files.XXXXXX")
          trap 'rm -f -- "$changed_files"' EXIT
          if ! git diff --name-only -z --no-renames "$BASE_SHA" "$GITHUB_SHA" > "$changed_files"; then
            echo "::warning::Diff failed; running the full rs gate."
            echo "rs=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # `case` patterns are not pathname globs: `rs/*` matches every path
          # under rs/, at any depth.
          #
          # wallet/rust-toolchain.toml is deliberately absent. A toolchain bump
          # that is correct also edits rs/rust-toolchain.toml and
          # rs/crates/*/Cargo.toml, which select rs; a bump that is not correct
          # fails scripts/check-rust-toolchain.sh in this always-running job.
          # Listing it would make every wallet pin bump run the rs suite twice
          # over for no additional coverage.
          rs=false
          while IFS= read -r -d '' file; do
            case "$file" in
              rs/*|docs/e2ee/*|scripts/check-akd-doc-evidence.mjs|scripts/check-rust-fmt.sh|scripts/check-rust-clippy.sh|scripts/check-rust-deny.sh|scripts/check-rust-toolchain.sh|.github/workflows/rs.yml)
                rs=true
                ;;
            esac
          done < "$changed_files"

          echo "rs=$rs" >> "$GITHUB_OUTPUT"

  rs_fmt:
    name: rs / rustfmt
    needs: changes
    if: needs.changes.outputs.rs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The version is read out of wallet/rust-toolchain.toml rather than
      # restated in YAML, because an action input cannot read TOML and a
      # restatement here would be one more thing to drift.
      - name: Resolve the pinned Rust toolchain
        id: rust_toolchain
        shell: bash
        run: |
          set -euo pipefail
          version=$(scripts/check-rust-toolchain.sh --print-channel)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ steps.rust_toolchain.outputs.version }}
          components: rustfmt

      - name: Prove the formatting check still fails on unformatted code
        run: scripts/check-rust-fmt.sh --self-test

      - name: Check every crate under rs/
        run: scripts/check-rust-fmt.sh --root rs

  rs_clippy:
    name: rs / clippy
    needs: changes
    if: needs.changes.outputs.rs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve the pinned Rust toolchain
        id: rust_toolchain
        shell: bash
        run: |
          set -euo pipefail
          version=$(scripts/check-rust-toolchain.sh --print-channel)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ steps.rust_toolchain.outputs.version }}
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rs
          key: rs-clippy

      # The negative control proves -D warnings and the selected target are
      # both live before the real verdict is trusted. rs/ is portable Rust, so
      # linux is the only host it needs; the wallet's macOS and Windows lanes
      # exist because its code has target-gated branches, and this tree
      # deliberately has none.
      - name: Prove -D warnings still fails a known lint
        run: scripts/check-rust-clippy.sh --self-test linux

      - name: Lint every crate under rs/ at -D warnings
        run: scripts/check-rust-clippy.sh --root rs

  rs_deny:
    name: rs / cargo-deny
    needs: changes
    if: needs.changes.outputs.rs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve the pinned Rust toolchain
        id: rust_toolchain
        shell: bash
        run: |
          set -euo pipefail
          version=$(scripts/check-rust-toolchain.sh --print-channel)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ steps.rust_toolchain.outputs.version }}

      - name: Prove the policy still decides the verdict
        run: scripts/check-rust-deny.sh --self-test

      # --config is explicit rather than defaulted so the separation from
      # wallet/deny.toml is visible at the call site, not just in the script.
      - name: Enforce rs/deny.toml over every crate under rs/
        run: scripts/check-rust-deny.sh --root rs --config rs/deny.toml

  rs_test:
    name: rs / tests
    needs: changes
    if: needs.changes.outputs.rs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve the pinned Rust toolchain
        id: rust_toolchain
        shell: bash
        run: |
          set -euo pipefail
          version=$(scripts/check-rust-toolchain.sh --print-channel)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ steps.rust_toolchain.outputs.version }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rs
          key: rs-test

      # --locked: test the lockfile CI actually builds, so a resolution that
      # only happens on a developer's machine cannot change the verdict.
      - name: Run the rs/ test suite
        working-directory: rs
        run: cargo test --locked --all-targets

      - name: Run the rs/ doc tests
        working-directory: rs
        run: cargo test --locked --doc

      # The normative AKD type, benchmark figures, and audit-scope correction
      # share one falsifiable evidence record. Its self-test first compiles the
      # invented HistoryProofV2 type and requires that compile to fail, mutates
      # each displayed metric independently, coordinates false values across
      # prose and JSON, re-points both cited fix PRs, aliases both releases to
      # one source, and changes the real pinned partition body. Report evidence
      # is parsed with Node alone, including when PATH contains no host tools.
      # Transport controls scope the Actions token to api.github.com, retry
      # transient failures, and keep unavailability distinct from evidence
      # drift; their self-test breaks each guard before trusting the live check.
      # Only then is the current documentation trusted.
      - name: Mutation-test AKD documentation evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-akd-doc-evidence.mjs --self-test

      - name: Verify AKD documentation against locked executable evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-akd-doc-evidence.mjs

      # `crash-injection` is off by default because it compiles an `abort()`
      # into f2z-relay-store's commit path, so the default run above skips
      # `tests/crash_safety.rs` entirely. Those cases are the only evidence that
      # delete-on-ack's two invariants survive an unplanned stop — nothing
      # acked-but-undeleted, nothing accepted-but-lost — and they prove it by
      # killing a real child process, which an in-process caught panic cannot.
      # A step of their own, so a run that skipped them is visible rather than
      # inferred.
      - name: Run the crash-safety suite, which kills real processes
        working-directory: rs
        run: cargo test --locked -p f2z-relay-store --features crash-injection --test crash_safety

  rs_wasm:
    name: rs / wasm32
    needs: changes
    if: needs.changes.outputs.rs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve the pinned Rust toolchain
        id: rust_toolchain
        shell: bash
        run: |
          set -euo pipefail
          version=$(scripts/check-rust-toolchain.sh --print-channel)
          target=$(scripts/check-rust-toolchain.sh --print-targets)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ steps.rust_toolchain.outputs.version }}
          targets: ${{ steps.rust_toolchain.outputs.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rs
          key: rs-wasm

      # ADR 0001 requires one Rust core shared by ZUULI and the web client, so
      # these crates reaching wasm32 is a protocol-level requirement rather than
      # a nice property. It is enforced by this job and not by convention,
      # because "we kept it portable" stops being true the first week nobody
      # checks. The first accidental `use std::` or tokio dependency fails here.
      #
      # Every crate the clients link belongs on this line. It is spelled out
      # rather than `--workspace` so that a future server binary — which will be
      # AGPL, will pull tokio, and will never reach a browser — does not
      # silently join the wasm build and then fail it.
      #
      # `f2z-relay-store` is deliberately **absent** and must stay absent: it
      # links SQLite through `rusqlite`'s bundled C amalgamation, which is a
      # native build by construction. It is a relay-side crate; no client links
      # it.
      #
      # `f2z-relay-testkit` is absent for a neighbouring reason: it opens
      # sockets, spawns tasks and reads a clock, and a test harness that could
      # reach the browser build could end up in the shipped bundle.
      #
      # `f2z-relay` — the server binary the paragraph above anticipated — is all
      # three at once: AGPL-3.0, tokio and SQLite, and never a browser. Adding a
      # crate to this line is a claim that a client links it.
      #
      # `f2z-msg-identity` is on it because it is the *most* client-linked crate
      # in the tree: it derives the user's messaging identity from the wallet
      # mnemonic (ARCHITECTURE.md §4.2), and a user who cannot reach that
      # derivation in the browser cannot restore their identity there. It reads
      # no clock and no generator — the CSPRNG is a `rand_core::CryptoRng`
      # parameter precisely so the crate can compile here — so this step is what
      # keeps that promise honest.
      - name: Build the client-linked crates for the browser target
        working-directory: rs
        run: |
          set -euo pipefail
          cargo build --locked --lib \
            --target "${{ steps.rust_toolchain.outputs.target }}" \
            -p f2z-codec \
            -p f2z-relay-proto \
            -p f2z-authority \
            -p f2z-msg-identity

      # KT.md §11.4: the log, the witness and the client link one crate. Only
      # the *client* half reaches the browser — `akd::auditor::audit_verify`
      # hardcodes AzksParallelismConfig::default() and reaches
      # tokio::task::spawn, so it compiles for wasm32 and then traps at runtime
      # (KT.md §11.3). `--no-default-features --features verifier` is therefore
      # not a size optimisation, it is the supported configuration, and this
      # step is what stops the auditor being pulled into a browser bundle by an
      # innocent-looking feature edit.
      - name: Build the f2z-kt-core client verifier for the browser target
        working-directory: rs
        run: |
          set -euo pipefail
          cargo build --locked --lib \
            --target "${{ steps.rust_toolchain.outputs.target }}" \
            -p f2z-kt-core --no-default-features --features verifier

  # Branch protection should require this stable context, `rs / gate`. It
  # succeeds only when the change detector and every applicable rs job
  # succeeded; a legitimate non-rs skip reports success rather than remaining
  # pending.
  #
  # The `name:` is not cosmetic. Without it this job would publish its job id,
  # `gate`, which is the context zuuli.yml's full-stack gate already publishes
  # and the one branch protection requires — two producers for one name, with
  # the winner decided by report order (#562).
  #
  # Every job in `needs:` below is bound into `env:` AND named on the `results=`
  # line. scripts/check-workflow-gates.mjs enforces that the three sets are
  # equal, so a job that is awaited but never inspected fails review instead of
  # quietly making this gate decorative. It also requires this `needs:` to cover
  # every job in this file, so adding a job without wiring it here fails.
  gate:
    name: rs / gate
    needs: [changes, rs_fmt, rs_clippy, rs_deny, rs_test, rs_wasm]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Re-run the workflow policy here so that even a job-level
      # continue-on-error on `changes` cannot turn that job's deliberately
      # failing policy verdict into the `success` conclusion this gate consumes.
      #
      # The label check is re-run here for the same reason, and this is how it
      # reaches the required context: this step's `outcome` is bound below as
      # POLICY_OUTCOME and the verdict refuses to pass unless it is `success`.
      # `needs:` a job without reading its result is the defect of #512 and
      # #515–#518; a step whose outcome is read is not that shape.
      - name: Recheck the workflow policy
        id: policy
        run: |
          node scripts/check-github-actions-pins.mjs --self-test
          node scripts/check-github-actions-pins.mjs
          node scripts/check-workflow-gates.mjs --self-test
          node scripts/check-workflow-gates.mjs
          node scripts/check-hash-domain-labels.mjs --self-test
          node scripts/check-hash-domain-labels.mjs
          node scripts/check-f2z-images.mjs --self-test
          node scripts/check-f2z-images.mjs

      - name: Verify required jobs succeeded or legitimately skipped
        shell: bash
        env:
          POLICY_OUTCOME: ${{ steps.policy.outcome }}
          RS_SELECTED: ${{ needs.changes.outputs.rs }}
          CHANGES: ${{ needs.changes.result }}
          RS_FMT: ${{ needs.rs_fmt.result }}
          RS_CLIPPY: ${{ needs.rs_clippy.result }}
          RS_DENY: ${{ needs.rs_deny.result }}
          RS_TEST: ${{ needs.rs_test.result }}
          RS_WASM: ${{ needs.rs_wasm.result }}
        run: |
          set -euo pipefail

          if [[ "$POLICY_OUTCOME" != success ]]; then
            echo "::error::workflow policy recheck did not pass: $POLICY_OUTCOME"
            exit 1
          fi
          if [[ "$CHANGES" != success ]]; then
            echo "::error::change detection did not pass: $CHANGES"
            exit 1
          fi

          # A skip is only legitimate when the detector said so. Anything other
          # than a clean true/false is a detector that failed open into silence,
          # which must fail the gate rather than excuse every job at once.
          case "$RS_SELECTED" in
            true) expected=success ;;
            false) expected=skipped ;;
            *)
              echo "::error::change detector produced no usable rs verdict: '$RS_SELECTED'"
              exit 1
              ;;
          esac

          results="rs_fmt=$RS_FMT rs_clippy=$RS_CLIPPY rs_deny=$RS_DENY rs_test=$RS_TEST rs_wasm=$RS_WASM"
          for entry in $results; do
            job=${entry%%=*}
            outcome=${entry#*=}
            if [[ "$outcome" != "$expected" ]]; then
              echo "::error::required job $job must be $expected, got '$outcome'"
              exit 1
            fi
          done

          echo "The rs gate passed (rs=$RS_SELECTED): changes=$CHANGES $results"
