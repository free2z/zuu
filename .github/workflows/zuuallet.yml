name: wallet/zuuallet

# Guards Zuuallet against dependency bumps breaking the build.
#
# Zuuallet's Rust backend (wallet/plugins/tauri-plugin-zcash) depends on the
# librustzcash crates via *path* dependencies into the z/zcash/librustzcash
# submodule. Bumping that submodule (or the crates.io / npm deps) can break
# compilation, so this workflow compiles both halves of the app:
#
#   - frontend: tsc typecheck + vite build
#   - rust:     cargo build of the Tauri lib (pulls the plugin + librustzcash)
#
# It runs on PRs/pushes that touch the app or its dependency inputs, and a
# weekly `upstream-canary` job proactively rebuilds against the *latest*
# librustzcash + refreshed crates to catch upstream drift before we bump.
#
# The canary also answers a question that is not about Zuuallet at all: is the
# free2z/librustzcash fork still needed? Zuuallet does not depend on
# tauri-plugin-f2zmsg, so it builds happily against pristine upstream while the
# pins that force the fork are fully present — the canary's blind spot. It now
# also resolves wallet/zuuli/src-tauri against pristine upstream and asserts
# that this *fails* for the documented reason. See the last step of
# `upstream-canary`, and docs/DEPENDENCIES.md.

on:
  pull_request:
    paths:
      - 'wallet/zuuallet/**'
      - 'wallet/shared/**'
      - 'wallet/package.json'
      - 'wallet/package-lock.json'
      - 'wallet/plugins/tauri-plugin-zcash/**'
      - 'z/zcash/librustzcash'
      - '.gitmodules'
      - 'scripts/check-rust-fmt.sh'
      - 'scripts/check-rust-deny.sh'
      - 'scripts/check-rust-clippy.sh'
      - 'scripts/check-tauri-plugin-permissions.mjs'
      - 'wallet/deny.toml'
      - '.github/workflows/zuuallet.yml'
  push:
    branches: [main]
    paths:
      - 'wallet/zuuallet/**'
      - 'wallet/shared/**'
      - 'wallet/package.json'
      - 'wallet/package-lock.json'
      - 'wallet/plugins/tauri-plugin-zcash/**'
      - 'z/zcash/librustzcash'
      - '.gitmodules'
      - 'scripts/check-rust-fmt.sh'
      - 'scripts/check-rust-deny.sh'
      - 'scripts/check-rust-clippy.sh'
      - 'scripts/check-tauri-plugin-permissions.mjs'
      - 'wallet/deny.toml'
      - '.github/workflows/zuuallet.yml'
  workflow_dispatch:
  schedule:
    # Mondays 07:00 UTC — upstream-canary only (see job `if:` guards).
    - cron: '0 7 * * 1'

concurrency:
  group: zuuallet-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------------------
  # Formatting. The required `gate` lives in zuuli.yml and its change detector
  # does not select wallet/zuuallet/**, so a Zuuallet-only pull request would
  # otherwise be able to land unformatted code — and then fail the next
  # unrelated ZUULI pull request on files it never touched. Same script, so the
  # two workflows cannot disagree about what "formatted" means.
  # ---------------------------------------------------------------------------
  fmt:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Resolve the pinned Rust toolchain
        id: rust_toolchain
        run: |
          set -euo pipefail
          version=$(scripts/check-rust-toolchain.sh --print-channel)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # rustfmt is absent from the minimal profile this action installs.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ steps.rust_toolchain.outputs.version }}
          components: rustfmt

      - name: Check formatting of every Rust crate under wallet/
        run: scripts/check-rust-fmt.sh

  # ---------------------------------------------------------------------------
  # Supply chain, for the same reason as `fmt`: the required `gate` in zuuli.yml
  # does not select wallet/zuuallet/**, so without this a Zuuallet-only change
  # to Cargo.toml or Cargo.lock could pull in an advisory or an incompatible
  # licence that nothing checks.
  # ---------------------------------------------------------------------------
  deny:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Fetch librustzcash submodule
        run: git submodule update --init z/zcash/librustzcash

      - name: Resolve the pinned Rust toolchain
        id: rust_toolchain
        run: |
          set -euo pipefail
          version=$(scripts/check-rust-toolchain.sh --print-channel)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ steps.rust_toolchain.outputs.version }}

      - name: Check advisories, licences and sources
        run: scripts/check-rust-deny.sh

  # ---------------------------------------------------------------------------
  # Lints, for the same reason as `fmt` and `deny`: the required `gate` in
  # zuuli.yml does not select wallet/zuuallet/**, so without this a
  # Zuuallet-only pull request could land code that fails `clippy -D warnings`
  # — and then fail the next unrelated ZUULI pull request on files it never
  # touched. Same script, so the two workflows cannot disagree about what
  # "lint-clean" means.
  #
  # This one compiles (clippy is a rustc driver), so unlike `fmt` it needs the
  # submodule, the Tauri system libraries and a cache.
  # ---------------------------------------------------------------------------
  clippy:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Fetch librustzcash submodule
        run: git submodule update --init z/zcash/librustzcash

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libxdo-dev \
            libdbus-1-dev \
            libssl-dev \
            build-essential curl wget file pkg-config

      - name: Resolve the pinned Rust toolchain
        id: rust_toolchain
        run: |
          set -euo pipefail
          version=$(scripts/check-rust-toolchain.sh --print-channel)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # clippy is absent from the minimal profile this action installs.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ steps.rust_toolchain.outputs.version }}
          components: clippy

      # Separate key from the `rust` job: clippy writes different artifacts into
      # the same target directory names, so a shared cache would have the two
      # jobs evicting each other's work on every run.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            wallet/plugins/tauri-plugin-zcash
            wallet/zuuli/src-tauri
            wallet/zuuallet/src-tauri
          key: zuuallet-clippy

      - name: Lint every Rust crate under wallet/ at -D warnings
        run: scripts/check-rust-clippy.sh

  # ---------------------------------------------------------------------------
  # Frontend: TypeScript typecheck + production bundle.
  # ---------------------------------------------------------------------------
  frontend:
    name: zuuallet / frontend
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: wallet/zuuallet/package-lock.json

      - name: Install dependencies
        working-directory: wallet/zuuallet
        run: npm ci

      # Keep fast advisory feedback here as well as in zuuli.yml's protected
      # gate. Dependency refreshes belong in focused PRs; bounded retries
      # tolerate registry failures without weakening the high-severity floor.
      - name: Audit dependencies (high and critical)
        working-directory: wallet/zuuallet
        run: |
          for attempt in 1 2 3; do
            npm audit --audit-level=high && exit 0
            [ "$attempt" -eq 3 ] && exit 1
            sleep $((attempt * 5))
          done

      - name: Typecheck + build (tsc && vite build)
        working-directory: wallet/zuuallet
        run: npm run build

      - name: Test owned frontend modules
        working-directory: wallet/zuuallet
        run: npm test

  # ---------------------------------------------------------------------------
  # Rust: compile the Tauri backend against the pinned librustzcash submodule.
  # This is the check that catches librustzcash API breakage from a dep bump.
  # ---------------------------------------------------------------------------
  rust:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/free2z/zuuli-linux-ci@sha256:e94d8795fd3c3265caec0f5fc2fa814391e22d2d6e574649a75e686e6e967406
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    env:
      # Shared target dir so the app build and the standalone plugin build reuse
      # the same compiled librustzcash artifacts instead of building it twice.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - name: Verify pinned Linux build image
        working-directory: /
        run: |
          set -euo pipefail
          /usr/local/bin/verify-zuuli-linux-image
          test -n "$BASH_VERSION"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Configure exact Git workspace trust
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      # Only fetch the one submodule the build needs — the rest of z/ is huge
      # (zebra, zcashd, zodl, ...) and irrelevant to compiling Zuuallet.
      - name: Fetch librustzcash submodule
        run: git submodule update --init z/zcash/librustzcash

      # `uses:` cannot take an expression; scripts/check-rust-toolchain.sh holds
      # this commit-pinned version action to wallet/rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: wallet/zuuallet/src-tauri -> ${{ github.workspace }}/target

      # --locked: the committed Cargo.lock must build as-is. Bumping the
      # librustzcash submodule changes the path-dep resolution, so whoever bumps
      # it must also commit the regenerated lock — this makes that non-optional.
      #
      # This compiles tauri-plugin-zcash and all librustzcash path deps. Because
      # the app graph does not enable extra Cargo features beyond what the plugin
      # itself declares, a plugin that free-rides on an undeclared feature fails
      # here too — so this single build is enough to catch feature-hygiene bugs.
      - name: Build Tauri backend (plugin + librustzcash path deps)
        env:
          # The build script watches this value. Changing it on every attempt
          # forces schema generation even when Cargo artifacts were restored.
          TAURI_SCHEMA_GENERATION_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}
          TAURI_PERMISSION_GENERATION_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}
        run: cargo build --locked --manifest-path wallet/zuuallet/src-tauri/Cargo.toml

      - name: Verify generated plugin permissions are current
        run: |
          set -euo pipefail
          node scripts/check-tauri-plugin-permissions.mjs --self-test
          node scripts/check-tauri-plugin-permissions.mjs
          permissions=wallet/plugins/tauri-plugin-zcash/permissions
          git diff --exit-code -- "$permissions"
          untracked=$(git ls-files --others --exclude-standard -- "$permissions")
          test -z "$untracked" || {
            echo "Unexpected generated permission files:" >&2
            echo "$untracked" >&2
            exit 1
          }

      # Tauri's build script refreshes only the schema for the current target.
      # Linux CI therefore owns the committed Linux schema and catches stale
      # plugin permissions without paying for a second generation pass.
      - name: Verify committed Tauri schemas are current
        run: |
          set -euo pipefail
          schemas=wallet/zuuallet/src-tauri/gen/schemas
          git diff --exit-code -- "$schemas"
          untracked=$(git ls-files --others --exclude-standard -- "$schemas")
          test -z "$untracked" || {
            echo "Unexpected generated schema files:" >&2
            echo "$untracked" >&2
            exit 1
          }

      - name: Test wallet plugin
        run: >-
          cargo test --locked
          --manifest-path wallet/plugins/tauri-plugin-zcash/Cargo.toml

  # The macOS/Windows plugin test matrix that used to live here — `custody /
  # ${{ matrix.os }}` — is now `rust_native_tests` in .github/workflows/zuuli.yml,
  # where the required `gate` awaits it (#610).
  #
  # It ran here, and passed, and could not fail a merge: this workflow publishes
  # no gate, branch protection does not require any context it emits, and its
  # `on: pull_request: paths:` filter means it does not run at all for a pull
  # request that touches nothing it lists. So the one job in the repository that
  # executed the Win32 file-identity helper was, in merge terms, advisory. The
  # move keeps the suite whole rather than splitting it: the entire matrix went,
  # under a selector that covers the same changes this workflow's filter does.

  # ---------------------------------------------------------------------------
  # Canary: rebuild against the LATEST librustzcash main + refreshed crates.
  # Runs weekly (and on manual dispatch) so upstream breakage shows up as an
  # early warning here, before someone bumps the submodule in a PR.
  # ---------------------------------------------------------------------------
  upstream-canary:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # UPSTREAM, by URL and not by `origin`. `.gitmodules` currently points
      # `origin` at free2z/librustzcash — a transient fork carrying one 4-line
      # deletion — and a canary that followed `origin/main` would be testing
      # the fork's stale main instead of zcash/librustzcash's. The whole point
      # of this job is to see upstream drift before we take it.
      - name: Fetch + bump librustzcash to latest UPSTREAM main
        run: |
          git submodule update --init z/zcash/librustzcash
          git -C z/zcash/librustzcash fetch https://github.com/zcash/librustzcash main
          git -C z/zcash/librustzcash checkout FETCH_HEAD
          echo "librustzcash now at: $(git -C z/zcash/librustzcash rev-parse --short HEAD)"

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libxdo-dev \
            libdbus-1-dev \
            libssl-dev \
            build-essential curl wget file pkg-config

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            wallet/zuuallet/src-tauri
            wallet/zuuli/src-tauri

      - name: Refresh crates.io deps to latest compatible
        run: cargo update --manifest-path wallet/zuuallet/src-tauri/Cargo.toml

      - name: Build against latest upstream
        run: cargo build --manifest-path wallet/zuuallet/src-tauri/Cargo.toml

      # -----------------------------------------------------------------------
      # The blind spot this job had until this step existed, and why its
      # polarity is inverted.
      #
      # Everything above builds wallet/zuuallet/src-tauri, and Zuuallet does not
      # depend on tauri-plugin-f2zmsg. But the entire reason the librustzcash
      # fork exists is that upstream's `block-buffer = "=0.11.0-rc.3"` /
      # `crypto-common = "=0.2.0-rc.1"` workspace pins make **ZUULI** unable to
      # link f2zmsg: `=0.2.0-rc.1` and the `^0.2` that `digest 0.11` requires
      # cannot both be satisfied. So this canary was passing against pristine
      # upstream while the exact condition that forces the fork was fully
      # present — a green that meant nothing about the thing it was watching.
      #
      # Adding `cargo build` for zuuli would just be a mystery red every Monday,
      # and a job that is always red teaches people to stop reading it. So the
      # assertion is inverted: **failing to resolve, for the documented reason,
      # is the expected and passing outcome** — it is this job confirming the
      # fork is still required. Three verdicts:
      #
      #   * resolution fails naming crypto-common/block-buffer  -> PASS, the
      #     fork is still needed; nothing to do.
      #   * resolution fails for any other reason               -> FAIL, real
      #     upstream breakage, which is what a canary is for.
      #   * resolution SUCCEEDS                                 -> FAIL loudly.
      #     Upstream has dropped the pins; the fork's premise is gone and it
      #     should be retired. docs/DEPENDENCIES.md §1 is the exit checklist.
      #
      # Resolution, not compilation, because that is where the conflict lives:
      # Cargo rejects the graph before a single crate is built, so this costs
      # seconds and is the exact failure the fork removes.
      # -----------------------------------------------------------------------
      - name: Assert the librustzcash fork is still required (ZUULI vs pristine upstream)
        run: |
          set -uo pipefail
          if cargo metadata --format-version 1 \
              --manifest-path wallet/zuuli/src-tauri/Cargo.toml \
              > /dev/null 2> zuuli-upstream-resolve.log; then
            echo "::error::ZUULI now RESOLVES against pristine upstream librustzcash."
            echo "The block-buffer / crypto-common pins that forced free2z/librustzcash"
            echo "appear to be gone. Retire the fork: see docs/DEPENDENCIES.md section 1"
            echo "and zcash/librustzcash#3010."
            exit 1
          fi
          cat zuuli-upstream-resolve.log
          if grep -q 'crypto-common' zuuli-upstream-resolve.log \
            && grep -q '0.2.0-rc.1' zuuli-upstream-resolve.log; then
            echo "Expected: ZUULI cannot resolve against pristine upstream librustzcash."
            echo "This is the conflict free2z/librustzcash's one 4-line deletion removes,"
            echo "so the fork is still required. Nothing to do."
            exit 0
          fi
          echo "::error::ZUULI failed to resolve against pristine upstream for an"
          echo "UNEXPECTED reason — not the known crypto-common conflict. Read the log"
          echo "above: this is genuine upstream breakage, which is what this canary is for."
          exit 1
