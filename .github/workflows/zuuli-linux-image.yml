name: ZUULI / Linux build image

# Phase A builds and publishes the immutable OS-dependency layer only. No
# wallet or release job consumes it until a follow-up PR pins a reviewed digest.
on:
  pull_request:
    paths:
      - .github/containers/zuuli-linux/**
      - .github/workflows/zuuli-linux-image.yml
      - docs/ZUULI-LINUX-BUILD-IMAGE.md
      - scripts/check-zuuli-linux-image.mjs
      - .github/workflows/zuuallet.yml
  push:
    branches: [main]
    paths:
      - .github/containers/zuuli-linux/**
      - .github/workflows/zuuli-linux-image.yml
      - docs/ZUULI-LINUX-BUILD-IMAGE.md
      - scripts/check-zuuli-linux-image.mjs
      - .github/workflows/zuuallet.yml
  schedule:
    - cron: "23 9 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zuuli-linux-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: ghcr.io/free2z/zuuli-linux-ci

jobs:
  validate:
    name: Validate image policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node scripts/check-zuuli-linux-image.mjs --self-test

  pull-request-build:
    name: Build and inspect image
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build the reviewed amd64 image locally
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .github/containers/zuuli-linux
          file: .github/containers/zuuli-linux/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: zuuli-linux-ci:pr-${{ github.event.pull_request.number }}
      - name: Verify the built image inventory
        run: >-
          docker run --rm
          zuuli-linux-ci:pr-${{ github.event.pull_request.number }}
          /usr/local/bin/verify-zuuli-linux-image

  publish:
    name: Publish immutable image
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch')
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish amd64 image with OCI SBOM and provenance
        id: publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .github/containers/zuuli-linux
          file: .github/containers/zuuli-linux/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:ubuntu-24.04
            ${{ env.IMAGE_NAME }}:ubuntu-24.04-build-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          sbom: true
          provenance: mode=max
      - name: Attest the published registry digest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
      - name: Verify the published digest and inventory
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools inspect "$IMAGE_NAME@$IMAGE_DIGEST"
          docker pull "$IMAGE_NAME@$IMAGE_DIGEST"
          docker run --rm "$IMAGE_NAME@$IMAGE_DIGEST" \
            /usr/local/bin/verify-zuuli-linux-image
          {
            echo '### Published ZUULI Linux image'
            echo
            echo "\`$IMAGE_NAME@$IMAGE_DIGEST\`"
            echo
            echo 'A follow-up Phase B PR must review and pin this exact digest.'
          } >> "$GITHUB_STEP_SUMMARY"
