name: ZUULI / Store listing read-only audit

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact current main commit whose store contract will be audited
        required: true
        type: string
      provider:
        description: Store provider to inspect
        required: true
        default: both
        type: choice
        options:
          - both
          - apple
          - play

permissions:
  contents: read

concurrency:
  group: zuuli-mobile-store
  cancel-in-progress: false

env:
  NODE_OPTIONS: --use-openssl-ca

jobs:
  audit:
    name: Compare protected store state without publication
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: zuuli-app-stores
    defaults:
      run:
        working-directory: wallet/zuuli
    steps:
      - name: Select verified CI trust before clients
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          CI_TRUST_CONTAINER: ${{ job.container.id != '' && '1' || '0' }}
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then ci_python=python; else ci_python=python3; fi
          "$ci_python" -I - <<'PY'
          import hashlib, os, pathlib, subprocess, sys, urllib.request
          url = 'https://raw.githubusercontent.com/corpora-inc/encorpora/086efd078bf7179df466449f194d716916e11305/.github/scripts/ci_trust.py'
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
          with opener.open(url, timeout=30) as response:
              if response.url != url: raise SystemExit('Unexpected CI helper redirect')
              data = response.read(50001)
          if len(data) > 50000 or hashlib.sha256(data).hexdigest() != 'ba1fe4e0b829fdb18dd619751479fbafdd791ecc51b834f3399cb972d8ddf167':
              raise SystemExit('CI helper checksum mismatch')
          mode = os.environ['CI_TRUST_CONTAINER']
          if mode not in ('0', '1'): raise SystemExit('Unclassified CI container context')
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'corpora-ci-trust-bootstrap.py'
          with os.fdopen(os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600), 'wb') as output:
              output.write(data)
          subprocess.run([sys.executable, '-I', str(path), '--source-commit', '086efd078bf7179df466449f194d716916e11305'] + (['--clients-only'] if mode == '1' else []), check=True)
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.22.1"
      - name: Verify exact current-main store source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "source SHA must be a full lowercase commit SHA" >&2
            exit 1
          }
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse refs/remotes/origin/main)" = "$SOURCE_SHA"
          git diff --exit-code -- .
          git diff --cached --exit-code -- .
      - run: npm ci --ignore-scripts
      - name: Verify local contract and offline read-only boundaries
        run: |
          npm run store:validate
          npm run test:store-listing
          npm run release:verify
      - name: Create isolated credential directory
        run: |
          set -euo pipefail
          secret_dir=$(mktemp -d "$RUNNER_TEMP/zuuli-store-audit.XXXXXX")
          chmod 700 "$secret_dir"
          echo "ZUULI_STORE_AUDIT_SECRET_DIR=$secret_dir" >> "$GITHUB_ENV"
      - name: Materialize ephemeral ASC credential
        if: inputs.provider == 'apple' || inputs.provider == 'both'
        env:
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
          ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          : "${ASC_KEY_BASE64:?ASC_KEY_BASE64 is not configured}"
          : "${ASC_KEY_ID:?ASC_KEY_ID is not configured}"
          : "${ASC_ISSUER_ID:?ASC_ISSUER_ID is not configured}"
          echo "::add-mask::$ASC_KEY_ID"
          echo "::add-mask::$ASC_ISSUER_ID"
          printf '%s' "$ASC_KEY_BASE64" | base64 --decode > "$ZUULI_STORE_AUDIT_SECRET_DIR/AuthKey.p8"
          chmod 600 "$ZUULI_STORE_AUDIT_SECRET_DIR/AuthKey.p8"
          test -s "$ZUULI_STORE_AUDIT_SECRET_DIR/AuthKey.p8"
          {
            echo "ASC_KEY_PATH=$ZUULI_STORE_AUDIT_SECRET_DIR/AuthKey.p8"
            echo "ASC_KEY_ID=$ASC_KEY_ID"
            echo "ASC_ISSUER_ID=$ASC_ISSUER_ID"
          } >> "$GITHUB_ENV"
      - name: Materialize ephemeral Play credential
        if: inputs.provider == 'play' || inputs.provider == 'both'
        env:
          PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: |
          set -euo pipefail
          : "${PLAY_SERVICE_ACCOUNT_JSON_BASE64:?PLAY_SERVICE_ACCOUNT_JSON_BASE64 is not configured}"
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON_BASE64" | base64 --decode > "$ZUULI_STORE_AUDIT_SECRET_DIR/play-service-account.json"
          chmod 600 "$ZUULI_STORE_AUDIT_SECRET_DIR/play-service-account.json"
          test -s "$ZUULI_STORE_AUDIT_SECRET_DIR/play-service-account.json"
          echo "PLAY_SERVICE_ACCOUNT_JSON=$ZUULI_STORE_AUDIT_SECRET_DIR/play-service-account.json" >> "$GITHUB_ENV"
      - name: Audit canonical locales, media, and Play tester mode
        id: audit
        continue-on-error: true
        env:
          PROVIDER: ${{ inputs.provider }}
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/zuuli-store-audit-evidence"
          mkdir -p "$evidence_dir"
          set +e
          node scripts/store-state-audit.mjs \
            "--provider=$PROVIDER" \
            "--output=$evidence_dir/store-state.json"
          audit_status=$?
          set -e
          if [[ -s "$evidence_dir/store-state.json" ]]; then
            echo "evidence_present=true" >> "$GITHUB_OUTPUT"
          else
            echo "evidence_present=false" >> "$GITHUB_OUTPUT"
          fi
          exit "$audit_status"
      - name: Destroy ephemeral store credentials
        id: cleanup
        if: always()
        continue-on-error: true
        run: |
          set -u
          cleanup_failed=0
          if [[ -n "${ZUULI_STORE_AUDIT_SECRET_DIR:-}" && -d "$ZUULI_STORE_AUDIT_SECRET_DIR" ]]; then
            find "$ZUULI_STORE_AUDIT_SECRET_DIR" -type f -exec rm -f -- {} + || cleanup_failed=1
            rmdir "$ZUULI_STORE_AUDIT_SECRET_DIR" || cleanup_failed=1
          fi
          if [[ -n "${ZUULI_STORE_AUDIT_SECRET_DIR:-}" && -e "$ZUULI_STORE_AUDIT_SECRET_DIR" ]]; then
            cleanup_failed=1
          fi
          exit "$cleanup_failed"
      - name: Upload sanitized store-state evidence
        if: always() && steps.audit.outputs.evidence_present == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zuuli-store-state-${{ inputs.provider }}-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/zuuli-store-audit-evidence/store-state.json
          if-no-files-found: error
          retention-days: 90
      - name: Enforce audit and cleanup verdict
        if: always()
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
          EVIDENCE_PRESENT: ${{ steps.audit.outputs.evidence_present }}
        run: |
          set -uo pipefail
          verdict_failed=0
          if [[ "$EVIDENCE_PRESENT" != true ]]; then
            echo "::error::sanitized store audit evidence was not produced"
            verdict_failed=1
          fi
          if [[ "$CLEANUP_OUTCOME" != success ]]; then
            echo "::error::ephemeral store credential cleanup did not succeed"
            verdict_failed=1
          fi
          if [[ "$AUDIT_OUTCOME" != success ]]; then
            echo "::error::one or more requested store provider audits failed"
            verdict_failed=1
          fi
          exit "$verdict_failed"
