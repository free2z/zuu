[package]
name = "tauri-plugin-notify"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
publish = false
links = "tauri-plugin-notify"
[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
[dependencies]
tauri = { version = "2", default-features = false }
f2z-notify-proto = { path = "../../../rs/crates/f2z-notify-proto", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "json"] }
getrandom = "0.3"
hex = "0.4"
tokio = { version = "1", features = ["sync"] }
[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
ed25519-dalek = "3"

[target.'cfg(target_os = "ios")'.dependencies]
# register_ios_plugin is gated by tauri/wry; declare it here, never rely on the host.
tauri = { version = "2", default-features = false, features = ["wry"] }
