# TEST FIXTURE, never compiled into a build — the shape
# `../../internal-directory.conf` shipped in before a deployment filled it
# (ADR 0017 §3).
#
# The shipped file now carries the internal deployment's real values, so it can
# no longer demonstrate the fail-closed property it is designed around. This
# file does, in the same grammar, through the same `parse`: every deployable
# value reads `PLACEHOLDER`, and the parser must answer `Unconfigured` — no
# directory, no relay, no connection.
#
# `the_placeholder_fixture_declares_the_shipped_files_keys` holds this file to
# the same key multiset as the shipped one, so a key added to the real file
# without being added here fails the test rather than quietly narrowing what
# fail-closed is proven over.

posture = internal-disposable

log_url = PLACEHOLDER
log_public_key = PLACEHOLDER
log_id = PLACEHOLDER
vrf_public_key = PLACEHOLDER
reset_authority_pk = PLACEHOLDER
reset_cooldown_seconds = 604800
witness_pk = PLACEHOLDER
threshold = 1
handle_authority_pk = PLACEHOLDER
handle_assertion_url = PLACEHOLDER
relay_url = PLACEHOLDER
