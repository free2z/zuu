# INTERNAL-DISPOSABLE directory configuration — ADR 0017
# (docs/e2ee/decisions/0017-internal-directory-activation.md).
#
# This file is compiled into every build of `tauri-plugin-f2zmsg`, and so into
# ZUULI (cash.free2z.zuuli) and e2e2z (cash.free2z.e2e2z). It is the ONLY place
# a shipping build learns which key-transparency log, witness, handle authority
# and relay to use. Filling it in is a one-file change.
#
# WHAT THIS POSTURE IS. free2z runs the log AND its only witness. `t = 1` is met
# by that witness, so lookups resolve, and the client reports ZERO independent
# witnesses, so the "not independently witnessed" warning stays on screen. The
# log is disposable: it is wiped before any public launch, and every handle,
# entry and pin made against it dies with it. Nothing below may claim otherwise.
#
# WIPING IT. Give the new log a NEW genesis signing key (so a new `log_id`) and
# ship its values here. A device persists the last tree head it verified; a
# head for another `log_id` is set aside, while a log reset under the SAME key
# is refused as a rollback and the directory stays unusable on that device —
# which is the point: a reset must be seen, never absorbed.
#
# FAIL CLOSED. While every key and URL below reads PLACEHOLDER the build keeps
# `NoDirectory` and configures no relay — it never connects anywhere. A file
# with SOME placeholders and some real values is malformed: the plugin's unit
# test `the_checked_in_file_is_well_formed` fails the build, and a shipped
# binary that somehow carried one would log the error and stay on
# `NoDirectory`. There is no environment override, by design.
#
# Grammar: `key = value`, `#` comments, no quoting, no interpolation. Unknown
# keys are errors. Keys are 64 lowercase hex characters (Ed25519 public keys).
#
# Filled in by the deployment workstream (zuu#1022, workstream 9) from the
# values the deployed services publish:
#
#   log_url               the log's public origin, https:// (TLS terminates ahead
#                         of f2z-kt, see rs/crates/f2z-kt/src/api.rs)
#   log_public_key        the log's GENESIS signing key
#   log_id                BLAKE2b-256("free2z/kt/v1/log-id" || log_public_key)
#                         (KT.md §6.1), as the log publishes it. Checked
#                         against the derivation, so a pasted key and id from
#                         two different logs are refused
#   vrf_public_key        the log's ECVRF public key, as its tree heads carry
#                         it. Pinned: a first head naming another key is refused
#   reset_authority_pk    the log config's `reset_authority_pk` (ADR 0014),
#                         pinned here because a key learned from the log is no
#                         authority at all
#   reset_cooldown_seconds  the log config's `reset_cooldown_seconds`
#   witness_pk            the witness's public key (`f2z-witness`); repeatable.
#                         Every witness here is counted as NOT independent —
#                         this file cannot assert independence (KT.md §8.3)
#   threshold             t; at least 1, at most the number of witness_pk lines
#   handle_authority_pk   the backend's HandleAssertion signing key — the same
#                         value as the log config's `authority_pk` (Contract C)
#   handle_assertion_url  the backend endpoint that issues HandleAssertions,
#                         https:// (ADR 0017 §5); for production
#                         https://free2z.cash/api/kt/handle-assertion/
#   relay_url             the default relay, wss://…/relay/v1

posture = internal-disposable

log_url = PLACEHOLDER
log_public_key = PLACEHOLDER
log_id = PLACEHOLDER
vrf_public_key = PLACEHOLDER
reset_authority_pk = PLACEHOLDER
reset_cooldown_seconds = 604800
witness_pk = PLACEHOLDER
threshold = 1
handle_authority_pk = PLACEHOLDER
handle_assertion_url = PLACEHOLDER
relay_url = PLACEHOLDER
