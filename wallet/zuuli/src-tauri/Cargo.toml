[package]
name = "zuuli"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
# Never goes to a registry: the wallet crates are consumed by path only. This is
# also what lets wallet/deny.toml skip them under `licenses.private.ignore`.
publish = false
description = "ZUULI by 2Z Inc — Zcash-native wallet, AI, livestreaming and articles."

[lib]
name = "zuuli_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2.4.9"
# Native HTTP client used by the frontend (@tauri-apps/plugin-http) to reach the
# free2z backend without browser CORS — powers Login with Zcash and every API call.
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Shared Zcash engine (librustzcash under the hood) — the "zuuallet guts".
tauri-plugin-zcash = { path = "../../plugins/tauri-plugin-zcash" }
# Tiny blocking HTTP server used ONLY for the desktop OAuth loopback capture
# (RFC 8252) — binds 127.0.0.1, serves a single request, then shuts down. Kept
# out of the shared tauri-plugin-zcash crate since it's ZUULI-specific.
tiny_http = "0.12"
url = "2"
getrandom = "0.3"
# End-to-end encrypted messaging (docs/e2ee/CLIENT-CONTRACT.md §3). The
# enrollment trio is NOT here — it needs the wallet seed and lives in
# `src/messaging.rs`, which borrows it from `tauri-plugin-zcash`'s managed
# state in-process so the mnemonic never crosses IPC (§2.2).
tauri-plugin-f2zmsg = { path = "../../plugins/tauri-plugin-f2zmsg" }
# The four messaging-core crates `src/messaging.rs` needs to turn a wallet seed
# into a `DeviceCredential`. Exactly the set `tauri-plugin-f2zmsg`'s own
# two-process harness names for the same job, and every one of them is already
# in this graph through the plugin — declaring them here is AGENTS.md's rule
# that what we use is declared rather than inherited by feature unification.
#
# `f2z-relay*`, `f2z-kt` and `f2z-witness` are deliberately absent: two are AGPL
# server binaries and adding one would relicense ZUULI (rs/README.md).
#
# §4.2's seed-derived key hierarchy, and `issue_device_credential`.
f2z-msg-identity = { path = "../../../rs/crates/f2z-msg-identity", version = "0.1.0" }
# `Handle` and `KemPublicKey`, which a `DeviceCredentialRequest` is built from.
f2z-kt-core = { path = "../../../rs/crates/f2z-kt-core", version = "0.1.0", default-features = false }
# `PublicKey` — the credential's `device_pk`.
f2z-codec = { path = "../../../rs/crates/f2z-codec", version = "0.1.0" }
# `credential::encode`, the canonical encoding `install_identity` parses back.
f2z-msg-mls = { path = "../../../rs/crates/f2z-msg-mls", version = "0.1.0" }
# `SecretVec`'s `ExposeSecret`, for the one line that reads the derived seed.
# Same version `tauri-plugin-zcash` resolves, so this adds nothing to the graph.
secrecy = "0.8"
# Hex for `identity_pk`, which crosses into the engine as a string.
hex = "0.4"
# The intent bridge, version 1 (`docs/intent-bridge/PROTOCOL.md`). ZUULI is the
# authority side: `src/intent.rs` calls `IntentGate::admit` and re-implements
# none of its guards. `no_std`, no I/O, no clock, no randomness — every one of
# which this crate passes in — and no cryptography beyond hashing. It adds no
# package to the graph: `f2z-codec`, `tls_codec` and `subtle` are already here
# through the messaging crates.
f2z-intent = { path = "../../../rs/crates/f2z-intent", version = "0.1.0" }
# Structured logging for the intent authority's refusals. A refusal carries a
# code and nothing else across the bridge (`f2z-intent`'s error rule), so the
# plugin error that produced it has to go somewhere an operator can read, and
# `tauri-plugin-zcash` already logs through this facade.
tracing = "0.1"

# Keep Tauri's mock runtime out of Windows test executables; the hosted runner
# cannot load that linkage. The shipping router still compiles on Windows, and
# its behavioral IPC probe runs on macOS/Linux.
[target.'cfg(not(target_os = "windows"))'.dev-dependencies]
tauri = { version = "2", features = ["test"] }
# #753's census needs a data directory it can make *unopenable*. Already in the
# lock as a transitive dependency, so naming it adds no crate to the graph.
tempfile = "3"

# ---------------------------------------------------------------------------
# Build profiles. DO NOT DELETE — this is load-bearing for `tauri dev` usability.
#
# This package is its own workspace root (there is no `[workspace]` above it and
# no repo-root Cargo.toml), so `[profile.*]` declared here IS honored for the
# whole dependency graph — including the `tauri-plugin-zcash` path dep and the
# librustzcash path deps in `z/zcash/librustzcash`.
#
# Why: `npm run tauri dev` builds the *dev* profile. At the Cargo default of
# `opt-level = 0`, the entire Zcash crypto stack (sapling-crypto, orchard,
# halo2_proofs, bls12_381, pasta_curves, group/ff, incrementalmerkletree /
# shardtree, blake2b_simd, zcash_note_encryption) runs unoptimized. Trial
# decryption, Pedersen hashing and shardtree inserts are then 20-100x slower
# than release, and chain sync crawls — minutes to advance a couple of blocks.
#
# The fix is the standard Zashi / zcash-devtool pattern: optimize dependencies,
# leave our own crates at opt-level 0 so edit-rebuild stays fast.
# ---------------------------------------------------------------------------

[profile.dev]
# Our own crates: unoptimized so incremental rebuilds stay quick and debugging
# (breakpoints, variable inspection) behaves.
opt-level = 0

[profile.dev.package."*"]
# Every dependency — crucially the Zcash crypto stack — gets fully optimized.
# Deps are compiled once and cached, so this costs a single cold build and buys
# back orders of magnitude on sync speed in `tauri dev`.
opt-level = 3

[profile.dev.build-override]
# Build scripts and proc macros also run at opt-level 0 by default; several
# Zcash deps do real work in build.rs. Cheap win on cold builds.
opt-level = 3

[profile.release]
# Release already implies opt-level = 3; these squeeze out the rest for shipped
# binaries at the cost of slower link times.
lto = "thin"
codegen-units = 1

# ---------------------------------------------------------------------------
# The one patch this app carries, and the reason it can link the messaging
# plugin at all. TRANSIENT — delete it the moment bip32 0.6.0 is published and
# the Zcash stack is on secp256k1 0.31.
#
# `bip32 0.6.0-pre.1` is the only 0.6 release (2025-01-27) and it exact-pins
# three 2024-era RustCrypto pre-releases: `sha2 =0.11.0-pre.4`,
# `hmac =0.13.0-pre.4`, `ripemd =0.2.0-pre.4`. librustzcash pins
# `bip32 = "=0.6.0-pre.1"`, so that island reaches everything under
# `tauri-plugin-zcash`. The messaging core is on the *released* lines — sha2
# 0.11.0 through `ed25519-dalek 3`, hmac 0.13.0 through `openmls_rust_crypto`
# (an optional dependency of `openmls` that Cargo still version-resolves) — and
# `=0.11.0-pre.4` cannot coexist with `^0.11`, so the two graphs were
# unlinkable. That is the whole of the blocker; it is NOT about our choice of
# Ed25519, and moving our crates to `libcrux-ed25519` would not have touched
# the `hmac` half of it.
#
# iqlusioninc/crates `main` already fixed the pre-release pins — but the same
# branch bumped `secp256k1-ffi` 0.29 -> 0.31, and `zcash_script 0.4.5` names
# `bip32::ExtendedPublicKey<secp256k1::PublicKey>` against secp256k1 0.29. No
# upstream commit has both. free2z/crates `f2z/bip32-secp256k1-0.29` is
# upstream `main` (eb57d49) with that one requirement held at 0.29, and nothing
# else.
#
# Pinned by `rev`, never by branch: a moving branch is not a reproducible
# build, and `--locked` has to mean something.
# ---------------------------------------------------------------------------
[patch.crates-io]
bip32 = { git = "https://github.com/free2z/crates", rev = "131d490ef75ccd23111cc7f3df91e4a88fc971ae" }
