# A checked restatement of the repository-root rust-toolchain.toml.
# The store-capture container mounts only wallet/, so its isolated WASM builds
# need a pin within that context. This file never decides the compiler version.
# Change the root pin first; scripts/check-rust-toolchain.sh enforces agreement.
[toolchain]
channel = "1.97.1"
profile = "minimal"
components = ["clippy", "rustfmt"]
targets = ["wasm32-unknown-unknown"]
