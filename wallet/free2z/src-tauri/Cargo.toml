[package]
name = "free2z"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
# Never goes to a registry: the wallet crates are consumed by path only. This is
# also what lets wallet/deny.toml skip them under `licenses.private.ignore`.
publish = false
description = "free2z content surface — articles, live, AI, creator and search. Holds no Zcash seed and no messaging keys."

[lib]
name = "free2z_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# The dependency list IS the security boundary for this surface (#904): the
# content app renders third-party markup, embeds and remote media, so it must
# not link `tauri-plugin-zcash` or `tauri-plugin-f2zmsg` at all. Linking either
# would put a privileged command in the invoke handler that #367's frame
# confusion could reach, whatever the capability files say. Adding one here is
# the change that `wallet/zuuli/scripts/surface-capability-authority.mjs`
# refuses on the capability side and that a reviewer must refuse on this side.
[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ---------------------------------------------------------------------------
# Build profiles. This package is its own workspace root — the repository keeps
# one Cargo workspace per shipped binary on purpose (#341) — so `[profile.*]`
# here is honored for the whole dependency graph.
# ---------------------------------------------------------------------------

[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 3

[profile.dev.build-override]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
