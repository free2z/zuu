<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Hello AI · Free2Z</title></head>
<body>
<main>
  <h1>Hello AI</h1>
  <p>A paid AI call uses your Free2Z platform credits. No call starts until you press Send.</p>
  <p id="identity">Signed out</p>
  <button id="sign-in">Sign in with Free2Z</button>
  <button id="switch">Use a different account</button>
  <button id="sign-out">Sign out</button>
  <p id="balance">Balance not loaded</p>
  <button id="refresh">Refresh account</button>
  <button id="manage">Manage Free2Z account</button>
  <button id="billing" hidden>Get 2Z on Free2Z</button>
  <button id="delete">Delete Free2Z account</button>
  <form id="chat">
    <label for="model">Model</label><select id="model" required></select>
    <label for="prompt">Prompt (sent to the AI provider; do not enter secrets)</label>
    <textarea id="prompt" required maxlength="8000">Explain one interesting fact about prime numbers.</textarea>
    <button id="send" type="submit">Send paid request (up to 256 output tokens)</button>
  </form>
  <button id="cancel">Stop delivery</button>
  <button id="recover">Recover last receipt / same-key call</button>
  <p id="status" role="status" aria-live="polite"></p>
  <pre id="answer"></pre>
  <p id="charge">Final charge unknown</p>
  <label for="reason">Report this AI output</label>
  <select id="reason"><option value="incorrect">Incorrect</option><option value="inappropriate">Inappropriate</option><option value="unsafe">Unsafe</option><option value="other">Other</option></select>
  <button id="report">Report output</button>
</main>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
